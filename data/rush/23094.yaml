effect:
  en: |-
    Choose 1 face-up non-Maximum Effect Monster with 100 or more ATK on your opponent's field, and this card gains ATK equal to [the chosen monster's ATK] until the end of this turn. Then, until the end of your opponent's next turn, neither player takes battle damage from battles involving this card.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    マキシマムモンスター以外の相手フィールドの表側表示の効果モンスター（攻撃力１００以上）１体を選び、このカードの攻撃力はターン終了時まで、［選んだモンスターの攻撃力］だけアップする。さらに次の相手ターン終了時まで、このカードの戦闘でお互いは戦闘ダメージを受けない。
  ko: |-
    맥시멈 몬스터 이외의 상대 필드의 앞면 표시인 효과 몬스터(공격력 100 이상) 1장을 고르고, 이 카드의 공격력은 턴 종료시까지, [고른 몬스터의 공격력]만큼 올린다. 추가로 다음 상대 턴 종료시까지, 이 카드의 전투로 양쪽 플레이어는 전투 데미지를 받지 않는다.
