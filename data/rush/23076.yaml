effect:
  en: |-
    Choose up to 2 Attack Position Celestial Warrior and/or Warrior Type monsters on your field. This turn, those monsters cannot be destroyed by battle. Then, you can Set 1 "Fusion" from your Graveyard to your Spell & Trap Zone.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分フィールドの攻撃表示モンスター（天界戦士族・戦士族）を合計２体まで選ぶ。このターン、そのモンスターは戦闘では破壊されない。さらに、自分の墓地の「フュージョン」１枚を選んで自分の魔法＆罠ゾーンにセットできる。
  ko: |-
    자신 필드의 공격 표시 몬스터(천계전사족・전사족)를 합계 2장까지 고른다. 이 턴에, 그 몬스터는 전투로는 파괴되지 않는다. 추가로, 자신 묘지의 "퓨전" 1장을 고르고 자신의 마법 & 함정 존에 세트할 수 있다.
