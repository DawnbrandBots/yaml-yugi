effect:
  en: |-
    This turn, this card's name becomes "Vanishing Heliacal Riser". Then, you can Special Summon 1 Level 7 Galaxy Type monster from your Graveyard face-up to your field. This turn, you cannot activate the effect of "Resurrection Heliacal Riser".
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカードのカード名はこのターン、「バニシング・ヘリアカルライザー」になる。その後、自分の墓地のモンスター（レベル７／ギャラクシー族）１体を選んで自分フィールドに表側表示で特殊召喚できる。このターン、自分は「リザレクション・ヘリアカルライザー」の効果を発動できない。
  ko: |-
    이 카드의 카드명은 이 턴에, "버니싱 헬리어컬라이저"가 된다. 그 후, 자신 묘지의 몬스터(레벨 7 / 갤럭시족) 1장을 고르고 자신 필드에 앞면 표시로 특수 소환할 수 있다. 이 턴에, 자신은 "리저렉션 헬리어컬라이저"의 효과를 발동할 수 없다.
