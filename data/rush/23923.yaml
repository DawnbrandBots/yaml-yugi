effect:
  en: |-
    Ritual Summon "Wako Gozen Riletta" by sending face-up monsters from your field to the Graveyard whose total Levels equal 8 or more as material (you cannot use more monsters than necessary as material). Then, you can send 1 card from your hand to the Graveyard. If you do, you can Special Summon 1 "Dimension Linker" from your Graveyard to your field in face-up Attack Position.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    レベルの合計が８以上になるように、自分フィールドの表側表示モンスターを素材として墓地へ送り、「和紅御前 リレッタ」をリチュアル召喚する（余分にモンスターを素材にできない）。その後、自分の手札１枚を選んで墓地へ送る事ができる。手札を墓地へ送った場合、さらに自分の墓地の「ディメンション・リンカー」１体を選んで自分フィールドに表側攻撃表示で特殊召喚できる。
