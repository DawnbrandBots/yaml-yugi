  ko: |-
    상대는 자신의 덱 맨 위의 카드를 넘겨, 서로 확인하고 원래대로 되돌린다. 그 카드가 선언한 종류의 카드였을 경우, 자신은 400 LP 회복한다. 이 카드가 맥시멈 모드일 경우, 추가로 상대 필드의 카드 1장을 고르고 파괴할 수 있다.
