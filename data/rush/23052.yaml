effect:
  en: |-
    Excavate the top 5 cards of your Deck. You can destroy up to 1 card on your opponent's field for every 2 excavated Spellcaster Type monsters with 500 or 1900 ATK/1500 DEF. Place the excavated cards on the bottom of your Deck in any order. If you destroyed 2 cards, you can only attack directly with 1 monster this turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分のデッキの上からカードを５枚めくり、お互いに確認する。自分はその中のモンスター（魔法使い族／攻撃力５００・１９００／守備力１５００）２体につき１枚まで相手フィールドのカードを選んで破壊できる。めくったカードを好きな順番でデッキの下に戻す。カード２枚を破壊した場合、このターン、自分はモンスター１体でしか直接攻撃できない。
  ko: |-
    자신의 덱 위에서 카드를 5장 넘기고, 서로 확인한다. 자신은 그 중의 몬스터(마법사족 / 공격력 500・1900 / 수비력 1500) 2장당 1장까지 상대 필드의 카드를 고르고 파괴할 수 있다. 넘긴 카드를 좋아하는 순서대로 덱 아래로 되돌린다. 카드 2장을 파괴했을 경우, 이 턴에, 자신은 몬스터 1장으로밖에 직접 공격할 수 없다.
