  ja: |-
    このカードを召喚・特殊召喚した自分メインフェイズに、自分の手札・フィールドのモンスター１体を墓地へ送って発動できる。
  ko: |-
    이 카드를 일반 소환 / 특수 소환한 자신 메인 페이즈에, 자신의 패 / 필드의 몬스터 1장을 묘지로 보내고 발동할 수 있다.
