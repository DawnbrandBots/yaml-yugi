effect:
  en: |-
    Place 1 monster from your opponent's Graveyard on the top of the Deck. Then, your opponent cannot Normal or Special Summon monsters with the same original name as that monster face-up until the end of your opponent's next turn. This turn, you cannot activate the effect of "Eria the Water Spiritualist".
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手の墓地のモンスター１体を選んでデッキの上に戻す。さらに次の相手ターン終了時まで、相手は選んだモンスターと元々のカード名が同じモンスターを表側表示で召喚・特殊召喚できない。このターン、自分は「水霊術師エリア」の効果を発動できない。
  ko: |-
    상대 묘지의 몬스터 1장을 고르고 덱 위로 되돌린다. 추가로 다음 상대 턴 종료시까지, 상대는 고른 몬스터와 원래의 카드명이 같은 몬스터를 앞면 표시로 일반 소환 / 특수 소환할 수 없다. 이 턴에, 자신은 "수령술사 에리아"의 효과를 발동할 수 없다.
