effect:
  en: |-
    Send the top card of your Deck to the Graveyard. Then, you can add 1 "Soleil, the Fairy of Skysavior" or "Lua, the Fairy of Skysavior" from your Graveyard to your hand. If you do, you can send 1 monster from your field to the Graveyard.
  de:
