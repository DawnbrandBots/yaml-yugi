  fr:
  it:
  pt:
  ja: |-
    自分のデッキの一番上のカードを墓地へ送る。その後、自分の墓地の「蒼救天使 ソレイル」または「蒼救天使 ルーア」１体を選んで手札に加える事ができる。加えた場合、さらに自分フィールドのモンスター１体を選んで墓地へ送る事ができる。
  ko: |-
    자신 덱 맨 위의 카드를 묘지로 보낸다. 그 후, 자신 묘지의 "창구천사 솔레일" 또는 "창구천사 루아" 1장을 고르고 패에 넣을 수 있다. 넣었을 경우, 추가로 자신 필드의 몬스터 1장을 고르고 묘지로 보낼 수 있다.
