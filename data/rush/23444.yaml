effect:
  en: |-
    Add 1 "X-Head Cannon", "Y-Dragon Head", or "Z-Metal Tank" from your Graveyard to your hand. Then, you can look at 1 face-down card in your opponent's Spell & Trap Zone. If that card is a Trap Card, destroy it.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分の墓地の「Ｘ－ヘッド・キャノン」「Ｙ－ドラゴン・ヘッド」「Ｚ－メタル・キャタピラー」のいずれか１体を選んで手札に加える。その後、相手の魔法＆罠ゾーンの裏側表示のカード１枚を選んで確認できる。そのカードが罠カードだった場合、さらに選んだカードを破壊する。
  ko: |-
    자신 묘지의 "X－헤드 캐논" "Y－드래곤 헤드" "Z－메탈 캐터필러" 중 어느 1장을 고르고 패에 넣는다. 그 후, 상대의 마법 & 함정 존의 뒷면 표시인 카드 1장을 고르고 확인할 수 있다. 그 카드가 함정 카드였을 경우, 추가로 고른 카드를 파괴한다.
