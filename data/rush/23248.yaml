    자신은 1장 드로우하고, 서로 확인한다. 그 카드가 몬스터(환룡족)였을 경우, 추가로 패의 몬스터(레벨 7 이상 / 환룡족) 1장을 자신 필드에 앞면 표시로 특수 소환할 수 있다.
