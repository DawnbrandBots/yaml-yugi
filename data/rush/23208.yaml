effect:
  en: |-
    Your opponent excavates the top card of their Deck and places it on top of their Deck. If it was the declared card type, you can draw 1 card. If you do, you cannot activate the effect of "Reporter Lilim" this turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手は自身のデッキの一番上のカードをめくり、お互いに確認して元に戻す。そのカードが宣言した種類のカードだった場合、自分は１枚ドローできる。ドローした場合、このターン、自分は「報道魔嬢キャスタリン」の効果を発動できない。
  ko: |-
    상대는 자신의 덱 맨 위의 카드를 넘겨, 서로 확인하고 원래대로 되돌린다. 그 카드가 선언한 종류의 카드였을 경우, 자신은 1장 드로우할 수 있다. 드로우했을 경우, 이 턴에, 자신은 "보도마양 캐스타린"의 효과를 발동할 수 없다.
