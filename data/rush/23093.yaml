requirement:
  en: |-
    During the turn you Normal Summoned this card, send 1 other card from your hand or field to the Graveyard.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカードを召喚したターンに、このカード以外の自分の手札・フィールドのカード１枚を墓地へ送って発動できる。
  ko: |-
    이 카드를 일반 소환한 턴에, 이 카드 이외의 자신의 패 / 필드의 카드 1장을 묘지로 보내고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    Change 1 Attack Position monster on your field to face-up Defense Position. Then, if you sent a WATER Attribute Aqua Type monster to the Graveyard to meet the requirement, you can destroy 1 face-up Level 10 or lower non-Maximum Monster on your opponent's field. This turn, you can only attack with Aqua Type monsters.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分フィールドの攻撃表示モンスター１体を選んで表側守備表示にする。この効果の条件でモンスター（水属性／水族）を墓地へ送った場合、さらにマキシマムモンスター以外の相手フィールドの表側表示モンスター（レベル１０以下）１体を選んで破壊できる。このターン、自分はモンスター（水族以外）で攻撃できない。
  ko: |-
    자신 필드의 공격 표시 몬스터 1장을 고르고 앞면 수비 표시로 한다. 이 효과의 조건으로 몬스터(물 속성 / 물족)를 묘지로 보냈을 경우, 추가로 맥시멈 몬스터 이외의 상대 필드의 앞면 표시 몬스터(레벨 10 이하) 1장을 고르고 파괴할 수 있다. 이 턴에, 자신은 몬스터(물족 이외)로 공격할 수 없다.
