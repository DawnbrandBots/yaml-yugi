effect:
  en: |-
    Special Summon 1 Level 6 or lower WIND Attribute Warrior Type monster from your hand face-up to your field. Then, if you have 2 or more face-up WIND Attribute Warrior Type monsters on your field, you can destroy 1 Spell/Trap Card on your opponent's field.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    手札のモンスター（レベル６以下／風属性／戦士族）１体を自分フィールドに表側表示で特殊召喚する。その後、自分フィールドの表側表示モンスター（風属性／戦士族）が２体以上の場合、相手フィールドの魔法・罠カード１枚を選んで破壊できる。
  ko: |-
    패의 몬스터(레벨 6 이하 / 바람 속성 / 전사족) 1장을 자신 필드에 앞면 표시로 특수 소환한다. 그 후, 자신 필드의 앞면 표시 몬스터(바람 속성 / 전사족)가 2장 이상일 경우, 상대 필드의 마법 / 함정 카드 1장을 고르고 파괴할 수 있다.
