    自分のデッキの下からカード５枚を取り出し、お互いに確認する。自分はその中から「Ｘ－ヘッド・キャノン」「Ｙ－ドラゴン・ヘッド」「Ｚ－メタル・キャタピラー」を合計２体まで選んで手札に加える事ができる。残りのカードをデッキに戻す。
