effect:
  en: |-
    Your opponent takes the bottom 3 cards of their Deck and shows them. Inflict damage to your opponent equal to [the number of monsters among the shown cards] x 400. Place 2 of the 3 shown cards on the top of your opponent's Deck in any order, and place the remaining card on the bottom of your opponent's Deck.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手は自身のデッキの下からカード３枚を取り出し、お互いに確認する。［その中のモンスターの数］×４００ダメージを相手に与える。自分は確認した３枚の中から２枚を選んで好きな順番で相手のデッキの上に戻し、残りのカードを相手のデッキの下に戻す。
  ko: |-
    상대는 자신의 덱 아래에서 카드 3장을 뽑고, 서로 확인한다. [그 중의 몬스터의 수] × 400 데미지를 상대에게 준다. 자신은 확인한 3장 중에서 2장을 골라 좋아하는 순서대로 상대의 덱 위로 되돌리고, 남은 카드를 상대의 덱 아래로 되돌린다.
