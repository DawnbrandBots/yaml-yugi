  ja: |-
    このカードのカード名はこのターン、「インターステライム」になる。その後、自分の墓地のモンスター（光属性／ギャラクシー族／攻撃力１０００）１体または「フュージョン」１枚を選んで手札に加える事ができる。加えた場合、このターン、自分は「エンセラダステライム」の効果を発動できない。
  ko: |-
    이 카드의 카드명은 이 턴에, "인터스텔라임"이 된다. 그 후, 자신 묘지의 몬스터(빛 속성 / 갤럭시족 / 공격력 1000) 1장 또는 "퓨전" 1장을 고르고 패에 넣을 수 있다. 넣었을 경우, 이 턴에, 자신은 "엔셀라다스텔라임"의 효과를 발동할 수 없다.
