  en: |-
    This turn, this card's name becomes "Interstellime". Then, you can add 1 LIGHT Attribute Galaxy Type monster with 1000 ATK or 1 "Fusion" from your Graveyard to your hand. If you do, you cannot activate the effect of "Enceladustellime" this turn.
