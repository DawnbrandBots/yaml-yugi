effect:
  en: |-
    Ritual Summon "Plasmatic Model Another Rising Blau" or "Plasmatic Model Rising Lystella" by sending face-up Thunder Type monsters from your field to the Graveyard whose total Levels equal 8 or more as material (you cannot use more monsters than necessary as material). This turn, you can only attack with Thunder Type monsters.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    レベルの合計が８以上になるように、自分フィールドの表側表示モンスター（雷族）を素材として墓地へ送り、「Ｐ・Ｍ ＡＲ－ブラウ」または「Ｐ・Ｍ Ｒ－リステラ」をリチュアル召喚する（余分にモンスターを素材にできない）。このターン、自分はモンスター（雷族以外）で攻撃できない。
  ko: |-
    레벨의 합계가 8 이상이 되도록, 자신 필드의 앞면 표시 몬스터(번개족)를 소재로서 묘지로 보내고, "P·M(플라즈마틱모델) AR(어나더라이징)－브라우" 또는 "P·MR(플라즈마틱모델 라이징)－리스텔라"를 리추얼 소환한다(여분의 몬스터를 소재로 할 수 없다). 이 턴에, 자신은 몬스터(번개족 이외)로 공격할 수 없다.
