effect:
  en: |-
    Special Summon 1 Level 3 or 4 WIND Attribute Warrior Type Effect Monster with 1000 or more ATK from your Graveyard face-up to your field. Then, you can add 1 "Speed Up" or "Speed Turn" from your Graveyard to your hand. This turn, you can only attack with Warrior Type monsters.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分の墓地の効果モンスター（レベル３・４／風属性／戦士族／攻撃力１０００以上）１体を選び、自分フィールドに表側表示で特殊召喚する。その後、自分の墓地の「スピード・アップ」または「スピード・ターン」１枚を選んで手札に加える事ができる。このターン、自分はモンスター（戦士族以外）で攻撃できない。
  ko: |-
    자신 묘지의 효과 몬스터(레벨 3・4 / 바람 속성 / 전사족 / 공격력 1000 이상) 1장을 고르고, 자신 필드에 앞면 표시로 특수 소환한다. 그 후, 자신 묘지의 "스피드 업" 또는 "스피드 턴" 1장을 고르고 패에 넣을 수 있다. 이 턴에, 자신은 몬스터(전사족 이외)로 공격할 수 없다.
