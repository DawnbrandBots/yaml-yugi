effect:
  en: |-
    This turn, this card's name becomes "X-Head Cannon". Then, you can add 1 "Y-Trial Dragon" or "Z-Trial Tank" from your Graveyard to your hand. You cannot Special Summon non-LIGHT Attribute monsters from the Extra Deck until the end of this turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカードのカード名はこのターン、「Ｘ－ヘッド・キャノン」になる。その後、自分の墓地の「Ｙ－トライアル・ドラゴン」または「Ｚ－トライアル・キャタピラー」１体を選んで手札に加える事ができる。この効果の発動後、ターン終了時まで自分はＥＸデッキからモンスター（光属性以外）を特殊召喚できない。
  ko: |-
    이 카드의 카드명은 이 턴에, "X－헤드 캐논"이 된다. 그 후, 자신 묘지의 "Y－트라이얼 드래곤" 또는 "Z－트라이얼 캐터필러" 1장을 고르고 패에 넣을 수 있다. 이 효과의 발동 후, 턴 종료시까지 자신은 엑스트라 덱에서 몬스터(빛 속성 이외)를 특수 소환할 수 없다.
