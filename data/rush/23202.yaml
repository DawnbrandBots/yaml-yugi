  ko: |-
    이 카드의 카드명은 이 턴에, "버니싱 헬리어컬라이저"가 된다. 그 후, 자신 묘지의 "퓨전" 또는 필드 마법 카드 1장을 고르고 패에 넣을 수 있다. 넣었을 경우, 이 턴에, 자신은 "버니싱 솔리티우스"의 효과를 발동할 수 없다.
