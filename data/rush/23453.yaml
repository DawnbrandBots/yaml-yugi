effect:
  en: |-
    Excavate the top 6 cards of your Deck. You can add 1 excavated Level 2 DARK Attribute monster with 1200 DEF, "Star Replete", or "Fusion" to your hand. Place the other cards on the bottom of your Deck in any order.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分のデッキの上からカードを６枚めくり、お互いに確認する。自分はその中からモンスター（レベル２／闇属性／守備力１２００）、「スター・リプリート」、「フュージョン」のいずれか１枚を選んで手札に加える事ができる。残りのカードを好きな順番でデッキの下に戻す。
  ko: |-
    자신의 덱 위에서 카드를 6장 넘기고, 서로 확인한다. 자신은 그 중에서 몬스터(레벨 2 / 어둠 속성 / 수비력 1200), "스타 리플리트", "퓨전" 중 어느 1장을 고르고 패에 넣을 수 있다. 남은 카드를 좋아하는 순서대로 덱 아래로 되돌린다.
