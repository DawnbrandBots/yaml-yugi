effect:
  en: |-
    Send the top 2 cards of either player's Deck to the Graveyard. Then, you can Special Summon 1 Level 6 or lower monster from your opponent's Graveyard to your field in face-up Defense Position. If it is the first turn of the player going second, you can Special Summon a Level 7 or higher monster from your opponent's Graveyard instead.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分または相手のデッキの上からカード２枚を墓地へ送る。その後、相手の墓地のモンスター（レベル６以下）１体を選んで自分フィールドに表側守備表示で特殊召喚できる。このターンが後攻プレイヤーの最初のターンの場合、この効果で相手の墓地のモンスター（レベル７以上）を選ぶ事もできる。
  ko: |-
    자신 또는 상대의 덱 위에서 카드 2장을 묘지로 보낸다. 그 후, 상대 묘지의 몬스터(레벨 6 이하) 1장을 고르고 자신 필드에 앞면 수비 표시로 특수 소환할 수 있다. 이 턴이 후공 플레이어의 최초의 턴일 경우, 이 효과로 상대 묘지의 몬스터(레벨 7 이상)를 고를 수도 있다.
  zh-TW:
