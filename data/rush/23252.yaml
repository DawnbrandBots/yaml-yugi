effect:
  en: |-
    Add 1 Level 3 LIGHT Attribute Warrior Type monster with 1000 DEF and/or 1 "Rising Equip" from your Graveyard to your hand. Then, you can choose 1 face-up monster on your field. This turn, that monster cannot be destroyed by card effects.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分の墓地のモンスター（レベル３／光属性／戦士族／守備力１０００）と「Ｒ・イクイップ」をそれぞれ１枚まで選んで手札に加える。その後、自分フィールドの表側表示モンスター１体を選ぶ事ができる。選んだ場合、このターン、そのモンスターは効果では破壊されない。
  ko: |-
    자신 묘지의 몬스터(레벨 3 / 빛 속성 / 전사족 / 수비력 1000)와 "R(라이징) 이큅"을 각각 1장까지 고르고 패에 넣는다. 그 후, 자신 필드의 앞면 표시 몬스터 1장을 고를 수 있다. 고른 경우, 이 턴에, 그 몬스터는 효과로는 파괴되지 않는다.
