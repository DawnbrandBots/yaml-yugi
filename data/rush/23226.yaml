effect:
  en: |-
    Excavate the top 5 cards of your Deck. You can add 1 excavated Level 7 Plant Type monster and/or 1 "Fusion" to your hand. Place the other cards on the bottom of your Deck in any order. If you added 2 cards to your hand by this effect, send 1 card from your hand to the Graveyard.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分のデッキの上からカードを５枚めくり、お互いに確認する。自分はその中からモンスター（レベル７／植物族）と「フュージョン」をそれぞれ１枚まで選んで手札に加える事ができる。残りのカードを好きな順番でデッキの下に戻す。この効果で２枚を手札に加えた場合、さらに自分の手札１枚を選んで墓地へ送る。
  ko: |-
    자신의 덱 위에서 카드를 5장 넘기고, 서로 확인한다. 자신은 그 중에서 몬스터(레벨 7 / 식물족)와 "퓨전"을 각각 1장까지 고르고 패에 넣을 수 있다. 남은 카드를 좋아하는 순서대로 덱 아래로 되돌린다. 이 효과로 2장을 패에 넣었을 경우, 추가로 자신의 패 1장을 고르고 묘지로 보낸다.
