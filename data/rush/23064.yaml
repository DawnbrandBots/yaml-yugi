effect:
  en: |-
    Ritual Summon "Dead Core the Mad Fiend of Despair" by sending Fiend Type monsters from your hand to the Graveyard whose total Levels equal 3 or more as material (you cannot use more monsters than necessary as material). Then, you can send the top 2 cards of your Deck to the Graveyard.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    レベルの合計が３以上になるように、手札のモンスター（悪魔族）を素材として墓地へ送り、「絶望狂魔デッド・コア」をリチュアル召喚する（余分にモンスターを素材にできない）。その後、自分のデッキの上からカード２枚を墓地へ送る事ができる。
  ko: |-
    레벨의 합계가 3 이상이 되도록, 패의 몬스터(악마족)를 소재로서 묘지로 보내고, "절망광마 데드 코어"를 리추얼 소환한다(여분의 몬스터를 소재로 할 수 없다). 그 후, 자신의 덱 위에서 카드 2장을 묘지로 보낼 수 있다.
