requirement:
  en: |-
    If you have a face-up EARTH Attribute Machine Type monster on your field during a turn you have not activated "Happy Journal", declare a card type (Monster, Spell, or Trap).
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分が「ハッピージャーナル」を発動していないターンに、自分フィールドに表側表示モンスター（地属性／機械族）がいる場合、カードの種類（モンスター・魔法・罠）を宣言して発動できる。
  ko: |-
    자신이 "행복저널"을 발동하고 있지 않은 턴에, 자신 필드에 앞면 표시 몬스터(땅 속성 / 기계족)가 있을 경우, 카드의 종류(몬스터・마법・함정)를 선언하고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    Your opponent excavates the top 2 cards of their Deck and places them on top of their Deck in the same order. Draw cards equal to [the number of cards of the declared card type among the excavated cards].
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手は自身のデッキの上からカードを２枚めくり、お互いに確認して元に戻す。自分は［その中の宣言した種類のカードの数］だけドローする。
  ko: |-
    상대는 자신의 덱 위에서 카드를 2장 넘기고, 서로 확인하여 원래대로 되돌린다. 자신은 [그 중의 선언한 종류의 카드의 수]만큼 드로우한다.
  zh-TW:
  zh-CN:
