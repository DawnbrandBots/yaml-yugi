effect:
  en: |-
    Special Summon up to 2 Level 6 or lower Rock Type Normal Monsters from your Graveyard face-up to your field. Increase the Levels of the monsters Special Summoned by this effect by 1 until the end of this turn. Then, you can increase the Level of 1 face-up monster on your field by 1 until the end of this turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分の墓地の通常モンスター（レベル６以下／岩石族）を２体まで選び、自分フィールドに表側表示で特殊召喚する。この効果で特殊召喚したモンスターのレベルはターン終了時まで１上がる。その後、自分フィールドの表側表示モンスター１体を選んでそのレベルをターン終了時まで１上げる事ができる。
  ko: |-
    자신 묘지의 일반 몬스터(레벨 6 이하 / 암석족)를 2장까지 고르고, 자신 필드에 앞면 표시로 특수 소환한다. 이 효과로 특수 소환한 몬스터의 레벨은 턴 종료시까지 1 올라간다. 그 후, 자신 필드의 앞면 표시 몬스터 1장을 고르고 그 레벨을 턴 종료시까지 1 올릴 수 있다.
