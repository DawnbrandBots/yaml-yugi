effect:
  en: |-
    Add 1 "Lumina the Dimensional Sworn Ally", "Riel the Dimensional Sworn Ally", or "Saintick Crusade" from your Graveyard to your hand. Then, you can shuffle 3 monsters from your Graveyard into the Deck. Then, if you shuffled a WIND Attribute monster by this effect, you can look at 1 face-down card in your opponent's Spell & Trap Zone. Then, if that card is a Trap Card, destroy it.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分の墓地の「次元の盟友 ルミナ」「次元の盟友 リエル」「セインティック・クルセイド」のいずれか１枚を選んで手札に加える。その後、自分の墓地のモンスター３体を選んでデッキに戻す事ができる。この効果でモンスター（風属性）を戻した場合、さらに相手の魔法＆罠ゾーンの裏側表示のカード１枚を選んで確認できる。そのカードが罠カードだった場合、さらに選んだカードを破壊する。
