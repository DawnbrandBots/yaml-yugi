requirement:
  en: |-
    During a turn you have not activated "The Player Returning Alive", send 1 Warrior Type monster or 1 Field Spell Card from your hand to the Graveyard.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分が「選手の生還」を発動していないターンに、手札のモンスター（戦士族）１体またはフィールド魔法カード１枚を墓地へ送って発動できる。
  ko: |-
    자신이 "선수의 생환"을 발동하고 있지 않은 턴에, 패의 몬스터(전사족) 1장 또는 필드 마법 카드 1장을 묘지로 보내고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    Send the top 3 cards of your Deck to the Graveyard. Then, add to your hand 1 card from among the cards sent. Then, if you have "The Warrior Returning Alive" in your Graveyard, you can add 1 Level 4 or 8 Warrior Type monster from your Graveyard to your hand.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分のデッキの上からカード３枚を墓地へ送る。その後、その中から１枚を選んで手札に加える。その後、自分の墓地に「戦士の生還」がある場合、自分の墓地のモンスター（レベル４・８／戦士族）１体を選んで手札に加える事ができる。
  ko: |-
    자신의 덱 위에서 카드 3장을 묘지로 보낸다. 그 후, 그 중에서 1장을 고르고 패에 넣는다. 그 후, 자신 묘지에 "전사의 생환"이 있을 경우, 자신 묘지의 몬스터(레벨 4・8 / 전사족) 1장을 고르고 패에 넣을 수 있다.
