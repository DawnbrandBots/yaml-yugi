effect:
  en: |-
    Fusion Summon "Rising HERO Argent O" or "Rising HERO Argent F" by shuffling LIGHT Attribute monsters from your field or Graveyard into the owner's Deck as material. Then, you can destroy 1 face-up Level 8 or lower monster on your opponent's field.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分のフィールド・墓地のモンスター（光属性）を素材として持ち主のデッキに戻し、「Ｒ・ＨＥＲＯ アルジェントＯ」または「Ｒ・ＨＥＲＯ アルジェントＦ」をフュージョン召喚する。その後、相手フィールドの表側表示モンスター（レベル８以下）１体を選んで破壊できる。
  ko: |-
    자신의 필드 / 묘지의 몬스터(빛 속성)를 소재로서 주인의 덱으로 되돌리고, "라이징 히어로 아르젠토O(오)" 또는 "라이징 히어로 아르젠토F(에프)"를 퓨전 소환한다. 그 후, 상대 필드의 앞면 표시 몬스터(레벨 8 이하) 1장을 고르고 파괴할 수 있다.
