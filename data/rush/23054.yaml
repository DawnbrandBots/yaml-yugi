effect:
  en: |-
    While this card is face-up in the Field Zone, face-up Level 3-5 Spellcaster Type monsters with 1500 original DEF on the field gain 500 ATK, and both players can Normal Summon Level 5 Spellcaster Type monsters with 1500 DEF without Tributing.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカードがフィールドゾーンに表側表示である限り、お互いのフィールドの元々の守備力が１５００の表側表示モンスター（レベル３～５／魔法使い族）の攻撃力は５００アップし、お互いはモンスター（レベル５／魔法使い族／守備力１５００）を召喚する場合に必要なリリースをなくす事ができる。
  ko: |-
    이 카드가 필드 존에 앞면 표시인 한, 서로의 필드의 원래 수비력이 1500 인 앞면 표시 몬스터(레벨 3~5 / 마법사족)의 공격력은 500 올리고, 양쪽 플레이어는 몬스터(레벨 5 / 마법사족 / 수비력 1500)를 일반 소환할 경우에 필요한 릴리스를 없앨 수 있다.
