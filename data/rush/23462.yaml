  ko: |-
    이 카드가 필드 존에 앞면 표시인 한, 이 카드의 카드명은 "열혈 스피릿 스타디움"이 되고, 서로의 몬스터(화염 속성)의 공격 선언시에 양쪽 플레이어는 함정 카드를 발동할 수 없으며, 그 공격은 관통한다.
