  ja: |-
    手札の効果モンスター（レベル３～５／戦士族）１体を自分フィールドに表側表示で特殊召喚する。その後、自分の墓地のモンスター（戦士族／攻撃力１４００／守備力１００）１体を選んで手札に加える事ができる。このターン、自分は「スピード・コマンダー」の効果を発動できない。
  ko: |-
    패의 효과 몬스터(레벨 3~5 / 전사족) 1장을 자신 필드에 앞면 표시로 특수 소환한다. 그 후, 자신 묘지의 몬스터(전사족 / 공격력 1400 / 수비력 100) 1장을 고르고 패에 넣을 수 있다. 이 턴에, 자신은 "스피드 커맨더"의 효과를 발동할 수 없다.
