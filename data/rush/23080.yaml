  en: |-
    Special Summon 1 Level 3-5 Warrior Type Effect Monster from your hand face-up to your field. Then, you can add 1 Warrior Type monster with 1400 ATK/100 DEF from your Graveyard to your hand. This turn, you cannot activate the effect of "Speed Commander".
  de:
