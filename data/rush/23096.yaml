requirement:
  en: |-
    Activate this card by sending the top 2 cards of your Deck to the Graveyard, except during the first turn of the player going first.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカードは、先攻１ターン目以外に、デッキの上からカード２枚を墓地へ送って発動できる。
  ko: |-
    이 카드는, 선공 1번째 턴 이외에, 덱 위에서 카드 2장을 묘지로 보내고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    While this card is face-up in the Field Zone, it cannot be destroyed by card effects, and during the Draw Phase of a player that has a card in their Field Zone, if they would draw until they have 5 cards in their hand for their normal draw, instead they draw until they have 6 cards.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカードがフィールドゾーンに表側表示である限り、このカードは効果では破壊されず、自身のフィールドゾーンにカードがあるプレイヤーはドローフェイズに手札が５枚になるように通常のドローをする場合、代わりに手札が６枚になるように通常のドローをする。
  ko: |-
    이 카드가 필드 존에 앞면 표시인 한, 이 카드는 효과로는 파괴되지 않으며, 자신의 필드 존에 카드가 있는 플레이어는 드로우 페이즈에 패가 5장이 되도록 일반 드로우를 할 경우, 대신에 패가 6장이 되도록 일반 드로우를 한다.
  zh-TW:
  zh-CN:
