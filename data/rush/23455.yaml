  zh-CN:
requirement:
  en: |-
    When your opponent Normal Summons a monster, place 1 Fusion Monster or Normal Monster from your Graveyard on the bottom of the Deck.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手がモンスターを召喚した時、自分の墓地のフュージョンモンスターまたは通常モンスター１体をデッキの下に戻して発動できる。
  ko: |-
    상대가 몬스터를 일반 소환했을 때, 자신 묘지의 퓨전 몬스터 또는 일반 몬스터 1장을 덱 아래로 되돌리고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    Change that Normal Summoned monster to face-down Defense Position. Then, if you placed a Fusion Monster to meet the requirement, you can destroy 1 face-down card on your opponent's field.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    その召喚されたモンスターを裏側守備表示にする。この効果の条件でフュージョンモンスターを戻した場合、さらに相手フィールドの裏側表示のカード１枚を選んで破壊できる。
  ko: |-
    그 일반 소환된 몬스터를 뒷면 수비 표시로 한다. 이 효과의 조건으로 퓨전 몬스터를 되돌렸을 경우, 추가로 상대 필드의 뒷면 표시인 카드 1장을 고르고 파괴할 수 있다.
