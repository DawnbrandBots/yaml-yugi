    This card's name becomes "Star of Beginning" while in the hand or Graveyard.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    手札または墓地にあるこのカードのカード名は「はじまりの星」になる。
  ko: |-
    패 또는 묘지에 있는 이 카드의 카드명은 "시작의 별"이 된다.
