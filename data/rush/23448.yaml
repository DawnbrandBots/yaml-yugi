  ja: |-
    小さな星の竜は成長を遂げ、新たな姿へと昇華した。人との絆、そして星々の力を糧に、神秘の力をその身に宿す。やがて来る運命の時、その名は星域に刻まれる。
  ko: |-
    작은 별의 용은 성장을 이루어, 새로운 모습으로 승화했다. 사람과의 유대, 그리고 별들의 힘을 양분 삼아, 신비로운 힘을 그 몸에 품는다. 이윽고 찾아올 운명의 시간, 그 이름은 별들의 영역에 새겨지리라.
