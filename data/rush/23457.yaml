  ja: |-
    自分の墓地のモンスター（レベル４／炎属性／戦士族）１体を選び、自分フィールドに表側守備表示で特殊召喚する。その後、自分の墓地のモンスター（レベル８／炎属性）１体を選んで手札に加える事ができる。このターン、自分は「球児皇オノマトピッチャー」の効果を発動できない。
  ko: |-
    자신 묘지의 몬스터(레벨 4 / 화염 속성 / 전사족) 1장을 고르고, 자신 필드에 앞면 수비 표시로 특수 소환한다. 그 후, 자신 묘지의 몬스터(레벨 8 / 화염 속성) 1장을 고르고 패에 넣을 수 있다. 이 턴에, 자신은 "구아황 오노마토피처"의 효과를 발동할 수 없다.
