  zh-CN:
effect:
  en: |-
    Special Summon 1 Level 3 or 8 DARK Attribute Fiend Type monster with 1200 DEF from your hand face-up to your field. Then, if you have "Dead Core the Mad Fiend of Despair" on your field, you can add 1 DARK Attribute Fiend Type monster from your Graveyard to your hand.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    手札のモンスター（レベル３・８／闇属性／悪魔族／守備力１２００）１体を自分フィールドに表側表示で特殊召喚する。その後、自分フィールドに「絶望狂魔デッド・コア」がいる場合、自分の墓地のモンスター（闇属性／悪魔族）１体を選んで手札に加える事ができる。
  ko: |-
    패의 몬스터(레벨 3・8 / 어둠 속성 / 악마족 / 수비력 1200) 1장을 자신 필드에 앞면 표시로 특수 소환한다. 그 후, 자신 필드에 "절망광마 데드 코어"가 있을 경우, 자신 묘지의 몬스터(어둠 속성 / 악마족) 1장을 고르고 패에 넣을 수 있다.
