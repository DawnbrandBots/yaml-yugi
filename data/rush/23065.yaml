  ja: |-
    自分が「絶望と切望」を発動していないターンに、デッキの上からカード２枚を墓地へ送って発動できる。
  ko: |-
    자신이 "절망과 갈망"을 발동하고 있지 않은 턴에, 덱 위에서 카드 2장을 묘지로 보내고 발동할 수 있다.
