effect:
  en: |-
    This turn, this face-up card can be treated as 2 Tributes for the Tribute Summon of a LIGHT Attribute Galaxy Type monster in Attack Position. Then, you can add 1 "Galactica Oblivion" or "Vanishing Heliacal Riser" from your Graveyard to your hand.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このターン、モンスター（光属性／ギャラクシー族）を攻撃表示でアドバンス召喚する場合、表側表示のこのカードは２体分のリリースにできる。さらに、自分の墓地の「ギャラクティカ・オブリビオン」または「バニシング・ヘリアカルライザー」１体を選んで手札に加える事ができる。
  ko: |-
    이 턴에, 몬스터(빛 속성 / 갤럭시족)를 공격 표시로 어드밴스 소환할 경우, 앞면 표시인 이 카드는 2장만큼의 릴리스로 할 수 있다. 추가로, 자신 묘지의 "갤럭티카 오블리비언" 또는 "버니싱 헬리어컬라이저" 1장을 고르고 패에 넣을 수 있다.
