requirement:
  en: |-
    During a turn you have not activated "Light of Bewitchment", declare the Attribute of 1 face-up Spellcaster Type monster on your field.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分が「幻惑の光」を発動していないターンに、自分フィールドの表側表示モンスター（魔法使い族）の属性を１つ宣言して発動できる。
  ko: |-
    자신이 "환혹의 빛"을 발동하고 있지 않은 턴에, 자신 필드의 앞면 표시 몬스터(마법사족)의 속성을 1개 선언하고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    The Attribute of 1 face-up monster on your opponent's field becomes the Attribute declared to meet the requirement until the end of this turn. After activation, you can Set this card instead of sending it to the Graveyard.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手フィールドの表側表示モンスター１体を選び、その属性をターン終了時までこの効果の条件で宣言した属性にする。発動後このカードは墓地へ送らずにそのままセットできる。
  ko: |-
    상대 필드의 앞면 표시 몬스터 1장을 고르고, 그 속성을 턴 종료시까지 이 효과의 조건으로 선언한 속성으로 한다. 발동 후 이 카드는 묘지로 보내지 않으며 그대로 세트할 수 있다.
