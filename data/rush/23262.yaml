requirement:
  en: |-
    When your opponent Sets a monster from their hand, or when a face-up monster(s) on your opponent's field is flipped face-down.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手が手札からモンスターをセットした時、または相手フィールドの表側表示モンスターが裏側表示になった時に発動できる。
  ko: |-
    상대가 패에서 몬스터를 세트했을 때, 또는 상대 필드의 앞면 표시 몬스터가 뒷면 표시가 되었을 때에 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    Look at 1 face-down monster on your opponent's field. Then, if you have a face-up monster with ATK greater than or equal to [that monster's original ATK] on your field, you can destroy the monster you looked at.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手フィールドの裏側表示モンスター１体を選んで確認する。自分フィールドに［そのモンスターの元々の攻撃力］以上の攻撃力を持つ表側表示モンスターがいる場合、さらに確認したモンスターを破壊できる。
  ko: |-
    상대 필드의 뒷면 표시 몬스터 1장을 고르고 확인한다. 자신 필드에 [그 몬스터의 원래 공격력] 이상의 공격력을 가지는 앞면 표시 몬스터가 있을 경우, 추가로 확인한 몬스터를 파괴할 수 있다.
