effect:
  en: |-
    Fusion Summon a Warrior Type monster with 2300 DEF by shuffling face-up Warrior Type Effect Monsters from your field into the owner's Deck as material. If you activated this effect during your Main Phase that you Special Summoned this card, you can also use Warrior Type Effect Monsters in your Graveyard as material. This turn, you can only attack with Warrior Type monsters, and you cannot activate the effect of "Speed Sniper".
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分フィールドの表側表示の効果モンスター（戦士族）を素材として持ち主のデッキに戻し、モンスター（戦士族／守備力２３００）をフュージョン召喚する。このカードを特殊召喚した自分メインフェイズにこの効果を発動した場合、自分の墓地の効果モンスター（戦士族）を素材とする事もできる。このターン、自分はモンスター（戦士族以外）で攻撃できず、「スピード・スナイパー」の効果を発動できない。
  ko: |-
    자신 필드의 앞면 표시인 효과 몬스터(전사족)를 소재로서 주인의 덱으로 되돌리고, 몬스터(전사족 / 수비력 2300)를 퓨전 소환한다. 이 카드를 특수 소환한 자신 메인 페이즈에 이 효과를 발동했을 경우, 자신 묘지의 효과 몬스터(전사족)를 소재로 할 수도 있다. 이 턴에, 자신은 몬스터(전사족 이외)로 공격할 수 없으며, "스피드 스나이퍼"의 효과를 발동할 수 없다.
