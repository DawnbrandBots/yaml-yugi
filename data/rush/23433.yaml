summoning_condition:
  en: |-
    You can Special Summon this card from your hand face-up to your field by placing 1 LIGHT Attribute and 1 DARK Attribute monster from your Graveyard on the bottom of the Deck in any order.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分の墓地のモンスター（光属性・闇属性）を１体ずつ好きな順番でデッキの下に戻し、このカードは手札から自分フィールドに表側表示で特殊召喚できる。
  ko: |-
    자신 묘지의 몬스터(빛 속성・어둠 속성)를 1장씩 좋아하는 순서대로 덱 아래로 되돌리고, 이 카드는 패에서 자신 필드에 앞면 표시로 특수 소환할 수 있다.
  zh-TW:
  zh-CN:
requirement:
  en: |-
    If you have not activated any effect during the turn you Special Summoned this card in the above way, pay 1000 LP.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    上記の方法でこのカードを特殊召喚したターンに、自分が効果を発動していない場合、１０００ＬＰを払って発動できる。
  ko: |-
    상기의 방법으로 이 카드를 특수 소환한 턴에, 자신이 효과를 발동하고 있지 않을 경우, 1000 LP를 지불하고 발동할 수 있다.
  zh-TW:
  zh-CN:
effect:
  en: |-
    Send all cards in both players' hands and fields to the Graveyard. Then, inflict damage to your opponent equal to [the number of cards sent to their Graveyard by this effect] x 300.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    お互いの手札・フィールドのカードを全て墓地へ送る。その後、［この効果で相手の墓地へ送られたカードの数］×３００ダメージを相手に与える。
  ko: |-
    서로의 패 / 필드의 카드를 전부 묘지로 보낸다. 그 후, [이 효과로 상대 묘지로 보내진 카드의 수] × 300 데미지를 상대에게 준다.
