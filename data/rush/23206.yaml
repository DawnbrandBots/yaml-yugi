effect:
  en: |-
    Your opponent excavates the top card of their Deck and places it on top of their Deck. If it was a Monster Card, send the top 3 cards of your Deck to the Graveyard. Then, if this card is in Maximum Mode, you can place up to 2 "Hot Off the Press" from your Graveyard on top of the Deck in any order.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手は自身のデッキの一番上のカードをめくり、お互いに確認して元に戻す。そのカードがモンスターだった場合、自分は自分のデッキの上からカード３枚を墓地へ送る。このカードがマキシマムモードの場合、さらに自分の墓地の「瓦バーン」を２枚まで選んで好きな順番でデッキの上に戻す事ができる。
  ko: |-
    상대는 자신의 덱 맨 위의 카드를 넘겨, 서로 확인하고 원래대로 되돌린다. 그 카드가 몬스터였을 경우, 자신은 자신의 덱 위에서 카드 3장을 묘지로 보낸다. 이 카드가 맥시멈 모드일 경우, 추가로 자신 묘지의 "기와 번"을 2장까지 고르고 좋아하는 순서대로 덱 위로 되돌릴 수 있다.
