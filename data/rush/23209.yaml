effect:
  en: |-
    Your opponent excavates the top card of their Deck and places it on top of their Deck. If it was the declared card type, you can add 1 EARTH Attribute Machine Type monster from your Graveyard to your hand. If you do, you cannot activate the effect of "High-Speed Machine ENG" this turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    相手は自身のデッキの一番上のカードをめくり、お互いに確認して元に戻す。そのカードが宣言した種類のカードだった場合、自分の墓地のモンスター（地属性／機械族）１体を選んで手札に加える事ができる。加えた場合、このターン、自分は「速撮マシンＥＮＧ」の効果を発動できない。
  ko: |-
    상대는 자신의 덱 맨 위의 카드를 넘겨, 서로 확인하고 원래대로 되돌린다. 그 카드가 선언한 종류의 카드였을 경우, 자신 묘지의 몬스터(땅 속성 / 기계족) 1장을 고르고 패에 넣을 수 있다. 넣었을 경우, 이 턴에, 자신은 "속촬 머신 ENG(이엔지)"의 효과를 발동할 수 없다.
