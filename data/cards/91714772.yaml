  de: Galaxie-Verteidigungsroboter Orbital 7
  es: Robot Defensa de la Galaxia Estación Orbital 7
  fr: Défense Galactique Orbital 7
  it: Orbitale 7 Robot Difesa Galattica
  pt: Robô de Defesa da Galáxia Orbital 7
  ja: <ruby>ＧＤ<rt>ギャラクシーディフェンス</rt></ruby>ロボ・オービタル <ruby>７<rt>セブン</rt></ruby>
  ja_romaji: Gyarakushī Difensu Robo Ōbitaru Sebun
  ko: GD 로보 오비탈 7
  ko_rr:
  zh-TW:
  zh-CN: 银河防卫机器人・奥比塔尔 7
text:
  en: |-
    You can Tribute this card from your hand or field; take 1 "Photon" monster and 1 "Galaxy" monster from your Deck, add 1 of them to your hand and send the other to the GY, also you cannot Special Summon for the rest of this turn, except LIGHT monsters. If a "Galaxy-Eyes" monster(s) is Special Summoned to your field (except during the Damage Step): You can Special Summon this card from your GY, but banish it when it leaves the field. You can only use each effect of "Galaxy Defense Robot Orbital 7" once per turn.
  de: |-
    Du kannst diese Karte von deiner Hand oder Spielfeldseite als Tribut anbieten; nimm 1 „Photon“-Monster und 1 „Galaxie“-Monster von deinem Deck, füge 1 von ihnen deiner Hand hinzu und lege das andere auf den Friedhof, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von LICHT Monstern. Falls ein oder mehr „Galaxieaugen“-Monster als Spezialbeschwörung auf deine Spielfeldseite beschworen werden (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung von deinem Friedhof beschwören, aber verbanne sie, wenn sie das Spielfeld verlässt. Du kannst jeden Effekt von „Galaxie-Verteidigungsroboter Orbital 7“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes Sacrificar esta carta en tu mano o Campo; toma 1 monstruo "Fotónico/a" y 1 monstruo "Galaxia" o "Galáctico/a" en tu Deck, añade 1 de ellos a tu mano y manda el otro al Cementerio, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos de LUZ. Si uno o más monstruos "Ojos Galácticos" son Invocados de Modo Especial a tu Campo (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial desde tu Cementerio, pero destiérrala cuando deje el Campo. Sólo puedes usar cada efecto de "Robot Defensa de la Galaxia Estación Orbital 7" una vez por turno.
  fr: |-
    Vous pouvez Sacrifier cette carte depuis votre main ou Terrain ; prenez 1 monstre "Photon" et 1 monstre "Galactique" depuis votre Deck, ajoutez-en 1 à votre main et envoyez l'autre au Cimetière, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres LUMIÈRE exclus) le reste de ce tour. Si un ou plusieurs monstres "Yeux Galactiques" sont Invoqués Spécialement sur votre Terrain (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte depuis votre Cimetière, mais bannissez-la lorsqu'elle quitte le Terrain. Vous ne pouvez utiliser chaque effet de "Défense Galactique Orbital 7" qu'une fois par tour.
  it: |-
    Puoi offrire come Tributo questa carta dalla tua mano o Terreno; prendi 1 mostro "Fotonico" e 1 mostro "Galattico" dal tuo Deck, aggiungi 1 di essi alla tua mano e manda l'altro al Cimitero, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri LUCE. Se uno o più mostri "Occhi Galattici" vengono Evocati Specialmente sul tuo Terreno (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta dal tuo Cimitero, ma bandiscila quando lascia il Terreno. Puoi utilizzare ogni effetto di "Orbitale 7 Robot Difesa Galattica" una sola volta per turno.
  pt: |-
    Você pode oferecer este card como Tributo da sua mão ou do campo; pegue 1 monstro "Fóton" e 1 monstro "Galáxia" do seu Deck, adicione 1 deles à sua mão e envie o outro para o Cemitério e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros de LUZ. Se um ou mais monstros "Olhos das Galáxias" forem Invocados por Invocação-Especial no seu campo (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial do seu Cemitério, mas bana-o quando ele deixar o campo. Você só pode usar cada efeito de "Robô de Defesa da Galáxia Orbital 7" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：手札・フィールドのこのカードをリリースして発動できる。デッキから「フォトン」モンスター１体と「ギャラクシー」モンスター１体を選び、その内の１体を手札に加え、もう１体を墓地へ送る。このターン、自分は光属性モンスターしか特殊召喚できない。②：自分フィールドに「ギャラクシーアイズ」モンスターが特殊召喚された場合に発動できる。このカードを墓地から特殊召喚する。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 패 / 필드의 이 카드를 릴리스하고 발동할 수 있다. 덱에서 "포톤" 몬스터 1장과 "갤럭시" 몬스터 1장을 골라, 그 중의 1장을 패에 넣고, 나머지 1장을 묘지로 보낸다. 이 턴에, 자신은 빛 속성 몬스터밖에 특수 소환할 수 없다. ②: 자신 필드에 "갤럭시아이즈" 몬스터가 특수 소환되었을 경우에 발동할 수 있다. 이 카드를 묘지에서 특수 소환한다. 이 효과로 특수 소환한 이 카드는, 필드에서 벗어났을 경우에 제외된다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：解放手牌・场上的此卡可以发动。从牌组挑选1只“光子”怪兽和1只“银河”怪兽，将其中1只加入手牌，另1只送至墓地。此回合，自己仅可特殊召唤光属性怪兽。②：“银河眼”怪兽被特殊召唤至自己场上的情况下可以发动。从墓地将此卡特殊召唤。以此效果特殊召唤的此卡从场上离开的情况下，将其除外。
