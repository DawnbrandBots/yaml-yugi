text:
  en: |-
    "Barrel Dragon" + 1 Machine Monster
    Once per turn (Quick Effect): You can toss 3 coins, then apply these effects based on the number of heads. 
    * 1 Head: Add 1 card that mentions "Heavy Metal Revenge" from your Deck to your hand.
    * 2 Heads: Destroy up to 2 cards an opponent controls.
    * 3 Heads: Special Summon 1 monster from your opponent's GY to your side of the field, or set 1 Spell/Trap from their GY to your side of the field.
