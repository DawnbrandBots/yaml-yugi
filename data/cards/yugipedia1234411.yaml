  zh-CN: |-
    效果怪兽2只
    此卡名的效果1回合仅可使用1次。①：在自己的主要阶段可以发动。向对手出示额外牌组的1只融合怪兽。从自己墓地挑选1只卡名记载于该怪兽的、除融合怪兽以外的怪兽，此卡直至结束阶段为止视为该怪兽的同名卡。然后，可将自己手牌・场上・墓地的怪兽作为融合素材除外，将所出示的融合怪兽融合召唤。此回合，自己从额外牌组仅可特殊召唤融合怪兽。
