  ko_rr:
  zh-TW:
  zh-CN: 邪恶之箱
text:
  en: |-
    This card is treated as a Toon monster while "Toon World" is on the field. If this card is in your hand and you control "Toon World": You can Special Summon this card, then you can add to your hand or Set 1 "Toon" Trap from your Deck. You can only use this effect of "Evil Box" once per turn. Once per turn (Quick Effect): You can target 1 card in either GY; place it on the bottom of the Deck.
  de: |-
    Diese Karte wird als Toon-Monster behandelt, solange „Toon-Welt“ auf dem Spielfeld liegt. Falls sich diese Karte in deiner Hand befindet und du „Toon-Welt“ kontrollierst: Du kannst diese Karte als Spezialbeschwörung beschwören, dann kannst du 1 „Toon“-Falle von deinem Deck deiner Hand hinzufügen oder setzen. Du kannst diesen Effekt von „Böse Box“ nur einmal pro Spielzug verwenden. Einmal pro Spielzug (Schnelleffekt): Du kannst 1 Karte in einem beliebigen Friedhof wählen; lege sie unters Deck.
  es: |-
    Esta carta se trata como un monstruo Toon mientras "Mundo Toon" esté en el Campo. Si esta carta está en tu mano y controlas "Mundo Toon": puedes Invocar esta carta de Modo Especial, y después puedes añadir a tu mano o Colocar 1 Trampa "Toon" desde tu Deck. Sólo puedes usar este efecto de "Mal Box" una vez por turno. Una vez por turno (Efecto Rápido): puedes seleccionar 1 carta en cualquier Cementerio; ponla en la parte inferior del Deck.
  fr: |-
    Cette carte est traitée comme monstre Toon tant que "Monde des Toons" est sur le Terrain. Si cette carte est dans votre main et que vous contrôlez "Monde des Toons" : vous pouvez Invoquer Spécialement cette carte, puis vous pouvez ajouter à votre main ou Poser 1 Piège "Toon" depuis votre Deck. Vous ne pouvez utiliser cet effet de "Box Maléfique" qu'une fois par tour. Une fois par tour (Effet Rapide) : vous pouvez cibler 1 carte dans l'un des Cimetières ; placez-la au-dessous du Deck.
  it: |-
    Questa carta viene considerata come un mostro Toon mentre "Mondo Toon" è sul Terreno. Se questa carta è nella tua mano e tu controlli "Mondo Toon": puoi Evocare Specialmente questa carta, poi puoi aggiungere alla tua mano o Posizionare 1 Trappola "Toon" dal tuo Deck. Puoi utilizzare questo effetto di "Malvagibox" una sola volta per turno. Una volta per turno (Effetto Rapido): puoi scegliere come bersaglio 1 carta in qualsiasi Cimitero; mettila in fondo al Deck.
  pt: |-
    Este card é considerado como um monstro Toon enquanto "Mundo Toon" estiver no campo. Se este card estiver na sua mão e você controlar "Mundo Toon": você pode Invocar este card por Invocação-Especial e, depois, você pode adicionar à sua mão ou Baixar 1 Armadilha "Toon" do seu Deck. Você só pode usar este efeito de "Malignabox" uma vez por turno. Uma vez por turno (Efeito Rápido): você pode escolher 1 card em qualquer Cemitério; coloque-o no fundo do Deck.
  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：自分フィールドに「トゥーン・ワールド」が存在する場合に発動できる。このカードを手札から特殊召喚する。その後、以下の効果を適用できる。●デッキから「トゥーン」罠カード１枚を選び、手札に加えるか自分フィールドにセットする。②：フィールドに「トゥーン・ワールド」が存在する限り、このカードはトゥーンモンスターとして扱う。③：自分・相手ターンに１度、自分か相手の墓地のカード１枚を対象として発動できる。そのカードをデッキの一番下に戻す。
  ko: |-
    이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드에 "툰 월드"가 존재할 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 그 후, 이하의 효과를 적용할 수 있다. ●덱에서 "툰" 함정 카드 1장을 고르고, 패에 넣거나 자신 필드에 세트한다. ②: 필드에 "툰 월드"가 존재하는 한, 이 카드는 툰 몬스터로 취급한다. ③: 자신 / 상대 턴에 1번, 자신이나 상대 묘지의 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 덱 맨 아래로 되돌린다.
  zh-TW:
  zh-CN: |-
    此卡名的①效果1回合仅可使用1次。①：自己场上存在“卡通世界”的情况下可以发动。从手牌将此卡特殊召唤。然后，可适用以下效果。
    ●从牌组挑选1张“卡通”陷阱卡，加入手牌或放置在自己场上。
    ②：只要场上存在“卡通世界”，此卡就视为卡通怪兽。③：在每个自己・对手回合中1次，以自己或对手墓地的1张卡为对象可以发动。将该卡放回牌组最下面。
