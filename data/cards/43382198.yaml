  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：自分のデッキの上からカードを以下の数だけ裏側で除外し、フィールドの表側表示モンスター１体を対象として発動できる。その効果を対象のモンスターに適用する。
    ●５枚：攻撃力・守備力を０にする。
    ●１０枚：効果を無効にする。
    ●１５枚：裏側で除外する。
  ko:
