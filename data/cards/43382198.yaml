  zh-CN: |-
    此卡名的①效果1回合仅可使用1次。①：从自己牌组上面依以下数量将卡以里侧除外，以场上的1只表侧表示怪兽为对象可以发动。对对象怪兽适用该效果。
    ●5张：将攻击力・守备力改成0。
    ●10张：将效果无效。
    ●15张：以里侧除外。
