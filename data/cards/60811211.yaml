text:
  en: |-
    If this card is Normal or Special Summoned: Banish (face-down) the top 8 cards of your Deck. Gains these effects based on the total number of face-down banished cards.
    ● 10+: Cannot be destroyed by battle.
    ● 20+: Once per turn (Quick Effect): You can target 1 card on the field; destroy it.
    ● 30+: Once per turn, during your opponent's End Phase: You can add 1 of your face-down banished cards to your hand.
    ● 40+: Skip both players' Draw Phases.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：このカードが召喚・特殊召喚した場合に発動する。自分のデッキの上からカード８枚を裏側で除外する。②：除外状態（裏側）のカードの数によって、このカードは以下の効果を得る。●１０枚以上：このカードは戦闘では破壊されない。●２０枚以上：自分・相手ターンに１度、フィールドのカード１枚を対象として発動できる。そのカードを破壊する。●３０枚以上：相手エンドフェイズに発動できる。自分の除外状態（裏側）のカード１枚を手札に加える。●４０枚以上：自分・相手のドローフェイズはスキップされる。
  ko:
  zh-TW:
  zh-CN: |-
    ①：此卡召唤・特殊召唤的情况下发动。从自己牌组上面将8张卡以里侧除外。②：依除外状态（里侧）的卡的数量，此卡获得以下效果。●10张以上：此卡不会因战斗被破坏。●20张以上：在每个自己・对手回合中1次，以场上的1张卡为对象可以发动。将该卡破坏。●30张以上：在对手的结束阶段可以发动。将自己除外状态（里侧）的1张卡加入手牌。●40张以上：跳过自己・对手的抽牌阶段。
