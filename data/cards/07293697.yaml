name:
  en: Perfect Toon World
  de: Perfekte Toon-Welt
  es: Mundo Toon Perfecto
  fr: Monde Parfait des Toons
  it: Mondo Toon Perfetto
  pt: Perfeito Mundo Toon
  ja: <ruby>完<rt>かん</rt></ruby><ruby>全<rt>ぜん</rt></ruby>なる<ruby>世<rt>せ</rt></ruby><ruby>界<rt>かい</rt></ruby> トゥーン・ワールド
  ja_romaji: Kanzennaru Sekai Tūn Wārudo
  ko: 완전한 세계 툰 월드
  ko_rr:
  zh-TW:
  zh-CN: 完美卡通世界
text:
  en: |-
    This card's name becomes "Toon World" while in the Field Zone. Once per turn, during your Main Phase: You can add 1 "Toon" card, or 1 card that mentions a "Toon" card by name, from your Deck to your hand. You can only use this effect of "Perfect Toon World" thrice per turn. If another card's effect activates, at the start of its resolution, you can banish 1 Toon monster you control until immediately after that effect resolves (each unique original monster name can only be banished once per turn, by you, by this effect of "Perfect Toon World").
  de: |-
    Der Name dieser Karte wird zu „Toon-Welt“, solange sie in der Spielfeldzone liegt. Einmal pro Spielzug, während deiner Main Phase: Du kannst deiner Hand 1 „Toon“-Karte oder 1 Karte, die den Namen einer „Toon“-Karte erwähnt, von deinem Deck hinzufügen. Du kannst diesen Effekt von „Perfekte Toon-Welt“ nur dreimal pro Spielzug verwenden. Falls der Effekt einer anderen Karte aktiviert wird, kannst du am Beginn seiner Auflösung 1 Toon-Monster, das du kontrollierst, bis sofort nach der Auflösung jenes Effekts verbannen (jeder einzigartige Grund-Monstername kann durch dich durch diesen Effekt von „Perfekte Toon-Welt“ nur einmal pro Spielzug verbannt werden).
  es: |-
    El nombre de esta carta se convierte en "Mundo Toon" mientras esté en la Zona del Campo. Una vez por turno, durante tu Main Phase: puedes añadir a tu mano 1 carta "Toon", o 1 carta que mencione una carta "Toon" por su nombre, en tu Deck. Sólo puedes usar este efecto de "Mundo Toon Perfecto" tres veces por turno. Si se activa el efecto de otra carta, al comienzo de su resolución, puedes desterrar 1 monstruo Toon que controles hasta inmediatamente después de que ese efecto se resuelva (cada nombre de monstruo único original sólo puede ser desterrado una vez por turno, por ti, por este efecto de "Mundo Toon Perfecto").
  fr: |-
    Le nom de cette carte devient "Monde des Toons" tant qu'elle est dans la Zone Terrain. Une fois par tour, durant votre Main Phase : vous pouvez ajouter 1 carte "Toon", ou 1 carte qui mentionne nommément une carte "Toon", depuis votre Deck à votre main. Vous ne pouvez utiliser cet effet de "Monde Parfait des Toons" que trois fois par tour. Si l'effet d'une autre carte s'active, au début de sa résolution, vous pouvez bannir 1 monstre Toon que vous contrôlez jusqu'à immédiatement après la résolution de l'effet (chaque nom de monstre d'origine unique ne peut être banni qu'une fois par tour, par vous, par cet effet de "Monde Parfait des Toons").
  it: |-
    Il nome di questa carta diventa "Mondo Toon" mentre è nella Zona Terreno. Una volta per turno, durante la tua Main Phase: puoi aggiungere 1 carta "Toon", o 1 carta che menziona una carta "Toon" per nome, dal tuo Deck alla tua mano. Puoi utilizzare questo effetto di "Mondo Toon Perfetto" solo tre volte per turno. Se si attiva l'effetto di un'altra carta, all'inizio della sua risoluzione, puoi bandire 1 mostro Toon che controlli fino a immediatamente dopo che quell'effetto si è risolto (ogni nome di mostro originale unico può essere bandito una sola volta per turno, da te, da questo effetto di "Mondo Toon Perfetto").
  pt: |-
    O nome deste card se torna "Mundo Toon" enquanto estiver na Zona do Campo. Uma vez por turno, durante sua Fase Principal: você pode adicionar 1 card "Toon", ou 1 card que mencione um card "Toon" pelo nome, do seu Deck à sua mão. Você só pode usar este efeito de "Perfeito Mundo Toon" três vezes por turno. Se o efeito de outro card for ativado, no começo de sua resolução, você pode banir 1 monstro Toon que você controla até imediatamente depois que esse efeito resolver (cada nome de monstro original único só pode ser banido uma vez por turno, por você, por este efeito de "Perfeito Mundo Toon").
  ja: |-
    このカード名の②の効果は１ターンに３度まで使用できる。①：このカードはフィールドゾーンに存在する限り、カード名を「トゥーン・ワールド」として扱う。②：１ターンに１度、自分メインフェイズに発動できる。「トゥーン」カードまたはそのカード名が記されたカード１枚をデッキから手札に加える。③：他のカードが発動した効果が適用される際に、自分フィールドのトゥーンモンスター１体をその効果処理後まで除外できる（このターン、このカード名のこの効果で元々のカード名が同じモンスターを除外できない）。
  ko: |-
    이 카드명의 ②의 효과는 1턴에 3번까지 사용할 수 있다. ①: 이 카드는 필드 존에 존재하는 한, 카드명을 "툰 월드"로 취급한다. ②: 1턴에 1번, 자신 메인 페이즈에 발동할 수 있다. "툰" 카드 또는 그 카드명이 쓰여진 카드 1장을 덱에서 패에 넣는다. ③: 다른 카드가 발동한 효과가 적용될 시기에, 자신 필드의 툰 몬스터 1장을 그 효과 처리 후까지 제외할 수 있다(이 턴에, 이 카드명의 이 효과로 원래의 카드명이 같은 몬스터를 제외할 수 없다).
  zh-TW:
  zh-CN: |-
    此卡名的②效果1回合最多可使用3次。①：此卡只要存在于场地区域，卡名视为“卡通世界”。②：1回合1次，在自己的主要阶段可以发动。从牌组将1张“卡通”卡或记载有该卡名的卡加入手牌。③：其他卡发动的效果将被适用之际，可将自己场上的1只卡通怪兽直至该效果处理后为止除外（此回合，不可以此卡名的此效果除外原本卡名相同的怪兽）。
