name:
  en: Fisherman of Legend
  de: Fischer aus der Legende
  es: Pescador de Leyenda
  fr: Pêcheur de Légende
  it: Pescatore della Leggenda
  pt: Pescador das Lendas
  ja: <ruby>大<rt>たい</rt></ruby><ruby>海<rt>かい</rt></ruby>の<ruby>伝<rt>でん</rt></ruby><ruby>説<rt>せつ</rt></ruby>－フィッシャーマン
  ja_romaji: Taikai no Densetsu - Fisshāman
  ko: 대해의 전설－어부
  ko_rr:
  zh-TW:
  zh-CN: 大海的传说－渔夫
text:
  en: |-
    If your opponent activates a monster effect on the field, or when an opponent's monster declares an attack, and "Umi" or a card that mentions "Dark Time Wizard" (except "Fisherman of Legend") is on the field (except during the Damage Step): Special Summon this card from your hand. If this card is Special Summoned: You can target 1 monster your opponent controls; destroy it, also during the End Phase of this turn, return this card from the field to the hand. You can only use each effect of "Fisherman of Legend" once per turn.
  de: |-
    Falls dein Gegner einen Monstereffekt auf dem Spielfeld aktiviert oder wenn ein Monster eines Gegners einen Angriff deklariert, und „Umi“ oder eine Karte, die „Dunkler Zeitzauberer“ erwähnt (außer „Fischer aus der Legende“), auf dem Spielfeld liegt (außer während des Damage Steps): Beschwöre diese Karte als Spezialbeschwörung von deiner Hand. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 Monster wählen, das dein Gegner kontrolliert; zerstöre es, zusätzlich gib während der End Phase dieses Spielzugs diese Karte vom Spielfeld auf die Hand zurück. Du kannst jeden Effekt von „Fischer aus der Legende“ nur einmal pro Spielzug verwenden.
  es: |-
    Si tu adversario activa un efecto de monstruo en el Campo, o cuando un monstruo del adversario declara un ataque, y "Umi" o una carta que mencione "Mago del Tiempo Oscuro" (excepto "Pescador de Leyenda") está en el Campo (excepto durante el Damage Step): Invoca esta carta de Modo Especial desde tu mano. Si esta carta es Invocada de Modo Especial: puedes seleccionar 1 monstruo que controle tu adversario; destrúyelo, y además durante la End Phase de este turno, devuelve esta carta del Campo a la mano. Sólo puedes usar cada efecto de "Pescador de Leyenda" una vez por turno.
  fr: |-
    Si votre adversaire active un effet de monstre sur le Terrain, ou lorsqu'un monstre de l'adversaire déclare une attaque, et que "Umi" ou une carte qui mentionne "Magicien du Temps des Ténèbres" ("Pêcheur de Légende" exclu) est sur le Terrain (sauf durant la Damage Step) : Invoquez Spécialement cette carte depuis votre main. Si cette carte est Invoquée Spécialement : vous pouvez cibler 1 monstre contrôlé par votre adversaire ; détruisez-le, et aussi, renvoyez cette carte depuis le Terrain à la main durant la End Phase de ce tour. Vous ne pouvez utiliser chaque effet de "Pêcheur de Légende" qu'une fois par tour.
  it: |-
    Se il tuo avversario attiva l'effetto di un mostro sul Terreno, o quando un mostro dell'avversario dichiara un attacco, e "Umi" o una carta che menziona "Stregone del Tempo Oscuro" (eccetto "Pescatore della Leggenda") è sul Terreno (eccetto durante il Damage Step): Evoca Specialmente questa carta dalla tua mano. Se questa carta viene Evocata Specialmente: puoi scegliere come bersaglio 1 mostro controllato dal tuo avversario; distruggilo, inoltre durante la End Phase di questo turno, fai ritornare questa carta dal Terreno nella mano. Puoi utilizzare ogni effetto di "Pescatore della Leggenda" una sola volta per turno.
  pt: |-
    Se seu oponente ativar um efeito de monstro no campo, ou quando um monstro do oponente declarar um ataque, e "Umi" ou um card que mencione "Mago do Tempo Negro" (exceto "Pescador das Lendas") estiver no campo (exceto durante a Etapa de Dano): Invoque este card por Invocação-Especial da sua mão. Se este card for Invocado por Invocação-Especial: você pode escolher 1 monstro que seu oponente controla; destrua-o e, além disso, durante a Fase Final deste turno, devolva este card do campo para a mão. Você só pode usar cada efeito de "Pescador das Lendas" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：相手がフィールドのモンスターの効果を発動した場合、または相手モンスターの攻撃宣言時、「大海の伝説－フィッシャーマン」を除く、「時の黒魔術師」のカード名が記されたカードまたは「海」がフィールドに存在していれば発動できる。このカードを手札から特殊召喚する。②：このカードが特殊召喚した場合、相手フィールドのモンスター１体を対象として発動できる。そのモンスターを破壊する。このターンのエンドフェイズに、フィールドのこのカードは手札に戻る。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 상대가 필드의 몬스터의 효과를 발동했을 경우, 또는 상대 몬스터의 공격 선언시, "대해의 전설－어부"가 아닌, "시간의 흑마술사"의 카드명이 쓰여진 카드 또는 "바다"가 필드에 존재하고 있으면 발동할 수 있다. 이 카드를 패에서 특수 소환한다. ②: 이 카드를 특수 소환했을 경우, 상대 필드의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 파괴한다. 이 턴의 엔드 페이즈에, 필드의 이 카드는 패로 되돌아간다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：对手发动场上的怪兽的效果的情况下，或对手怪兽攻击宣言时，如果场上存在除“大海的传说－渔夫”以外的、记载有“时间黑魔术师”卡名的卡或“海”则可以发动。从手牌将此卡特殊召唤。②：此卡特殊召唤的情况下，以对手场上的1只怪兽为对象可以发动。将该怪兽破坏。在此回合的结束阶段，场上的此卡将回到手牌。
