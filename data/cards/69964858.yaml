name:
  en: Witchcrafter Pupils
  de: Hexwerker-Schülerinnen
  es: Aprendices Artibruja
  fr: Disciples, Artisanesorcière
  it: Stregartigiane Allieve
  pt: Pupilas da Fazticeira
  ja: ウィッチクラフト・ピューピルズ
  ja_romaji: Witchikurafuto Pyūpiruzu
  ko: 위치크래프트 퓨필즈
  ko_rr:
  zh-TW: 魔女工藝・學徒組
  zh-CN: 魔女工艺・学徒组
text:
  en: |-
    1 "Witchcrafter" monster + 1 Spellcaster monster
    During the Main or Battle Phase (Quick Effect): You can activate 1 of these effects;
    ● Add 1 "Witchcrafter" Spell from your Deck to your hand.
    ● Reveal 1 "Witchcrafter" Normal or Quick-Play Spell in your hand; apply that card's activation effect.
    During your End Phase: You can return 1 of your banished "Witchcrafter" cards to the GY. You can only use each effect of "Witchcrafter Pupils" once per turn.
  de: |-
    1 „Hexwerker“-Monster + 1 Hexer-Monster
    Während der Main oder Battle Phase (Schnelleffekt): Du kannst 1 dieser Effekte aktivieren;
    ● Füge deiner Hand 1 „Hexwerker“-Zauber von deinem Deck hinzu.
    ● Zeige 1 Normalen „Hexwerker“-Zauber oder „Hexwerker“-Schnellzauber in deiner Hand vor; führe den Aktivierungseffekt jener Karte aus.
    Während deiner End Phase: Du kannst 1 deiner verbannten „Hexwerker“-Karten auf den Friedhof zurücklegen. Du kannst jeden Effekt von „Hexwerker-Schülerinnen“ nur einmal pro Spielzug verwenden.
  es: |-
    1 monstruo "Artibruja" + 1 monstruo Lanzador de Conjuros
    Durante la Main o Battle Phase (Efecto Rápido): puedes activar 1 de estos efectos;
    ● Añade a tu mano 1 Mágica "Artibruja" en tu Deck.
    ● Muestra 1 Mágica Normal o de Juego Rápido "Artibruja" en tu mano; aplica el efecto de activación de esa carta.
    Durante tu End Phase: puedes devolver al Cementerio 1 de tus cartas "Artibruja" desterradas. Sólo puedes usar cada efecto de "Aprendices Artibruja" una vez por turno.
  fr: |-
    1 monstre "Artisanesorcière" + 1 monstre Magicien
    Durant la Main ou Battle Phase (Effet Rapide) : vous pouvez activer 1 de ces effets ;
    ● Ajoutez 1 Magie "Artisanesorcière" depuis votre Deck à votre main.
    ● Révélez 1 Magie Normale ou Jeu-Rapide "Artisanesorcière" dans votre main ; appliquez l'effet d'activation de la carte.
    Durant votre End Phase : vous pouvez renvoyer 1 de vos cartes "Artisanesorcière" bannies au Cimetière. Vous ne pouvez utiliser chaque effet de "Disciples, Artisanesorcière" qu'une fois par tour.
  it: |-
    1 mostro "Stregartigiana" + 1 mostro Incantatore
    Durante la Main o Battle Phase (Effetto Rapido): puoi attivare 1 di questi effetti;
    ● Aggiungi 1 Magia "Stregartigiana" dal tuo Deck alla tua mano.
    ● Rivela 1 Magia Normale o Rapida "Stregartigiana" nella tua mano; applica l'effetto dell'attivazione di quella carta.
    Durante la tua End Phase: puoi far ritornare nel Cimitero 1 delle tue carte "Stregartigiana" bandite. Puoi utilizzare ogni effetto di "Stregartigiane Allieve" una sola volta per turno.
  pt: |-
    1 monstro "Fazticeira" + 1 monstro Mago
    Durante a Fase Principal ou de Batalha (Efeito Rápido): você pode ativar 1 desses efeitos;
    ● Adicione 1 Magia "Fazticeira" do seu Deck à sua mão.
    ● Revele 1 Magia Normal ou Rápida "Fazticeira" na sua mão; aplique o efeito de ativação desse card.
    Durante sua Fase Final: você pode devolver 1 dos seus cards "Fazticeira" banidos para o Cemitério. Você só pode usar cada efeito de "Pupilas da Fazticeira" uma vez por turno.
  ja: |-
    「ウィッチクラフト」モンスター＋魔法使い族モンスター
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分・相手のメインフェイズ及びバトルフェイズに、以下の効果から１つを選択して発動できる。●デッキから「ウィッチクラフト」魔法カード１枚を手札に加える。●手札の「ウィッチクラフト」通常・速攻魔法カード１枚を相手に見せて発動できる。その魔法カード発動時の効果を適用する。②：自分エンドフェイズに発動できる。自分の除外状態の「ウィッチクラフト」カード１枚を墓地に戻す。
  ko: |-
    "위치크래프트" 몬스터 ＋ 마법사족 몬스터<br>이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 / 상대의 메인 페이즈 및 배틀 페이즈에, 이하의 효과에서 1개를 선택하고 발동할 수 있다. ●덱에서 "위치크래프트" 마법 카드 1장을 패에 넣는다. ●패의 "위치크래프트" 일반 / 속공 마법 카드 1장을 상대에게 보여주고 발동할 수 있다. 그 마법 카드 발동시의 효과를 적용한다. ②: 자신 엔드 페이즈에 발동할 수 있다. 자신의 제외 상태인 "위치크래프트" 카드 1장을 묘지로 되돌린다.
  zh-TW:
  zh-CN: |-
    “魔女工艺”怪兽＋魔法师族怪兽
    此卡名的①②效果1回合仅可各使用1次。①：在自己・对手的主要阶段及战斗阶段，可从以下效果中选择1个发动。●从牌组将1张“魔女工艺”魔法卡加入手牌。●向对手出示手牌的1张“魔女工艺”通常・速攻魔法卡可以发动。适用该魔法卡发动时的效果。②：在自己的结束阶段可以发动。将自己除外状态的1张“魔女工艺”卡放回墓地。
