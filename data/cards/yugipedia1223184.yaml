text:
  en: |-
    You can Ritual Summon this card with "Reindsurm Conquest". (Quick Effect): You can send 2 cards from your hand to the GY, including this card; add 1 non-FIRE "Reindsurm" monster from your Deck to your hand. If this card is Ritual Summoned, or your opponent Special Summons a monster(s): You can shuffle up to 2 monsters on the field into the Deck. If this card and a WATER "Reindsurm" monster are in your GY: You can add this card to your hand. You can only use each effect of "Reindsurm Gigalovendra" once per turn.
