name:
  en: Red Dragon Archfiend's Chains
  de: Ketten des Rotdrachen-Erzunterweltlers
  es: Cadenas del Dragón Rojo Archidemonio
  fr: Chaînes du Dragon Rouge Archdémon
  it: Catene dell'Arcidemone Drago Rosso
  pt: Correntes do Dragão Vermelho Arquidemônio
  ja: レッド・デーモンズ・チェーン
  ja_romaji: Reddo Dēmonzu Chēn
  ko: 레드 데몬즈 체인
  ko_rr:
  zh-TW: 闇紅惡魔鎖鏈
  zh-CN: 暗红恶魔锁链
text:
  en: |-
    You can activate this card the turn it was Set, by revealing 1 "Red Dragon Archfiend" in your Extra Deck. Activate this card by revealing any number of monsters in your hand, then target Effect Monsters your opponent controls equal to the number of Tuners revealed +1; those monsters lose 100 ATK for each card revealed, also their effects are negated. If none of those monsters are on the field, destroy this card. You can only activate 1 "Red Dragon Archfiend's Chains" per turn.
  de: |-
    Du kannst diese Karte in dem Spielzug aktivieren, in dem sie gesetzt wurde, indem du 1 „Rotdrachen-Erzunterweltler“ in deinem Extra Deck vorzeigst. Aktiviere diese Karte, indem du eine beliebige Anzahl Monster in deiner Hand vorzeigst und dann Effektmonster, die dein Gegner kontrolliert, in Höhe der Anzahl der vorgezeigten Empfänger +1 wählst; jene Monster verlieren für jede vorgezeigte Karte 100 ATK, zusätzlich werden ihre Effekte annulliert. Falls sich keins jener Monster auf dem Spielfeld befindet, zerstöre diese Karte. Du kannst nur 1 „Ketten des Rotdrachen-Erzunterweltlers“ pro Spielzug aktivieren.
  es: |-
    Puedes activar esta carta en el turno en el que fue Colocada, mostrando 1 "Dragón Rojo Archidemonio" en tu Deck Extra. Activa esta carta mostrando cualquier número de monstruos en tu mano, y después selecciona Monstruos de Efecto que controle tu adversario iguales al número de Cantantes mostrados +1; esos monstruos pierden 100 ATK por cada carta mostrada, y además sus efectos son negados. Si ninguno de esos monstruos está en el Campo, destruye esta carta. Sólo puedes activar 1 "Cadenas del Dragón Rojo Archidemonio" por turno.
  fr: |-
    Vous pouvez activer cette carte le tour où elle a été Posée, en révélant 1 "Dragon Rouge Archdémon" dans votre Extra Deck. Activez cette carte en révélant un nombre de votre choix de monstres dans votre main, puis ciblez un nombre de Monstres à Effet contrôlés par votre adversaire, égal au nombre de Syntoniseurs révélés +1 ; ces monstres perdent 100 ATK pour chaque carte révélée, et aussi, leurs effets sont annulés. Si aucun de ces monstres n'est sur le Terrain, détruisez cette carte. Vous ne pouvez activer qu'1 "Chaînes du Dragon Rouge Archdémon" par tour.
  it: |-
    Puoi attivare questa carta nel turno in cui è stata Posizionata, rivelando 1 "Arcidemone Drago Rosso" nel tuo Extra Deck. Attiva questa carta rivelando un qualsiasi numero di mostri nella tua mano, poi scegli come bersaglio Mostri con Effetto controllati dal tuo avversario pari al numero di Tuner rivelati +1; quei mostri perdono 100 ATK per ogni carta rivelata, inoltre i loro effetti sono annullati. Se nessuno di quei mostri è sul Terreno, distruggi questa carta. Puoi attivare solo 1 "Catene dell'Arcidemone Drago Rosso" per turno.
  pt: |-
    Você pode ativar este card no turno em que foi Baixado, ao revelar 1 "Dragão Vermelho Arquidemônio" no seu Deck Adicional. Ative este card ao revelar qualquer número de monstros na sua mão e, depois, escolha Monstros de Efeito que seu oponente controla igual ao número de Reguladores revelados +1; esses monstros perdem 100 de ATK para cada card revelado e, além disso, seus efeitos são negados. Se nenhum desses monstros estiver no campo, destrua este card. Você só pode ativar 1 "Correntes do Dragão Vermelho Arquidemônio" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。このカードはＥＸデッキの「レッド・デーモンズ・ドラゴン」１体を相手に見せ、セットしたターンに発動する事もできる。①：手札のモンスターを任意の数だけ相手に見せ、その内のチューナーの数＋１体だけ相手フィールドの効果モンスターを対象としてこのカードを発動できる。このカードが魔法＆罠ゾーンに存在する限り、対象のモンスターの攻撃力は手札から見せた数×１００ダウンし、効果は無効化される。対象のモンスターがフィールドに存在しない場合にこのカードは破壊される。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. 이 카드는 엑스트라 덱의 "레드 데몬즈 드래곤" 1장을 상대에게 보여주고, 세트한 턴에 발동할 수도 있다. ①: 패의 몬스터를 임의의 수만큼 상대에게 보여주고, 그 중의 튜너의 수 ＋ 1장만 상대 필드의 효과 몬스터를 대상으로 하여 이 카드를 발동할 수 있다. 이 카드가 마법 & 함정 존에 존재하는 한, 대상 몬스터의 공격력은 패에서 보여준 수 × 100 내리고, 효과는 무효화된다. 대상 몬스터가 필드에 존재하지 않을 경우에 이 카드는 파괴된다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。此卡也可通过向对手出示额外牌组的1只“暗红恶魔龙”，来在放置的回合发动。①：向对手出示手牌任意数量的怪兽，依其中协调的数量＋1只，以对手场上的效果怪兽为对象可以发动此卡。只要此卡存在于魔法与陷阱区域，对象怪兽的攻击力下降从手牌出示的数量×100的数值，效果无效化。对象怪兽不存在场上的情况下，此卡将被破坏。
