    このカード名の①の効果は１ターンに１度しか使用できない。①：自分の墓地からモンスター３体を除外して発動できる。このカードを手札から特殊召喚する。その後、以下の効果から１つを選んで適用できる。●手札・デッキから「ホワイトナイツ」モンスター１体を特殊召喚する。●デッキから「白のヴェール」１枚を手札に加える。②：このカードが相手モンスターと戦闘を行う攻撃宣言時に発動する。その相手モンスターの攻撃力を０にする。③：このカードが相手によって破壊された場合に発動する。相手に１０００ダメージを与える。
