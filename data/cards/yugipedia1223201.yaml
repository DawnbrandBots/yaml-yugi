  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将2只“轮回虫龙”怪兽加入手牌。然后，挑选自己的1张手牌送至墓地。然后，对手场上或墓地存在龙族怪兽的情况下，可从自己墓地将1只昆虫族怪兽加入手牌。②：此卡存在于墓地的状态下，自己将昆虫族怪兽仪式召唤的情况下，将此卡除外可以发动。从牌组将1张“轮回虫龙”场地魔法卡以表侧表示放在自己场上。
