text:
  en: |-
    Add 2 "Reindsurm" monsters from your Deck to your hand, then send 1 card from your hand to the GY, then if your opponent has a Dragon monster in their field or GY, you can add 1 Insect monster from your GY to your hand. If you Ritual Summon an Insect monster(s) while this card is in your GY: You can banish this card; place 1 "Reindsurm" Field Spell from your Deck face-up on your field. You can only use each effect of "Reindsurm Practice" once per turn.
