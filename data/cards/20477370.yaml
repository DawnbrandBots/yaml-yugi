text:
  en: |-
    2 Level 6 Plant monsters
    You can detach 2 materials from this card; Special Summon 1 Plant Xyz Monster from your Extra Deck in Defense Position, except "Rikka Empress Strenna", then if you Special Summoned a "Rikka" monster, you can attach 1 "Rikka" monster from your Deck to it. If a monster(s) is Tributed (except during the Damage Step): You can Set 1 "Rikka" Trap from your Deck or GY. You can only use each effect of "Rikka Empress Strenna" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    植物族レベル６モンスター×２
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードのＸ素材を２つ取り除いて発動できる。ＥＸデッキから「六花深聖ストレナエ」以外の植物族Ｘモンスター１体を守備表示で特殊召喚する。この効果で「六花」Ｘモンスターを特殊召喚した場合、さらにデッキから「六花」モンスター１体をそのＸ素材にできる。②：モンスターがリリースされた場合に発動できる。自分のデッキ・墓地から「六花」罠カード１枚を自分フィールドにセットする。
  ko:
  zh-TW:
  zh-CN: |-
    植物族等级6怪兽×2
    此卡名的①②效果1回合仅可各使用1次。①：去除此卡的2个超量素材可以发动。从额外牌组将“六花深圣花环”以外的1只植物族超量怪兽以守备表示特殊召唤。以此效果特殊召唤了“六花”超量怪兽的情况下，进而可从牌组将1只“六花”怪兽作为其超量素材。②：有怪兽被解放的情况下可以发动。从自己牌组・墓地将1张“六花”陷阱卡放置在自己场上。
