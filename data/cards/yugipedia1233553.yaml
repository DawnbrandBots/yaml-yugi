  en: |-
    You can Ritual Summon this card with a "Marincess" card. Monsters your opponent controls lose 1000 ATK. You can only use each of the following effects of "Aqua Leviathan @Marincess" once per turn. You can reveal this card in your hand; add 1 "Marincess" card from your Deck to your hand, except a Ritual Monster, then discard 1 card. If this card is Ritual Summoned: You can return cards your opponent controls to the hand up to the number of "Marincess" Monster Cards you control.
