name:
  en: Dark Magician, the Pharaoh's Servant
  de: Dunkler Magier, der Diener des Pharao
  es: Mago Oscuro, el Servidor del Faraón
  fr: Magicien Sombre, le Serviteur du Pharaon
  it: Mago Nero, il Servitore del Faraone
  pt: Mago Negro, o Servo do Faraó
  ja: <ruby>王<rt>ファラオ</rt></ruby>のしもべ－ブラック・マジシャン
  ja_romaji: Farao no Shimobe - Burakku Majishan
  ko: 파라오의 심복－블랙 매지션
  ko_rr:
  zh-TW:
  zh-CN: 王之仆从－黑魔导
text:
  en: |-
    This card's name becomes "Dark Magician" while on the field or in the GY. You can only use 1 of the following effects of "Dark Magician, the Pharaoh's Servant" per turn, and only once that turn. If this card is in your hand: You can reveal 1 Spell in your hand; Special Summon this card, then you can Set 1 Spell/Trap that mentions "Dark Magician" from your Deck. (Quick Effect): You can discard 1 Spell; destroy all Spells/Traps your opponent controls.
  de: |-
    Der Name dieser Karte wird zu „Dunkler Magier“, solange sie auf dem Spielfeld oder im Friedhof liegt. Du kannst nur 1 der folgenden Effekte von „Dunkler Magier, der Diener des Pharao“ pro Spielzug verwenden und in jenem Spielzug nur einmal. Falls sich diese Karte in deiner Hand befindet: Du kannst 1 Zauber in deiner Hand vorzeigen; beschwöre diese Karte als Spezialbeschwörung, dann kannst du 1 Zauber/Falle, der oder die „Dunkler Magier“ erwähnt, von deinem Deck setzen. (Schnelleffekt): Du kannst 1 Zauber abwerfen; zerstöre alle Zauber/Fallen, die dein Gegner kontrolliert.
  es: |-
    El nombre de esta carta se convierte en "Mago Oscuro" mientras está en el Campo o en el Cementerio. Sólo puedes usar 1 de los siguientes efectos de "Mago Oscuro, el Servidor del Faraón" por turno, y sólo una vez ese turno. Si esta carta está en tu mano: puedes mostrar 1 Mágica en tu mano; Invoca esta carta de Modo Especial, y después puedes Colocar 1 Mágica/Trampa desde tu Deck que mencione "Mago Oscuro". (Efecto Rápido): puedes descartar 1 Mágica; destruye todas las Mágicas/Trampas que controle tu adversario.
  fr: |-
    Le nom de cette carte devient "Magicien Sombre" tant qu'elle est sur le Terrain ou dans le Cimetière. Vous ne pouvez utiliser qu'1 des effets suivants de "Magicien Sombre, le Serviteur du Pharaon" par tour, et uniquement une fois le tour. Si cette carte est dans votre main : vous pouvez révéler 1 Magie dans votre main ; Invoquez Spécialement cette carte, puis vous pouvez Poser 1 Magie/Piège qui mentionne "Magicien Sombre" depuis votre Deck. (Effet Rapide) : vous pouvez défausser 1 Magie ; détruisez tous les Magies/Pièges contrôlés par votre adversaire.
  it: |-
    Il nome di questa carta diventa "Mago Nero" mentre è sul Terreno o nel Cimitero. Puoi utilizzare solo 1 dei seguenti effetti di "Mago Nero, il Servitore del Faraone" per turno, e solo una volta in quel turno. Se questa carta è nella tua mano: puoi rivelare 1 Magia nella tua mano; Evoca Specialmente questa carta, poi puoi Posizionare 1 Magia/Trappola che menziona "Mago Nero" dal tuo Deck. (Effetto Rapido): puoi scartare 1 Magia; distruggi tutte le Magie/Trappole controllate dal tuo avversario.
  pt: |-
    O nome deste card se torna "Mago Negro" enquanto estiver no campo ou no Cemitério. Você só pode usar 1 dos seguintes efeitos de "Mago Negro, o Servo do Faraó" por turno e apenas uma vez por turno. Se este card estiver na sua mão: você pode revelar 1 Magia na sua mão; Invoque este card por Invocação-Especial e, depois, você pode Baixar 1 Magia/Armadilha que mencione "Mago Negro" do seu Deck. (Efeito Rápido): você pode descartar 1 Magia; destrua todas as Magias/Armadilhas que seu oponente controla.
  ja: |-
    このカード名の②③の効果は１ターンに１度、いずれか１つしか使用できない。①：このカードのカード名は、フィールド・墓地に存在する限り「ブラック・マジシャン」として扱う。②：このカードが手札に存在する場合、手札の魔法カード１枚を相手に見せて発動できる。このカードを特殊召喚する。その後、デッキから「ブラック・マジシャン」のカード名が記された魔法・罠カード１枚を自分フィールドにセットできる。③：自分・相手ターンに、手札から魔法カード１枚を捨てて発動できる。相手フィールドの魔法・罠カードを全て破壊する。
  ko: |-
    이 카드명의 ②③의 효과는 1턴에 1번, 어느 쪽이든 1개밖에 사용할 수 없다. ①: 이 카드의 카드명은, 필드 / 묘지에 존재하는 한 "블랙 매지션"으로 취급한다. ②: 이 카드가 패에 존재할 경우, 패의 마법 카드 1장을 상대에게 보여주고 발동할 수 있다. 이 카드를 특수 소환한다. 그 후, 덱에서 "블랙 매지션"의 카드명이 쓰여진 마법 / 함정 카드 1장을 자신 필드에 세트할 수 있다. ③: 자신 / 상대 턴에, 패에서 마법 카드 1장을 버리고 발동할 수 있다. 상대 필드의 마법 / 함정 카드를 전부 파괴한다.
  zh-TW:
  zh-CN: |-
    此卡名的②③效果1回合1次，仅可使用其中1个。①：此卡只要存在于场上・墓地，卡名视为“黑魔导”。②：此卡存在于手牌的情况下，向对手出示手牌的1张魔法卡可以发动。将此卡特殊召唤。然后，可从牌组将1张记载有“黑魔导”卡名的魔法・陷阱卡放置在自己场上。③：在自己・对手回合中，从手牌将1张魔法卡舍弃可以发动。将对手场上的魔法・陷阱卡全部破坏。
