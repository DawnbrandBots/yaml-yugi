pendulum_scale: 1
pendulum_effect:
  en: |-
    During your Main Phase: You can return this card to the Extra Deck, then you can add 1 Level 7 Pendulum Monster from your Deck or face-up Extra Deck to your hand. You can only use this effect of "Master Spirit Tech Force - Pendulum Ruler" once per turn.
  de: |-
    Während deiner Main Phase: Du kannst diese Karte ins Extra Deck zurücklegen, dann kannst du deiner Hand 1 Pendelmonster der Stufe 7 von deinem Deck oder offen von deinem Extra Deck hinzufügen. Du kannst diesen Effekt von „Meistergeist-Technikkraft - Pendelherrscher“ nur einmal pro Spielzug verwenden.
  es: |-
    Durante tu Main Phase: puedes devolver esta carta al Deck Extra, y después puedes añadir a tu mano 1 Monstruo de Péndulo de Nivel 7 en tu Deck o Deck Extra boca arriba. Sólo puedes usar este efecto de "Fuerza Tecno Espiritual Maestra - Señor del Péndulo" una vez por turno.
  fr: |-
    Durant votre Main Phase : vous pouvez renvoyer cette carte à l'Extra Deck, puis vous pouvez ajouter 1 Monstre Pendule de Niveau 7 depuis votre Deck ou Extra Deck face recto à votre main. Vous ne pouvez utiliser cet effet de "Force Tech Spirit Maîtresse - Souverain Pendule" qu'une fois par tour.
  it: |-
    Durante la tua Main Phase: puoi far ritornare questa carta nell'Extra Deck, poi puoi aggiungere 1 Mostro Pendulum di Livello 7 dal tuo Deck o Extra Deck scoperto alla tua mano. Puoi utilizzare questo effetto di "Maestro Forza Tech Spirito - Sovrano Pendulum" una sola volta per turno.
  pt: |-
    Durante sua Fase Principal: você pode devolver este card para o Deck Adicional e, depois, você pode adicionar 1 Monstro Pêndulo de Nível 7 do seu Deck ou Deck Adicional com a face para cima à sua mão. Você só pode usar este efeito de "Força Tech Espiritual Mestre - Governante Pêndulo" uma vez por turno.
  ja: |-
    このカード名のＰ効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。このカードをＥＸデッキに戻す。その後、自分のデッキ・ＥＸデッキ（表側）からレベル７のＰモンスター１体を手札に加える事ができる。
  ko: |-
    이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 메인 페이즈에 발동할 수 있다. 이 카드를 엑스트라 덱으로 되돌린다. 그 후, 자신의 덱 / 엑스트라 덱(앞면)에서 레벨 7 의 펜듈럼 몬스터 1장을 패에 넣을 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。将此卡放回额外牌组。然后，可从自己牌组・额外牌组（表侧）将1只等级7的灵摆怪兽加入手牌。
