  ja: |-
    このカードは通常召喚できず、カードの効果でのみ特殊召喚できる。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の墓地に悪魔族・アンデット族モンスターが３体以上存在する場合に発動できる。このカードを手札から特殊召喚する。②：フィールドのこのカードが破壊された場合に発動できる。このカードを手札に加え、相手フィールドのモンスター１体のコントロールをエンドフェイズまで得る。その後、この効果でコントロールを得たモンスターの攻撃力の半分のダメージを相手に与える事ができる。
