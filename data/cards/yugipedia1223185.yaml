    以“轮回虫龙之骸歌”降临
    此卡名的①②效果1回合仅可各使用1次。①：此卡仪式召唤的情况下可以发动。从牌组将2张“轮回虫龙”卡送至墓地。②：此卡因战斗以外的方法被送至墓地的情况下可以发动。为使合计等级达到仪式召唤的怪兽的等级以上，解放自己手牌・场上的怪兽，或作为解放的代替将自己墓地的昆虫族・龙族怪兽放回牌组，从手牌将1只昆虫族仪式怪兽仪式召唤。
