text:
  en: |-
    Monsters your opponent controls lose 1500 DEF while you control a Tribute Summoned monster. If this card is Tributed: You can activate 1 of these effects (but you can only use each effect of "Clown Crew Cappello" once per turn);
    ● Shuffle all Pendulum Monsters from the face-up Extra Decks and the field into the Deck.
    ● Special Summon 1 non-Pendulum "Clown Crew" monster from your Deck or Extra Deck, ignoring its Summoning conditions.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：Ａ召喚したモンスターが自分フィールドに存在する限り、相手フィールドのモンスターの守備力は１５００ダウンする。②：このカードがリリースされた場合、以下の効果から１つを選択して発動できる（このカード名の以下の効果はそれぞれ１ターンに１度しか選択できない）。●お互いのＥＸデッキ（表側）・フィールドのＰモンスターを全てデッキに戻す。●デッキ・ＥＸデッキからＰモンスター以外の「道化の一座」モンスター１体を召喚条件を無視して特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    ①：只要自己场上存在上级召唤的怪兽，对手场上的怪兽的守备力下降1500。②：此卡被解放的情况下，可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。
    ●将双方额外牌组（表侧）・场上的灵摆怪兽全部放回牌组。
    ●从牌组・额外牌组将灵摆怪兽以外的1只“小丑戏帮”怪兽无视召唤条件特殊召唤。
card_type: Monster
monster_type_line: Beast-Warrior / Pendulum / Effect
attribute: LIGHT
level: 5
atk: 1900
def: 800
pendulum_scale: 7
pendulum_effect:
  en: |-
    During your Main Phase: You can send 1 non-Pendulum "Clown Crew" card from your Deck to the GY, and if you do, Special Summon this card, also until the end of the next turn after this effect resolves, you cannot activate the effect of monsters Special Summoned from the Deck or Extra Deck. You can only use this effect of "Clown Crew Cappello" once per turn.
  de: |-
    Während deiner Main Phase: Du kannst 1 „Clowntrupp“-Nichtpendel-Karte von deinem Deck auf den Friedhof legen und falls du dies tust, beschwöre diese Karte als Spezialbeschwörung, zusätzlich kannst du bis zum Ende des nächsten Spielzugs, nachdem dieser Effekt aufgelöst wurde, keine Effekte von Monstern aktivieren, die als Spezialbeschwörung vom Deck oder Extra Deck beschworen wurden. Du kannst diesen Effekt von „Clowntrupp Cappello“ nur einmal pro Spielzug verwenden.
  es: |-
    Durante tu Main Phase: puedes mandar al Cementerio 1 carta "Compañía de Payasos" que no sea de Péndulo en tu Deck y, si lo haces, Invoca esta carta de Modo Especial y además, hasta el final del próximo turno después de que se resuelva este efecto, no puedes activar el efecto de los monstruos Invocados de Modo Especial desde el Deck o Deck Extra. Sólo puedes usar este efecto de "Cappello de la Compañía de Payasos" una vez por turno.
  fr: |-
    Durant votre Main Phase : vous pouvez envoyer 1 carte non-Pendule "Troupe des Clowns" depuis votre Deck au Cimetière, et si vous le faites, Invoquez Spécialement cette carte, et aussi, jusqu'à la fin du prochain tour après la résolution de cet effet, vous ne pouvez pas activer les effets des monstres Invoqués Spécialement depuis le Deck ou Extra Deck. Vous ne pouvez utiliser cet effet de "Cappello, Troupe des Clowns" qu'une fois par tour.
  it: |-
    Durante la tua Main Phase: puoi mandare 1 carta "Compagnia di Clown" non-Pendulum dal tuo Deck al Cimitero e, se lo fai, Evoca Specialmente questa carta, inoltre fino alla fine del prossimo turno dopo che questo effetto si è risolto, non puoi attivare gli effetti dei mostri Evocati Specialmente dal Deck o Extra Deck. Puoi utilizzare questo effetto di "Compagnia di Clown Cappello" una sola volta per turno.
  pt: |-
    Durante sua Fase Principal: você pode enviar 1 card "Companhia de Palhaços" que não seja Pêndulo do seu Deck para o Cemitério e, se isso acontecer, Invoque este card por Invocação-Especial e, além disso, até o final do próximo turno depois que este efeito resolver, você não pode ativar os efeitos de monstros Invocados por Invocação-Especial do Deck ou Deck Adicional. Você só pode usar este efeito de "Companhia de Palhaços Cappello" uma vez por turno.
  ja: |-
    このカード名のＰ効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。デッキからＰモンスター以外の「道化の一座」カード１枚を墓地へ送り、このカードを特殊召喚する。この効果の発動後、次のターンの終了時まで自分はデッキ・ＥＸデッキから特殊召喚されたモンスターの効果を発動できない。
  ko: |-
    이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다.
    ①: 자신 메인 페이즈에 발동할 수 있다. 덱에서 펜듈럼 몬스터 이외의 "크라운 클랜" 카드 1장을 묘지로 보내고, 이 카드를 특수 소환한다. 이 효과의 발동 후, 다음 턴의 종료시까지 자신은 덱 / 엑스트라 덱에서 특수 소환된 몬스터의 효과를 발동할 수 없다.
  zh-TW: |-
    此卡名的鐘擺效果1回合僅可使用1次。
    ①：在自己的主要階段可以發動。從牌組將鐘擺怪獸以外的1張「小丑戲幫」卡送至墓地，將此卡特殊召喚。此效果發動後，直至下個回合結束時為止自己不可發動從牌組・額外牌組被特殊召喚的怪獸的效果。
  zh-CN: |-
    此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。从牌组将灵摆怪兽以外的1张“小丑戏帮”卡送至墓地，将此卡特殊召唤。此效果发动后，直至下个回合结束时为止，自己不可发动被从牌组・额外牌组特殊召唤的怪兽的效果。
