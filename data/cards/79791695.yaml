text:
  en: |-
    3+ Level 7 monsters
    You can also Xyz Summon this card by using 1 "Number C" monster you control with a number between "101" and "107" in its name (transfer its materials). Gains 1000 ATK for each material attached to it. While this card has a "Number C" monster as material, your opponent cannot add cards from the Deck to the hand, except by drawing them. Once per turn: You can detach 1 material from this card; attach the top 2 cards of your opponent's Deck to this card.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    レベル７モンスター×３体以上
    このカードは自分フィールドの「ＣＮｏ．１０１」～「ＣＮｏ．１０７」のいずれかの「ＣＮｏ．」モンスターの上に重ねてＸ召喚する事もできる。①：このカードの攻撃力は、このカードのＸ素材の数×１０００アップする。②：このカードが「ＣＮｏ．」モンスターをＸ素材としている限り、相手はドロー以外の方法でデッキからカードを手札に加える事ができない。③：１ターンに１度、このカードのＸ素材を１つ取り除いて発動できる。相手のデッキの上からカード２枚をこのカードのＸ素材にする。
  ko:
  zh-TW:
  zh-CN: |-
    等级7怪兽×3只以上
    此卡也可重叠在自己场上的“混沌编号101”～“混沌编号107”中的任一“混沌编号”怪兽上面来超量召唤。①：此卡的攻击力上升此卡超量素材的数量×1000的数值。②：只要此卡持有“混沌编号”怪兽作为超量素材，对手不可用抽牌以外的方法从牌组将卡加入手牌。③：1回合1次，去除此卡的1个超量素材可以发动。从对手牌组上面将2张卡作为此卡的超量素材。
