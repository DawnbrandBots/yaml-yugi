  pt:
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、サイコロを振る効果を持つカード１枚をデッキから手札に加える事ができる。②：カードの効果で自分か相手がサイコロを振り、１が出た場合、そのプレイヤーは以下の効果から１つを選択して発動できる（同一チェーン上ではお互い１度まで）。●相手フィールドのモンスターを３体まで破壊する。●相手フィールドのモンスター１体を破壊し、相手フィールドのモンスター１体の効果を無効にする。●自分の墓地からモンスター１体を特殊召喚する。
