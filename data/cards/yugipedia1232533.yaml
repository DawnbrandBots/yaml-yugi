  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从手牌将1张“狱神”卡舍弃可以发动。从额外牌组将1只“狱神”灵摆怪兽放在自己的灵摆区域。以此效果放了融合怪兽的情况下，进而可从牌组将1只“狱神”灵摆怪兽放在自己的灵摆区域。②：自己场上存在“狱神”怪兽的情况下，将墓地的此卡除外，以场上的1只表侧表示怪兽为对象可以发动。该怪兽攻击力上升1500，此回合不可攻击。
