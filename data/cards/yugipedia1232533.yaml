text:
  en: |-
    Discard 1 "Power Patron" card; place 1 "Power Patron" Pendulum Monster from your Extra Deck in your Pendulum Zone, then if it is a Fusion Monster, you can place 1 "Power Patron" Pendulum Monster from your Deck in your Pendulum Zone. If you control a "Power Patron" monster: You can banish this card from your GY, then target 1 face-up monster on the field; it gains 1500 ATK, also it cannot attack this turn. You can only use each effect of "Power Patron Portal Plugging -Sword of Mutual Destruction-" once per turn.
