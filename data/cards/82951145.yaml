text:
  en: |-
    You can discard 1 other card; Special Summon this card from your hand. If this card is Special Summoned: You can add 1 "Sun God" card from your Deck to your hand, except "Helpoemer, Chanter of the Sun God", then if your opponent's LP are at least 2000 higher than yours, you can discard 1 random card from their hand. During the End Phase, if "The Immortal Sun God" was sent to your GY this turn: You can add this card from your GY to your hand. You can only use each effect of "Helpoemer, Chanter of the Sun God" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：手札から他のカード１枚を捨てて発動できる。このカードを手札から特殊召喚する。②：このカードが特殊召喚した場合に発動できる。デッキから「太陽神の詩詠者－ヘルポエマー」以外の「太陽神」カード１枚を手札に加える。自分のＬＰが相手より２０００以上少ない場合、さらに相手の手札をランダムに１枚捨てる事ができる。③：このターンに「不死なる太陽神」が自分の墓地へ送られている場合、エンドフェイズに発動できる。墓地のこのカードを手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：从手牌将1张其他的卡舍弃可以发动。从手牌将此卡特殊召唤。②：此卡特殊召唤的情况下可以发动。从牌组将“太阳神的咏诗者－地狱诗人”以外的1张“太阳神”卡加入手牌。自己的LP比对手少2000以上的情况下，进而可随机舍弃对手的1张手牌。③：此回合有“不死之太阳神”被送至自己墓地的情况下，在结束阶段可以发动。将墓地的此卡加入手牌。
