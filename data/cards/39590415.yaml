text:
  en: |-
    You can Ritual Summon this card with "Reindsurm Conquest". If this card is Ritual Summoned: You can add 2 non-WIND "Reindsurm" monsters from your Deck to your hand. If this card is sent to the GY, except by battle (except during the Damage Step): You can Ritual Summon 1 Insect Ritual Monster from your hand, by Tributing monsters from your hand or field, and/or shuffling Insect and/or Dragon monsters from your GY into the Deck, whose total Levels equal or exceed its Level. You can only use each effect of "Reindsurm Amurusa" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「竜の骸歌」により降臨
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが儀式召喚した場合に発動できる。デッキから風属性以外の「リインゼルム」モンスター２体を手札に加える。②：このカードが戦闘以外で墓地へ送られた場合に発動できる。レベルの合計が儀式召喚するモンスターのレベル以上になるように、自分の手札・フィールドのモンスターをリリース、またはリリースの代わりに自分の墓地の昆虫族・ドラゴン族モンスターをデッキに戻し、手札から昆虫族の儀式モンスター１体を儀式召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    以“轮回虫龙之骸歌”降临
    此卡名的①②效果1回合仅可各使用1次。①：此卡仪式召唤的情况下可以发动。从牌组将风属性以外的2只“轮回虫龙”怪兽加入手牌。②：此卡因战斗以外的方法被送至墓地的情况下可以发动。为使合计等级达到仪式召唤的怪兽的等级以上，解放自己手牌・场上的怪兽，或作为解放的代替将自己墓地的昆虫族・龙族怪兽放回牌组，从手牌将1只昆虫族仪式怪兽仪式召唤。
