  ja: |-
    このカードは通常召喚できない。このカードを含む手札の地属性モンスター３体を相手に見せた場合に特殊召喚できる。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：手札のこのカードを相手に見せて発動できる。デッキから「龍札」カード１枚を手札に加える。その後、自分の手札を１枚選んで捨てる。②：相手がフィールドのモンスターの効果を発動した時に発動できる。その効果を無効にする。フィールドに水属性モンスターが存在する場合、さらにこのターン、このカードは戦闘・効果では破壊されない。
