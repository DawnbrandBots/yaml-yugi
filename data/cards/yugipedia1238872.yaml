text:
  en: |-
    When this card is activated: You can add 1 Level 4 or lower "Cubic" monster from your Deck to your hand. Neither player takes any battle damage from battles involving 2 monsters. Once per turn, during your Main Phase: You can Special Summon 1 "Cubic" monster from your hand, ignoring its Summoning conditions. If a monster(s) is destroyed by battle: Its controller takes damage equal to its original ATK. You can only activate 1 "Cubic Dimension" per turn.
