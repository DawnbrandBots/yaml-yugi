name:
  en: Kuzuha the Hex Ashtra
  de: Kuzuha die hexende Ashtra
  es: Kuzuha la Ashtra Bruja
  fr: Kuzuha l'Ensorceleuse Ashtra
  it: Kuzuha l'Ashtra Maledizione
  pt: Kuzuha, a Ashtra Feiticeira
  ja: <ruby>蠱<rt>こ</rt></ruby><ruby>神<rt>じん</rt></ruby>の<ruby>色鬼<rt>アシュトラ</rt></ruby> クズハ
  ja_romaji: Kojin no Ashutora Kuzuha
  ko: 고신의 아슈트라 쿠즈하
  ko_rr:
  zh-TW:
  zh-CN: 蛊神之色艮鬼 葛叶
text:
  en: |-
    You can Special Summon this card (from your hand) by revealing 1 face-down card you control and returning it to the hand or Extra Deck. You can only Special Summon "Kuzuha the Hex Ashtra" once per turn this way. You can only use each of the following effects of "Kuzuha the Hex Ashtra" once per turn. You can target 1 card on the field for every 2 face-down cards on the field; destroy it. During your End Phase: You can target 1 "Ashtra" Trap in your GY; Set it.
  de: |-
    Du kannst diese Karte als Spezialbeschwörung (von deiner Hand) beschwören, indem du 1 verdeckte Karte vorzeigst, die du kontrollierst, und sie auf die Hand oder ins Extra Deck zurückgibst. Du kannst „Kuzuha die hexende Ashtra“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Du kannst jeden der folgenden Effekte von „Kuzuha die hexende Ashtra“ nur einmal pro Spielzug verwenden. Du kannst für je 2 verdeckte Karten auf dem Spielfeld 1 Karte auf dem Spielfeld wählen; zerstöre sie. Während deiner End Phase: Du kannst 1 „Ashtra“-Falle in deinem Friedhof wählen; setze sie.
  es: |-
    Puedes Invocar esta carta de Modo Especial (desde tu mano) mostrando 1 carta boca abajo que controles y devolviéndola a la mano o Deck Extra. Sólo puedes Invocar de Modo Especial "Kuzuha la Ashtra Bruja" una vez por turno de esta forma. Sólo puedes usar cada uno de los siguientes efectos de "Kuzuha la Ashtra Bruja" una vez por turno. Puedes seleccionar 1 carta en el Campo por cada 2 cartas boca abajo en el Campo; destrúyela. Durante tu End Phase: puedes seleccionar 1 Trampa "Ashtra" en tu Cementerio; Colócala.
  fr: |-
    Vous pouvez Invoquer Spécialement cette carte (depuis votre main) en révélant 1 carte face verso que vous contrôlez et en la renvoyant à la main ou Extra Deck. Vous ne pouvez Invoquer Spécialement "Kuzuha l'Ensorceleuse Ashtra" qu'une fois par tour de cette façon. Vous ne pouvez utiliser chacun des effets suivants de "Kuzuha l'Ensorceleuse Ashtra" qu'une fois par tour. Vous pouvez cibler 1 carte sur le Terrain pour toutes les 2 cartes face verso sur le Terrain ; détruisez-la. Durant votre End Phase : vous pouvez cibler 1 Piège "Ashtra" dans votre Cimetière ; Posez-le.
  it: |-
    Puoi Evocare Specialmente questa carta (dalla tua mano) rivelando 1 carta coperta che controlli e facendola ritornare nella mano o Extra Deck. Puoi Evocare Specialmente "Kuzuha l'Ashtra Maledizione" una sola volta per turno in questo modo. Puoi utilizzare ognuno dei seguenti effetti di "Kuzuha l'Ashtra Maledizione" una sola volta per turno. Puoi scegliere come bersaglio 1 carta sul Terreno per ogni 2 carte coperte sul Terreno; distruggila. Durante la tua End Phase: puoi scegliere come bersaglio 1 Trappola "Ashtra" nel tuo Cimitero; Posizionala.
  pt: |-
    Você pode Invocar este card por Invocação-Especial (da sua mão) ao revelar 1 card com a face para baixo que você controla e devolvê-lo para a mão ou para o Deck Adicional. Você só pode Invocar "Kuzuha, a Ashtra Feiticeira" por Invocação-Especial uma vez por turno desta forma. Você só pode usar cada um dos seguintes efeitos de "Kuzuha, a Ashtra Feiticeira" uma vez por turno. Você pode escolher 1 card no campo para cada 2 cards com a face para baixo no campo; destrua-os. Durante sua Fase Final: você pode escolher 1 Armadilha "Ashtra" no seu Cemitério; Baixe-a.
  ja: |-
    このカード名の、①の方法による特殊召喚は１ターンに１度しかできず、②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードは自分フィールドの裏側表示カード１枚を相手に見せて手札・ＥＸデッキに戻し、手札から特殊召喚できる。②：フィールドの裏側表示カード２枚につき１枚まで、フィールドのカードを対象として発動できる。そのカードを破壊する。③：自分エンドフェイズに、自分の墓地の「アシュトラ」罠カード１枚を対象として発動できる。そのカードを自分フィールドにセットする。
  ko: |-
    이 카드명의, ①의 방법에 의한 특수 소환은 1턴에 1번밖에 할 수 없으며, ②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드는 자신 필드의 뒷면 표시 카드 1장을 상대에게 보여주고 패 / 엑스트라 덱으로 되돌리고, 패에서 특수 소환할 수 있다. ②: 필드의 뒷면 표시 카드 2장당 1장까지, 필드의 카드를 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다. ③: 자신 엔드 페이즈에, 자신 묘지의 "아슈트라" 함정 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 자신 필드에 세트한다.
  zh-TW:
  zh-CN: |-
    此卡名以①方法的特殊召唤1回合仅可进行1次，且②③效果1回合仅可各使用1次。①：此卡可通过将自己场上的1张里侧表示卡出示给对手并放回手牌・额外牌组，来从手牌特殊召唤。②：场上的里侧表示卡每有2张，就以场上的最多1张卡为对象可以发动。将该卡破坏。③：在自己的结束阶段，以自己墓地的1张“艮鬼”陷阱卡为对象可以发动。将该卡放置在自己场上。
