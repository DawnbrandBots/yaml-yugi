  zh-CN: |-
    此卡名的①②效果1回合1次，仅可使用其中1个。①：以自己场上的1只“假面魔蹈士”超量怪兽为对象可以发动。从额外牌组将1只阶级比该自己的怪兽高1或低2的“编号”怪兽重叠在对象怪兽上面，视为超量召唤特殊召唤。②：将墓地的此卡除外，以自己墓地的“黑影”怪兽或“假面魔蹈士”超量怪兽合计3只为对象可以发动。将该怪兽以喜欢的顺序放回牌组下面。然后，自己抽1张。
