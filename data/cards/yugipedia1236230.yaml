text:
  en: |-
    Target 1 "Masquerade" Xyz Monster you control; Special Summon from your Extra Deck, 1 "Number" monster that is 1 Rank higher or 2 Ranks lower than that monster you control, by using it as material (this is treated as an Xyz Summon, transfer its materials). You can banish this card from your GY, then target 3 "Umbral Horror" monsters and/or "Masquerade" Xyz Monsters in your GY; place them on the bottom of the Deck in any order, then draw 1 card. You can only use 1 "Chaos Barian's Change" effect per turn, and only once that turn.
