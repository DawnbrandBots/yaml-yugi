name:
  en: Astrograph Sorcerer, the Starfrost Magician
  de: Astrografzauberer, Sternfrost-Magier
  es: Hechicero del Astrógrafo, el Mago Congelaestrellas
  fr: Sorcier Astrographe, le Magicien du Gel Stellaire
  it: Stregone Astrografo, il Mago Gelidestelle
  pt: Feiticeiro Astrógrafo, o Mago Starfrost
  ja: <ruby>星<rt>せい</rt></ruby><ruby>霜<rt>そう</rt></ruby>の<ruby>魔<rt>ま</rt></ruby><ruby>術<rt>じゅつ</rt></ruby><ruby>師<rt>し</rt></ruby>－アストログラフ・マジシャン
  ja_romaji: Seisō no Majutsushi - Asutorogurafu Majishan
  ko: 성상의 마술사－아스트로그래프 매지션
  ko_rr:
  zh-TW:
  zh-CN: 星霜的魔术师－宙读阵魔术士
text:
  en: |-
    If a face-up Monster Card(s) you control is destroyed by battle or card effect: You can Special Summon this card from your hand, then you can Special Summon 1 of those destroyed monsters from your face-up Extra Deck or GY. During the Main Phase (Quick Effect): You can Tribute this card, then you can Fusion Summon 1 Dragon Fusion Monster from your Extra Deck, by shuffling its materials from your field and/or face-up Extra Deck into the Deck. You can only use each effect of "Astrograph Sorcerer, the Starfrost Magician" once per turn.
  de: |-
    Falls eine oder mehr offene Monsterkarten, die du kontrollierst, durch Kampf oder einen Karteneffekt zerstört werden: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören, dann kannst du 1 jener zerstörten Monster als Spezialbeschwörung offen von deinem Extra Deck oder von deinem Friedhof beschwören. Während der Main Phase (Schnelleffekt): Du kannst diese Karte als Tribut anbieten, dann kannst du 1 Drache-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du sein Material von deiner Spielfeldseite und/oder offen von deinem Extra Deck ins Deck mischst. Du kannst jeden Effekt von „Astrografzauberer, Sternfrost-Magier“ nur einmal pro Spielzug verwenden.
  es: |-
    Si una o más Cartas de Monstruo boca arriba que controles son destruidas en batalla o por el efecto de una carta: puedes Invocar esta carta de Modo Especial desde tu mano, y después puedes Invocar de Modo Especial, desde tu Deck Extra boca arriba o Cementerio, 1 de esos monstruos destruidos. Durante la Main Phase (Efecto Rápido): puedes Sacrificar esta carta, y después puedes Invocar por Fusión 1 Monstruo de Fusión Dragón desde tu Deck Extra, barajando al Deck sus materiales en tu Campo y/o Deck Extra boca arriba. Sólo puedes usar cada efecto de "Hechicero del Astrógrafo, el Mago Congelaestrellas" una vez por turno.
  fr: |-
    Si une ou plusieurs Cartes Monstre face recto que vous contrôlez sont détruites au combat ou par un effet de carte : vous pouvez Invoquer Spécialement cette carte depuis votre main, puis vous pouvez Invoquer Spécialement 1 de ces monstres détruits depuis votre Extra Deck face recto ou Cimetière. Durant la Main Phase (Effet Rapide) : vous pouvez Sacrifier cette carte, puis vous pouvez Invoquer par Fusion 1 Monstre Fusion Dragon depuis votre Extra Deck, en mélangeant ses Matériels depuis votre Terrain et/ou Extra Deck face recto dans le Deck. Vous ne pouvez utiliser chaque effet de "Sorcier Astrographe, le Magicien du Gel Stellaire" qu'une fois par tour.
  it: |-
    Se una o più Carte Mostro scoperte che controlli vengono distrutte in battaglia o dall'effetto di una carta: puoi Evocare Specialmente questa carta dalla tua mano, poi puoi Evocare Specialmente 1 di quei mostri distrutti dal tuo Extra Deck scoperto o Cimitero. Durante la Main Phase (Effetto Rapido): puoi offrire come Tributo questa carta, poi puoi Evocare tramite Fusione 1 Mostro Fusione Drago dal tuo Extra Deck, mischiando i suoi materiali dal tuo Terreno e/o Extra Deck scoperto nel Deck. Puoi utilizzare ogni effetto di "Stregone Astrografo, il Mago Gelidestelle" una sola volta per turno.
  pt: |-
    Se um ou mais Cards de Monstro com a face para cima que você controla forem destruídos em batalha ou por um efeito de card: você pode Invocar este card por Invocação-Especial da sua mão e, depois, você pode Invocar por Invocação-Especial 1 desses monstros destruídos do seu Deck Adicional com a face para cima ou Cemitério. Durante a Fase Principal (Efeito Rápido): você pode oferecer este card como Tributo e, depois, você pode Invocar por Invocação-Fusão 1 Monstro de Fusão Dragão do seu Deck Adicional, ao embaralhar suas matérias do seu campo e/ou Deck Adicional com a face para cima no Deck. Você só pode usar cada efeito de "Feiticeiro Astrógrafo, o Mago Starfrost" uma vez por turno.
  ja: |-
    このカード名の①②のモンスター効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドの表側表示のモンスターカードが戦闘・効果で破壊された場合に発動できる。このカードを手札から特殊召喚する。その後、その破壊されたモンスターの内１体を自分のＥＸデッキ（表側）・墓地から特殊召喚できる。②：自分・相手のメインフェイズに発動できる。このカードをリリースする。その後、自分のＥＸデッキ（表側）・フィールドのモンスターを融合素材としてデッキに戻し、ドラゴン族の融合モンスター１体を融合召喚できる。
  ko: |-
    이 카드명의 ①②의 몬스터 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드의 앞면 표시 몬스터 카드가 전투 / 효과로 파괴되었을 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 그 후, 그 파괴된 몬스터 중 1장을 자신의 엑스트라 덱(앞면) / 묘지에서 특수 소환할 수 있다. ②: 자신 / 상대의 메인 페이즈에 발동할 수 있다. 이 카드를 릴리스한다. 그 후, 자신의 엑스트라 덱(앞면) / 필드의 몬스터를 융합 소재로서 덱으로 되돌리고, 드래곤족인 융합 몬스터 1장을 융합 소환할 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名的①②怪兽效果1回合仅可各使用1次。①：自己场上的表侧表示怪兽卡因战斗・效果被破坏的情况下可以发动。从手牌将此卡特殊召唤。然后，可从自己额外牌组（表侧）・墓地将该被破坏的怪兽中的1只特殊召唤。②：在自己・对手的主要阶段可以发动。解放此卡。然后，可将自己额外牌组（表侧）・场上的怪兽作为融合素材放回牌组，将1只龙族融合怪兽融合召唤。
