pendulum_effect:
  en: |-
    During your Main Phase: You can destroy this card, and if you do, place 1 Scale 1 Pendulum Monster from your hand or Deck in your Pendulum Zone, except "Astrograph Sorcerer, the Starfrost Magician", but neither player can activate its Pendulum Effects this turn. You can only use this effect of "Astrograph Sorcerer, the Starfrost Magician" once per turn.
  de: |-
    Während deiner Main Phase: Du kannst diese Karte zerstören und falls du dies tust, lege 1 Pendelmonster mit Pendelbereich 1 von deiner Hand oder deinem Deck in deine Pendelzone, außer „Astrografzauberer, Sternfrost-Magier“, aber kein Spieler kann in diesem Spielzug seine Pendeleffekte aktivieren. Du kannst diesen Effekt von „Astrografzauberer, Sternfrost-Magier“ nur einmal pro Spielzug verwenden.
  es: |-
    Durante tu Main Phase: puedes destruir esta carta y, si lo haces, pon en tu Zona de Péndulo 1 Monstruo de Péndulo de Escala 1 en tu mano o Deck, excepto "Hechicero del Astrógrafo, el Mago Congelaestrellas", pero ningún jugador puede activar sus Efectos de Péndulo este turno. Sólo puedes usar este efecto de "Hechicero del Astrógrafo, el Mago Congelaestrellas" una vez por turno.
  fr: |-
    Durant votre Main Phase : vous pouvez détruire cette carte, et si vous le faites, placez 1 Monstre Pendule d'Échelle 1 ("Sorcier Astrographe, le Magicien du Gel Stellaire" exclu) depuis votre main ou Deck dans votre Zone Pendule, mais aucun joueur ne peut activer ses Effets Pendule ce tour. Vous ne pouvez utiliser cet effet de "Sorcier Astrographe, le Magicien du Gel Stellaire" qu'une fois par tour.
  it: |-
    Durante la tua Main Phase: puoi distruggere questa carta e, se lo fai, metti 1 Mostro Pendulum di Valore 1 dalla tua mano o Deck nella tua Zona Pendulum, eccetto "Stregone Astrografo, il Mago Gelidestelle", ma nessun giocatore può attivare i suoi Effetti Pendulum in questo turno. Puoi utilizzare questo effetto di "Stregone Astrografo, il Mago Gelidestelle" una sola volta per turno.
  pt: |-
    Durante sua Fase Principal: você pode destruir este card e, se isso acontecer, coloque 1 Monstro Pêndulo de Escala 1 da sua mão ou do Deck na sua Zona de Pêndulo, exceto "Feiticeiro Astrógrafo, o Mago Starfrost", mas nenhum duelista pode ativar seus Efeitos de Pêndulo neste turno. Você só pode usar este efeito de "Feiticeiro Astrógrafo, o Mago Starfrost" uma vez por turno.
  ja: |-
    このカード名のＰ効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。このカードを破壊し、手札・デッキから「星霜の魔術師－アストログラフ・マジシャン」以外のＰスケールが１のＰモンスター１体を自分のＰゾーンに置く。この効果で置いたカードのＰ効果はこのターン発動できない。
  ko: |-
    이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 메인 페이즈에 발동할 수 있다. 이 카드를 파괴하고, 패 / 덱에서 "성상의 마술사－아스트로그래프 매지션" 이외의 펜듈럼 스케일이 1 인 펜듈럼 몬스터 1장을 자신의 펜듈럼 존에 놓는다. 이 효과로 놓은 카드의 펜듈럼 효과는 이 턴에 발동할 수 없다.
  zh-TW:
  zh-CN: |-
    此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。将此卡破坏，从手牌・牌组将“星霜的魔术师－宙读阵魔术士”以外的、1只灵摆刻度为1的灵摆怪兽放在自己的灵摆区域。以此效果所放的卡的灵摆效果此回合不可发动。
