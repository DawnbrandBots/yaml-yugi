name:
  en: Kuriboh - Multiply!
  de: Kuriboh - Multiplizieren!
  es: Kuriboh - ¡Multiplícate!
  fr: Kuriboh - Multiplication !
  it: Kuriboh - Moltiplicazione!
  pt: Kuriboh - Multiplicar!
  ja: <ruby>増<rt>ぞう</rt></ruby><ruby>殖<rt>しょく</rt></ruby>するクリボー！
  ja_romaji: Zōshokusuru Kuribō!
  ko: 증식의 크리보!
  ko_rr:
  zh-TW:
  zh-CN: 增殖的库里波!
text:
  en: |-
    When your opponent activates a monster effect, or an opponent's monster declares an attack (Quick Effect): You can Special Summon this card from your hand. You can only use this effect of "Kuriboh - Multiply!" once per turn. Once per turn, when your opponent activates a monster effect on the field, or during damage calculation when an opponent's monster attacks (Quick Effect): You can add to your hand or Special Summon, from your Deck or GY, 1 "Dark Magician" or 1 monster with 300 ATK/200 DEF, then you can change that opponent's monster's ATK to 0.
  de: |-
    Wenn dein Gegner einen Monstereffekt aktiviert oder ein Monster eines Gegners einen Angriff deklariert (Schnelleffekt): Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören. Du kannst diesen Effekt von „Kuriboh - Multiplizieren!“ nur einmal pro Spielzug verwenden. Einmal pro Spielzug, wenn dein Gegner einen Monstereffekt auf dem Spielfeld aktiviert oder während der Schadensberechnung, wenn ein Monster eines Gegners angreift (Schnelleffekt): Du kannst 1 „Dunkler Magier“ oder 1 Monster mit 300 ATK/200 DEF von deinem Deck oder Friedhof deiner Hand hinzufügen oder als Spezialbeschwörung beschwören, dann kannst du die ATK jenes Monsters des Gegners zu 0 ändern.
  es: |-
    Cuando tu adversario active un efecto de monstruo, o un monstruo del adversario declare un ataque (Efecto Rápido): puedes Invocar esta carta de Modo Especial desde tu mano. Sólo puedes usar este efecto de "Kuriboh - ¡Multiplícate!" una vez por turno. Una vez por turno, cuando tu adversario active el efecto de un monstruo en el Campo, o durante el cálculo de daño cuando un monstruo del adversario ataque (Efecto Rápido): puedes añadir a tu mano, o Invocar de Modo Especial desde tu Deck o Cementerio, 1 "Mago Oscuro" o 1 monstruo con 300 ATK/200 DEF, y después puedes cambiar el ATK de ese monstruo del adversario a 0.
  fr: |-
    Lorsque votre adversaire active un effet de monstre, ou qu'un monstre de l'adversaire déclare une attaque (Effet Rapide) : vous pouvez Invoquer Spécialement cette carte depuis votre main. Vous ne pouvez utiliser cet effet de "Kuriboh - Multiplication !" qu'une fois par tour. Une fois par tour, lorsque votre adversaire active un effet de monstre sur le Terrain, ou durant le calcul des dommages lorsqu'un monstre de l'adversaire attaque (Effet Rapide) : vous pouvez ajouter à votre main ou Invoquer Spécialement, depuis votre Deck ou Cimetière, 1 "Magicien Sombre" ou 1 monstre avec 300 ATK/200 DEF, puis vous pouvez changer l'ATK du monstre de l'adversaire à 0.
  it: |-
    Quando il tuo avversario attiva l'effetto di un mostro, o un mostro dell'avversario dichiara un attacco (Effetto Rapido): puoi Evocare Specialmente questa carta dalla tua mano. Puoi utilizzare questo effetto di "Kuriboh - Moltiplicazione!" una sola volta per turno. Una volta per turno, quando il tuo avversario attiva l'effetto di un mostro sul Terreno, o durante il calcolo dei danni quando un mostro dell'avversario attacca (Effetto Rapido): puoi aggiungere alla tua mano o Evocare Specialmente, dal tuo Deck o Cimitero, 1 "Mago Nero" o 1 mostro con 300 ATK/200 DEF, poi puoi cambiare l'ATK di quel mostro dell'avversario a 0.
  pt: |-
    Quando seu oponente ativar um efeito de monstro, ou um monstro do oponente declarar um ataque (Efeito Rápido): você pode Invocar este card por Invocação-Especial da sua mão. Você só pode usar este efeito de "Kuriboh - Multiplicar!" uma vez por turno. Uma vez por turno, quando seu oponente ativar um efeito de monstro no campo, ou durante o cálculo de dano quando um monstro do oponente atacar (Efeito Rápido): você pode adicionar à sua mão ou Invocar por Invocação-Especial, do seu Deck ou Cemitério, 1 "Mago Negro" ou 1 monstro com 300 de ATK/200 de DEF e, depois, você pode mudar o ATK desse monstro do oponente para 0.
  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：相手がモンスターの効果を発動した時、または相手モンスターの攻撃宣言時に発動できる。このカードを手札から特殊召喚する。②：１ターンに１度、相手がフィールドのモンスターの効果を発動した時、または相手モンスターが攻撃するダメージ計算時に発動できる。「ブラック・マジシャン」または攻撃力３００／守備力２００のモンスター１体を自分のデッキ・墓地から選び、手札に加えるか特殊召喚する。その後、その相手モンスターの攻撃力を０にできる。
  ko: |-
    이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 상대가 몬스터의 효과를 발동했을 때, 또는 상대 몬스터의 공격 선언시에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. ②: 1턴에 1번, 상대가 필드의 몬스터의 효과를 발동했을 때, 또는 상대 몬스터가 공격하는 데미지 계산시에 발동할 수 있다. "블랙 매지션" 또는 공격력 300 / 수비력 200 의 몬스터 1장을 자신의 덱 / 묘지에서 고르고, 패에 넣거나 특수 소환한다. 그 후, 그 상대 몬스터의 공격력을 0 으로 할 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名的①效果1回合仅可使用1次。①：对手发动怪兽的效果时，或对手怪兽攻击宣言时可以发动。从手牌将此卡特殊召唤。②：1回合1次，对手发动场上的怪兽的效果时，或对手怪兽攻击的伤害计算时可以发动。从自己牌组・墓地挑选1只“黑魔导”或攻击力300/守备力200的怪兽，加入手牌或特殊召唤。然后，可将该对手怪兽的攻击力改成0。
