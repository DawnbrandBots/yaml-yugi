text:
  en: |-
    During the Main Phase (Quick Effect): You can reveal this card in your hand; banish it (face-down), and if you do, Special Summon 1 of your face-down banished "Xenovader△" monsters, except a Level 6 monster. You can only use this effect of "Burial Summit Xenovader△ Helheim" once per turn. If this card is Normal or Special Summoned: Banish (face-down) the top 6 cards of your Deck. Other "Xenovader△" cards you control cannot be destroyed by your opponent's card effects, also your opponent cannot target them with card effects.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：自分・相手のメインフェイズに、手札のこのカードを相手に見せて発動できる。このカードを裏側で除外し、レベル６モンスター以外の自分の除外状態（裏側）の「異解△」モンスター１体を特殊召喚する。②：このカードが召喚・特殊召喚した場合に発動する。自分のデッキの上からカード６枚を裏側で除外する。③：このカードがモンスターゾーンに存在する限り、自分フィールドの他の「異解△」カードは相手の効果では破壊されず、相手はそれらを効果の対象にできない。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①效果1回合仅可使用1次。①：在自己・对手的主要阶段，向对手出示手牌的此卡可以发动。将此卡以里侧除外，将等级6怪兽以外的、自己除外状态（里侧）的1只“异解△”怪兽特殊召唤。②：此卡召唤・特殊召唤的情况下发动。从自己牌组上面将6张卡以里侧除外。③：只要此卡存在于怪兽区域，自己场上其他的“异解△”卡不会因对手的效果被破坏，且对手不可将其作为效果的对象。
