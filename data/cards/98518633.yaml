text:
  en: |-
    If a Spell/Trap(s) on the field is returned to the hand (except during the Damage Step): You can Special Summon this card from your GY (if it was there when that card was returned) or hand (even if not), in face-up or face-down Defense Position, but if you Summoned it from the GY, banish it when it leaves the field. If another card(s) on the field is returned to the hand, while this card is in the Monster Zone (except during the Damage Step): You can target 1 of your banished Normal Traps; Set it. You can only use each effect of "Kerolia the Frolicsome" once per turn.
  de: |-
    Falls ein/e oder mehr Zauber/Fallen vom Spielfeld auf die Hand zurückgegeben werden (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung von deinem Friedhof (falls sie dort lag, als jene Karten zurückgegeben wurden) oder deiner Hand (selbst falls nicht) in die offene oder verdeckte Verteidigungsposition beschwören, aber falls du sie vom Friedhof beschworen hast, verbanne sie, wenn sie das Spielfeld verlässt. Falls eine oder mehr andere Karten vom Spielfeld auf die Hand zurückgegeben werden, solange diese Karte in der Monsterzone liegt (außer während des Damage Steps): Du kannst 1 deiner verbannten Normalen Fallen wählen; setze sie. Du kannst jeden Effekt von „Kerolia die Ausgelassene“ nur einmal pro Spielzug verwenden.
  es: |-
    Si una o más Mágicas/Trampas en el Campo son devueltas a la mano (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial desde tu Cementerio (si estaba allí cuando esa carta fue devuelta) o mano (aun si no lo estaba), en Posición de Defensa boca arriba o boca abajo, pero si la Invocaste desde el Cementerio, destiérrala cuando deje el Campo. Si otra u otras cartas en el Campo son devueltas a la mano, mientras esta carta está en la Zona de Monstruos (excepto durante el Damage Step): puedes seleccionar 1 de tus Trampas Normales desterradas; Colócala. Sólo puedes usar cada efecto de "Kerolia la Divertida" una vez por turno.
  fr: |-
    Si un ou plusieurs Magies/Pièges sur le Terrain sont renvoyés à la main (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte depuis votre Cimetière (si elle y était lorsque les cartes ont été renvoyées) ou la main (même si elle n'y était pas) en Position de Défense face recto ou face verso, mais si vous l'avez Invoquée depuis le Cimetière, bannissez-la lorsqu'elle quitte le Terrain. Si une ou plusieurs autres cartes sur le Terrain sont renvoyées à la main, tant que cette carte est dans la Zone Monstre (sauf durant la Damage Step) : vous pouvez cibler 1 de vos Pièges Normaux bannis ; Posez-le. Vous ne pouvez utiliser chaque effet de "Kerolia la Pleine d'Entrain" qu'une fois par tour.
  it: |-
    Se una o più Magie/Trappole sul Terreno vengono fatte ritornare nella mano (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta dal tuo Cimitero (se era lì quando quelle carte sono state fatte ritornare) o mano (anche se non lo era), scoperta o coperta in Posizione di Difesa, ma se l'hai Evocata dal Cimitero, bandiscila quando lascia il Terreno. Se una o più altre carte sul Terreno vengono fatte ritornare nella mano, mentre questa carta è nella Zona Mostri (eccetto durante il Damage Step): puoi scegliere come bersaglio 1 delle tue Trappole Normali bandite; Posizionala. Puoi utilizzare ogni effetto di "Kerolia la Vivace" una sola volta per turno.
  pt: |-
    Se uma ou mais Magias/Armadilhas no campo forem devolvidas para a mão (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial do seu Cemitério (se ele estava lá quando esse card foi devolvido) ou da mão (mesmo se ele não estava), com a face para cima ou com a face para baixo em Posição de Defesa, mas se você o Invocou do Cemitério, bana-o quando ele deixar o campo. Se um ou mais outros cards no campo forem devolvidos para a mão, enquanto este card estiver na Zona de Monstros (exceto durante a Etapa de Dano): você pode escolher 1 das suas Armadilhas Normais banidas; Baixe-a. Você só pode usar cada efeito de "Kerolia, a Brincalhona" uma vez por turno.
