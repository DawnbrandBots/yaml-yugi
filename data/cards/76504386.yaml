  ja: <ruby>Ｎｏ．<rt>ナンバーズ</rt></ruby>３９ <ruby>光<rt>ひかり</rt></ruby>の<ruby>使<rt>し</rt></ruby><ruby>者<rt>しゃ</rt></ruby> <ruby>希<rt>き</rt></ruby><ruby>望<rt>ぼう</rt></ruby><ruby>皇<rt>おう</rt></ruby>ホープ
  ja_romaji: Nanbāzu Sanjūkyū Hikari no Shisha Kibōō Hōpu
