  zh-CN: 魔女工艺・书匠玛尔卡
text:
  en: |-
    You can Tribute this card from your hand or field; add 1 "Witchcrafter" Field or Continuous Spell from your Deck to your hand. If a face-up "Witchcrafter" monster(s) you control leaves the field by an opponent's card effect, while this card is in your GY (except during the Damage Step): You can Special Summon this card (but banish it when it leaves the field), and if you do, Tribute 1 monster your opponent controls. You can only use each effect of "Witchcrafter Marka" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：手札・フィールドのこのカードをリリースして発動できる。デッキから「ウィッチクラフト」フィールド・永続魔法カード１枚を手札に加える。②：このカードが墓地に存在する状態で、自分フィールドの表側表示の「ウィッチクラフト」モンスターが相手の効果でフィールドから離れた場合に発動できる。このカードを特殊召喚し、相手フィールドのモンスター１体をリリースする。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 패 / 필드의 이 카드를 릴리스하고 발동할 수 있다. 덱에서 "위치크래프트" 필드 / 지속 마법 카드 1장을 패에 넣는다. ②: 이 카드가 묘지에 존재하는 상태에서, 자신 필드의 앞면 표시의 "위치크래프트" 몬스터가 상대 효과로 필드에서 벗어났을 경우에 발동할 수 있다. 이 카드를 특수 소환하고, 상대 필드의 몬스터 1장을 릴리스한다. 이 효과로 특수 소환한 이 카드는, 필드에서 벗어났을 경우에 제외된다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：解放手牌・场上的此卡可以发动。从牌组将1张“魔女工艺”场地・永续魔法卡加入手牌。②：此卡存在于墓地的状态下，自己场上表侧表示的“魔女工艺”怪兽因对手的效果从场上离开的情况下可以发动。将此卡特殊召唤，将对手场上1只怪兽解放。以此效果特殊召唤的此卡从场上离开的情况下，将其除外。
