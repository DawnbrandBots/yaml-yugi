  ja: |-
    このカード名はルール上「獄神」カードとしても扱う。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：フィールドに「獄神」カードが存在する場合に発動できる。このカードを手札から特殊召喚する。その後、デッキから「テオリアライズ」魔法・罠カード１枚を手札に加える事ができる。②：モンスターが表側で除外された場合、以下から１つを選択して発動できる。●デッキから「アルス＝マグナ」カード１枚を手札に加える。●このカードを除外し、ＥＸデッキから「ディアクトロス」モンスター１体を特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名在规则上也视为“狱神”卡。此卡名的①②效果1回合仅可各使用1次。①：场上存在“狱神”卡的情况下可以发动。从手牌将此卡特殊召唤。然后，可从牌组将1张“预幻”魔法・陷阱卡加入手牌。②：有怪兽以表侧被除外的情况下，可从以下效果中选择1个发动。
    ●从牌组将1张“奥艺”卡加入手牌。
    ●将此卡除外，从额外牌组将1只“迪亚克特罗斯”怪兽特殊召唤。
