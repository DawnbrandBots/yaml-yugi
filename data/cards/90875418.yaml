name:
  en: Theorealized Medius
  de: Theorealisierter Medius
  es: Teoresaber Anterior Medius
  fr: Théoréalisation Medius
  it: Teorealizzare Medius
  pt: Teorealizar Medius
  ja: <ruby>予幻使<rt>テオリアライズ</rt></ruby> メディウス
