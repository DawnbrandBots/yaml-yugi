  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのモンスターが戦闘・効果で破壊された自分・相手ターンに発動できる。このカードを手札から特殊召喚し、自分の墓地からモンスター１体を攻撃力８００アップの装備魔法カード扱いでこのカードに装備する。②：自分メインフェイズに発動できる。このカードの装備カードを全て破壊する。この効果でモンスターカードを破壊した場合、さらにその内の１体とはレベルが異なり、種族・属性が同じモンスター１体をデッキから手札に加える事ができる。
