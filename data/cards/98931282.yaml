name:
  en: Destiny HERO - Dreadnought Servant
  de: Schicksals-HELD - Dreadnought Servant
  es: HÉROE del Destino - Dreadnought Servant
  fr: Servant Sans Effroi - HÉROS de la Destinée
  it: Servitore della Corazzata - EROE del Destino
  pt: HERÓI do Destino - Servo Couraçado
  ja: <ruby>Ｄ－ＨＥＲＯ<rt>デステニーヒーロー</rt></ruby> ドレッドノートサーヴァント
  ja_romaji: Desutenī Hīrō Doreddonōto Sāvanto
  ko:
  ko_rr:
  zh-TW:
  zh-CN: 命运－英雄 无惧仆从
text:
  en: |-
    If you control a "Destiny HERO" monster or a face-up Field Spell: You can Special Summon this card from your hand, then you can destroy 1 card you control, and if you do, add 1 "Polymerization" from your Deck to your hand. If you Special Summon a Level 8 "Destiny HERO" monster(s) (except during the Damage Step): You can banish this card from your GY, then target 1 card your opponent controls; place it on top of the Deck. You can only use each effect of "Destiny HERO - Dreadnought Servant" once per turn.
  de: |-
    Falls du ein „Schicksals-HELD“-Monster oder einen offenen Spielfeldzauber kontrollierst: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören, dann kannst du 1 Karte zerstören, die du kontrollierst, und falls du dies tust, füge deiner Hand 1 „Polymerisation“ von deinem Deck hinzu. Falls du ein oder mehr „Schicksals-HELD“-Monster der Stufe 8 als Spezialbeschwörung beschwörst (außer während des Damage Steps): Du kannst diese Karte von deinem Friedhof verbannen und dann 1 Karte wählen, die dein Gegner kontrolliert; lege sie aufs Deck. Du kannst jeden Effekt von „Schicksals-HELD - Dreadnought Servant“ nur einmal pro Spielzug verwenden.
  es: |-
    Si controlas un monstruo "HÉROE del Destino" o una Mágica de Campo boca arriba: puedes Invocar esta carta de Modo Especial desde tu mano, y después puedes destruir 1 carta que controles y, si lo haces, añade a tu mano 1 "Polimerización" en tu Deck. Si Invocas de Modo Especial uno o más monstruos "HÉROE del Destino" de Nivel 8 (excepto durante el Damage Step): puedes desterrar esta carta en tu Cementerio, y después selecciona 1 carta que controle tu adversario; ponla en la parte superior del Deck. Sólo puedes usar cada efecto de "HÉROE del Destino - Dreadnought Servant" una vez por turno.
  fr: |-
    Si vous contrôlez un monstre "HÉROS de la Destinée" ou une Magie de Terrain face recto : vous pouvez Invoquer Spécialement cette carte depuis votre main, puis vous pouvez détruire 1 carte que vous contrôlez, et si vous le faites, ajoutez 1 "Polymérisation" depuis votre Deck à votre main. Si vous Invoquez Spécialement un ou plusieurs monstres "HÉROS de la Destinée" de Niveau 8 (sauf durant la Damage Step) : vous pouvez bannir cette carte depuis votre Cimetière, puis ciblez 1 carte contrôlée par votre adversaire ; placez-la au-dessus du Deck. Vous ne pouvez utiliser chaque effet de "Servant Sans Effroi - HÉROS de la Destinée" qu'une fois par tour.
  it: |-
    Se controlli un mostro "EROE del Destino" o una Magia Terreno scoperta: puoi Evocare Specialmente questa carta dalla tua mano, poi puoi distruggere 1 carta che controlli e, se lo fai, aggiungi 1 "Polimerizzazione" dal tuo Deck alla tua mano. Se Evochi Specialmente uno o più mostri "EROE del Destino" di Livello 8 (eccetto durante il Damage Step): puoi bandire questa carta dal tuo Cimitero, poi scegliere come bersaglio 1 carta controllata dal tuo avversario; mettila in cima al Deck. Puoi utilizzare ogni effetto di "Servitore della Corazzata - EROE del Destino" una sola volta per turno.
  pt: |-
    Se você controlar um monstro "HERÓI do Destino" ou uma Magia de Campo com a face para cima: você pode Invocar este card por Invocação-Especial da sua mão e, depois, você pode destruir 1 card que você controla e, se isso acontecer, adicione 1 "Polimerização" do seu Deck à sua mão. Se você Invocar por Invocação-Especial um ou mais monstros "HERÓI do Destino" de Nível 8 (exceto durante a Etapa de Dano): você pode banir este card do seu Cemitério e, depois, escolha 1 card que seu oponente controla; coloque-o no topo do Deck. Você só pode usar cada efeito de "HERÓI do Destino - Servo Couraçado" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドに「Ｄ－ＨＥＲＯ」モンスターかフィールド魔法カードが表側表示で存在する場合に発動できる。このカードを手札から特殊召喚する。その後、以下の効果を適用できる。●自分フィールドのカード１枚を破壊し、デッキから「融合」１枚を手札に加える。②：自分がレベル８の「Ｄ－ＨＥＲＯ」モンスターを特殊召喚した場合、墓地のこのカードを除外し、相手フィールドのカード１枚を対象として発動できる。そのカードをデッキの一番上に戻す。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：“命运－英雄”怪兽或场地魔法卡以表侧表示存在于自己场上的情况下可以发动。从手牌将此卡特殊召唤。然后，可适用以下效果。
    ●将自己场上的1张卡破坏，从牌组将1张“融合”加入手牌。
    ②：自己将等级8的“命运－英雄”怪兽特殊召唤的情况下，将墓地的此卡除外，以对手场上的1张卡为对象可以发动。将该卡放回牌组最上面。
