  en: |-
    Add 1 "Sennet" monster from your Deck to your hand. If you discard a "Sennet" Ritual Monster(s) while this card is in your GY: You can banish this card; Special Summon 1 non-Effect Fusion Monster from your Extra Deck with ATK less than or equal to any of the discarded monsters' as a Normal Monster Card, but for the rest of this turn, it cannot attack directly, also you cannot activate non-Zombie monster effects. You can only use each effect of "Sennet Per Akh" once per turn.
