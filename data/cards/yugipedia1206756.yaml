  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将1只“塞尼特”怪兽加入手牌。②：此卡存在于墓地的状态下，自己从手牌将“塞尼特”仪式怪兽舍弃的情况下，将此卡除外可以发动。从额外牌组将1只攻击力在所舍弃的怪兽的攻击力以下的、效果怪兽以外的融合怪兽视为通常怪兽卡特殊召唤。此回合，以此效果特殊召唤的怪兽不可直接攻击，自己不可发动不死族以外的怪兽的效果。
