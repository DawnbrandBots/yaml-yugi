text:
  en: |-
    You can Ritual Summon this card with any "Zenet" card. This card equipped with an Equip Card cannot be destroyed by battle. You can only use each of the following effects of "Zenetmes Nekhbet" once per turn. You can discard this card; add 1 "Zenet" card from your GY to your hand, except "Zenetmes Nekhbet". (Quick Effect): You can Special Summon 1 face-up Normal Monster Card from your Spell & Trap Zone, and if you do, equip this card you control to it as an Equip Spell that gives it 2500 ATK.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「セネト」カードにより降臨
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から捨てて発動できる。自分の墓地から「セネトメス・ネクベト」以外の「セネト」カード１枚を手札に加える。②：装備カードを装備しているこのカードは戦闘では破壊されない。③：自分・相手ターンに発動できる。自分の魔法＆罠ゾーンの表側表示の通常モンスターカード１枚を特殊召喚し、自分フィールドのこのカードを攻撃力２５００アップの装備魔法カード扱いでそのモンスターに装備する。
  ko:
  zh-TW:
  zh-CN: |-
    以“塞尼特”卡降临
    此卡名的①③效果1回合仅可各使用1次。①：从手牌将此卡舍弃可以发动。从自己墓地将“塞尼特摩斯・尼库贝特”以外的1张“塞尼特”卡加入手牌。②：装备有装备卡的此卡不会因战斗被破坏。③：在自己・对手回合中可以发动。将自己的魔法与陷阱区域的1张表侧表示的通常怪兽卡特殊召唤，将自己场上的此卡视为攻击力上升2500的装备魔法卡装备于该怪兽。
