name:
  en: Malefic Force
  de: Niederträchtige Kraft
  es: Fuerza Maliciosa
  fr: Force Corrompue
  it: Forza Maligna
  pt: Força Perniciosa
  ja: <ruby>Ｓｉｎ<rt>シン</rt></ruby> <ruby>Ｆｏｒｃｅ<rt>フォース</rt></ruby>
  ja_romaji: Shin Fōsu
  ko: Sin 포스
  ko_rr:
  zh-TW:
  zh-CN: Sin 力量
text:
  en: |-
    Target 1 face-up monster on the field; equip this card to it with the following effects.
    ● The equipped monster is unaffected by Spell effects.
    ● Once per turn: You can destroy this card, and if you do, add 1 "Malefic" card from your Deck to your hand.
    If a card is in the Field Zone: You can banish this card and 1 other "Malefic" card from your GY; destroy all monsters on the field. You can only use each effect of "Malefic Force" once per turn.
  de: |-
    Wähle 1 offenes Monster auf dem Spielfeld; rüste es mit dieser Karte mit den folgenden Effekten aus.
    ● Das ausgerüstete Monster bleibt von Zaubereffekten unberührt.
    ● Einmal pro Spielzug: Du kannst diese Karte zerstören und falls du dies tust, füge deiner Hand 1 „Niederträchtig“-Karte von deinem Deck hinzu.
    Falls eine Karte in der Spielfeldzone liegt: Du kannst diese Karte und 1 andere „Niederträchtig“-Karte von deinem Friedhof verbannen; zerstöre alle Monster auf dem Spielfeld. Du kannst jeden Effekt von „Niederträchtige Kraft“ nur einmal pro Spielzug verwenden.
  es: |-
    Selecciona 1 monstruo boca arriba en el Campo; equípale esta carta con los siguientes efectos.
    ● El monstruo equipado no es afectado por efectos de Mágicas.
    ● Una vez por turno: puedes destruir esta carta y, si lo haces, añade a tu mano 1 carta "Malicioso/a" en tu Deck.
    Si una carta está en la Zona del Campo: puedes desterrar esta carta y otra carta "Malicioso/a" en tu Cementerio; destruye todos los monstruos en el Campo. Sólo puedes usar cada efecto de "Fuerza Maliciosa" una vez por turno.
  fr: |-
    Ciblez 1 monstre face recto sur le Terrain ; équipez-lui cette carte avec les effets suivants.
    ● Le monstre équipé n'est pas affecté par les effets de Magie.
    ● Une fois par tour : vous pouvez détruire cette carte, et si vous le faites, ajoutez 1 carte "Corrompu" depuis votre Deck à votre main.
    Si une carte est dans la Zone Terrain : vous pouvez bannir cette carte et 1 autre carte "Corrompu" depuis votre Cimetière ; détruisez tous les monstres sur le Terrain. Vous ne pouvez utiliser chaque effet de "Force Corrompue" qu'une fois par tour.
  it: |-
    Scegli come bersaglio 1 mostro scoperto sul Terreno; equipaggia questa carta a esso con i seguenti effetti.
    ● Il mostro equipaggiato è immune agli effetti delle Magie.
    ● Una volta per turno: puoi distruggere questa carta e, se lo fai, aggiungi 1 carta "Maligno" dal tuo Deck alla tua mano.
    Se una carta è nella Zona Terreno: puoi bandire questa carta e 1 altra carta "Maligno" dal tuo Cimitero; distruggi tutti i mostri sul Terreno. Puoi utilizzare ogni effetto di "Forza Maligna" una sola volta per turno.
  pt: |-
    Escolha 1 monstro com a face para cima no campo; equipe este card a ele com os seguintes efeitos.
    ● O monstro equipado não é afetado por efeitos de Magia.
    ● Uma vez por turno: você pode destruir este card e, se isso acontecer, adicione 1 card "Pernicioso(a)" do seu Deck à sua mão.
    Se um card estiver na Zona do Campo: você pode banir este card e 1 outro card "Pernicioso(a)" do seu Cemitério; destrua todos os monstros no campo. Você só pode usar cada efeito de "Força Perniciosa" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：フィールドの表側表示モンスター１体を対象としてこのカードを発動できる。このカードを以下の効果を持つ装備カード扱いでそのモンスターに装備する。
    ●装備モンスターは魔法カードの効果を受けない。
    ●１ターンに１度、発動できる。このカードを破壊し、デッキから「Ｓｉｎ」カード１枚を手札に加える。
    ②：フィールドゾーンにカードが存在する場合、自分の墓地からこのカードと「Ｓｉｎ」カード１枚を除外して発動できる。フィールドのモンスターを全て破壊する。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 필드의 앞면 표시 몬스터 1장을 대상으로 하고 이 카드를 발동할 수 있다. 이 카드를 이하의 효과를 가지는 장착 카드로 취급하고 그 몬스터에 장착한다.
    ●장착 몬스터는 마법 카드의 효과를 받지 않는다.
    ●1턴에 1번, 발동할 수 있다. 이 카드를 파괴하고, 덱에서 "Sin(신)" 카드 1장을 패에 넣는다.
    ②: 필드 존에 카드가 존재할 경우, 자신 묘지에서 이 카드와 "Sin(신)" 카드 1장을 제외하고 발동할 수 있다. 필드의 몬스터를 전부 파괴한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：以场上的1只表侧表示怪兽为对象可以发动此卡。将此卡视为拥有以下效果的装备卡，装备于该怪兽。
    ●装备怪兽不受魔法卡的效果影响。
    ●1回合1次，可以发动。将此卡破坏，从牌组将1张“Sin”卡加入手牌。
    ②：场地区域存在卡的情况下，从自己墓地将此卡和1张“Sin”卡除外可以发动。将场上的怪兽全部破坏。
