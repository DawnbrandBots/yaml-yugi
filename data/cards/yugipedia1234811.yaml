  en: |-
    If you control an "Amazoness" monster or "Harpie Lady", you can activate this card the turn it was Set. Target 1 monster on the field; Special Summon 1 "Harpie" or "Amazoness" monster from your hand or Deck, and if you do, return the targeted monster to the hand. You can banish this card from your GY; add 1 "Harpie" or "Amazoness" monster from your GY or banishment to your hand. You can only use each effect of "Amazoness Dramatic Rescue" once per turn.
