  ja: |-
    このカードは通常召喚できない。「完全なる羽化－究極完全態・グレート・モス」は１ターンに１度、自分の墓地の昆虫族モンスターが６体以上の場合のみ特殊召喚できる。①：このカードが特殊召喚した場合に発動できる。相手フィールドのカードを全て手札に戻す。その後、自分の墓地に通常モンスターが存在する場合、このカードの攻撃力を自分の墓地の昆虫族モンスターの数×３００アップできる。②：相手がモンスターを召喚・特殊召喚する度に発動する。相手フィールドの全てのモンスターの攻撃力は自身のレベル×１００ダウンする。
