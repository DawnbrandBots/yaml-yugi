  zh-CN: |-
    “拉之翼神龙”＋“太阳神”怪兽×3
    ①：场上的此卡不受其他卡的效果影响。②：1回合1次，在自己・对手的主要阶段，从手牌将任意数量的“太阳神”卡舍弃，依其数量指定使用中的对手的主要怪兽区域可以发动。对手必须将该区域的怪兽送至墓地。③：此卡进行战斗的攻击宣言时，支付LP直至变为1LP可以发动。此卡的攻击力・守备力上升相当于所支付的数值及自己墓地的“太阳神”怪兽的攻击力合计数值。
