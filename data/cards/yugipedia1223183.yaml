text:
  en: |-
    You can Ritual Summon this card with "Reindsurm Conquest". If this card is Ritual Summoned: You can add 2 "Reindsurm" Spells/Traps from your Deck to your hand. If this card is sent to the GY, except by battle: You can Ritual Summon 1 Insect Ritual Monster from your hand, by Tributing monsters from your hand or field, and/or shuffling Insect and/or Dragon monsters from your GY into the Deck, whose total Levels equal or exceed its Level. You can only use each effect of "Reindsurm Luvian" once per turn.
