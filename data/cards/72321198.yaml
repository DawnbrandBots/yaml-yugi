text:
  en: |-
    When a card or effect is activated (Quick Effect): You can reveal this card in your hand; Special Summon 1 "Arcana Force" monster from your hand in Defense Position. You can only use this effect of "Arcana Force XII - The Hangman" once per turn. If this card is Summoned: Toss a coin.
    ● Heads: Destroy 1 monster you control, and if you do, take damage equal to its original ATK.
    ● Tails: Destroy 1 monster your opponent controls, and if you do, inflict damage to your opponent equal to its original ATK.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：カードの効果が発動した時、手札のこのカードを相手に見せて発動できる。手札から「アルカナフォース」モンスター１体を守備表示で特殊召喚する。②：このカードが召喚・反転召喚・特殊召喚した場合に発動する。コイントスを１回行い、その裏表によって以下の効果を適用する。●表：自分フィールドのモンスター１体を破壊し、自分はその元々の攻撃力分のダメージを受ける。●裏：相手フィールドのモンスター１体を破壊し、その元々の攻撃力分のダメージを相手に与える。
  ko: |-
    이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 카드의 효과가 발동했을 때, 패의 이 카드를 상대에게 보여주고 발동할 수 있다. 패에서 "아르카나 포스" 몬스터 1장을 수비 표시로 특수 소환한다. ②: 이 카드를 일반 소환 / 반전 소환 / 특수 소환했을 경우에 발동한다. 코인 토스를 1회 실행하고, 그 앞뒷면에 따라 이하의 효과를 적용한다. ●앞: 자신 필드의 몬스터 1장을 파괴하고, 자신은 그 원래 공격력만큼의 데미지를 받는다. ●뒤: 상대 필드의 몬스터 1장을 파괴하고, 그 원래 공격력만큼의 데미지를 상대에게 준다.
