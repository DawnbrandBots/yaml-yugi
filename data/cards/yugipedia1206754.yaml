text:
  en: |-
    You can Ritual Summon this card with any "Sennet" card. This card equipped with an Equip Card cannot be destroyed by battle. You can only use each of the following effects of "Sennetmes Nekhbet" once per turn. You can discard this card; add 1 "Sennet" card from your GY to your hand, except "Sennetmes Nekhbet". (Quick Effect): You can Special Summon 1 face-up Normal Monster Card from your Spell & Trap Zone, and if you do, equip this card you control to it as an Equip Spell that gives it 2500 ATK.
