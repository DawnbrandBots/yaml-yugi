  de: Beginn von Atlantis
  es: Advenimiento de Atlántida
  fr: Avènement d'Atlantis
  it: Avvento di Atlantide
  pt: Advento de Atlântida
  ja: <ruby>顕現する伝説の都<rt>アトランティス・アドベント</rt></ruby>
  ja_romaji: Atorantisu Adobento
