  ko_rr:
  zh-TW:
  zh-CN: 显现的亚特兰蒂斯
text:
  en: |-
    This card's name becomes "Umi" while in the Spell & Trap Zone. You can only use each of the following effects of "Advent of Atlantis" once per turn. During your Main Phase: You can place 1 "Atlantis, City of the Sea Dragon" or "Umi" from your Deck, face-up in your Field Zone. If this card is sent to the GY: You can add 1 Level 7 Sea Serpent monster from your Deck to your hand.
  de: |-
    Der Name dieser Karte wird zu „Umi“, solange sie in der Zauber- & Fallenzone liegt. Du kannst jeden der folgenden Effekte von „Beginn von Atlantis“ nur einmal pro Spielzug verwenden. Während deiner Main Phase: Du kannst 1 „Atlantis, Stadt des Seedrachen“ oder „Umi“ von deinem Deck offen in deine Spielfeldzone legen. Falls diese Karte auf den Friedhof gelegt wird: Du kannst deiner Hand 1 Seeschlange-Monster der Stufe 7 von deinem Deck hinzufügen.
  es: |-
    El nombre de esta carta se convierte en "Umi" mientras esté en la Zona de Magia y Trampas. Sólo puedes usar cada uno de los siguientes efectos de "Advenimiento de Atlántida" una vez por turno. Durante tu Main Phase: puedes poner boca arriba en tu Zona del Campo 1 "Atlántida, Ciudad del Dragón Marino" o "Umi" en tu Deck. Si esta carta es mandada al Cementerio: puedes añadir a tu mano 1 monstruo Serpiente Marina de Nivel 7 en tu Deck.
  fr: |-
    Le nom de cette carte devient "Umi" tant qu'elle est dans la Zone Magie & Piège. Vous ne pouvez utiliser chacun des effets suivants de "Avènement d'Atlantis" qu'une fois par tour. Durant votre Main Phase : vous pouvez placer face recto 1 "Atlantis, Cité du Dragon des Mers" ou "Umi" depuis votre Deck dans votre Zone Terrain. Si cette carte est envoyée au Cimetière : vous pouvez ajouter 1 monstre Serpent de Mer de Niveau 7 depuis votre Deck à votre main.
  it: |-
    Il nome di questa carta diventa "Umi" mentre è nella Zona Magie & Trappole. Puoi utilizzare ognuno dei seguenti effetti di "Avvento di Atlantide" una sola volta per turno. Durante la tua Main Phase: puoi mettere 1 "Atlantide, Città del Drago del Mare" o "Umi" dal tuo Deck, scoperta nella tua Zona Terreno. Se questa carta viene mandata al Cimitero: puoi aggiungere 1 mostro Serpente Marino di Livello 7 dal tuo Deck alla tua mano.
  pt: |-
    O nome deste card se torna "Umi" enquanto estiver na Zona de Magias & Armadilhas. Você só pode usar cada um dos seguintes efeitos de "Advento de Atlântida" uma vez por turno. Durante sua Fase Principal: você pode colocar 1 "Atlântida, a Cidade do Dragão Marinho" ou "Umi" do seu Deck, com a face para cima na sua Zona do Campo. Se este card for enviado para o Cemitério: você pode adicionar 1 monstro Serpente Marinha de Nível 7 do seu Deck à sua mão.
  ja: |-
    このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードは魔法＆罠ゾーンに存在する限り、カード名を「海」として扱う。②：自分メインフェイズに発動できる。デッキから「竜都アトランティス」か「海」１枚を自分のフィールドゾーンに表側表示で置く。③：このカードが墓地へ送られた場合に発動できる。デッキから海竜族・レベル７モンスター１体を手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的②③效果1回合仅可各使用1次。①：此卡只要存在于魔法与陷阱区域，卡名视为“海”。②：在自己的主要阶段可以发动。从牌组将1张“龙都 亚特兰蒂斯”或“海”以表侧表示放在自己的场地区域。③：此卡被送至墓地的情况下可以发动。从牌组将1只海龙族・等级7怪兽加入手牌。
