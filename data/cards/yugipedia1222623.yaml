  en: |-
    When your opponent activates a card or effect that includes an effect that Special Summons a Monster Card(s) from the GY: Negate that effect, and if you do, Special Summon 1 monster from your opponent's GY to their field, then send any number of face-up monsters they control to the GY whose total ATK equal 6000 or less. If this card is banished: You can add it to your hand, then immediately after this effect resolves, you can Normal Summon 1 monster from your hand that requires 1 or more Tributes without Tributing. You can only use each effect of "Final Journey of the Soul" once per turn.
