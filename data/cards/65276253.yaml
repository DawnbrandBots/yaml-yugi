text:
  en: |-
    During your Main Phase: You can add 1 "Magician Girl" monster from your Deck to your hand. You can only use this effect of "B.L.A.C.K. Parfait" once per turn. If your opponent Normal or Special Summons a monster(s) (except during the Damage Step): You can Special Summon 1 "Magician Girl" monster from your hand with a different Attribute from the monsters you control, then if you control "Dark Magician Girl", you can negate the effects of 1 other face-up card on the field until the end of this turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。デッキから「マジシャン・ガール」モンスター１体を手札に加える。②：相手がモンスターを召喚・特殊召喚した場合に発動できる。同じ属性のモンスターが自分フィールドに存在しない「マジシャン・ガール」モンスター１体を手札から特殊召喚する。その後、自分フィールドに「ブラック・マジシャン・ガール」が存在する場合、フィールドの他の表側表示カード１枚の効果をターン終了時まで無効にできる。
