  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードが表側表示で存在する限り１度だけ、自分メインフェイズに発動できる。デッキから「ゴーストリック」モンスター１体を手札に加える。②：モンスターが相手の効果で墓地へ送られた場合、以下の効果から１つを選択して発動できる。
    ●自分フィールドの表側表示か裏側守備表示の「ゴーストリック」モンスター１体を表側守備表示か裏側守備表示にする。
    ●自分のデッキの一番上のカードを自分フィールドの「ゴーストリック」Ｘモンスター１体のＸ素材にする。
