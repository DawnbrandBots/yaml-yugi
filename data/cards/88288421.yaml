text:
  en: |-
    If a monster(s) is Normal or Special Summoned and there is another monster(s) on the field with the same Type: That Summoned monster(s) gains 1000 ATK/DEF. If this card is destroyed: Negate the effects of all face-up monsters currently on the field, also their ATK/DEF become their original ATK/DEF. Once per turn, during the Standby Phase, if this card is in your GY and there are no cards in the Field Zones: You can place this card face-up on your field.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：モンスターが召喚・特殊召喚された場合、そのモンスターと同じ種族の他のモンスターがフィールドに存在していれば発動する。その召喚・特殊召喚されたモンスターの攻撃力・守備力は１０００アップする。②：このカードが破壊された場合に発動する。フィールドの全ての表側表示モンスターの効果は無効化され、その攻撃力・守備力は元々の数値になる。③：自分・相手のスタンバイフェイズに、このカードが墓地に存在し、お互いのフィールドゾーンにカードが存在しない場合に発動できる。このカードを自分フィールドに表側表示で置く。
