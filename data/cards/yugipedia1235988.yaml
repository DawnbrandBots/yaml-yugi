  en: |-
    This card's name becomes "Umi" while on the field. You can only use each of the following effects of "Rampant Wings of Atlantis" once per turn. You can send this card from your hand and 1 Spell/Trap or "Umi" from your hand or face-up field to the GY, then target 1 card your opponent controls; send it to the GY. If you control "Atlantis, City of the Sea Dragon": You can banish this card from your GY; Special Summon 1 Level 4 or lower Sea Serpent monster from your hand or Deck.
