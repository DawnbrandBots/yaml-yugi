name:
  en: Blue-Eyes White Dragon, the White Phantom Beast
  de: Blauäugiger w. Drache, das weiße Phantomungeheuer
  es: Dragón Blanco de Ojos Azules, la Bestia Fantasma Blanca
  fr: Dragon Blanc aux Yeux Bleus, la Bête Fantôme Blanche
  it: Drago Bianco Occhi Blu, la Bestia Fantasma Bianca
  pt: Dragão Branco de Olhos Azuis, a Besta Fantasma Branca
  ja: <ruby>白<rt>しろ</rt></ruby>き<ruby>幻<rt>げん</rt></ruby><ruby>獣<rt>じゅう</rt></ruby>－<ruby>青眼の白龍<rt>ブルーアイズ・ホワイト・ドラゴン</rt></ruby>
  ja_romaji: Shiroki Genjū - Burūaizu Howaito Doragon
  ko: 하얀 환상수－푸른 눈의 백룡
  ko_rr:
  zh-TW:
  zh-CN: 白之幻兽－青眼白龙
text:
  en: |-
    When this card is added from the Deck to your hand, or a monster you control is destroyed by battle: You can reveal this card in your hand; Special Summon it. If this card is Special Summoned from the hand or Deck: You can destroy all monsters your opponent controls, also you can only attack directly with "Blue-Eyes" monsters for the rest of this turn. You can only use each of the preceding effects of "Blue-Eyes White Dragon, the White Phantom Beast" once per turn. When a card or effect is activated that targets this card on the field (Quick Effect): You can discard 1 card; negate that effect.
  de: |-
    Wenn diese Karte vom Deck deiner Hand hinzugefügt wird oder ein Monster, das du kontrollierst, durch Kampf zerstört wird: Du kannst diese Karte in deiner Hand vorzeigen; beschwöre sie als Spezialbeschwörung. Falls diese Karte als Spezialbeschwörung von der Hand oder dem Deck beschworen wird: Du kannst alle Monster zerstören, die dein Gegner kontrolliert, zusätzlich kannst du für den Rest dieses Spielzugs nur mit „Blauäugig“-Monstern direkt angreifen. Du kannst jeden der vorherigen Effekte von „Blauäugiger w. Drache, das weiße Phantomungeheuer“ nur einmal pro Spielzug verwenden. Wenn eine Karte oder ein Effekt aktiviert wird, die oder der diese Karte auf dem Spielfeld als Ziel wählt (Schnelleffekt): Du kannst 1 Karte abwerfen; annulliere jenen Effekt.
  es: |-
    Cuando esta carta en el Deck es añadida a tu mano, o un monstruo que controlas es destruido en batalla: puedes mostrar esta carta en tu mano; Invócala de Modo Especial. Si esta carta es Invocada de Modo Especial desde la mano o Deck: puedes destruir todos los monstruos que controle tu adversario, y además sólo puedes atacar directamente con monstruos "Ojos Azules" por el resto de este turno. Sólo puedes usar cada uno de los previos efectos de "Dragón Blanco de Ojos Azules, la Bestia Fantasma Blanca" una vez por turno. Cuando es activada una carta o efecto que selecciona esta carta en el Campo (Efecto Rápido): puedes descartar 1 carta; niega ese efecto.
  fr: |-
    Lorsque cette carte est ajoutée depuis le Deck à votre main, ou qu'un monstre que vous contrôlez est détruit au combat : vous pouvez révéler cette carte dans votre main ; Invoquez-la Spécialement. Si cette carte est Invoquée Spécialement depuis la main ou Deck : vous pouvez détruire tous les monstres contrôlés par votre adversaire, et aussi, vous ne pouvez attaquer directement qu'avec des monstres "Yeux Bleus" le reste de ce tour. Vous ne pouvez utiliser chacun des effets précédents de "Dragon Blanc aux Yeux Bleus, la Bête Fantôme Blanche" qu'une fois par tour. Lorsqu'une carte ou un effet qui cible cette carte sur le Terrain est activé (Effet Rapide) : vous pouvez défausser 1 carte ; annulez l'effet.
  it: |-
    Quando questa carta viene aggiunta dal Deck alla tua mano, o un mostro che controlli viene distrutto in battaglia: puoi rivelare questa carta nella tua mano; Evocala Specialmente. Se questa carta viene Evocata Specialmente dalla mano o Deck: puoi distruggere tutti i mostri controllati dal tuo avversario, inoltre puoi attaccare direttamente solo con mostri "Occhi Blu" per il resto di questo turno. Puoi utilizzare ognuno dei precedenti effetti di "Drago Bianco Occhi Blu, la Bestia Fantasma Bianca" una sola volta per turno. Quando viene attivata una carta o un effetto che sceglie come bersaglio questa carta sul Terreno (Effetto Rapido): puoi scartare 1 carta; annulla quell'effetto.
  pt: |-
    Quando este card for adicionado do Deck à sua mão, ou um monstro que você controla for destruído em batalha: você pode revelar este card na sua mão; Invoque-o por Invocação-Especial. Se este card for Invocado por Invocação-Especial da mão ou do Deck: você pode destruir todos os monstros que seu oponente controla e, além disso, você só pode atacar diretamente com monstros "Olhos Azuis" pelo resto deste turno. Você só pode usar cada um dos efeitos anteriores de "Dragão Branco de Olhos Azuis, a Besta Fantasma Branca" uma vez por turno. Quando um card ou efeito for ativado que escolha este card no campo como alvo (Efeito Rápido): você pode descartar 1 card; negue o efeito.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがデッキから手札に加わった時、または自分のモンスターが戦闘で破壊された時、手札のこのカードを相手に見せて発動できる。このカードを特殊召喚する。②：このカードが手札・デッキから特殊召喚した場合に発動できる。相手フィールドのモンスターを全て破壊する。このターン、自分は「ブルーアイズ」モンスターでしか直接攻撃できない。③：フィールドのこのカードを対象とする効果が発動した時、手札を１枚捨てて発動できる。その効果を無効にする。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드가 덱에서 패에 넣어졌을 때, 또는 자신 몬스터가 전투로 파괴되었을 때, 패의 이 카드를 상대에게 보여주고 발동할 수 있다. 이 카드를 특수 소환한다. ②: 이 카드를 패 / 덱에서 특수 소환했을 경우에 발동할 수 있다. 상대 필드의 몬스터를 전부 파괴한다. 이 턴에, 자신은 "푸른 눈" 몬스터로밖에 직접 공격할 수 없다. ③: 필드의 이 카드를 대상으로 하는 효과가 발동했을 때, 패를 1장 버리고 발동할 수 있다. 그 효과를 무효로 한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：此卡从牌组加入手牌时，或自己的怪兽因战斗被破坏时，向对手出示手牌的此卡可以发动。将此卡特殊召唤。②：此卡从手牌・牌组特殊召唤的情况下可以发动。将对手场上的怪兽全部破坏。此回合，自己仅可用“青眼”怪兽直接攻击。③：以场上的此卡为对象的效果发动时，舍弃1张手牌可以发动。将该效果无效。
