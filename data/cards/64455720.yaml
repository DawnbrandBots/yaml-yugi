name:
  en: Ashtra's Web
  de: Ashtras Netz
  es: Red de Ashtra
  fr: Toile d'Ashtra
  it: Ragnatela di Ashtra
  pt: Teia de Ashtra
  ja: <ruby>色鬼<rt>アシュトラ</rt></ruby>の<ruby>蟲<rt>こ</rt></ruby><ruby>毒<rt>どく</rt></ruby>
  ja_romaji: Ashutora no Kodoku
