  ko_rr:
  zh-TW:
  zh-CN: 色艮鬼之蛊毒
text:
  en: |-
    Activate 1 of these effects;
    ● Special Summon this card as a Normal Monster (Insect/Tuner/DARK/Level 1/ATK 0/DEF 0) (this card is NOT treated as a Trap), then immediately after this effect resolves, you can Synchro Summon 1 Synchro Monster.
    ● Target 1 "Ashtra" monster in your GY; Special Summon it.
    You can only activate 1 "Ashtra's Web" per turn.
  de: |-
    Aktiviere 1 dieser Effekte;
    ● Beschwöre diese Karte als Spezialbeschwörung als Normales Monster (Insekt/Empfänger/FINSTERNIS/Stufe 1/ATK 0/DEF 0) (diese Karte wird NICHT als Falle behandelt), dann, sofort nachdem dieser Effekt aufgelöst wurde, kannst du 1 Synchromonster als Synchrobeschwörung beschwören.
    ● Wähle 1 „Ashtra“-Monster in deinem Friedhof; beschwöre es als Spezialbeschwörung.
    Du kannst nur 1 „Ashtras Netz“ pro Spielzug aktivieren.
  es: |-
    Activa 1 de estos efectos;
    ● Invoca esta carta de Modo Especial como un Monstruo Normal (Insecto/Cantante/OSCURIDAD/Nivel 1/ATK 0/DEF 0) (esta carta NO se trata como una Trampa), e inmediatamente después de que se resuelva este efecto, puedes Invocar por Sincronía 1 Monstruo de Sincronía.
    ● Selecciona 1 monstruo "Ashtra" en tu Cementerio; Invócalo de Modo Especial.
    Sólo puedes activar 1 "Red de Ashtra" por turno.
  fr: |-
    Activez 1 de ces effets ;
    ● Invoquez Spécialement cette carte comme Monstre Normal (Insecte/Syntoniseur/TÉNÈBRES/Niveau 1/ATK 0/DEF 0) (cette carte N'EST PAS traitée comme Piège), puis immédiatement après la résolution de cet effet, vous pouvez Invoquer par Synchronisation 1 Monstre Synchro.
    ● Ciblez 1 monstre "Ashtra" dans votre Cimetière ; Invoquez-le Spécialement.
    Vous ne pouvez activer qu'1 "Toile d'Ashtra" par tour.
  it: |-
    Attiva 1 di questi effetti;
    ● Evoca Specialmente questa carta come Mostro Normale (Insetto/Tuner/OSCURITÀ/Livello 1/ATK 0/DEF 0) (questa carta NON viene considerata come una Trappola), poi immediatamente dopo che questo effetto si è risolto, puoi Synchro Evocare 1 Mostro Synchro.
    ● Scegli come bersaglio 1 mostro "Ashtra" nel tuo Cimitero; Evocalo Specialmente.
    Puoi attivare solo 1 "Ragnatela di Ashtra" per turno.
  pt: |-
    Ative 1 desses efeitos;
    ● Invoque este card por Invocação-Especial como um Monstro Normal (Inseto/Regulador/TREVAS/Nível 1/ATK 0/DEF 0) (este card NÃO é considerado como uma Armadilha) e, depois, imediatamente depois que este efeito resolver, você pode Invocar por Invocação-Sincro 1 Monstro Sincro.
    ● Escolha 1 monstro "Ashtra" no seu Cemitério; Invoque-o por Invocação-Especial.
    Você só pode ativar 1 "Teia de Ashtra" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：以下の効果から１つを選択して発動できる。
    ●このカードは通常モンスター（昆虫族・チューナー・闇・星１・攻／守０）となり、モンスターゾーンに特殊召喚する（罠カードとしては扱わない）。その後、Ｓモンスター１体のＳ召喚を行う事ができる。
    ●自分の墓地の「アシュトラ」モンスター１体を対象として発動できる。そのモンスターを特殊召喚する。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 이하의 효과에서 1개를 선택하고 발동할 수 있다.
    ●이 카드는 일반 몬스터(곤충족 / 튜너 / 어둠 / 레벨 1 / 공 0 / 수 0)가 되고, 몬스터 존에 특수 소환한다(함정 카드로는 취급하지 않는다). 그 후, 싱크로 몬스터 1장의 싱크로 소환을 실행할 수 있다.
    ●자신 묘지의 "아슈트라" 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 특수 소환한다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：可从以下效果中选择1个发动。
    ●此卡变为通常怪兽（昆虫族・协调・暗・星1・攻/守0），特殊召唤至怪兽区域（不视为陷阱卡）。然后，可进行1只同步怪兽的同步召唤。
    ●以自己墓地的1只“艮鬼”怪兽为对象可以发动。将该怪兽特殊召唤。
