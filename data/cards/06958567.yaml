  zh-TW:
  zh-CN: 魔女工艺・庆典
text:
  en: |-
    Activate 1 of these effects;
    ● Destroy 1 "Witchcrafter" monster you control and 1 card your opponent controls.
    ● Fusion Summon 1 "Witchcrafter" Fusion Monster from your Extra Deck, by shuffling Spellcaster monsters from your GY and/or banishment into the Deck.
    During your End Phase, if you control a "Witchcrafter" monster, while this card is in your GY: You can add this card to your hand. You can only use 1 "Witchcrafter Celebration" effect per turn, and only once that turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。①：以下の効果から１つを選択して発動できる。●自分フィールドの「ウィッチクラフト」モンスター１体と相手フィールドのカード１枚を破壊する。●自分の墓地・除外状態の魔法使い族モンスターを融合素材としてデッキに戻し、「ウィッチクラフト」融合モンスター１体を融合召喚する。②：自分エンドフェイズに、このカードが墓地に存在し、自分フィールドに「ウィッチクラフト」モンスターが存在する場合に発動できる。このカードを手札に加える。
  ko: |-
    이 카드명의 ①②의 효과는 1턴에 1번, 어느 쪽이든 1개밖에 사용할 수 없다. ①: 이하의 효과에서 1개를 선택하고 발동할 수 있다. ●자신 필드의 "위치크래프트" 몬스터 1장과 상대 필드의 카드 1장을 파괴한다. ●자신의 묘지 / 제외 상태인 마법사족 몬스터를 융합 소재로 하여 덱으로 되돌리고, "위치크래프트" 융합 몬스터 1장을 융합 소환한다. ②: 자신 엔드 페이즈에, 이 카드가 묘지에 존재하고, 자신 필드에 "위치크래프트" 몬스터가 존재할 경우에 발동할 수 있다. 이 카드를 패에 넣는다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合1次，仅可使用其中1个。①：可从以下效果中选择1个发动。
    ●将自己场上的1只“魔女工艺”怪兽和对手场上的1张卡破坏。
    ●将自己墓地・除外状态的魔法师族怪兽作为融合素材放回牌组，将1只“魔女工艺”融合怪兽融合召唤。
    ②：在自己的结束阶段，此卡存在于墓地，且自己场上存在“魔女工艺”怪兽的情况下可以发动。将此卡加入手牌。
