name:
  en: Graverobber
  de: Grabräuber
  es: Ladrón de Tumbas
  fr: Profanateur de Tombes
  it: Predatore delle Tombe
  pt: Ladrão de Túmulos
  ja: <ruby>墓<rt>はか</rt></ruby><ruby>荒<rt>あ</rt></ruby>らし
  ja_romaji: Hakaarashi
  ko: 도굴꾼
  ko_rr:
  zh-TW: 盜墓
  zh-CN: 盗墓者
text:
  en: |-
    Target 1 Spell in your opponent's GY; add it to your hand. If you activate that Spell Card, immediately after it resolves, take 2000 damage. If you do not activate it, send it from your hand or field to the GY during the End Phase.
  de: |-
    Wähle 1 Zauber im Friedhof deines Gegners; füge ihn deiner Hand hinzu. Falls du jene Zauberkarte aktivierst, erhältst du 2000 Schaden, sofort nachdem sie aufgelöst wurde. Falls du sie nicht aktivierst, lege sie während der End Phase von deiner Hand oder Spielfeldseite auf den Friedhof.
  es: |-
    Selecciona 1 Mágica en el Cementerio de tu adversario; añádela a tu mano. Si activas esa Carta Mágica, inmediatamente después de que se resuelva, tú recibes 2000 puntos de daño. Si no la activas, mándala de tu mano o Campo al Cementerio durante la End Phase.
  fr: |-
    Ciblez 1 Magie dans le Cimetière de votre adversaire ; ajoutez-la à votre main. Si vous activez la Carte Magie, immédiatement après sa résolution, recevez 2000 points de dommages. Si vous ne l'activez pas, envoyez-la depuis votre main ou Terrain au Cimetière durant la End Phase.
  it: |-
    Scegli come bersaglio 1 Magia nel Cimitero del tuo avversario; aggiungila alla tua mano. Se attivi quella Carta Magia, immediatamente dopo che si è risolta, subisci 2000 danni. Se non la attivi, mandala dalla tua mano o Terreno al Cimitero durante la End Phase.
  pt: |-
    Escolha 1 Magia no Cemitério do seu oponente; adicione-a à sua mão. Se você ativar esse Card de Magia, imediatamente depois que ele resolver, sofra 2000 de dano. Se você não o ativar, envie-o da sua mão ou do campo para o Cemitério durante a Fase Final.
  ja: |-
    相手の墓地にある魔法カード１枚を選択し、ターン終了時まで自分の手札として使用する事ができる。その魔法カードを使用した場合、２０００ポイントのダメージを受ける。
  ko: |-
    상대의 묘지에 있는 마법 카드 1장을 선택하여, 턴 종료시까지 자신의 패로서 사용할 수 있다. 그 마법 카드를 사용했을 경우, 2000 포인트의 데미지를 받는다.
  zh-TW:
  zh-CN: |-
    ①：以对手墓地的1张魔法卡为对象可以发动。将该魔法卡加入自己手牌。发动该魔法卡的情况下，自己将受到2000伤害。除此以外的情况下，在结束阶段该魔法卡将从手牌・场上被送至墓地。
