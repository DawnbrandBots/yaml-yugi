name:
  en: Gatling Ogre
  de: Gatling-Oger
  es: Ogro Gatling
  fr: Ogre Gatling
  it: Orco Gatling
  pt: Ogro Metralhadora
  ja: ガトリング・オーガ
  ja_romaji: Gatoringu Ōga
  ko: 개틀링 오우거
  ko_rr:
  zh-TW:
  zh-CN: 加特林食人魔
text:
  en: |-
    You can send any number of face-down cards from your Spell & Trap Zone to the GY; inflict 800 damage to your opponent for each card sent to the GY, also your opponent takes no effect damage from non-Fiend monsters' effects for the rest of this turn. You can only use this effect of "Gatling Ogre" thrice per turn. Once per turn, when this card is targeted for an attack: You can inflict 500 damage to your opponent for each Attack Position monster they control, then end the Battle Phase.
  de: |-
    Du kannst eine beliebige Anzahl verdeckter Karten von deiner Zauber- & Fallenzone auf den Friedhof legen; füge deinem Gegner für jede auf den Friedhof gelegte Karte 800 Schaden zu, zusätzlich erhält dein Gegner für den Rest dieses Spielzugs keinen Effektschaden von Effekten von Nichtunterweltler-Monstern. Du kannst diesen Effekt von „Gatling-Oger“ nur dreimal pro Spielzug verwenden. Einmal pro Spielzug, wenn diese Karte als Ziel für einen Angriff gewählt wird: Du kannst deinem Gegner für jedes Monster in Angriffsposition, das er kontrolliert, 500 Schaden zufügen, dann beende die Battle Phase.
  es: |-
    Puedes mandar al Cementerio cualquier número de cartas boca abajo en tu Zona de Magia y Trampas; inflige 800 puntos de daño a tu adversario por cada carta mandada al Cementerio, y además tu adversario no recibe daño de efecto de efectos de monstruos que no sean Demonio por el resto de este turno. Sólo puedes usar este efecto de "Ogro Gatling" tres veces por turno. Una vez por turno, cuando esta carta es seleccionada para un ataque: puedes infligir 500 puntos de daño a tu adversario por cada monstruo en Posición de Ataque que controle, y después termina la Battle Phase.
  fr: |-
    Vous pouvez envoyer un nombre de votre choix de cartes face verso depuis votre Zone Magie & Piège au Cimetière ; infligez 800 points de dommages à votre adversaire pour chaque carte envoyée au Cimetière, et aussi, votre adversaire ne reçoit aucun dommage d'effet des effets de monstres non-Démon le reste de ce tour. Vous ne pouvez utiliser cet effet de "Ogre Gatling" que trois fois par tour. Une fois par tour, lorsque cette carte est ciblée par une attaque : vous pouvez infliger 500 points de dommages à votre adversaire pour chaque monstre en Position d'Attaque qu'il contrôle, puis terminez la Battle Phase.
  it: |-
    Puoi mandare un qualsiasi numero di carte coperte dalla tua Zona Magie & Trappole al Cimitero; infliggi 800 danni al tuo avversario per ogni carta mandata al Cimitero, inoltre il tuo avversario non subisce danno da effetto dagli effetti dei mostri non-Demone per il resto di questo turno. Puoi utilizzare questo effetto di "Orco Gatling" solo tre volte per turno. Una volta per turno, quando questa carta viene scelta come bersaglio per un attacco: puoi infliggere 500 danni al tuo avversario per ogni mostro in Posizione di Attacco che controlla, poi termina la Battle Phase.
  pt: |-
    Você pode enviar qualquer número de cards com a face para baixo da sua Zona de Magias & Armadilhas para o Cemitério; cause 800 de dano ao seu oponente para cada card enviado para o Cemitério e, além disso, seu oponente não sofre dano de efeito dos efeitos de monstros não-Demônio pelo resto deste turno. Você só pode usar este efeito de "Ogro Metralhadora" três vezes por turno. Uma vez por turno, quando este card for escolhido como alvo de um ataque: você pode causar 500 de dano ao seu oponente para cada monstro em Posição de Ataque que ele controla e, depois, encerre a Fase de Batalha.
  ja: |-
    このカード名の①の効果は１ターンに３度まで使用できる。①：自分の魔法＆罠ゾーンの裏側表示カードを任意の数だけ墓地へ送って発動できる。墓地へ送った数×８００ダメージを相手に与える。この効果の発動後、ターン終了時まで悪魔族以外のモンスターの効果で相手が受ける全ての効果ダメージは０になる。②：１ターンに１度、このカードが攻撃対象に選択された時に発動できる。相手フィールドの攻撃表示モンスターの数×５００ダメージを相手に与える。その後、バトルフェイズを終了する。
  ko: |-
    이 카드명의 ①의 효과는 1턴에 3번까지 사용할 수 있다. ①: 자신의 마법 & 함정 존의 뒷면 표시 카드를 임의의 수만큼 묘지로 보내고 발동할 수 있다. 묘지로 보낸 수 × 800 데미지를 상대에게 준다. 이 효과의 발동 후, 턴 종료시까지 악마족 이외의 몬스터의 효과로 상대가 받는 모든 효과 데미지는 0 이 된다. ②: 1턴에 1번, 이 카드가 공격 대상으로 선택되었을 때에 발동할 수 있다. 상대 필드의 공격 표시 몬스터의 수 × 500 데미지를 상대에게 준다. 그 후, 배틀 페이즈를 종료한다.
  zh-TW:
  zh-CN: |-
    此卡名的①效果1回合最多可使用3次。①：将自己魔法与陷阱区域任意数量的里侧表示卡送至墓地可以发动。给予对手送至了墓地的数量×800的伤害。此效果发动后，直至回合结束时为止，对手因恶魔族以外的怪兽的效果受到的所有效果伤害变为0。②：1回合1次，此卡被选择为攻击对象时可以发动。给予对手相当于对手场上的攻击表示怪兽数量×500的伤害。然后，结束战斗阶段。
