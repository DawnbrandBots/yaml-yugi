name:
  en: Rokket Barrage
  de: Rakketenhagel
  es: Descarga Cohette
  fr: Barrage Rokkette
  it: Raffica Mizzile
  pt: Barragem Foguette
  ja: ヴァレット・バラージュ
  ja_romaji: Varetto Barāju
  ko: 바렛 버라지
  ko_rr:
  zh-TW:
  zh-CN: 枪弹网幕
text:
  en: |-
    If this card is in your hand: You can send 1 DARK Dragon monster from your Deck to the GY, except a Level 5 monster; Special Summon this card, also you cannot Special Summon from the Extra Deck for the rest of this turn, except DARK monsters. When a Link Monster's effect is activated that targets this card on the field (Quick Effect): You can destroy this card, then Special Summon up to 1 "Rokket" monster each from your hand, Deck, GY, and banishment, except "Rokket Barrage". You can only use each effect of "Rokket Barrage" once per turn.
  de: |-
    Falls sich diese Karte in deiner Hand befindet: Du kannst 1 FINSTERNIS Drache-Monster von deinem Deck auf den Friedhof legen, außer einem Monster der Stufe 5; beschwöre diese Karte als Spezialbeschwörung, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von FINSTERNIS Monstern. Wenn der Effekt eines Linkmonsters aktiviert wird, der diese Karte auf dem Spielfeld als Ziel wählt (Schnelleffekt): Du kannst diese Karte zerstören, dann beschwöre bis zu je 1 „Rakkete“-Monster als Spezialbeschwörung von deiner Hand, deinem Deck, deinem Friedhof und deinen verbannten Karten, außer „Rakketenhagel“. Du kannst jeden Effekt von „Rakketenhagel“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta está en tu mano: puedes mandar al Cementerio 1 monstruo Dragón de OSCURIDAD en tu Deck, excepto un monstruo de Nivel 5; Invoca esta carta de Modo Especial, y además no puedes Invocar de Modo Especial desde el Deck Extra por el resto de este turno, excepto monstruos de OSCURIDAD. Cuando es activado el efecto de un Monstruo de Enlace que selecciona esta carta en el Campo (Efecto Rápido): puedes destruir esta carta, y después Invoca de Modo Especial hasta 1 monstruo "Cohette" cada uno desde tu mano, Deck, Cementerio y destierro, excepto "Descarga Cohette". Sólo puedes usar cada efecto de "Descarga Cohette" una vez por turno.
  fr: |-
    Si cette carte est dans votre main : vous pouvez envoyer 1 monstre TÉNÈBRES Dragon (monstres de Niveau 5 exclus) depuis votre Deck au Cimetière ; Invoquez Spécialement cette carte, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres TÉNÈBRES exclus) depuis l'Extra Deck le reste de ce tour. Lorsqu'un effet de Monstre Lien qui cible cette carte sur le Terrain est activé (Effet Rapide) : vous pouvez détruire cette carte, puis Invoquez Spécialement max. 1 monstre "Rokkette" chacun ("Barrage Rokkette" exclu) depuis votre main, Deck, Cimetière et bannissement. Vous ne pouvez utiliser chaque effet de "Barrage Rokkette" qu'une fois par tour.
  it: |-
    Se questa carta è nella tua mano: puoi mandare 1 mostro OSCURITÀ Drago dal tuo Deck al Cimitero, eccetto un mostro di Livello 5; Evoca Specialmente questa carta, inoltre non puoi Evocare Specialmente dall'Extra Deck per il resto di questo turno, eccetto mostri OSCURITÀ. Quando viene attivato l'effetto di un Mostro Link che sceglie come bersaglio questa carta sul Terreno (Effetto Rapido): puoi distruggere questa carta, poi Evocare Specialmente fino a 1 mostro "Mizzile" ciascuno dalla tua mano, Deck, Cimitero e carte bandite, eccetto "Raffica Mizzile". Puoi utilizzare ogni effetto di "Raffica Mizzile" una sola volta per turno.
  pt: |-
    Se este card estiver na sua mão: você pode enviar 1 monstro Dragão de TREVAS do seu Deck para o Cemitério, exceto um monstro de Nível 5; Invoque este card por Invocação-Especial e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional pelo resto deste turno, exceto monstros de TREVAS. Quando o efeito de um Monstro Link for ativado que escolha este card no campo como alvo (Efeito Rápido): você pode destruir este card e, depois, Invoque por Invocação-Especial até 1 monstro "Foguette" cada da sua mão, do Deck, do Cemitério e do banimento, exceto "Barragem Foguette". Você só pode usar cada efeito de "Barragem Foguette" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：デッキからレベル５以外のドラゴン族・闇属性モンスター１体を墓地へ送って発動できる。このカードを手札から特殊召喚する。このターン、自分は闇属性モンスターしかＥＸデッキから特殊召喚できない。②：フィールドのこのカードを対象とするＬモンスターの効果が発動した時に発動できる。このカードを破壊する。その後、自分の手札・デッキ・墓地・除外状態からそれぞれ１体まで、「ヴァレット・バラージュ」以外の「ヴァレット」モンスターを特殊召喚する。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 덱에서 레벨 5 이외의 드래곤족 / 어둠 속성 몬스터 1장을 묘지로 보내고 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 이 턴에, 자신은 어둠 속성 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. ②: 필드의 이 카드를 대상으로 하는 링크 몬스터의 효과가 발동했을 때에 발동할 수 있다. 이 카드를 파괴한다. 그 후, 자신의 패 / 덱 / 묘지 / 제외 상태에서 각각 1장까지, "바렛 버라지" 이외의 "바렛" 몬스터를 특수 소환한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将1只等级5以外的龙族・暗属性怪兽送至墓地可以发动。从手牌将此卡特殊召唤。此回合，自己从额外牌组仅可特殊召唤暗属性怪兽。②：以场上的此卡为对象的、连接怪兽的效果发动时可以发动。将此卡破坏。然后，从自己手牌・牌组・墓地・除外状态各将最多1只、“枪弹网幕”以外的“枪弹”怪兽特殊召唤。
