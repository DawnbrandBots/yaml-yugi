text:
  en: |-
    When your opponent activates a Spell/Trap Card while you control a Normal Monster or "Zenet" Ritual Monster: Negate the activation, and if you do, destroy that card. If the total ATK of all Normal Monster Cards you control is more than 3000: You can banish this card from your GY; Set 1 "Zenet" Spell/Trap from your Deck or GY, except "Zenet Thunderfall". You can only use each effect of "Zenet Thunderfall" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドに通常モンスターか「セネト」儀式モンスターが存在し、相手が魔法・罠カードを発動した時に発動できる。その発動を無効にし破壊する。②：自分フィールドの通常モンスターカードの攻撃力の合計が３０００より高い場合、墓地のこのカードを除外して発動できる。自分のデッキ・墓地から「光器の降雷」以外の「セネト」魔法・罠カード１枚を自分フィールドにセットする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：自己场上存在通常怪兽或“塞尼特”仪式怪兽，且对手发动魔法・陷阱卡时可以发动。将该发动无效并破坏。②：自己场上的通常怪兽卡的攻击力合计高于3000的情况下，将墓地的此卡除外可以发动。从自己牌组・墓地将“塞尼特・光器之降雷”以外的1张“塞尼特”魔法・陷阱卡放置在自己场上。
