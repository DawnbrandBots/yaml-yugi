name:
  en: Witchcrafter Distortion
  de: Hexwerker-Verzerrung
  es: Distorsión Artibruja
  fr: Distorsion Artisanesorcière
  it: Distorsione Stregartigiana
  pt: Distorção Fazticeira
  ja: ウィッチクラフト・ディストーション
  ja_romaji: Wicchikurafuto Disutōshon
  ko: 위치크래프트 디스토션
  ko_rr:
  zh-TW: 魔女工藝・消散
  zh-CN: 魔女工艺・消散
text:
  en: |-
    When a Spell/Trap Card, or monster effect, is activated while you control a Level 5 or higher "Witchcrafter" monster: Negate the activation, and if you do, destroy that card. If this card is in your GY, except the turn it was sent there: You can banish it; add 1 Level 5 or higher Spellcaster monster from your Deck to your hand, then discard 1 card. You can only use each effect of "Witchcrafter Distortion" once per turn.
  de: |-
    Wenn eine Zauber-/Fallenkarte oder ein Monstereffekt aktiviert wird, solange du ein „Hexwerker“-Monster der Stufe 5 oder höher kontrollierst: Annulliere die Aktivierung und falls du dies tust, zerstöre jene Karte. Falls sich diese Karte in deinem Friedhof befindet, außer in dem Spielzug, in dem sie dorthin gelegt wurde: Du kannst sie verbannen; füge deiner Hand 1 Hexer-Monster der Stufe 5 oder höher von deinem Deck hinzu, dann wirf 1 Karte ab. Du kannst jeden Effekt von „Hexwerker-Verzerrung“ nur einmal pro Spielzug verwenden.
  es: |-
    Cuando es activada una Carta Mágica/de Trampa, o efecto de monstruo, mientras controlas un monstruo "Artibruja" de Nivel 5 o mayor: niega la activación y, si lo haces, destruye esa carta. Si esta carta está en tu Cementerio, excepto en el turno en el que ésta fue mandada allí: puedes desterrarla; añade a tu mano 1 monstruo Lanzador de Conjuros de Nivel 5 o mayor en tu Deck, y después descarta 1 carta. Sólo puedes usar cada efecto de "Distorsión Artibruja" una vez por turno.
  fr: |-
    Lorsqu'une Carte Magie/Piège ou un effet de monstre est activé tant que vous contrôlez un monstre "Artisanesorcière" de min. Niveau 5 : annulez l'activation, et si vous le faites, détruisez la carte. Si cette carte est dans votre Cimetière, sauf le tour où elle y a été envoyée : vous pouvez la bannir ; ajoutez 1 monstre Magicien de min. Niveau 5 depuis votre Deck à votre main, puis défaussez 1 carte. Vous ne pouvez utiliser chaque effet de "Distorsion Artisanesorcière" qu'une fois par tour.
  it: |-
    Quando viene attivata una Carta Magia/Trappola o l'effetto di un mostro mentre controlli un mostro "Stregartigiana" di Livello 5 o superiore: annulla l'attivazione e, se lo fai, distruggi quella carta. Se questa carta è nel tuo Cimitero, eccetto nel turno in cui è stata mandata lì: puoi bandirla; aggiungi 1 mostro Incantatore di Livello 5 o superiore dal tuo Deck alla tua mano, poi scarta 1 carta. Puoi utilizzare ogni effetto di "Distorsione Stregartigiana" una sola volta per turno.
  pt: |-
    Quando um Card de Magia/Armadilha, ou efeito de monstro, for ativado enquanto você controlar um monstro "Fazticeira" de Nível 5 ou mais: negue a ativação e, se isso acontecer, destrua esse card. Se este card estiver no seu Cemitério, exceto no turno em que foi enviado para lá: você pode bani-lo; adicione 1 monstro Mago de Nível 5 ou mais do seu Deck à sua mão e, depois, descarte 1 card. Você só pode usar cada efeito de "Distorção Fazticeira" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドにレベル５以上の「ウィッチクラフト」モンスターが存在し、モンスターの効果・魔法・罠カードが発動した時に発動できる。その発動を無効にし破壊する。②：このターンに墓地へ送られていないこのカードを墓地から除外して発動できる。デッキからレベル５以上の魔法使い族モンスター１体を手札に加える。その後、自分の手札を１枚選んで捨てる。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드에 레벨 5 이상의 "위치크래프트" 몬스터가 존재하고, 몬스터의 효과 / 마법 / 함정 카드가 발동했을 때에 발동할 수 있다. 그 발동을 무효로 하고 파괴한다. ②: 이 턴에 묘지로 보내져 있지 않은 이 카드를 묘지에서 제외하고 발동할 수 있다. 덱에서 레벨 5 이상의 마법사족 몬스터 1장을 패에 넣는다. 그 후, 자신의 패를 1장 고르고 버린다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：自己场上存在等级5以上的“魔女工艺”怪兽，且怪兽的效果・魔法・陷阱卡发动时可以发动。将该发动无效并破坏。②：从墓地将不是在此回合被送至墓地的此卡除外可以发动。从牌组将1只等级5以上的魔法师族怪兽加入手牌。然后，挑选自己的1张手牌舍弃。
