text:
  en: |-
    Target up to 2 Spells/Traps on the field, including a card you control; destroy them, then if you destroyed a face-down card, you can send 1 "Unchained" monster from your Deck to the GY. If this card on the field is destroyed by an "Unchained" card's effect: You can Special Summon 1 Level 8 "Unchained" monster from your Deck, then you can shuffle 1 card each from both your hand and your opponent's GY into the Deck. You can only use each effect of "Conviction of the Unchained" once per turn.
