text:
  en: |-
    Add 1 "Adamancipator" monster from your Deck to your hand. If this card is in your GY: You can place 1 card from your hand on top of the Deck; add this card to your hand. You can only use each effect of "Adamancipator Mates" once per turn.
  de: |-
    Füge deiner Hand 1 „Steinbefreier“-Monster von deinem Deck hinzu. Falls sich diese Karte in deinem Friedhof befindet: Du kannst 1 Karte von deiner Hand aufs Deck legen; füge diese Karte deiner Hand hinzu. Du kannst jeden Effekt von „Steinbefreier-Kumpel“ nur einmal pro Spielzug verwenden.
  es: |-
    Añade a tu mano 1 monstruo "Adamancipador" en tu Deck. Si esta carta está en tu Cementerio: puedes poner en la parte superior del Deck 1 carta en tu mano; añade esta carta a tu mano. Sólo puedes usar cada efecto de "Compañeros Adamancipador" una vez por turno.
  fr: |-
    Ajoutez 1 monstre "Inflexcipateur" depuis votre Deck à votre main. Si cette carte est dans votre Cimetière : vous pouvez placer 1 carte depuis votre main au-dessus du Deck ; ajoutez cette carte à votre main. Vous ne pouvez utiliser chaque effet de "Partenaires Inflexcipateur" qu'une fois par tour.
  it: |-
    Aggiungi 1 mostro "Irremovibilatore" dal tuo Deck alla tua mano. Se questa carta è nel tuo Cimitero: puoi mettere 1 carta dalla tua mano in cima al Deck; aggiungi questa carta alla tua mano. Puoi utilizzare ogni effetto di "Compagni Irremovibilatore" una sola volta per turno.
  pt: |-
    Adicione 1 monstro "Adamancipador" do seu Deck à sua mão. Se este card estiver no seu Cemitério: você pode colocar 1 card da sua mão no topo do Deck; adicione este card à sua mão. Você só pode usar cada efeito de "Companheiros Adamancipadores" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：デッキから「アダマシア」モンスター１体を手札に加える。②：このカードが墓地に存在する場合、手札を１枚デッキの一番上に戻して発動できる。このカードを手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将1只“魔救”怪兽加入手牌。②：此卡存在于墓地的情况下，将1张手牌放回牌组最上面可以发动。将此卡加入手牌。
