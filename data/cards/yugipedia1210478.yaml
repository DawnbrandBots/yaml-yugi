  en: |-
    (Quick Effect): You can reveal this card and 1 other "Xenovader△" card in your hand; banish both (face-down), and if you do, draw 2 cards. You can only use this effect of "Mad Tempest Xenovader△ Ploutonion" once per turn. If this card is Normal or Special Summoned: Banish (face-down) the top 7 cards of your Deck. Once per turn (Quick Effect): You can shuffle 1 of your face-down banished "Xenovader△" monsters into the Deck, then you can shuffle 1 monster your opponent controls with the same Attribute into the Deck.
