name:
  en: Infernity Necromancer
  de: Ewig infernaler Totenbeschwörer
  es: Nigromante Inférnico
  fr: Nécromancien Enfernité
  it: Necromante Demoneterno
  pt: Necromante Inférnico
  ja: インフェルニティ・ネクロマンサー
  ja_romaji: Inferuniti Nekuromansā
  ko: 인페르니티 네크로맨서
  ko_rr:
  zh-TW: 無限獄死靈師
  zh-CN: 无限狱死灵师
text:
  en: |-
    If this card is Normal Summoned: Change this card to Defense Position. Once per turn, if you have no cards in your hand: You can target 1 "Infernity" monster in your GY, except "Infernity Necromancer"; Special Summon it.
  de: |-
    Falls diese Karte als Normalbeschwörung beschworen wird: Ändere diese Karte in die Verteidigungsposition. Einmal pro Spielzug, falls du keine Karten in deiner Hand hast: Du kannst 1 „Ewig infernal“-Monster in deinem Friedhof wählen, außer „Ewig infernaler Totenbeschwörer“; beschwöre es als Spezialbeschwörung.
  es: |-
    Si esta carta es Invocada de Modo Normal: cambia esta carta a Posición de Defensa. Una vez por turno, si no tienes cartas en tu mano: puedes seleccionar 1 monstruo "Inférnico/a" en tu Cementerio, excepto "Nigromante Inférnico"; Invócalo de Modo Especial.
  fr: |-
    Si cette carte est Invoquée Normalement : changez cette carte en Position de Défense. Une fois par tour, si vous n'avez aucune carte dans votre main : vous pouvez cibler 1 monstre "Enfernité" ("Nécromancien Enfernité" exclu) dans votre Cimetière ; Invoquez-le Spécialement.
  it: |-
    Se questa carta viene Evocata Normalmente: metti questa carta in Posizione di Difesa. Una volta per turno, se non hai nessuna carta nella tua mano: puoi scegliere come bersaglio 1 mostro "Demoneterno" nel tuo Cimitero, eccetto "Necromante Demoneterno"; Evocalo Specialmente.
  pt: |-
    Se este card for Invocado por Invocação-Normal: coloque este card em Posição de Defesa. Uma vez por turno, se você não tiver cards na sua mão: você pode escolher 1 monstro "Inférnico(a)" no seu Cemitério, exceto "Necromante Inférnico"; Invoque-o por Invocação-Especial.
  ja: |-
    ①：このカードが召喚した場合に発動する。このカードを守備表示にする。②：１ターンに１度、自分の手札が０枚の場合、「インフェルニティ・ネクロマンサー」以外の自分の墓地の「インフェルニティ」モンスター１体を対象として発動できる。そのモンスターを特殊召喚する。
  ko: |-
    이 카드는 일반 소환에 성공했을 때, 수비 표시가 된다. 자신의 패가 0장일 경우, 이하의 효과를 얻는다. 1턴에 1번, 자신의 묘지에 존재하는 "인페르니티 네크로맨서" 이외의 "인페르니티"라는 이름이 붙은 몬스터 1장을 특수 소환할 수 있다.
  zh-TW:
  zh-CN: |-
    这张卡召唤成功时，变成守备表示。此外，自己手卡是0张的场合，这张卡得到以下效果。1回合1次，可以从自己墓地选择「永火死灵师」以外的1只名字带有「永火」的怪兽特殊召唤。
