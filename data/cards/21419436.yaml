text:
  en: |-
    2+ monsters, including a Fiend monster
    If your opponent Special Summons a monster(s) face-up (except during the Damage Step): You can target 1 of them; destroy 1 Fiend monster you control, and if you do, negate the targeted monster's effects until the end of this turn. When a monster effect is activated on the field and you control a Link-4 or higher "Unchained" Link Monster (Quick Effect): You can banish this card from your GY; destroy the monster that activated that effect. You can only use each effect of "Unchained Soul Rage Abominator" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    悪魔族モンスターを含むモンスター２体以上
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：相手がモンスターを表側表示で特殊召喚した場合、その内の１体を対象として発動できる。自分フィールドの悪魔族モンスター１体を破壊し、対象のモンスターの効果をターン終了時まで無効にする。②：自分フィールドにリンク４以上の「破械」Ｌモンスターが存在し、フィールドのモンスターの効果が発動した時、墓地のこのカードを除外して発動できる。その効果を発動したモンスターを破壊する。
  ko: |-
    악마족 몬스터를 포함하는 몬스터 2장 이상
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 상대가 몬스터를 앞면 표시로 특수 소환했을 경우, 그 중의 1장을 대상으로 하고 발동할 수 있다. 자신 필드의 악마족 몬스터 1장을 파괴하고, 대상 몬스터의 효과를 턴 종료시까지 무효로 한다. ②: 자신 필드에 링크 4 이상의 "언체인드" 링크 몬스터가 존재하고, 필드의 몬스터의 효과가 발동했을 때, 묘지의 이 카드를 제외하여 발동할 수 있다. 그 효과를 발동한 몬스터를 파괴한다.
  zh-TW:
  zh-CN: |-
    包含恶魔族怪兽在内的怪兽2只以上
    此卡名的①②效果1回合仅可各使用1次。①：对手将怪兽以表侧表示特殊召唤的情况下，以其中1只为对象可以发动。将自己场上的1只恶魔族怪兽破坏，将对象怪兽的效果直至回合结束时为止无效。②：自己场上存在连接4以上的“破械”连接怪兽，且场上怪兽的效果发动时，将墓地的此卡除外可以发动。将发动该效果的怪兽破坏。
