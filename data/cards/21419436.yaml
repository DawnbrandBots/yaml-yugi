name:
  en: Unchained Soul of Abominable Rage
  de: Losgekettete Seele der schrecklichen Raserei
  es: Alma Desencadenada de Rabia Abominable
  fr: Âme Désenchaînée de la Rage Abominable
  it: Anima Svincolata dell'Abominevole Rabbia
  pt: Alma Desacorrentada da Raiva Abominável
  ja: <ruby>破<rt>は</rt></ruby><ruby>械<rt>かい</rt></ruby><ruby>神<rt>しん</rt></ruby><ruby>雙<rt>そう</rt></ruby>ラギア
  ja_romaji: Hakaishinsō Ragia
  ko: 언체인드소울쌍 라기아
  ko_rr:
  zh-TW:
  zh-CN: 破械神双 拉基安
text:
  en: |-
    2+ monsters, including a Fiend monster
    If your opponent Special Summons a monster(s) face-up (except during the Damage Step): You can target 1 of them; destroy 1 Fiend monster you control, and if you do, negate the targeted monster's effects until the end of this turn. When a monster effect is activated on the field and you control a Link-4 or higher "Unchained" Link Monster (Quick Effect): You can banish this card from your GY; destroy the monster that activated its effect. You can only use each effect of "Unchained Soul of Abominable Rage" once per turn.
  de: |-
    2+ Monster, darunter ein Unterweltler-Monster
    Falls dein Gegner ein oder mehr Monster offen als Spezialbeschwörung beschwört (außer während des Damage Steps): Du kannst 1 von ihnen wählen; zerstöre 1 Unterweltler-Monster, das du kontrollierst, und falls du dies tust, annulliere bis zum Ende dieses Spielzugs die Effekte des als Ziel gewählten Monsters. Wenn ein Monstereffekt auf dem Spielfeld aktiviert wird und du ein „Losgekettet“-Linkmonster mit Link-4 oder höher kontrollierst (Schnelleffekt): Du kannst diese Karte von deinem Friedhof verbannen; zerstöre das Monster, dessen Effekt aktiviert wurde. Du kannst jeden Effekt von „Losgekettete Seele der schrecklichen Raserei“ nur einmal pro Spielzug verwenden.
  es: |-
    2+ monstruos, incluyendo un monstruo Demonio
    Si tu adversario Invoca de Modo Especial uno o más monstruos boca arriba (excepto durante el Damage Step): puedes seleccionar 1 de ellos; destruye 1 monstruo Demonio que controles y, si lo haces, niega los efectos del monstruo seleccionado hasta el final de este turno. Cuando es activado un efecto de monstruo en el Campo y controlas un Monstruo de Enlace "Desencadenado/a" de Link-4 o mayor (Efecto Rápido): puedes desterrar esta carta en tu Cementerio; destruye el monstruo que activó su efecto. Sólo puedes usar cada efecto de "Alma Desencadenada de Rabia Abominable" una vez por turno.
  fr: |-
    2+ monstres (un monstre Démon inclus)
    Si votre adversaire Invoque Spécialement face recto un ou plusieurs monstres (sauf durant la Damage Step) : vous pouvez en cibler 1 ; détruisez 1 monstre Démon que vous contrôlez, et si vous le faites, annulez les effets du monstre ciblé jusqu'à la fin de ce tour. Lorsqu'un effet de monstre est activé sur le Terrain et que vous contrôlez un Monstre Lien "Désenchaîné" de min. Link-4 (Effet Rapide) : vous pouvez bannir cette carte depuis votre Cimetière ; détruisez le monstre qui a activé son effet. Vous ne pouvez utiliser chaque effet de "Âme Désenchaînée de la Rage Abominable" qu'une fois par tour.
  it: |-
    2+ mostri, compreso un mostro Demone
    Se il tuo avversario Evoca Specialmente uno o più mostri scoperti (eccetto durante il Damage Step): puoi scegliere 1 di essi come bersaglio; distruggi 1 mostro Demone che controlli e, se lo fai, annulla gli effetti del mostro scelto come bersaglio fino alla fine di questo turno. Quando viene attivato l'effetto di un mostro sul Terreno e tu controlli un Mostro Link "Svincolato" Link-4 o superiore (Effetto Rapido): puoi bandire questa carta dal tuo Cimitero; distruggi il mostro che ha attivato il suo effetto. Puoi utilizzare ogni effetto di "Anima Svincolata dell'Abominevole Rabbia" una sola volta per turno.
  pt: |-
    2+ monstros, incluindo um monstro Demônio
    Se seu oponente Invocar um ou mais monstros por Invocação-Especial com a face para cima (exceto durante a Etapa de Dano): você pode escolher 1 deles; destrua 1 monstro Demônio que você controla e, se isso acontecer, negue os efeitos do monstro alvo até o final deste turno. Quando um efeito de monstro for ativado no campo e você controlar um Monstro Link "Desacorrentado(a)" de Link-4 ou mais (Efeito Rápido): você pode banir este card do seu Cemitério; destrua o monstro que ativou seu efeito. Você só pode usar cada efeito de "Alma Desacorrentada da Raiva Abominável" uma vez por turno.
  ja: |-
    悪魔族モンスターを含むモンスター２体以上
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：相手がモンスターを表側表示で特殊召喚した場合、その内の１体を対象として発動できる。自分フィールドの悪魔族モンスター１体を破壊し、対象のモンスターの効果をターン終了時まで無効にする。②：自分フィールドにリンク４以上の「破械」Ｌモンスターが存在し、フィールドのモンスターの効果が発動した時、墓地のこのカードを除外して発動できる。その効果を発動したモンスターを破壊する。
  ko: |-
    악마족 몬스터를 포함하는 몬스터 2장 이상<br>이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 상대가 몬스터를 앞면 표시로 특수 소환했을 경우, 그 중의 1장을 대상으로 하고 발동할 수 있다. 자신 필드의 악마족 몬스터 1장을 파괴하고, 대상 몬스터의 효과를 턴 종료시까지 무효로 한다. ②: 자신 필드에 링크 4 이상의 "언체인드" 링크 몬스터가 존재하고, 필드의 몬스터의 효과가 발동했을 때, 묘지의 이 카드를 제외하여 발동할 수 있다. 그 효과를 발동한 몬스터를 파괴한다.
  zh-TW:
  zh-CN: |-
    包含恶魔族怪兽在内的怪兽2只以上
    此卡名的①②效果1回合仅可各使用1次。①：对手将怪兽以表侧表示特殊召唤的情况下，以其中1只为对象可以发动。将自己场上的1只恶魔族怪兽破坏，将对象怪兽的效果直至回合结束时为止无效。②：自己场上存在连接4以上的“破械”连接怪兽，且场上怪兽的效果发动时，将墓地的此卡除外可以发动。将发动该效果的怪兽破坏。
