text:
  en: |-
    If you control a monster with 0 ATK or DEF: You can Special Summon this card from your hand. You can reveal 3 Xyz Monsters in your Extra Deck with different Ranks, then target 1 other card on the field; destroy both it and this card. You can banish this card from your GY; detach 1 material from a monster you control, then you can Special Summon 1 monster with 0 ATK or DEF from your hand or GY. You can only use each effect of "Garbage Golem" once per turn.
  de: |-
    Falls du ein Monster mit 0 ATK oder DEF kontrollierst: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören. Du kannst 3 Xyz-Monster mit unterschiedlichen Rängen in deinem Extra Deck vorzeigen und dann 1 andere Karte auf dem Spielfeld wählen; zerstöre sowohl sie als auch diese Karte. Du kannst diese Karte von deinem Friedhof verbannen; hänge 1 Material von einem Monster ab, das du kontrollierst, dann kannst du 1 Monster mit 0 ATK oder DEF als Spezialbeschwörung von deiner Hand oder deinem Friedhof beschwören. Du kannst jeden Effekt von „Abfallgolem“ nur einmal pro Spielzug verwenden.
  es: |-
    Si controlas un monstruo con 0 ATK o DEF: puedes Invocar esta carta de Modo Especial desde tu mano. Puedes mostrar 3 Monstruos Xyz en tu Deck Extra con Rangos diferentes, y después selecciona otra carta en el Campo; destrúyela, así como esta carta. Puedes desterrar esta carta en tu Cementerio; desacopla 1 material de un monstruo que controles, y después puedes Invocar de Modo Especial 1 monstruo con 0 ATK o DEF desde tu mano o Cementerio. Sólo puedes usar cada efecto de "Gólem de Porquería" una vez por turno.
  fr: |-
    Si vous contrôlez un monstre avec 0 ATK ou DEF : vous pouvez Invoquer Spécialement cette carte depuis votre main. Vous pouvez révéler 3 Monstres Xyz dans votre Extra Deck de Rangs différents, puis ciblez 1 autre carte sur le Terrain ; détruisez-la ainsi que cette carte. Vous pouvez bannir cette carte depuis votre Cimetière ; détachez 1 Matériel d'un monstre que vous contrôlez, puis vous pouvez Invoquer Spécialement 1 monstre avec 0 ATK ou DEF depuis votre main ou Cimetière. Vous ne pouvez utiliser chaque effet de "Golem Immondices" qu'une fois par tour.
  it: |-
    Se controlli un mostro con ATK o DEF 0: puoi Evocare Specialmente questa carta dalla tua mano. Puoi rivelare 3 Mostri Xyz nel tuo Extra Deck con Ranghi diversi, poi scegliere come bersaglio 1 altra carta sul Terreno; distruggi sia quella che questa carta. Puoi bandire questa carta dal tuo Cimitero; stacca 1 materiale da un mostro che controlli, poi puoi Evocare Specialmente 1 mostro con 0 ATK o DEF dalla tua mano o Cimitero. Puoi utilizzare ogni effetto di "Golem Spazzatura" una sola volta per turno.
  pt: |-
    Se você controlar um monstro com 0 de ATK ou DEF: você pode Invocar este card por Invocação-Especial da sua mão. Você pode revelar 3 Monstros Xyz no seu Deck Adicional com Classes diferentes e, depois, escolha 1 outro card no campo; destrua tanto ele como este card. Você pode banir este card do seu Cemitério; desassocie 1 matéria de um monstro que você controla e, depois, você pode Invocar por Invocação-Especial 1 monstro com 0 de ATK ou DEF da sua mão ou do Cemitério. Você só pode usar cada efeito de "Golem do Lixo" uma vez por turno.
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドに攻撃力か守備力が０のモンスターが存在する場合に発動できる。このカードを手札から特殊召喚する。②：ランクが異なるＥＸデッキのＸモンスター３体を相手に見せ、フィールドの他のカード１枚を対象として発動できる。そのカードとこのカードを破壊する。③：墓地のこのカードを除外して発動できる。自分フィールドのＸ素材を１つ取り除く。その後、自分の手札・墓地から攻撃力か守備力が０のモンスター１体を特殊召喚できる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：自己场上存在攻击力或守备力为0的怪兽的情况下可以发动。从手牌将此卡特殊召唤。②：向对手出示额外牌组的阶级不同的3只超量怪兽，以场上的1张其他卡为对象可以发动。将该卡和此卡破坏。③：将墓地的此卡除外可以发动。去除自己场上的1个超量素材。然后，可从自己手牌・墓地将1只攻击力或守备力为0的怪兽特殊召唤。
