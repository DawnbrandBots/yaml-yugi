name:
  en: Galaxy-Eyes Photon Change Dragon
  de: Galaxieaugen-Photonen-Wechseldrache
  es: Dragón de Cambio Fotónico de Ojos Galácticos
  fr: Dragon du Changement Photon aux Yeux Galactiques
  it: Drago Cambio Fotonico Occhi Galattici
  pt: Dragão da Mudança de Fóton de Olhos das Galáxias
  ja: <ruby>銀河眼の輝光子竜<rt>ギャラクシーアイズ・フォトン・チェンジ・ドラゴン</rt></ruby>
  ja_romaji: Gyarakushīaizu Foton Chenji Doragon
  ko: 갤럭시아이즈 포톤 체인지 드래곤
  ko_rr:
  zh-TW:
  zh-CN: 银河眼辉光子龙
text:
  en: |-
    You can Special Summon this card (from your hand) by Tributing 2 face-up monsters with 2000 or more ATK from anywhere on the field, including a monster you control. You can only Special Summon "Galaxy-Eyes Photon Change Dragon" once per turn this way. During the Main Phase (Quick Effect): You can banish this card you control; Special Summon 1 "Galaxy-Eyes Photon Dragon" from your Deck or GY, then you can banish 1 monster your opponent controls that was Special Summoned from the Extra Deck, until the End Phase. You can only use this effect of "Galaxy-Eyes Photon Change Dragon" once per turn.
  de: |-
    Du kannst diese Karte als Spezialbeschwörung (von deiner Hand) beschwören, indem du 2 offene Monster mit 2000 oder mehr ATK von irgendwo auf dem Spielfeld als Tribut anbietest, darunter ein Monster, das du kontrollierst. Du kannst „Galaxieaugen-Photonen-Wechseldrache“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Während der Main Phase (Schnelleffekt): Du kannst diese Karte verbannen, die du kontrollierst; beschwöre 1 „Galaxieaugen-Photonendrache“ als Spezialbeschwörung von deinem Deck oder Friedhof, dann kannst du 1 Monster, das dein Gegner kontrolliert und das als Spezialbeschwörung vom Extra Deck beschworen wurde, bis zur End Phase verbannen. Du kannst diesen Effekt von „Galaxieaugen-Photonen-Wechseldrache“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes Invocar esta carta de Modo Especial (desde tu mano) Sacrificando 2 monstruos boca arriba con 2000 ATK o más en cualquier lugar del Campo, incluyendo un monstruo que controles. Sólo puedes Invocar de Modo Especial "Dragón de Cambio Fotónico de Ojos Galácticos" una vez por turno de esta forma. Durante la Main Phase (Efecto Rápido): puedes desterrar esta carta que controlas; Invoca de Modo Especial 1 "Dragón Fotónico de Ojos Galácticos" desde tu Deck o Cementerio, y después puedes desterrar 1 monstruo que controle tu adversario que fuera Invocado de Modo Especial desde el Deck Extra, hasta la End Phase. Sólo puedes usar este efecto de "Dragón de Cambio Fotónico de Ojos Galácticos" una vez por turno.
  fr: |-
    Vous pouvez Invoquer Spécialement cette carte (depuis votre main) en Sacrifiant 2 monstres face recto avec min. 2000 ATK (un monstre que vous contrôlez inclus) depuis le Terrain. Vous ne pouvez Invoquer Spécialement "Dragon du Changement Photon aux Yeux Galactiques" qu'une fois par tour de cette façon. Durant la Main Phase (Effet Rapide) : vous pouvez bannir cette carte que vous contrôlez ; Invoquez Spécialement 1 "Dragon Photon aux Yeux Galactiques" depuis votre Deck ou Cimetière, puis vous pouvez bannir 1 monstre contrôlé par votre adversaire qui a été Invoqué Spécialement depuis l'Extra Deck, jusqu'à la End Phase. Vous ne pouvez utiliser cet effet de "Dragon du Changement Photon aux Yeux Galactiques" qu'une fois par tour.
  it: |-
    Puoi Evocare Specialmente questa carta (dalla tua mano) offrendo come Tributo 2 mostri scoperti con ATK 2000 o superiore su qualsiasi Terreno, compreso un mostro che controlli. Puoi Evocare Specialmente "Drago Cambio Fotonico Occhi Galattici" una sola volta per turno in questo modo. Durante la Main Phase (Effetto Rapido): puoi bandire questa carta che controlli; Evoca Specialmente 1 "Drago Fotonico Occhi Galattici" dal tuo Deck o Cimitero, poi puoi bandire 1 mostro controllato dal tuo avversario che è stato Evocato Specialmente dall'Extra Deck, fino alla End Phase. Puoi utilizzare questo effetto di "Drago Cambio Fotonico Occhi Galattici" una sola volta per turno.
  pt: |-
    Você pode Invocar este card por Invocação-Especial (da sua mão) ao oferecer como Tributo 2 monstros com a face para cima com 2000 ou mais de ATK de qualquer parte do campo, incluindo um monstro que você controla. Você só pode Invocar "Dragão da Mudança de Fóton de Olhos das Galáxias" por Invocação-Especial uma vez por turno desta forma. Durante a Fase Principal (Efeito Rápido): você pode banir este card que você controla; Invoque por Invocação-Especial 1 "Dragão de Fóton de Olhos das Galáxias" do seu Deck ou Cemitério e, depois, você pode banir 1 monstro que seu oponente controla que foi Invocado por Invocação-Especial do Deck Adicional, até a Fase Final. Você só pode usar este efeito de "Dragão da Mudança de Fóton de Olhos das Galáxias" uma vez por turno.
  ja: |-
    このカード名の、①の方法による特殊召喚は１ターンに１度しかできず、②の効果は１ターンに１度しか使用できない。①：このカードは、自分フィールドのモンスターを含む自分・相手フィールドの攻撃力２０００以上の表側表示モンスター２体をリリースして手札から特殊召喚できる。②：自分・相手のメインフェイズに、フィールドのこのカードを除外して発動できる。自分のデッキ・墓地から「銀河眼の光子竜」１体を特殊召喚する。その後、ＥＸデッキから特殊召喚された相手フィールドのモンスター１体をエンドフェイズまで除外できる。
  ko: |-
    이 카드명의, ①의 방법에 의한 특수 소환은 1턴에 1번밖에 할 수 없으며, ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드는, 자신 필드의 몬스터를 포함하는 자신 / 상대 필드의 공격력 2000 이상인 앞면 표시 몬스터 2장을 릴리스하고 패에서 특수 소환할 수 있다. ②: 자신 / 상대의 메인 페이즈에, 필드의 이 카드를 제외하고 발동할 수 있다. 자신의 덱 / 묘지에서 "갤럭시아이즈 포톤 드래곤" 1장을 특수 소환한다. 그 후, 엑스트라 덱에서 특수 소환된 상대 필드의 몬스터 1장을 엔드 페이즈까지 제외할 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名以①方法的特殊召唤1回合仅可进行1次，且②效果1回合仅可使用1次。①：此卡可解放包含自己场上的怪兽在内的、自己・对手场上的2只攻击力2000以上的表侧表示怪兽来从手牌特殊召唤。②：在自己・对手的主要阶段，将场上的此卡除外可以发动。从自己牌组・墓地将1只“银河眼光子龙”特殊召唤。然后，可将对手场上的1只被从额外牌组特殊召唤的怪兽直至结束阶段为止除外。
