  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、デッキからレベル４以下の「方界」モンスター１体を手札に加える事ができる。②：モンスター同士の戦闘で発生するお互いへの戦闘ダメージは０になる。③：１ターンに１度、自分メインフェイズに発動できる。手札から「方界」モンスター１体を召喚条件を無視して特殊召喚する。④：モンスターが戦闘で破壊された場合に発動する。破壊されたモンスターのコントローラーはその元々の攻撃力分のダメージを受ける。
