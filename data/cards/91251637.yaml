text:
  en: |-
    You can Ritual Summon this card with "Javelin Beetle of the Alliance". During the Main Phase (Quick Effect): You can reveal this card in your hand; Ritual Summon 1 Insect Ritual Monster from your hand, by Tributing monsters from your hand or field whose total Levels equal or exceed its Level. You can only use this effect of "Javelin Beetle of the Alliance" once per Duel. If this card is Ritual Summoned: You can target 1 other card in this card's column; destroy it, and if you do, this card gains 600 ATK.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「盟約のジャベリンビートル」により降臨
    このカード名の①の効果はデュエル中に１度しか使用できない。①：自分・相手のメインフェイズに、手札のこのカードを相手に見せて発動できる。レベルの合計が儀式召喚するモンスターのレベル以上になるように、自分の手札・フィールドのモンスターをリリースし、手札から昆虫族の儀式モンスター１体を儀式召喚する。②：このカードが儀式召喚した場合、このカードと同じ縦列の他のカード１枚を対象として発動できる。そのカードを破壊し、このカードの攻撃力は６００アップする。
  ko:
  zh-TW:
  zh-CN: |-
    以“盟约之标枪甲虫”降临
    此卡名的①效果在决斗中仅可使用1次。①：在自己・对手的主要阶段，向对手出示手牌的此卡可以发动。为使合计等级达到仪式召唤的怪兽的等级以上，解放自己手牌・场上的怪兽，从手牌将1只昆虫族仪式怪兽仪式召唤。②：此卡仪式召唤的情况下，以与此卡同一纵列的1张其他卡为对象可以发动。将该卡破坏，此卡的攻击力上升600。
