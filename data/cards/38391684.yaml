name:
  en: Atlantis, City of the Sea Dragon
  de: Atlantis, Stadt des Seedrachen
  es: Atlántida, Ciudad del Dragón Marino
  fr: Atlantis, Cité du Dragon des Mers
  it: Atlantide, Città del Drago del Mare
  pt: Atlântida, a Cidade do Dragão Marinho
  ja: <ruby>竜<rt>りゅう</rt></ruby><ruby>都<rt>と</rt></ruby>アトランティス
  ja_romaji: Ryūto Atorantisu
  ko: 용도 아틀란티스
  ko_rr:
  zh-TW:
  zh-CN: 龙都 亚特兰蒂斯
text:
  en: |-
    While a monster that mentions "Atlantis, City of the Sea Dragon" is on the field, the Levels of all monsters in both players' hands and on the field are reduced by 1. When you Link Summon a "Daedalus" Link Monster, you can reduce the total number of materials by 1 (from Link Rating and from mentioned materials). If this card is in your GY and you control "Umi": You can place this card face-up on your field. You can only use this effect of "Atlantis, City of the Sea Dragon" once per turn.
  de: |-
    Solange ein Monster, das „Atlantis, Stadt des Seedrachen“ erwähnt, auf dem Spielfeld liegt, werden die Stufen aller Monster in den Händen beider Spieler und auf dem Spielfeld um 1 verringert. Wenn du ein „Daedalus“-Linkmonster als Linkbeschwörung beschwörst, kannst du die Gesamtanzahl des Materials um 1 verringern (von Linkzahl und vom erwähnten Material). Falls sich diese Karte in deinem Friedhof befindet und du „Umi“ kontrollierst: Du kannst diese Karte offen auf deine Spielfeldseite legen. Du kannst diesen Effekt von „Atlantis, Stadt des Seedrachen“ nur einmal pro Spielzug verwenden.
  es: |-
    Mientras un monstruo que mencione "Atlántida, Ciudad del Dragón Marino" esté en el Campo, los Niveles de todos los monstruos en el Campo y en las manos de ambos jugadores se reducen en 1. Cuando Invocas por Enlace un Monstruo de Enlace "Dédalo", puedes reducir el número total de materiales en 1 (del Rating de Enlace y de los materiales mencionados). Si esta carta está en tu Cementerio y controlas "Umi": puedes poner esta carta boca arriba en tu Campo. Sólo puedes usar este efecto de "Atlántida, Ciudad del Dragón Marino" una vez por turno.
  fr: |-
    Tant qu'un monstre qui mentionne "Atlantis, Cité du Dragon des Mers" est sur le Terrain, le Niveau de tous les monstres dans la main de chaque joueur et sur le Terrain est réduit de 1. Lorsque vous Invoquez par Lien un Monstre Lien "Dédale", vous pouvez réduire de 1 le nombre total de Matériels (par sa Classification Lien et par les Matériels mentionnés). Si cette carte est dans votre Cimetière et que vous contrôlez "Umi" : vous pouvez placer face recto cette carte sur votre Terrain. Vous ne pouvez utiliser cet effet de "Atlantis, Cité du Dragon des Mers" qu'une fois par tour.
  it: |-
    Mentre un mostro che menziona "Atlantide, Città del Drago del Mare" è sul Terreno, i Livelli di tutti i mostri nelle mani di entrambi i giocatori e sul Terreno sono ridotti di 1. Quando Evochi Link un Mostro Link "Dedalo", puoi ridurre il numero totale di materiali di 1 (dalla Classificazione Link e dai materiali menzionati). Se questa carta è nel tuo Cimitero e tu controlli "Umi": puoi mettere questa carta scoperta sul tuo Terreno. Puoi utilizzare questo effetto di "Atlantide, Città del Drago del Mare" una sola volta per turno.
  pt: |-
    Enquanto um monstro que mencione "Atlântida, a Cidade do Dragão Marinho" estiver no campo, os Níveis de todos os monstros nas mãos dos dois duelistas e no campo são reduzidos em 1. Quando você Invocar por Invocação-Link um Monstro Link "Daedalus", você pode reduzir em 1 o número total de matérias (do Valor Link e das matérias necessárias mencionadas). Se este card estiver no seu Cemitério e você controlar "Umi": você pode colocar este card com a face para cima no seu campo. Você só pode usar este efeito de "Atlântida, a Cidade do Dragão Marinho" uma vez por turno.
  ja: |-
    このカード名の③の効果は１ターンに１度しか使用できない。①：フィールドに「竜都アトランティス」のカード名が記されたモンスターが存在する限り、お互いの手札・フィールドのモンスターのレベルは１つ下がる。②：このカードがフィールドゾーンに存在する限り、自分が「ダイダロス」ＬモンスターをＬ召喚する場合に必要なＬ素材の数を１つ分、Ｌ素材の条件を１体分少なくできる。③：このカードが墓地に存在し、自分フィールドに「海」が存在する場合に発動できる。このカードを自分フィールドに表側表示で置く。
  ko: |-
    이 카드명의 ③의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 필드에 "용도 아틀란티스"의 카드명이 쓰여진 몬스터가 존재하는 한, 서로의 패 / 필드의 몬스터의 레벨은 1개 내려간다. ②: 이 카드가 필드 존에 존재하는 한, 자신이 "다이달로스" 링크 몬스터를 링크 소환할 경우에 필요한 링크 소재의 수를 1개만큼, 링크 소재의 조건을 1장만큼 적게 할 수 있다. ③: 이 카드가 묘지에 존재하고, 자신 필드에 "바다"가 존재할 경우에 발동할 수 있다. 이 카드를 자신 필드에 앞면 표시로 놓는다.
  zh-TW:
  zh-CN: |-
    此卡名的③效果1回合仅可使用1次。①：只要场上存在记载有“龙都 亚特兰蒂斯”卡名的怪兽，双方手牌・场上的怪兽的等级下降1。②：只要此卡存在于场地区域，自己要连接召唤“代达罗斯”连接怪兽的情况下，所需要的连接素材的数量可减少1、记载的连接素材的条件可减少1只。③：此卡存在于墓地，且自己场上存在“海”的情况下可以发动。将此卡以表侧表示放在自己场上。
