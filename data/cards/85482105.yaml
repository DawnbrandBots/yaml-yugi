text:
  en: |-
    If this card is in your hand: You can send 1 "Speedroid" card from your Deck to the GY, except "Speedroid Darumaknocker"; Special Summon this card, also you cannot Special Summon for the rest of this turn, except WIND monsters. If this card is sent from the field to the GY: You can add 1 "Speedroid" Spell/Trap from your Deck to your hand, then if you control a "Clear Wing" monster, you can destroy 1 monster on the field. You can only use each effect of "Speedroid Darumaknocker" once per turn.
