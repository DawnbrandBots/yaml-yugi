    此卡名的①②效果1回合仅可各使用1次。①：此卡特殊召唤的情况下，或从场上被送至墓地的情况下可以发动。从牌组挑选1张“艮鬼”陷阱卡，加入手牌或放置在自己场上。②：自己墓地存在陷阱卡的情况下可以发动。将场上的里侧表示卡全部放回手牌。然后，自己墓地的陷阱卡为5张以上的情况下，可将对手场上的卡全部放回手牌。
