text:
  en: |-
    When this card is activated: You can add 1 WATER Cyberse monster from your Deck to your hand. Once per turn, during your opponent's End Phase: You can shuffle up to 3 WATER monsters from your GY and/or banishment into the Deck. You can send this face-up card to the GY; Ritual Summon 1 WATER Cyberse Ritual Monster from your hand, by banishing WATER monsters from your GY whose total Levels equal or exceed the Level of the Ritual Monster. You can only activate 1 "Marincess Reef Lagoon" per turn.
  de:
  es:
  fr:
