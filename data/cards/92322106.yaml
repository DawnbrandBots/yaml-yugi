  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、デッキからサイバース族・水属性モンスター１体を手札に加える事ができる。②：相手エンドフェイズに発動できる。自分の墓地・除外状態の水属性モンスターを３体までデッキに戻す。③：魔法＆罠ゾーンの表側表示のこのカードを墓地へ送って発動できる。レベルの合計が儀式召喚するモンスターのレベル以上になるように、自分の墓地の水属性モンスターを除外し、手札からサイバース族・水属性の儀式モンスター１体を儀式召喚する。
