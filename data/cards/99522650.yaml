  ja: |-
    このカードは通常召喚できない。「沈黙の闘者－サイレント・マジシャン」は１ターンに１度、自分フィールドのレベル７以下の魔法使い族・戦士族モンスター１体をリリースした場合のみ特殊召喚できる。①：このカードは１ターンに１度だけ戦闘・効果では破壊されない。②：１ターンに２度まで、相手がドローする度に発動できる。自分は１枚ドローする。相手が自身のカードの効果でドローしていた場合、代わりにその枚数分だけ、自分はドローする。③：自分の手札が６枚以上である限り、相手が発動した魔法カードの効果は無効化される。
