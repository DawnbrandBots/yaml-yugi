  en: |-
    While you control 2 or more non-Token Normal Monsters, Normal Monsters you control gain 1000 ATK. You can only use each of the following effects of "Bunnillin Soft" once per turn. You can target 2 Normal Monsters in your GY with different Types, Attributes, and Levels; Special Summon them. If a Level 5 or higher Normal Monster(s) with 2000 or less original ATK/DEF is Special Summoned or declares an attack: You can add 1 card from your GY to your hand.
