name:
  en: Chaos End Ruler - Master of the Beginning and End
  de: Chaos-Endherrscher - Meister des Anfangs und des Endes
  es: Gobernante del Final del Caos - Amo del Principio y Fin
  fr: Souverain de la Fin du Chaos - Maître du Début et de la Fin
  it: Sovrano Fine del Chaos - Maestro dell'Inizio e della Fine
  pt: Governante do Fim do Caos - Mestre do Princípio e do Fim
  ja: カオスエンド・ルーラー－<ruby>開<rt>かい</rt></ruby><ruby>闢<rt>びゃく</rt></ruby>と<ruby>終<rt>しゅう</rt></ruby><ruby>焉<rt>えん</rt></ruby>の<ruby>支<rt>し</rt></ruby><ruby>配<rt>はい</rt></ruby><ruby>者<rt>しゃ</rt></ruby>－
  ja_romaji: Kaosu Endo Rūrā -Kaibyaku to Shūen no Shihaisha-
  ko: 카오스 엔드 룰러 －개벽과 종언의 지배자－
  ko_rr:
  zh-TW:
  zh-CN: 混沌终末统御者 －开辟与终焉的支配者－
text:
  en: |-
    Cannot be Normal Summoned/Set. Must be Special Summoned (from your hand) by banishing 1 LIGHT Warrior and 1 DARK Fiend monster from your GY. This card's Special Summon cannot be negated. Neither player can activate cards or effects when this card is Special Summoned. If you control this card that was Special Summoned this way: You can pay 1000 LP; banish as many cards from your opponent's field and GY as possible, then inflict 500 damage to your opponent for each card banished. You can only use this effect of "Chaos End Ruler - Master of the Beginning and End" once per turn.
  de: |-
    Kann nicht als Normalbeschwörung beschworen/gesetzt werden. Muss als Spezialbeschwörung (von deiner Hand) beschworen werden, indem du 1 LICHT Krieger- und 1 FINSTERNIS Unterweltler-Monster von deinem Friedhof verbannst. Die Spezialbeschwörung dieser Karte kann nicht annulliert werden. Kein Spieler kann Karten oder Effekte aktivieren, wenn diese Karte als Spezialbeschwörung beschworen wird. Falls du diese Karte kontrollierst, die auf diese Art als Spezialbeschwörung beschworen wurde: Du kannst 1000 LP zahlen; verbanne so viele Karten von der Spielfeldseite und dem Friedhof deines Gegners wie möglich, dann füge deinem Gegner für jede verbannte Karte 500 Schaden zu. Du kannst diesen Effekt von „Chaos-Endherrscher - Meister des Anfangs und des Endes“ nur einmal pro Spielzug verwenden.
  es: |-
    No puede ser Invocado de Modo Normal/Colocado. Debe ser Invocado de Modo Especial (desde tu mano) desterrando 1 monstruo Guerrero de LUZ y 1 monstruo Demonio de OSCURIDAD en tu Cementerio. La Invocación Especial de esta carta no puede ser negada. Ningún jugador puede activar cartas o efectos cuando esta carta es Invocada de Modo Especial. Si controlas esta carta que fue Invocada de Modo Especial de esta forma: puedes pagar 1000 LP; destierra tantas cartas en el Campo y Cementerio de tu adversario como sea posible, y después inflige 500 puntos de daño a tu adversario por cada carta desterrada. Sólo puedes usar este efecto de "Gobernante del Final del Caos - Amo del Principio y Fin" una vez por turno.
  fr: |-
    Ni Invocable Normalement ni Posable Normalement. Uniquement Invocable Spécialement (depuis votre main) en bannissant 1 monstre LUMIÈRE Guerrier et 1 monstre TÉNÈBRES Démon depuis votre Cimetière. L'Invocation Spéciale de cette carte ne peut pas être annulée. Aucun joueur ne peut activer ni de cartes ni d'effets lorsque cette carte est Invoquée Spécialement. Si vous contrôlez cette carte qui a été Invoquée Spécialement de cette façon : vous pouvez payer 1000 LP ; bannissez autant de cartes depuis le Terrain et Cimetière de votre adversaire que possible, puis infligez 500 points de dommages à votre adversaire pour chaque carte qui a été bannie. Vous ne pouvez utiliser cet effet de "Souverain de la Fin du Chaos - Maître du Début et de la Fin" qu'une fois par tour.
  it: |-
    Non può essere Evocato Normalmente/Posizionato. Deve essere Evocato Specialmente (dalla tua mano) bandendo 1 mostro LUCE Guerriero e 1 mostro OSCURITÀ Demone dal tuo Cimitero. L'Evocazione Speciale di questa carta non può essere annullata. Nessun giocatore può attivare carte o effetti quando questa carta viene Evocata Specialmente. Se controlli questa carta che è stata Evocata Specialmente in questo modo: puoi pagare 1000 LP; bandisci tante carte dal Terreno e Cimitero del tuo avversario quante possibile, poi infliggi 500 danni al tuo avversario per ogni carta bandita. Puoi utilizzare questo effetto di "Sovrano Fine del Chaos - Maestro dell'Inizio e della Fine" una sola volta per turno.
  pt: |-
    Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial (da sua mão) ao banir 1 monstro Guerreiro de LUZ e 1 monstro Demônio de TREVAS do seu Cemitério. A Invocação-Especial deste card não pode ser negada. Nenhum duelista pode ativar cards ou efeitos quando este card for Invocado por Invocação-Especial. Se você controlar este card que foi Invocado por Invocação-Especial desta forma: você pode pagar 1000 PV; bana tantos cards do campo e do Cemitério do seu oponente quanto possível e, depois, cause 500 de dano ao seu oponente para cada card banido. Você só pode usar este efeito de "Governante do Fim do Caos - Mestre do Princípio e do Fim" uma vez por turno.
  ja: |-
    このカードは通常召喚できない。自分の墓地から戦士族・光属性と悪魔族・闇属性のモンスターを１体ずつ除外した場合のみ特殊召喚できる。このカード名の③の効果は１ターンに１度しか使用できない。①：このカードの特殊召喚は無効化されない。②：このカードの特殊召喚成功時にお互いはカードの効果を発動できない。③：このカードが上記の方法で特殊召喚されている場合、１０００ＬＰを払って発動できる。相手のフィールド・墓地のカードを全て除外する。その後、この効果で除外した数×５００ダメージを相手に与える。
  ko: |-
    이 카드는 통상 소환할 수 없다. 자신 묘지에서 전사족 / 빛 속성과 악마족 / 어둠 속성인 몬스터를 1장씩 제외했을 경우에만 특수 소환할 수 있다. 이 카드명의 ③의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드의 특수 소환은 무효화되지 않는다. ②: 이 카드의 특수 소환 성공시에 양쪽 플레이어는 카드의 효과를 발동할 수 없다. ③: 이 카드가 상기의 방법으로 특수 소환되어 있을 경우, 1000 LP를 지불하고 발동할 수 있다. 상대의 필드 / 묘지의 카드를 전부 제외한다. 그 후, 이 효과로 제외한 수 × 500 데미지를 상대에게 준다.
  zh-TW:
  zh-CN: |-
    此卡不可通常召唤。仅可在从自己墓地将战士族・光属性和恶魔族・暗属性的怪兽各1只除外的情况下特殊召唤。此卡名的③效果1回合仅可使用1次。①：此卡的特殊召唤不会被无效化。②：此卡特殊召唤成功时双方不可发动卡的效果。③：此卡是以上述方法被特殊召唤的情况下，支付1000LP可以发动。将对手场上・墓地的卡全部除外。然后，给予对手以此效果除外的数量×500的伤害。
