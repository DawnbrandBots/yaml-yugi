    ①：このカードの攻撃宣言時に発動する。自分は５００ＬＰを失い、このカードの攻撃力は５００アップする。②：モンスターが戦闘で破壊された時に発動できる。そのモンスターを破壊したモンスターに墓地のこのカードを装備魔法カード扱いで装備する。その後、相手フィールドの攻撃力が一番高いモンスター１体を破壊できる。③：装備モンスターはカード名を「ゾンバイア」として扱い、効果は無効化される。④：装備モンスターの攻撃宣言時に発動する。そのコントローラーは５００ＬＰを失い、装備モンスターの攻撃力は５００アップする。
