name:
  en: The Big Saturn
  de: Der große Saturn
  es: El Gran Saturno
  fr: Saturne le Puissant
  it: Saturno il Grande
  pt: O Grande Saturno
  ja: <ruby>Ｔｈｅ ｂｉｇ ＳＡＴＵＲＮ<rt>ザ・ビッグ・サターン</rt></ruby>
  ja_romaji: Za Biggu Satān
  ko: The big SATURN
  ko_rr: Deo Bik Saeteon
  zh-TW: The big SATURN
  zh-CN: The big SATURN
text:
  en: |-
    Cannot be Special Summoned from the hand or Deck. Once per turn: You can discard 1 card and pay 1000 LP; this card gains 1000 ATK until the end of this turn. When this card in your possession is destroyed by your opponent's card effect and sent to your GY: Both players take damage equal to this card's ATK in the GY.
  de: |-
    Kann nicht als Spezialbeschwörung von der Hand oder dem Deck beschworen werden. Einmal pro Spielzug: Du kannst 1 Karte abwerfen und 1000 LP zahlen; diese Karte erhält bis zum Ende dieses Spielzugs 1000 ATK. Wenn diese Karte, die dir gehört, durch einen Karteneffekt deines Gegners zerstört und auf deinen Friedhof gelegt wird: Beide Spieler erhalten Schaden in Höhe der ATK dieser Karte im Friedhof.
  es: |-
    No puede ser Invocado de Modo Especial desde la mano o Deck. Una vez por turno: puedes descartar 1 carta y pagar 1000 LP; esta carta gana 1000 ATK hasta el final de este turno. Cuando esta carta en tu posesión es destruida por el efecto de una carta de tu adversario y mandada a tu Cementerio: ambos jugadores reciben daño igual al ATK de esta carta en el Cementerio.
  fr: |-
    Non Invocable Spécialement depuis la main ou Deck. Une fois par tour : vous pouvez défausser 1 carte et payer 1000 LP ; jusqu'à la fin de ce tour, cette carte gagne 1000 ATK. Lorsque cette carte en votre possession est détruite par un effet de carte de votre adversaire et envoyée à votre Cimetière : chaque joueur reçoit des dommages égaux à l'ATK de cette carte dans le Cimetière.
  it: |-
    Non può essere Evocato Specialmente dalla mano o Deck. Una volta per turno: puoi scartare 1 carta e pagare 1000 LP; questa carta guadagna 1000 ATK fino alla fine di questo turno. Quando questa carta sotto il tuo comando viene distrutta dall'effetto di una carta del tuo avversario e mandata al tuo Cimitero: entrambi i giocatori subiscono danno pari all'ATK di questa carta nel Cimitero.
  pt: |-
    Não pode ser Invocado por Invocação-Especial da mão ou do Deck. Uma vez por turno: você pode descartar 1 card e pagar 1000 PV; este card ganha 1000 de ATK até o final deste turno. Quando este card em sua posse for destruído por um efeito de card do seu oponente e enviado para o seu Cemitério: os dois duelistas sofrem dano igual ao ATK deste card no Cemitério.
  ja: |-
    このカードは手札またはデッキからの特殊召喚はできない。手札を１枚捨てて１０００ライフポイントを払う。エンドフェイズ時までこのカードの攻撃力は１０００ポイントアップする。この効果は１ターンに１度だけ自分のメインフェイズに使用する事ができる。相手がコントロールするカードの効果によってこのカードが破壊され墓地へ送られた時、お互いにその攻撃力分のダメージを受ける。
  ko: |-
    이 카드는 패 / 덱에서의 특수 소환은 할 수 없다. ①: 1턴에 1번, 패를 1장 버리고, 1000 LP를 지불하여 발동할 수 있다. 이 카드의 공격력은 턴 종료시까지 1000 올린다. ②: 이 카드가 상대 효과로 파괴되어 묘지로 보내졌을 경우에 발동한다. 양쪽 플레이어는 이 카드의 원래 공격력만큼의 데미지를 받는다.
  zh-TW:
  zh-CN: |-
    这张卡不能作从手卡或者卡组的特殊召唤。丢弃1张手卡支付1000基本分。直到结束阶段时这张卡的攻击力上升1000。这个效果1回合只有1次在自己的主要阶段才能使用。对方控制的卡的效果让这张卡被破坏送去墓地时，双方受到那个攻击力数值的伤害。
