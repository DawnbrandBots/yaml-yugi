text:
  en: |-
    2 monsters, including a Dinosaur monster
    If this card is Link Summoned: You can make this card gain ATK equal to half the combined original ATK of the Dinosaur monsters used as Link Material. During your Main Phase: You can Fusion Summon 1 Dinosaur Fusion Monster from your Extra Deck, by banishing its materials from your field or GY, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Dinosaur monsters. You can only use this effect of "Stratiae the Stratasmasher Dino" once per turn.
  de: |-
    2 Monster, darunter ein Dinosaurier-Monster
    Falls diese Karte als Linkbeschwörung beschworen wird: Du kannst diese Karte ATK in Höhe der Hälfte der kombinierten Grund-ATK der Dinosaurier-Monster, die als Linkmaterial verwendet wurden, erhalten lassen. Während deiner Main Phase: Du kannst 1 Dinosaurier-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du sein Material von deiner Spielfeldseite oder deinem Friedhof verbannst, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Dinosaurier-Monstern. Du kannst diesen Effekt von „Stratiae der Strataspalter-Dino“ nur einmal pro Spielzug verwenden.
  es: |-
    2 monstruos, incluyendo un monstruo Dinosaurio
    Si esta carta es Invocada por Enlace: puedes hacer que esta carta gane ATK igual a la mitad del ATK original combinado de los monstruos Dinosaurio usados como Material de Enlace. Durante tu Main Phase: puedes Invocar por Fusión 1 Monstruo de Fusión Dinosaurio desde tu Deck Extra, desterrando sus materiales en tu Campo o Cementerio, y además no puedes Invocar de Modo Especial desde el Deck Extra por el resto de este turno, excepto monstruos Dinosaurio. Sólo puedes usar este efecto de "Stratiae el Dino Rompestratos" una vez por turno.
  fr: |-
    2 monstres (un monstre Dinosaure inclus)
    Si cette carte est Invoquée par Lien : vous pouvez faire gagner à cette carte une ATK égale à la moitié de la somme des ATK d'origine des monstres Dinosaure utilisés comme Matériel Lien. Durant votre Main Phase : vous pouvez Invoquer par Fusion 1 Monstre Fusion Dinosaure depuis votre Extra Deck, en bannissant ses Matériels depuis votre Terrain ou Cimetière, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Dinosaure exclus) depuis l'Extra Deck le reste de ce tour. Vous ne pouvez utiliser cet effet de "Stratiae le Dino Écrastrate" qu'une fois par tour.
  it: |-
    2 mostri, compreso un mostro Dinosauro
    Se questa carta viene Evocata Link: puoi far guadagnare a questa carta ATK pari alla metà della somma degli ATK originali dei mostri Dinosauro utilizzati come Materiale Link. Durante la tua Main Phase: puoi Evocare tramite Fusione 1 Mostro Fusione Dinosauro dal tuo Extra Deck, bandendo i suoi materiali dal tuo Terreno o Cimitero, inoltre non puoi Evocare Specialmente dall'Extra Deck per il resto di questo turno, eccetto mostri Dinosauro. Puoi utilizzare questo effetto di "Stratiae il Dino Spaccastrati" una sola volta per turno.
  pt: |-
    2 monstros, incluindo um monstro Dinossauro
    Se este card for Invocado por Invocação-Link: você pode fazer com que este card ganhe ATK igual à metade do ATK original combinado dos monstros Dinossauro usados como Matéria Link. Durante sua Fase Principal: você pode Invocar por Invocação-Fusão 1 Monstro de Fusão Dinossauro do seu Deck Adicional, ao banir suas matérias do seu campo ou Cemitério e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional pelo resto deste turno, exceto monstros Dinossauro. Você só pode usar este efeito de "Stratiae, o Dino Stratasmagador" uma vez por turno.
  ja: |-
    恐竜族モンスターを含むモンスター２体
    このカード名の②の効果は１ターンに１度しか使用できない。①：このカードがＬ召喚した場合に発動できる。このカードの攻撃力は、そのＬ素材とした恐竜族モンスターの元々の攻撃力を合計した数値の半分だけアップする。②：自分メインフェイズに発動できる。自分のフィールド・墓地のモンスターを融合素材として除外し、恐竜族の融合モンスター１体を融合召喚する。この効果の発動後、ターン終了時まで自分は恐竜族モンスターしかＥＸデッキから特殊召喚できない。
  ko:
  zh-TW:
  zh-CN: |-
    包含恐龙族怪兽在内的怪兽2只
    此卡名的②效果1回合仅可使用1次。①：此卡连接召唤的情况下可以发动。此卡的攻击力上升相当于作为其连接素材的、恐龙族怪兽的原本攻击力的合计数值的一半。②：在自己的主要阶段可以发动。将自己场上・墓地的怪兽作为融合素材除外，将1只恐龙族融合怪兽融合召唤。此效果发动后，直至回合结束时为止，自己从额外牌组仅可特殊召唤恐龙族怪兽。
