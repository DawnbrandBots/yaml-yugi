  en: |-
    You can discard 1 other card; Special Summon this card from your hand. If this card is Special Summoned: You can add 1 "Sun God" card from your Deck to your hand, except "The Sun God's Poet - Helpoemer", then if your opponent's LP are at least 2000 higher than yours, you can discard 1 random card from their hand. During the End Phase, if "The Immortal Sun God" was sent to your GY this turn: You can add this card from your GY to your hand. You can only use each effect of "The Sun God's Poet - Helpoemer" once per turn.
