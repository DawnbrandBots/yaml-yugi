  en: |-
    You can reveal this card in your hand; Special Summon 1 "Winter Raven" monster from your hand, except "Anu, Knight of the Winter Raven". During the Main Phase (Quick Effect): You can target 1 "Winter Raven" monster you control; place it face-up in its owner's Spell & Trap Zone as a Continuous Spell, and if you do, Special Summon 1 "Winter Raven" monster from your hand or GY, except "Anu, Knight of the Winter Raven". You can only use each effect of "Anu, Knight of the Winter Raven" once per turn.
