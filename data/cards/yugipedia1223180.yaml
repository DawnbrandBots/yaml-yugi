  en: |-
    You can Ritual Summon this card with "Reindsurm Conquest". When your opponent activates a monster effect in the field or GY and you control this Ritual Summoned card (Quick Effect): You can negate the activation, then you can shuffle 1 monster your opponent controls and 1 monster in their GY into the Deck, also if either of them was a Dragon monster, double this card's ATK. If this card and a LIGHT "Reindsurm" monster are in your GY: You can add this card to your hand. You can only use each effect of "Reindsurm Giriakarma" once per turn.
