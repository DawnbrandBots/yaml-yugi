text:
  en: |-
    2+ monsters, including an "Unchained Soul" monster
    During your End Phase: You can target up to 2 Fiend monsters in your GY that were destroyed and sent there this turn; Special Summon them, but you cannot Special Summon, except Fiend monsters, while you control either of those face-up monsters. If this card on the field would be destroyed by battle or card effect, you can destroy 1 face-up card on either field instead. You can only use each effect of "Unchained Enma Lord Yama" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「破械神」モンスターを含むモンスター２体以上
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分エンドフェイズに、このターンに破壊された自分の墓地の悪魔族モンスターを２体まで対象として発動できる。そのモンスターを特殊召喚する。この効果で特殊召喚したモンスターが自分フィールドに表側表示で存在する限り、自分は悪魔族モンスターしか特殊召喚できない。②：フィールドのこのカードが戦闘・効果で破壊される場合、代わりに自分か相手のフィールドの表側表示カード１枚を破壊できる。
  ko: |-
    "언체인드소울" 몬스터를 포함하는 몬스터 2장 이상
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 엔드 페이즈에, 이 턴에 파괴된 자신 묘지의 악마족 몬스터를 2장까지 대상으로 하고 발동할 수 있다. 그 몬스터를 특수 소환한다. 이 효과로 특수 소환한 몬스터가 자신 필드에 앞면 표시로 존재하는 한, 자신은 악마족 몬스터밖에 특수 소환할 수 없다. ②: 필드의 이 카드가 전투 / 효과로 파괴될 경우, 대신에 자신이나 상대의 필드의 앞면 표시 카드 1장을 파괴할 수 있다.
  zh-TW:
  zh-CN: |-
    包含“破械神”怪兽在内的怪兽2只以上
    此卡名的①②效果1回合仅可各使用1次。①：在自己的结束阶段，以在此回合被破坏的、自己墓地的最多2只恶魔族怪兽为对象可以发动。将该怪兽特殊召唤。只要以此效果特殊召唤的怪兽以表侧表示存在于自己场上，自己仅可特殊召唤恶魔族怪兽。②：场上的此卡将被战斗・效果破坏的情况下，作为代替可将自己或对手场上的1张表侧表示卡破坏。
