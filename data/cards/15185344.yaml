  es: Siclavee Coronado
  fr: Siclavee à Couronne
  it: Siclavee Incoronato
  pt: Siclavee Coroado
  ja: <ruby>燦<rt>さん</rt></ruby><ruby>冠<rt>かん</rt></ruby><ruby>乗<rt>じょう</rt></ruby><ruby>騎<rt>き</rt></ruby>シックラヴィー
