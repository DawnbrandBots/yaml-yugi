text:
  en: |-
    During the End Phase, if a monster(s) was destroyed by battle this turn: You can Special Summon this card from your hand or GY, and if "Invincible Demise Lord" was destroyed by battle this turn, this card's original ATK becomes 3000, also it cannot be destroyed by card effects. During your Main Phase: You can reveal cards in your Deck, including "Slash Draw", equal to the number of cards your opponent controls +1 and place those revealed cards on top of the Deck in any order. You can only use each effect of "Invincible Demise Lord" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このターンにモンスターが戦闘で破壊されている場合、エンドフェイズに発動できる。このカードを手札・墓地から特殊召喚する。このターンに「不死のデスロード」が戦闘で破壊されている場合、この効果で特殊召喚したこのカードは、元々の攻撃力が３０００になり、効果では破壊されない。②：自分メインフェイズに発動できる。相手フィールドのカードの数＋１枚だけ、デッキから「一撃必殺！居合いドロー」を含むカードを相手に見せ、好きな順番でデッキの上に置く。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 턴에 몬스터가 전투로 파괴되어 있을 경우, 엔드 페이즈에 발동할 수 있다. 이 카드를 패 / 묘지에서 특수 소환한다. 이 턴에 "불사의 데스로드"가 전투로 파괴되어 있을 경우, 이 효과로 특수 소환한 이 카드는, 원래 공격력이 3000 이 되고, 효과로는 파괴되지 않는다. ②: 자신 메인 페이즈에 발동할 수 있다. 상대 필드의 카드의 수 ＋1장만, 덱에서 "일격필살! 슬래시 드로우"를 포함하는 카드를 상대에게 보여주고, 좋아하는 순서대로 덱 위에 놓는다.
