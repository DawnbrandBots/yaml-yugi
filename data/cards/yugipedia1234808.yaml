  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：以自己墓地・除外状态的1只“神鹰”怪兽或“亚马逊”怪兽为对象可以发动。将该怪兽特殊召唤。然后，可根据自己场上的“神鹰女郎”及“亚马逊”怪兽的数量从以下效果中挑选1个适用。
    ●1只以上：从牌组将1张“诱惑的镜壁”以表侧表示放在自己的魔法与陷阱区域。
    ●2只以上：获得对手场上的1只怪兽的控制权。
    ●3只以上：将对手场上的怪兽全部破坏。
