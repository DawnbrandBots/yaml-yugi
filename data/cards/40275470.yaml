  zh-TW:
  zh-CN: 人造人－念力能量震慑者
text:
  en: |-
    This card's name becomes "Jinzo" while on the field or in the GY. If this card is Normal or Special Summoned: You can destroy all Traps your opponent controls (if face-down, reveal it), then this card gains 300 ATK for each card destroyed. You can only use this effect of "Jinzo - Energy Shocker" once per turn. While you have another monster that mentions "Dark Time Wizard" in your field or GY, your opponent cannot activate Trap Cards or effects.
  de: |-
    Der Name dieser Karte wird zu „Jinzo“, solange sie auf dem Spielfeld oder im Friedhof liegt. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst alle Fallen zerstören, die dein Gegner kontrolliert (falls verdeckt, zeige sie vor), dann erhält diese Karte für jede zerstörte Karte 300 ATK. Du kannst diesen Effekt von „Jinzo - Energieschocker“ nur einmal pro Spielzug verwenden. Solange du ein anderes Monster, das „Dunkler Zeitzauberer“ erwähnt, auf deiner Spielfeldseite oder in deinem Friedhof hast, kann dein Gegner weder Fallenkarten noch Falleneffekte aktivieren.
  es: |-
    El nombre de esta carta se convierte en "Jinzo" mientras está en el Campo o en el Cementerio. Si esta carta es Invocada de Modo Normal o Especial: puedes destruir todas las Trampas que controle tu adversario (si está boca abajo, muéstrala), y después esta carta gana 300 ATK por cada carta destruida. Sólo puedes usar este efecto de "Jinzo - Golpeador Energético" una vez por turno. Mientras tienes otro monstruo en tu Campo o Cementerio que mencione "Mago del Tiempo Oscuro", tu adversario no puede activar Cartas de Trampa o sus efectos.
  fr: |-
    Le nom de cette carte devient "Jinzo" tant qu'elle est sur le Terrain ou dans le Cimetière. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez détruire tous les Pièges contrôlés par votre adversaire (s'ils sont face verso, révélez-les), puis cette carte gagne 300 ATK pour chaque carte détruite. Vous ne pouvez utiliser cet effet de "Choc Énergétique Jinzo" qu'une fois par tour. Tant que vous avez un autre monstre qui mentionne "Magicien du Temps des Ténèbres" dans votre Terrain ou Cimetière, votre adversaire ne peut activer ni de Cartes Piège ni d'effets de Piège.
  it: |-
    Il nome di questa carta diventa "Jinzo" mentre è sul Terreno o nel Cimitero. Se questa carta viene Evocata Normalmente o Specialmente: puoi distruggere tutte le Trappole controllate dal tuo avversario (se coperte, rivelale), poi questa carta guadagna 300 ATK per ogni carta distrutta. Puoi utilizzare questo effetto di "Jinzo - Fulminatore Energia" una sola volta per turno. Mentre hai un altro mostro che menziona "Stregone del Tempo Oscuro" nel tuo Terreno o Cimitero, il tuo avversario non può attivare le Carte Trappola o i loro effetti.
  pt: |-
    O nome deste card se torna "Jinzo" enquanto estiver no campo ou no Cemitério. Se este card for Invocado por Invocação-Normal ou Especial: você pode destruir todas as Armadilhas que seu oponente controla (se estiverem com a face para baixo, revele-as) e, depois, este card ganha 300 de ATK para cada card destruído. Você só pode usar este efeito de "Jinzo - Choque de Energia" uma vez por turno. Enquanto você tiver outro monstro que mencione "Mago do Tempo Negro" no seu campo ou Cemitério, seu oponente não pode ativar Cards de Armadilha ou seus efeitos.
  ja: |-
    このカード名の②の効果は１ターンに１度しか使用できない。①：このカードのカード名は、フィールド・墓地に存在する限り「人造人間－サイコ・ショッカー」として扱う。②：このカードが召喚・特殊召喚した場合に発動できる。相手フィールドの罠カードを全て破壊する（裏側表示カードはめくって確認する）。その後、このカードの攻撃力は破壊した数×３００アップする。③：このカードを除く、「時の黒魔術師」のカード名が記されたモンスターが自分のフィールドか墓地に存在する限り、相手は罠カードの効果を発動できない。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的②效果1回合仅可使用1次。①：此卡只要存在于场上・墓地，卡名视为“人造人－念力震慑者”。②：此卡召唤・特殊召唤的情况下可以发动。将对手场上的陷阱卡全部破坏（里侧表示卡翻开确认）。然后，此卡的攻击力上升所破坏数量×300的数值。③：只要自己场上或墓地存在除此卡以外的、记载有“时间黑魔术师”卡名的怪兽，对手不可发动陷阱卡的效果。
