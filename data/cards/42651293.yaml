text:
  en: |-
    If a monster(s) is Tributed (except during the Damage Step): You can Special Summon this card from your hand and 1 "Rikka" monster from your Deck, except "Primrose the Twin Rikka Fairy", in Defense Position, also you cannot Special Summon for the rest of this turn, except Plant monsters. You can target 1 Plant monster you control; increase or decrease its Level by 2. During your opponent's Main Phase, you can (Quick Effect): Immediately after this effect resolves, Xyz Summon 1 Plant Xyz Monster. You can only use each effect of "Primrose the Twin Rikka Fairy" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：モンスターがリリースされた場合に発動できる。「六花双精プリムローズ」以外のデッキの「六花」モンスター１体と、手札のこのカードを守備表示で特殊召喚する。この効果の発動後、ターン終了時まで自分は植物族モンスターしか特殊召喚できない。②：自分フィールドの植物族モンスター１体を対象として発動できる。そのモンスターのレベルを２つ上げるか下げる。③：相手メインフェイズに発動できる。植物族Ｘモンスター１体のＸ召喚を行う。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：有怪兽被解放的情况下可以发动。将“六花双精报春蔷薇”以外的、牌组的1只“六花”怪兽，和手牌的此卡以守备表示特殊召唤。此效果发动后，直至回合结束时为止自己仅可特殊召唤植物族怪兽。②：以自己场上的1只植物族怪兽为对象可以发动。该怪兽的等级上升或下降2。③：在对手的主要阶段可以发动。进行1只植物族超量怪兽的超量召唤。
