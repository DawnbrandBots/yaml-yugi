text:
  en: |-
    Each player can only Special Summon non-"Number" monsters from the Extra Deck twice per turn while this card is face-up on the field. You can only use each of the following effects of "Seventh Barian's" once per turn. During your Main Phase: You can add 1 "Umbral Horror" monster from your Deck to your hand, then discard 1 card. During the End Phase: Each player takes 400 damage for each Xyz Monster on the field.
  de:
