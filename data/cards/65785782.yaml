name:
  en: Call of Atlantis
  de: Ruf von Atlantis
  es: Llamada de Atlántida
  fr: Appel d'Atlantis
  it: Richiamo di Atlantide
  pt: Chamado da Atlântida
  ja: <ruby>呼応する伝説の都<rt>アトランティス・コール</rt></ruby>
  ja_romaji: Atorantisu Kōru
  ko: 아틀란티스 콜
  ko_rr:
  zh-TW:
  zh-CN: 响应的亚特兰蒂斯
text:
  en: |-
    Add 1 monster that mentions "Atlantis, City of the Sea Dragon" from your Deck to your hand, then if you control "Atlantis, City of the Sea Dragon", you can negate the effects of 1 Effect Monster your opponent controls, until the end of this turn. If you control "Umi": You can banish this card from your GY; WATER monsters you control gain 500 ATK/DEF. You can only use each effect of "Call of Atlantis" once per turn.
  de: |-
    Füge deiner Hand 1 Monster, das „Atlantis, Stadt des Seedrachen“ erwähnt, von deinem Deck hinzu, dann, falls du „Atlantis, Stadt des Seedrachen“ kontrollierst, kannst du bis zum Ende dieses Spielzugs die Effekte von 1 Effektmonster annullieren, das dein Gegner kontrolliert. Falls du „Umi“ kontrollierst: Du kannst diese Karte von deinem Friedhof verbannen; WASSER Monster, die du kontrollierst, erhalten 500 ATK/DEF. Du kannst jeden Effekt von „Ruf von Atlantis“ nur einmal pro Spielzug verwenden.
  es: |-
    Añade a tu mano 1 monstruo en tu Deck que mencione "Atlántida, Ciudad del Dragón Marino" y después, si controlas "Atlántida, Ciudad del Dragón Marino", puedes negar los efectos de 1 Monstruo de Efecto que controle tu adversario, hasta el final de este turno. Si controlas "Umi": puedes desterrar esta carta en tu Cementerio; los monstruos de AGUA que controlas ganan 500 ATK/DEF. Sólo puedes usar cada efecto de "Llamada de Atlántida" una vez por turno.
  fr: |-
    Ajoutez 1 monstre qui mentionne "Atlantis, Cité du Dragon des Mers" depuis votre Deck à votre main, puis si vous contrôlez "Atlantis, Cité du Dragon des Mers", vous pouvez annuler les effets d'1 Monstre à Effet contrôlé par votre adversaire jusqu'à la fin de ce tour. Si vous contrôlez "Umi" : vous pouvez bannir cette carte depuis votre Cimetière ; les monstres EAU que vous contrôlez gagnent 500 ATK/DEF. Vous ne pouvez utiliser chaque effet de "Appel d'Atlantis" qu'une fois par tour.
  it: |-
    Aggiungi 1 mostro che menziona "Atlantide, Città del Drago del Mare" dal tuo Deck alla tua mano, poi se controlli "Atlantide, Città del Drago del Mare", puoi annullare gli effetti di 1 Mostro con Effetto controllato dal tuo avversario, fino alla fine di questo turno. Se controlli "Umi": puoi bandire questa carta dal tuo Cimitero; i mostri ACQUA che controlli guadagnano 500 ATK/DEF. Puoi utilizzare ogni effetto di "Richiamo di Atlantide" una sola volta per turno.
  pt: |-
    Adicione 1 monstro que mencione "Atlântida, a Cidade do Dragão Marinho" do seu Deck à sua mão e, depois, se você controlar "Atlântida, a Cidade do Dragão Marinho", você pode negar os efeitos de 1 Monstro de Efeito que seu oponente controla, até o final deste turno. Se você controlar "Umi": você pode banir este card do seu Cemitério; monstros de ÁGUA que você controla ganham 500 de ATK/DEF. Você só pode usar cada efeito de "Chamado da Atlântida" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：デッキから「竜都アトランティス」のカード名が記されたモンスター１体を手札に加える。自分フィールドに「竜都アトランティス」が存在する場合、さらに相手フィールドの効果モンスター１体の効果をターン終了時まで無効にできる。②：自分フィールドに「海」が存在する場合、墓地のこのカードを除外して発動できる。自分フィールドの全ての水属性モンスターの攻撃力・守備力は５００アップする。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 덱에서 "용도 아틀란티스"의 카드명이 쓰여진 몬스터 1장을 패에 넣는다. 자신 필드에 "용도 아틀란티스"가 존재할 경우, 추가로 상대 필드의 효과 몬스터 1장의 효과를 턴 종료시까지 무효로 할 수 있다. ②: 자신 필드에 "바다"가 존재할 경우, 묘지의 이 카드를 제외하고 발동할 수 있다. 자신 필드의 모든 물 속성 몬스터의 공격력 / 수비력은 500 올린다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将1只记载有“龙都 亚特兰蒂斯”卡名的怪兽加入手牌。自己场上存在“龙都 亚特兰蒂斯”的情况下，进而可将对手场上的1只效果怪兽的效果直至回合结束时为止无效。②：自己场上存在“海”的情况下，将墓地的此卡除外可以发动。自己场上的所有水属性怪兽的攻击力・守备力上升500。
