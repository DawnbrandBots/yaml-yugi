text:
  en: |-
    This card's name becomes "Umi" while on the field. You can only use each of the following effects of "Levia-Dragon of Atlantis - Daedalus" once per turn. If you control "Atlantis, City of the Sea Dragon" or "Umi": You can Special Summon this card from your hand. You can send up to 3 face-up "Umi" you control to the GY; add that many cards that mention "Atlantis, City of the Sea Dragon" from your Deck to your hand, except Level 7 monsters, then you can send 1 card on the field to the GY.
  de: |-
    Der Name dieser Karte wird zu „Umi“, solange sie auf dem Spielfeld liegt. Du kannst jeden der folgenden Effekte von „Levia-Drache von Atlantis - Daedalus“ nur einmal pro Spielzug verwenden. Falls du „Atlantis, Stadt des Seedrachen“ oder „Umi“ kontrollierst: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören. Du kannst bis zu 3 offene „Umi“, die du kontrollierst, auf den Friedhof legen; füge deiner Hand ebenso viele Karten, die „Atlantis, Stadt des Seedrachen“ erwähnen, von deinem Deck hinzu, außer Monstern der Stufe 7, dann kannst du 1 Karte vom Spielfeld auf den Friedhof legen.
  es: |-
    El nombre de esta carta se convierte en "Umi" mientras esté en el Campo. Sólo puedes usar cada uno de los siguientes efectos de "Levia-Dragón de Atlántida - Dédalo" una vez por turno. Si controlas "Atlántida, Ciudad del Dragón Marino" o "Umi": puedes Invocar esta carta de Modo Especial desde tu mano. Puedes mandar al Cementerio hasta 3 "Umi" boca arriba que controles; añade a tu mano ese número de cartas en tu Deck que mencionen "Atlántida, Ciudad del Dragón Marino", excepto monstruos de Nivel 7, y después puedes mandar al Cementerio 1 carta en el Campo.
  fr: |-
    Le nom de cette carte devient "Umi" tant qu'elle est sur le Terrain. Vous ne pouvez utiliser chacun des effets suivants de "Dragon-Levia d'Atlantis - Dédale" qu'une fois par tour. Si vous contrôlez "Atlantis, Cité du Dragon des Mers" ou "Umi" : vous pouvez Invoquer Spécialement cette carte depuis votre main. Vous pouvez envoyer max. 3 "Umi" face recto que vous contrôlez au Cimetière ; ajoutez autant de cartes qui mentionnent "Atlantis, Cité du Dragon des Mers" (monstres de Niveau 7 exclus) depuis votre Deck à votre main, puis vous pouvez envoyer 1 carte sur le Terrain au Cimetière.
  it: |-
    Il nome di questa carta diventa "Umi" mentre è sul Terreno. Puoi utilizzare ognuno dei seguenti effetti di "Levia-Drago di Atlantide - Dedalo" una sola volta per turno. Se controlli "Atlantide, Città del Drago del Mare" o "Umi": puoi Evocare Specialmente questa carta dalla tua mano. Puoi mandare fino a 3 "Umi" scoperti che controlli al Cimitero; aggiungi quel numero di carte che menzionano "Atlantide, Città del Drago del Mare" dal tuo Deck alla tua mano, eccetto mostri di Livello 7, poi puoi mandare al Cimitero 1 carta sul Terreno.
  pt: |-
    O nome deste card se torna "Umi" enquanto estiver no campo. Você só pode usar cada um dos seguintes efeitos de "Levia-Dragão da Atlântida - Daedalus" uma vez por turno. Se você controlar "Atlântida, a Cidade do Dragão Marinho" ou "Umi": você pode Invocar este card por Invocação-Especial da sua mão. Você pode enviar até 3 "Umi" com a face para cima que você controla para o Cemitério; adicione esse número de cards que mencionem "Atlântida, a Cidade do Dragão Marinho" do seu Deck à sua mão, exceto monstros de Nível 7 e, depois, você pode enviar 1 card no campo para o Cemitério.
  ja: |-
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドに「竜都アトランティス」か「海」が存在する場合に発動できる。このカードを手札から特殊召喚する。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：自分フィールドの表側表示の「海」を３枚まで墓地へ送って発動できる。その数だけ、レベル７モンスターを除く、「竜都アトランティス」のカード名が記されたカードをデッキから手札に加える。その後、フィールドのカード１枚を墓地へ送る事ができる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①③效果1回合仅可各使用1次。①：自己场上存在“龙都 亚特兰蒂斯”或“海”的情况下可以发动。从手牌将此卡特殊召唤。②：此卡只要存在于怪兽区域，卡名视为“海”。③：将自己场上的最多3张表侧表示的“海”送至墓地可以发动。依其数量，从牌组将除等级7怪兽以外的、记载有“龙都 亚特兰蒂斯”卡名的卡加入手牌。然后，可将场上的1张卡送至墓地。
