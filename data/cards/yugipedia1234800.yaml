  en: |-
    This card's name becomes "Harpie Lady" while on the field or in the GY. You can only use each of the following effects of "Harpie Lady - Alluring Dance" once per turn. During the Main Phase, if this card is in your hand (Quick Effect): You can target 1 EARTH or WIND monster you control; return it to the hand/Extra Deck, and if you do, Special Summon this card. If this card is Normal or Special Summoned: You can add 1 Spell/Trap from your Deck to your hand that mentions "Harpie Lady".
