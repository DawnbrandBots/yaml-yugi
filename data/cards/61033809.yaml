text:
  en: |-
    You can reveal this card in your hand; banish it (face-down), and if you do, add 1 of your face-down banished "Xenovader△" cards to your hand, except a Level 5 monster. You can only use this effect of "Sky Thunder Xenovader△ Yomi" once per turn. If this card is Normal or Special Summoned: Banish (face-down) the top 5 cards of your Deck. Once per turn, when your opponent activates a monster effect (Quick Effect): You can shuffle 1 of your face-down banished "Xenovader△" monsters with the same Attribute into the Deck, and if you do, negate the activation.
