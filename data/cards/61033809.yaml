  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：手札のこのカードを相手に見せて発動できる。このカードを裏側で除外し、レベル５モンスター以外の自分の除外状態（裏側）の「異解△」カード１枚を手札に加える。②：このカードが召喚・特殊召喚した場合に発動する。自分のデッキの上からカード５枚を裏側で除外する。③：１ターンに１度、相手がモンスターの効果を発動した時に発動できる。そのモンスターと同じ属性の自分の除外状態（裏側）の「異解△」モンスター１体をデッキに戻し、その発動を無効にする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①效果1回合仅可使用1次。①：向对手出示手牌的此卡可以发动。将此卡以里侧除外，将等级5怪兽以外的、自己除外状态（里侧）的1张“异解△”卡加入手牌。②：此卡召唤・特殊召唤的情况下发动。从自己牌组上面将5张卡以里侧除外。③：1回合1次，对手发动怪兽的效果时可以发动。将与该怪兽相同属性的、自己除外状态（里侧）的1只“异解△”怪兽放回牌组，将该发动无效。
