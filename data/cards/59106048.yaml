text:
  en: |-
    If this card is Normal or Special Summoned, and you control "Regulus, the Prince of Endymion" or a "Witchcrafter" monster, except "Witchcrafter Seed": You can target 1 face-up card on the field; return it to the hand. You can banish this card from your GY; reveal any number of cards in your hand, including a Spell, shuffle them into the Deck, then draw cards equal to the number shuffled. You can only use each effect of "Witchcrafter Seed" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合、自分フィールドに「ウィッチクラフト・シード」以外の「ウィッチクラフト」モンスターか「聖月の皇太子レグルス」が存在していれば、フィールドの表側表示カード１枚を対象として発動できる。そのカードを手札に戻す。②：墓地のこのカードを除外して発動できる。魔法カードを含む手札のカードを任意の数だけ相手に見せ、デッキに戻す。その後、自分は戻した数だけドローする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下，如果自己场上存在“魔女工艺・育种希德”以外的“魔女工艺”怪兽或“恩底弥翁之圣月皇太子 雷格鲁斯”，则以场上的1张表侧表示卡为对象可以发动。将该卡放回手牌。②：将墓地的此卡除外可以发动。将包含魔法卡在内的、手牌任意数量的卡出示给对手并放回牌组。然后，自己依放回的数量抽牌。
