text:
  en: |-
    Cannot be Normal Summoned/Set. Must be Special Summoned (from your hand) while a monster that cannot be Normal Summoned/Set is face-up on the field. You can only Special Summon "Cartoon Shade" once per turn this way. If this card is Special Summoned: You can add 1 monster with 2000 ATK or DEF that cannot be Normal Summoned/Set from your Deck to your hand. If this card on the field is Tributed: You can target 1 card on the field, or target 2 if you control a monster with 2000 ATK or DEF; return them to the hand.
  de: |-
    Kann nicht als Normalbeschwörung beschworen/gesetzt werden. Muss als Spezialbeschwörung (von deiner Hand) beschworen werden, solange ein Monster, das nicht als Normalbeschwörung beschworen/gesetzt werden kann, offen auf dem Spielfeld liegt. Du kannst „Cartoon-Schatten“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 Monster mit 2000 ATK oder DEF, das nicht als Normalbeschwörung beschworen/gesetzt werden kann, von deinem Deck hinzufügen. Falls diese Karte vom Spielfeld als Tribut angeboten wird: Du kannst 1 Karte auf dem Spielfeld wählen oder 2, falls du ein Monster mit 2000 ATK oder DEF kontrollierst; gib sie auf die Hand zurück.
  es: |-
    No puede ser Invocado de Modo Normal/Colocado. Debe ser Invocado de Modo Especial (desde tu mano) mientras un monstruo que no pueda ser Invocado de Modo Normal/Colocado esté boca arriba en el Campo. Sólo puedes Invocar de Modo Especial "Sombra Cartoon" una vez por turno de esta forma. Si esta carta es Invocada de Modo Especial: puedes añadir a tu mano 1 monstruo en tu Deck con 2000 ATK o DEF que no pueda ser Invocado de Modo Normal/Colocado. Si esta carta en el Campo es Sacrificada: puedes seleccionar 1 carta en el Campo, o seleccionar 2 si controlas un monstruo con 2000 ATK o DEF; devuélvelas a la mano.
  fr: |-
    Ni Invocable Normalement ni Posable Normalement. Uniquement Invocable Spécialement (depuis votre main) tant qu'un monstre qui ne peut pas être Invoqué/Posé Normalement est face recto sur le Terrain. Vous ne pouvez Invoquer Spécialement "Ombre Cartoon" qu'une fois par tour de cette façon. Si cette carte est Invoquée Spécialement : vous pouvez ajouter 1 monstre avec 2000 ATK ou DEF qui ne peut pas être Invoqué/Posé Normalement depuis votre Deck à votre main. Si cette carte sur le Terrain est Sacrifiée : vous pouvez cibler 1 carte sur le Terrain, ou ciblez-en 2 si vous contrôlez un monstre avec 2000 ATK ou DEF ; renvoyez-les à la main.
  it: |-
    Non può essere Evocato Normalmente/Posizionato. Deve essere Evocato Specialmente (dalla tua mano) mentre un mostro che non può essere Evocato Normalmente/Posizionato è scoperto sul Terreno. Puoi Evocare Specialmente "Ombra Cartoon" una sola volta per turno in questo modo. Se questa carta viene Evocata Specialmente: puoi aggiungere 1 mostro con ATK o DEF 2000 che non può essere Evocato Normalmente/Posizionato dal tuo Deck alla tua mano. Se questa carta sul Terreno viene offerta come Tributo: puoi scegliere come bersaglio 1 carta sul Terreno, o sceglierne come bersaglio 2 se controlli un mostro con ATK o DEF 2000; falle ritornare nella mano.
  pt: |-
    Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial (da sua mão) enquanto um monstro que não pode ser Invocado por Invocação-Normal/Baixado estiver com a face para cima no campo. Você só pode Invocar "Sombra Cartoon" por Invocação-Especial uma vez por turno desta forma. Se este card for Invocado por Invocação-Especial: você pode adicionar 1 monstro com 2000 de ATK ou DEF que não possa ser Invocado por Invocação-Normal/Baixado do seu Deck à sua mão. Se este card no campo for oferecido como Tributo: você pode escolher 1 card no campo, ou escolher 2 se você controlar um monstro com 2000 de ATK ou DEF; devolva-os para a mão.
  ja: |-
    このカードは通常召喚できない。「カートゥーン・シェード」は１ターンに１度、通常召喚できないモンスターがフィールドに表側表示で存在する場合のみ特殊召喚できる。①：このカードが特殊召喚した場合に発動できる。攻撃力か守備力が２０００の通常召喚できないモンスター１体をデッキから手札に加える。②：フィールドのこのカードがリリースされた場合、フィールドのカード１枚を対象として発動できる（自分フィールドに攻撃力か守備力が２０００のモンスターが存在する場合、この効果の対象を２枚にできる）。そのカードを手札に戻す。
  ko:
  zh-TW:
  zh-CN: |-
    此卡不可通常召唤。“剪影卡通”1回合1次，仅可在有不可通常召唤的怪兽以表侧表示存在于场上的情况下特殊召唤。①：此卡特殊召唤的情况下可以发动。从牌组将1只攻击力或守备力为2000的、不可通常召唤的怪兽加入手牌。②：场上的此卡被解放的情况下，以场上的1张卡为对象可以发动（自己场上存在攻击力或守备力为2000的怪兽的情况下，可将此效果的对象改成2张）。将该卡放回手牌。
