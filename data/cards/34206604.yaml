text:
  en: |-
    Pay 1000 Life Points to Special Summon 1 level 6 or lower Fusion Monster from your Extra Deck in face-up Attack or Defense Position. That Fusion Monster cannot attack your opponent's Life Points directly, and is returned to your Extra Deck at the end of the turn.
  de: |-
    Du kannst 1000 LP zahlen; beschwöre 1 Fusionsmonster der Stufe 6 oder niedriger als Spezialbeschwörung von deinem Extra Deck, aber es kann nicht direkt angreifen, zusätzlich lege es während der End Phase ins Extra Deck zurück.
  es: |-
    Puedes pagar 1000 LP; Invoca de Modo Especial 1 Monstruo de Fusión de Nivel 6 o menor desde tu Deck Extra, pero éste no puede atacar directamente, y además devuélvelo al Deck Extra durante la End Phase.
  fr: |-
    Vous pouvez payer 1000 LP ; Invoquez Spécialement 1 Monstre Fusion de max. Niveau 6 depuis votre Extra Deck, mais il ne peut pas attaquer directement, et aussi, renvoyez-le à l'Extra Deck durant la End Phase.
  it: |-
    Puoi pagare 1000 LP; Evoca Specialmente 1 Mostro Fusione di Livello 6 o inferiore dal tuo Extra Deck, ma esso non può attaccare direttamente, inoltre fallo ritornare nell'Extra Deck durante la End Phase.
  pt: |-
    Você pode pagar 1000 PV; Invoque por Invocação-Especial 1 Monstro de Fusão de Nível 6 ou menos do seu Deck Adicional, mas ele não pode atacar diretamente e, além disso, devolva-o para o Deck Adicional durante a Fase Final.
  ja: |-
    １０００ライフポイントを払う事で、融合デッキからレベル６以下の融合モンスター１体を特殊召喚する。この融合モンスターは相手プレイヤーに直接攻撃する事はできず、ターン終了時に融合デッキに戻る。
  ko: |-
    1000 라이프 포인트를 지불하는 것으로, 융합 덱에서 레벨 6 이하의 융합 몬스터 1장을 특수 소환한다. 이 융합 몬스터는 상대 플레이어에게 직접 공격할 수 없으며, 턴 종료시에 융합 덱으로 되돌아간다.
  zh-TW:
  zh-CN: |-
    可以通过支付1000基本分，从融合卡组把1只6星以下的融合怪兽特殊召唤。这融合怪兽不能向对方玩家直接攻击，回合结束时回到融合卡组。
