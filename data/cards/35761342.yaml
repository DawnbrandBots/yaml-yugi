text:
  en: |-
    If this card is Normal or Special Summoned: Banish (face-down) the top card of your Deck. You can only use each of the following effects of "Xenovader△ of Emptiness Gehenna" once per turn. If this card is in your hand and you control no monsters: You can Special Summon this card. During your Main Phase: You can add up to 2 of your face-down banished "Xenovader△" monsters with different names to your hand, except "Xenovader△ of Emptiness Gehenna", also you cannot activate cards or effects for the rest of this turn, except "Xenovader△" cards or effects.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在し、自分フィールドにモンスターが存在しない場合に発動できる。このカードを特殊召喚する。②：このカードが召喚・特殊召喚した場合に発動する。自分のデッキの上からカード１枚を裏側で除外する。③：自分メインフェイズに発動できる。「虚ノ異解△ゲヘナ」以外の自分の除外状態（裏側）の「異解△」モンスターを２体まで手札に加える（同名カードは１枚まで）。このターン、自分は「異解△」カード以外のカードの効果を発動できない。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①③效果1回合仅可各使用1次。①：此卡存在于手牌，且自己场上不存在怪兽的情况下可以发动。将此卡特殊召唤。②：此卡召唤・特殊召唤的情况下发动。从自己牌组上面将1张卡以里侧除外。③：在自己的主要阶段可以发动。将“虚之异解△盖赫纳”以外的、自己除外状态（里侧）的最多2只“异解△”怪兽加入手牌（同名卡最多1张）。此回合，自己不可发动“异解△”卡以外的卡的效果。
