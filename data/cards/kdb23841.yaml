text:
  en: |-
    "The Winged Dragon of Ra" + 3 "Sun God" monsters
    Unaffected by other cards' effects. Once per turn, during the Main Phase (Quick Effect): You can discard any number of "Sun God" cards, then choose that number of your opponent's used Main Monster Zones; your opponent must send monsters in those zones to the GY. When an attack is declared involving this card: You can pay LP so that you only have 1 left; this card gains ATK/DEF equal to the LP paid and the total ATK of "Sun God" monsters in your GY.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「ラーの翼神竜」＋「太陽神」モンスター×３
    ①：フィールドのこのカードは他のカードの効果を受けない。②：１ターンに１度、自分・相手のメインフェイズに、手札から「太陽神」カードを任意の数だけ捨て、その数だけ使用している相手のメインモンスターゾーンを指定して発動できる。相手はそのゾーンのモンスターを墓地へ送らなければならない。③：このカードが戦闘を行う攻撃宣言時、１ＬＰになるようにＬＰを払って発動できる。このカードの攻撃力・守備力は、払った数値及び自分の墓地の「太陽神」モンスターの攻撃力の合計分アップする。
  ko:
  zh-TW:
  zh-CN: |-
    “拉之翼神龙”＋“太阳神”怪兽×3
    ①：场上的此卡不受其他卡的效果影响。②：1回合1次，在自己・对手的主要阶段，从手牌将任意数量的“太阳神”卡舍弃，依其数量指定使用中的对手的主要怪兽区域可以发动。对手必须将该区域的怪兽送至墓地。③：此卡进行战斗的攻击宣言时，支付LP直至变为1LP可以发动。此卡的攻击力・守备力上升相当于所支付的数值及自己墓地的“太阳神”怪兽的攻击力合计数值。
