name:
  en: Cyberse Contract Witch
  de: Cyberse-Vertrag-Hexe
  es: Bruja Ciberso Contratada
  fr: Sorcière du Contrat Cyberse
  it: Strega a Contratto Cyberso
  pt: Bruxa do Contrato Ciberso
  ja: サイバース・コントラクト・ウィッチ
  ja_romaji: Saibāsu Kontorakuto Witchi
  ko: 사이버스 콘트랙트 위치
  ko_rr:
  zh-TW:
  zh-CN: 电子界契约女巫
text:
  en: |-
    2 monsters with the same Type
    If this card is Link Summoned, or a monster(s) is Special Summoned to a zone(s) this card points to: You can send 1 Spell from your hand or face-up field to the GY; add 1 Ritual Monster from your Deck to your hand. You can target 1 Ritual, Fusion, Synchro, or Xyz Monster this card points to; Special Summon 1 monster from your GY with the same Type but a different card type (Ritual, Fusion, Synchro, or Xyz). You can only use each effect of "Cyberse Contract Witch" once per turn.
  de: |-
    2 Monster mit demselben Typ
    Falls diese Karte als Linkbeschwörung beschworen wird oder ein oder mehr Monster als Spezialbeschwörung in eine oder mehr Zonen, auf die diese Karte zeigt, beschworen werden: Du kannst 1 Zauber von deiner Hand oder offen von deiner Spielfeldseite auf den Friedhof legen; füge deiner Hand 1 Ritualmonster von deinem Deck hinzu. Du kannst 1 Ritual-, Fusions-, Synchro- oder Xyz-Monster wählen, auf das diese Karte zeigt; beschwöre 1 Monster mit demselben Typ, aber einem unterschiedlichen Kartentyp (Ritual, Fusion, Synchro oder Xyz) als Spezialbeschwörung von deinem Friedhof. Du kannst jeden Effekt von „Cyberse-Vertrag-Hexe“ nur einmal pro Spielzug verwenden.
  es: |-
    2 monstruos con el mismo Tipo
    Si esta carta es Invocada por Enlace, o uno o más monstruos son Invocados de Modo Especial a una o más zonas a las que apunte esta carta: puedes mandar al Cementerio 1 Mágica en tu mano o Campo boca arriba; añade a tu mano 1 Monstruo de Ritual en tu Deck. Puedes seleccionar 1 Monstruo de Ritual, Fusión, Sincronía o Xyz al que apunte esta carta; Invoca de Modo Especial, desde tu Cementerio, 1 monstruo con el mismo Tipo pero de un tipo diferente de carta (Ritual, Fusión, Sincronía o Xyz). Sólo puedes usar cada efecto de "Bruja Ciberso Contratada" una vez por turno.
  fr: |-
    2 monstres du même Type
    Si cette carte est Invoquée par Lien, ou un ou plusieurs monstres sont Invoqués Spécialement dans des zones pointées par cette carte : vous pouvez envoyer 1 Magie depuis votre main ou Terrain face recto au Cimetière ; ajoutez 1 Monstre Rituel depuis votre Deck à votre main. Vous pouvez cibler 1 Monstre Rituel, Fusion, Synchro ou Xyz pointé par cette carte ; Invoquez Spécialement 1 monstre depuis votre Cimetière du même Type mais de type de carte différent (Rituel, Fusion, Synchro ou Xyz). Vous ne pouvez utiliser chaque effet de "Sorcière du Contrat Cyberse" qu'une fois par tour.
  it: |-
    2 mostri con lo stesso Tipo
    Se questa carta viene Evocata Link, o uno o più mostri vengono Evocati Specialmente in una o più zone puntate da questa carta: puoi mandare 1 Magia dalla tua mano o Terreno scoperto al Cimitero; aggiungi 1 Mostro Rituale dal tuo Deck alla tua mano. Puoi scegliere come bersaglio 1 Mostro Rituale, Fusione, Synchro o Xyz puntato da questa carta; Evoca Specialmente dal tuo Cimitero 1 mostro con lo stesso Tipo ma con un diverso tipo di carta (Rituale, Fusione, Synchro o Xyz). Puoi utilizzare ogni effetto di "Strega a Contratto Cyberso" una sola volta per turno.
  pt: |-
    2 monstros com o mesmo Tipo
    Se este card for Invocado por Invocação-Link, ou um ou mais monstros forem Invocados por Invocação-Especial para uma ou mais zonas para as quais este card apontar: você pode enviar 1 Magia da sua mão ou do campo com a face para cima para o Cemitério; adicione 1 Monstro de Ritual do seu Deck à sua mão. Você pode escolher 1 Monstro de Ritual, de Fusão, Sincro ou Xyz para o qual este card apontar; Invoque por Invocação-Especial 1 monstro do seu Cemitério com o mesmo Tipo, mas um tipo de card diferente (Ritual, Fusão, Sincro ou Xyz). Você só pode usar cada efeito de "Bruxa do Contrato Ciberso" uma vez por turno.
  ja: |-
    同じ種族のモンスター２体
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがＬ召喚した場合、またはこのカードのリンク先にモンスターが特殊召喚された場合、自分の手札・フィールド（表側表示）から魔法カード１枚を墓地へ送って発動できる。デッキから儀式モンスター１体を手札に加える。②：このカードのリンク先の儀式・融合・Ｓ・Ｘモンスター１体を対象として発動できる。そのモンスターとは種類（儀式・融合・Ｓ・Ｘ）が異なり、種族が同じモンスター１体を自分の墓地から特殊召喚する。
  ko: |-
    같은 종족의 몬스터 2장
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 링크 소환했을 경우, 또는 이 카드의 링크 앞에 몬스터가 특수 소환되었을 경우, 자신의 패 / 필드(앞면 표시)에서 마법 카드 1장을 묘지로 보내고 발동할 수 있다. 덱에서 의식 몬스터 1장을 패에 넣는다. ②: 이 카드의 링크 앞의 의식 / 융합 / 싱크로 / 엑시즈 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터와는 종류(의식 / 융합 / 싱크로 / 엑시즈)가 다르고, 종족이 같은 몬스터 1장을 자신 묘지에서 특수 소환한다.
  zh-TW:
  zh-CN: |-
    相同种族的怪兽2只
    此卡名的①②效果1回合仅可各使用1次。①：此卡连接召唤的情况下，或有怪兽被特殊召唤至此卡连接端的情况下，从自己手牌・场上（表侧表示）将1张魔法卡送至墓地可以发动。从牌组将1只仪式怪兽加入手牌。②：以此卡连接端的1只仪式・融合・同步・超量怪兽为对象可以发动。从自己墓地将1只与该怪兽种类（仪式・融合・同步・超量）不同、种族相同的怪兽特殊召唤。
