text:
  en: |-
    You can Ritual Summon this card with any "Sennet" card. This card equipped with an Equip Card is unaffected by your opponent's activated effects. You can only use each of the following effects of "Sennetnakht Sphinx" once per turn. You can discard this card; add 1 "Sennet" card from your Deck to your hand, except "Sennetnakht Sphinx". (Quick Effect): You can send 1 face-up Normal Monster Card you control to the GY; change as many monsters your opponent controls as possible to face-down Defense Position, then you can Special Summon 1 Normal Monster from your GY.
