text:
  en: |-
    Once per turn, during the Standby Phase: Roll a six-sided die, and place counters on this card (max. 6), up to the result. When a monster effect is activated on your opponent's field, or once per battle, during damage calculation, if your opponent's monster attacks: You can remove 1 counter from this card, then target 1 of those monsters; toss a coin and call it. If you call it right, Special Summon 1 monster that mentions "Dark Time Wizard" from your Deck, and if you do, until the end of this turn, change the targeted monster's ATK to 0, also negate its effects.
  de: |-
    Einmal pro Spielzug, während der Standby Phase: Wirf einen sechsseitigen Würfel und lege Zählmarken bis zum Ergebnis auf diese Karte (max. 6). Wenn ein Monstereffekt auf der Spielfeldseite deines Gegners aktiviert wird oder einmal pro Kampf, während der Schadensberechnung, falls ein Monster deines Gegners angreift: Du kannst 1 Zählmarke von dieser Karte entfernen und dann 1 jener Monster wählen; wirf eine Münze und sage das Ergebnis voraus. Falls du richtig vorausgesagt hast, beschwöre 1 Monster, das „Dunkler Zeitzauberer“ erwähnt, als Spezialbeschwörung von deinem Deck und falls du dies tust, bis zum Ende dieses Spielzugs, ändere die ATK des als Ziel gewählten Monsters zu 0, zusätzlich annulliere seine Effekte.
  es: |-
    Una vez por turno, durante la Standby Phase: lanza un dado de seis caras, y pon contadores en esta carta (máx. 6), hasta el resultado. Cuando es activado un efecto de monstruo en el Campo de tu adversario, o una vez por batalla, durante el cálculo de daño, si el monstruo de tu adversario ataca: puedes retirar 1 contador de esta carta, y después selecciona 1 de esos monstruos; lanza una moneda y elige Cara o Cruz. Si aciertas, Invoca de Modo Especial 1 monstruo que mencione "Mago del Tiempo Oscuro" desde tu Deck y, si lo haces, hasta el final de este turno cambia a 0 el ATK del monstruo seleccionado, y además niega sus efectos.
  fr: |-
    Une fois par tour, durant la Standby Phase : lancez un dé à six faces, et placez un nombre de Compteurs sur cette carte (max. 6) inférieur ou égal au résultat. Lorsqu'un effet de monstre est activé sur le Terrain de votre adversaire, ou une fois par combat durant le calcul des dommages, si un monstre de votre adversaire attaque : vous pouvez retirer 1 Compteur de cette carte, puis ciblez 1 de ces monstres ; jouez à pile ou face. Si vous gagnez, Invoquez Spécialement 1 monstre qui mentionne "Magicien du Temps des Ténèbres" depuis votre Deck, et si vous le faites, jusqu'à la fin de ce tour, changez l'ATK du monstre ciblé à 0, et aussi, annulez ses effets.
  it: |-
    Una volta per turno, durante la Standby Phase: tira un dado a sei facce, e metti segnalini su questa carta (massimo 6), fino al risultato. Quando viene attivato l'effetto di un mostro sul Terreno del tuo avversario, o una volta per battaglia, durante il calcolo dei danni, se un mostro del tuo avversario attacca: puoi rimuovere 1 segnalino da questa carta, poi scegliere come bersaglio 1 di quei mostri; lancia una moneta e scegli testa o croce. Se indovini, Evoca Specialmente 1 mostro che menziona "Stregone del Tempo Oscuro" dal tuo Deck e, se lo fai, fino alla fine di questo turno, cambia l'ATK del mostro scelto come bersaglio a 0, inoltre annulla i suoi effetti.
  pt: |-
    Uma vez por turno, durante a Fase de Apoio: lance um dado de seis faces, e coloque marcadores neste card (máx. 6), até o resultado. Quando um efeito de monstro for ativado no campo do seu oponente, ou uma vez por batalha, durante o cálculo de dano, se um monstro do seu oponente atacar: você pode remover 1 marcador deste card e, depois, escolha 1 desses monstros; lance uma moeda e escolha cara ou coroa. Se você ganhar, Invoque por Invocação-Especial 1 monstro que mencione "Mago do Tempo Negro" do seu Deck e, se isso acontecer, até o final deste turno, mude o ATK do monstro alvo para 0 e, além disso, negue seus efeitos.
  ja: |-
    ①：自分・相手のスタンバイフェイズに発動する。サイコロを１回振り、出た目の数までこのカードにカウンターを置く（最大６つまで）。②：相手モンスターが攻撃するダメージ計算時に１度、または相手フィールドのモンスターの効果が発動した時に、このカードのカウンターを１つ取り除き、その内の１体を対象として発動できる。コイントスを１回行い、裏表を当てる。当たった場合、デッキから「時の黒魔術師」のカード名が記されたモンスター１体を特殊召喚し、対象のモンスターはターン終了時まで、攻撃力が０になり、効果は無効化される。
  ko:
  zh-TW:
  zh-CN: |-
    ①：在自己・对手的准备阶段发动。掷1次骰子，以掷出的数字为上限在此卡上放计数物（最多6个）。②：每次对手怪兽攻击的伤害计算时有1次，或对手场上的怪兽的效果发动时，去除此卡的1个计数物，以其中1只为对象可以发动。掷1次硬币，猜正反。猜对的情况下，从牌组将1只记载有“时间黑魔术师”卡名的怪兽特殊召唤，对象怪兽直至回合结束时为止，攻击力变为0，效果无效化。
