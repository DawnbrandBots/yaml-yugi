name:
  en: Sleepy Scapegoats
  de: Schläfrige Sündenböcke
  es: Scapegoats Adormilados
  fr: Boucs Émissaires Endormis
  it: Capri Espiatori Assonnati
  pt: Bodes Expiatórios Sonolentos
  ja: <ruby>眠<rt>ねむ</rt></ruby>れる<ruby>羊<rt>ひつじ</rt></ruby> スケープ・ゴート
  ja_romaji: Nemureru Hitsuji Sukēpu Gōto
  ko: 잠자는 양 희생양
  ko_rr:
  zh-TW:
  zh-CN: 眠羊 替罪山羊
text:
  en: |-
    Special Summon up to 4 "Sacrificial Sheep Tokens" (Beast/EARTH/Level 1/ATK 0/DEF 0) in Defense Position (they cannot be Tributed for a Tribute Summon this turn), then if your opponent controls a monster, you can Special Summon 1 "Swiftwind Panther Warrior" from your Deck, also for the rest of this turn, you cannot Special Summon from the Extra Deck, except Fusion Monsters. If a card(s) you control that mentions "Dark Time Wizard" would be destroyed by battle or card effect, you can destroy 1 Token you control that was Special Summoned by this effect instead.
  de: |-
    Beschwöre bis zu 4 „Opferschaf-Spielmarken“ (Ungeheuer/ERDE/Stufe 1/ATK 0/DEF 0) als Spezialbeschwörung in die Verteidigungsposition (sie können in diesem Spielzug nicht als Tribut für eine Tributbeschwörung angeboten werden), dann, falls dein Gegner ein Monster kontrolliert, kannst du 1 „Starkwind-Panter-Krieger“ als Spezialbeschwörung von deinem Deck beschwören, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Fusionsmonstern. Falls eine oder mehr Karten, die du kontrollierst und die „Dunkler Zeitzauberer“ erwähnen, durch Kampf oder einen Karteneffekt zerstört würden, kannst du stattdessen 1 Spielmarke zerstören, die du kontrollierst und die durch diesen Effekt als Spezialbeschwörung beschworen wurde.
  es: |-
    Invoca de Modo Especial hasta 4 "Ficha Cordero Sacrificial" (Bestia/TIERRA/Nivel 1/ATK 0/DEF 0) en Posición de Defensa (no pueden ser Sacrificadas para una Invocación por Sacrificio este turno) y después, si tu adversario controla un monstruo, puedes Invocar de Modo Especial 1 "Guerrero Pantera Viento Veloz" desde tu Deck y además, por el resto de este turno, no puedes Invocar de Modo Especial desde el Deck Extra, excepto Monstruos de Fusión. Si una o más cartas que controlas que mencionan "Mago del Tiempo Oscuro" fueran a ser destruidas en batalla o por el efecto de una carta, puedes destruir 1 Ficha que controles que fuera Invocada de Modo Especial por este efecto en su lugar.
  fr: |-
    Invoquez Spécialement max. 4 "Jeton Mouton Sacrificiel" (Bête/TERRE/Niveau 1/ATK 0/DEF 0) en Position de Défense (ils ne peuvent pas être Sacrifiés pour une Invocation Sacrifice ce tour), puis si votre adversaire contrôle un monstre, vous pouvez Invoquer Spécialement 1 "Guerrier Panthère du Vent Rapide" depuis votre Deck, et aussi, vous ne pouvez pas Invoquer Spécialement (Monstres Fusion exclus) depuis l'Extra Deck le reste de ce tour. Si une ou plusieurs cartes que vous contrôlez qui mentionnent "Magicien du Temps des Ténèbres" vont être détruites au combat ou par un effet de carte, vous pouvez détruire 1 Jeton que vous contrôlez qui a été Invoqué Spécialement par cet effet à la place.
  it: |-
    Evoca Specialmente fino a 4 "Segna-Montone Sacrificale" (Bestia/TERRA/Livello 1/ATK 0/DEF 0) in Posizione di Difesa (essi non possono essere offerti come Tributo per un'Evocazione tramite Tributo in questo turno), poi se il tuo avversario controlla un mostro, puoi Evocare Specialmente 1 "Pantera Guerriera Ventoveloce" dal tuo Deck, inoltre per il resto di questo turno, non puoi Evocare Specialmente dall'Extra Deck, eccetto Mostri Fusione. Se una o più carte che controlli che menzionano "Stregone del Tempo Oscuro" stanno per essere distrutte in battaglia o dall'effetto di una carta, puoi invece distruggere 1 Segna-Mostro che controlli che è stato Evocato Specialmente da questo effetto.
  pt: |-
    Invoque por Invocação-Especial até 4 "Ficha de Ovelha Sacrificial" (Besta/TERRA/Nível 1/ATK 0/DEF 0) em Posição de Defesa (elas não podem ser oferecidas como Tributo para uma Invocação-Tributo neste turno) e, depois, se seu oponente controlar um monstro, você pode Invocar por Invocação-Especial 1 "Guerreiro Pantera Vento Veloz" do seu Deck e, além disso, pelo resto deste turno, você não pode Invocar por Invocação-Especial do Deck Adicional, exceto Monstros de Fusão. Se um ou mais cards que você controla que mencionem "Mago do Tempo Negro" seriam destruídos em batalha ou por um efeito de card, em vez disso, você pode destruir 1 Ficha que você controla que foi Invocada por Invocação-Especial por este efeito.
  ja: |-
    ①：自分フィールドに「身代わり羊トークン」（獣族・地・星１・攻／守０）を４体まで守備表示で特殊召喚する。相手フィールドにモンスターが存在する場合、さらにデッキから「疾風の豹戦士パンサーウォリアー」１体を特殊召喚できる。このターン、このトークンはＡ召喚のためにはリリースできず、自分は融合モンスターしかＥＸデッキから特殊召喚できない。「時の黒魔術師」のカード名が記された自分フィールドのカードが戦闘・効果で破壊される場合、代わりにこの効果で特殊召喚した自分フィールドのトークン１体を破壊できる。
  ko: |-
    ①: 자신 필드에 "희생하는 양 토큰"(야수족 / 땅 / 레벨 1 / 공 0 / 수 0)을 4장까지 수비 표시로 특수 소환한다. 상대 필드에 몬스터가 존재할 경우, 추가로 덱에서 "질풍의 표범전사 팬서 워리어" 1장을 특수 소환할 수 있다. 이 턴에, 이 토큰은 어드밴스 소환을 위해서는 릴리스할 수 없으며, 자신은 융합 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. "시간의 흑마술사"의 카드명이 쓰여진 자신 필드의 카드가 전투 / 효과로 파괴될 경우, 대신에 이 효과로 특수 소환한 자신 필드의 토큰 1장을 파괴할 수 있다.
  zh-TW:
  zh-CN: |-
    ①：将最多4只“替身羊衍生物”（兽族・地・星1・攻/守0）以守备表示特殊召唤至自己场上。对手场上存在怪兽的情况下，进而可从牌组将1只“疾风的豹战士”特殊召唤。此回合，此衍生物不可为上级召唤而解放，自己从额外牌组仅可特殊召唤融合怪兽。记载有“时间黑魔术师”卡名的自己场上的卡将被战斗・效果破坏的情况下，作为代替可将以此效果特殊召唤的、自己场上的1只衍生物破坏。
