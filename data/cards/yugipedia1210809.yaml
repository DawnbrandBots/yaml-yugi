  en: |-
    You can Ritual Summon this card with "Relinquished the Wicked Eye of Illusion". Your opponent takes any battle damage you would have taken from battles involving this card. You can only use each of the following effects of "Relinquished the Wicked Eye of Illusion" once per turn. If this card is in your hand: You can Tribute 2 monsters; Special Summon this card (this is treated as a Ritual Summon). During the Main Phase (Quick Effect): You can target 1 Effect Monster your opponent controls; negate its effects, and if you do, equip it to this card as an Equip Spell that gives it 2000 ATK.
