text:
  en: |-
    Cannot be destroyed by battle. You can only use each of the following effects of "The Sun God's Torture Device - Viser Des Shock" once per turn. If a monster(s) is sent to your opponent's GY and you control a "Sun God" card, even during the Damage Step: You can Special Summon this card from your hand, and if you do, return 1 other card on the field to the hand/Extra Deck, and if you do that, inflict 800 damage to your opponent. During the End Phase, if "The Immortal Sun God" was sent to your GY this turn: You can add this card from your GY to your hand.
