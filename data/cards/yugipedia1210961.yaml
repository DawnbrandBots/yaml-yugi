    此卡名的①③效果1回合仅可各使用1次。①：有怪兽被送至对手墓地的情况下，如果自己场上存在“太阳神”卡则可以发动（伤害步骤也可以发动）。从手牌将此卡特殊召唤，将场上的1张其他卡放回手牌・额外牌组，给予对手800伤害。②：此卡不会因战斗被破坏。③：此回合有“不死之太阳神”被送至自己墓地的情况下，在结束阶段可以发动。将墓地的此卡加入手牌。
