name:
  en: Gagaga Girl - Cell Phone Subtraction
  de: Gagaga-Mädchen - Handysubtraktion
  es: Chica Gagaga - Reducción del Teléfono Móvil
  fr: Fille Gagaga - Téléphone Portable de Soustraction
  it: Ragazza Gagaga - Sottrazione Cellulare
  pt: Garota Gagaga - Redução do Celular
  ja: ガガガガール－ゼロゼロコール
  ja_romaji: Gagaga Gāru - Zero Zero Kōru
  ko: 가가가 걸－제로제로콜
  ko_rr:
  zh-TW:
  zh-CN: 我我我女孩－零零拨号
text:
  en: |-
    If your opponent Special Summons a monster(s) from the Extra Deck (except during the Damage Step): You can target 1 face-up monster you control; Special Summon this card from your hand, then immediately after this effect resolves, Xyz Summon using only this card and the targeted monster. When you do, treat this card's Level as the same as the targeted monster's. If this card is detached from an Xyz Monster to activate that monster's effect: You can change the ATK of 1 face-up monster your opponent controls to 0. You can only use each effect of "Gagaga Girl - Cell Phone Subtraction" once per turn.
  de: |-
    Falls dein Gegner ein oder mehr Monster als Spezialbeschwörung vom Extra Deck beschwört (außer während des Damage Steps): Du kannst 1 offenes Monster wählen, das du kontrollierst; beschwöre diese Karte als Spezialbeschwörung von deiner Hand, dann, sofort nachdem dieser Effekt aufgelöst wurde, führe eine Xyz-Beschwörung durch, indem du nur diese Karte und das als Ziel gewählte Monster verwendest. Wenn du dies tust, behandle die Stufe dieser Karte als dieselbe wie die des als Ziel gewählten Monsters. Falls diese Karte von einem Xyz-Monster abgehängt wird, um den Effekt jenes Monsters zu aktivieren: Du kannst die ATK von 1 offenen Monster, das dein Gegner kontrolliert, zu 0 ändern. Du kannst jeden Effekt von „Gagaga-Mädchen - Handysubtraktion“ nur einmal pro Spielzug verwenden.
  es: |-
    Si tu adversario Invoca uno o más monstruos de Modo Especial desde el Deck Extra (excepto durante el Damage Step): puedes seleccionar 1 monstruo boca arriba que controles; Invoca esta carta de Modo Especial desde tu mano, e inmediatamente después de que se resuelva este efecto, Invoca Xyz usando sólo esta carta y el monstruo seleccionado. Cuando lo haces, trata el Nivel de esta carta como el mismo que el del monstruo seleccionado. Si esta carta es desacoplada de un Monstruo Xyz para activar el efecto de ese monstruo: puedes cambiar a 0 el ATK de 1 monstruo boca arriba que controle tu adversario. Sólo puedes usar cada efecto de "Chica Gagaga - Reducción del Teléfono Móvil" una vez por turno.
  fr: |-
    Si votre adversaire Invoque Spécialement un ou plusieurs monstres depuis l'Extra Deck (sauf durant la Damage Step) : vous pouvez cibler 1 monstre face recto que vous contrôlez ; Invoquez Spécialement cette carte depuis votre main, puis immédiatement après la résolution de cet effet, Invoquez par Xyz en utilisant uniquement cette carte et le monstre ciblé. Lorsque vous le faites, traitez le Niveau de cette carte comme le même que celui du monstre ciblé. Si cette carte est détachée d'un Monstre Xyz pour activer l'effet du monstre : vous pouvez changer à 0 l'ATK d'1 monstre face recto contrôlé par votre adversaire. Vous ne pouvez utiliser chaque effet de "Fille Gagaga - Téléphone Portable de Soustraction" qu'une fois par tour.
  it: |-
    Se il tuo avversario Evoca Specialmente uno o più mostri dall'Extra Deck (eccetto durante il Damage Step): puoi scegliere come bersaglio 1 mostro scoperto che controlli; Evoca Specialmente questa carta dalla tua mano, poi immediatamente dopo che questo effetto si è risolto, Evoca Xyz utilizzando solo questa carta e il mostro scelto come bersaglio. Quando lo fai, considera il Livello di questa carta lo stesso del mostro scelto come bersaglio. Se questa carta viene staccata da un Mostro Xyz per attivare l'effetto di quel mostro: puoi cambiare l'ATK di 1 mostro scoperto controllato dal tuo avversario a 0. Puoi utilizzare ogni effetto di "Ragazza Gagaga - Sottrazione Cellulare" una sola volta per turno.
  pt: |-
    Se seu oponente Invocar um ou mais monstros por Invocação-Especial do Deck Adicional (exceto durante a Etapa de Dano): você pode escolher 1 monstro com a face para cima que você controla; Invoque este card por Invocação-Especial da sua mão e, depois, imediatamente depois que este efeito resolver, Invoque por Invocação-Xyz usando apenas este card e o monstro alvo. Ao fazê-lo, considere o Nível deste card como o mesmo que o do monstro alvo. Se este card for desassociado de um Monstro Xyz para ativar o efeito desse monstro: você pode mudar para 0 o ATK de 1 monstro com a face para cima que seu oponente controla. Você só pode usar cada efeito de "Garota Gagaga - Redução do Celular" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：相手がＥＸデッキからモンスターを特殊召喚した場合、自分フィールドの表側表示モンスター１体を対象として発動できる。このカードを手札から特殊召喚する。その後、このカードと対象のモンスターのみを素材としてＸ召喚を行う。その際、このカードのレベルは、対象のモンスターと同じレベルとして扱う。②：Ｘ素材のこのカードがＸモンスターの効果を発動するために取り除かれた場合に発動できる。相手フィールドの表側表示モンスター１体の攻撃力を０にする。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 상대가 엑스트라 덱에서 몬스터를 특수 소환했을 경우, 자신 필드의 앞면 표시 몬스터 1장을 대상으로 하고 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 그 후, 이 카드와 대상 몬스터만을 소재로서 엑시즈 소환을 실행한다. 그 시기에, 이 카드의 레벨은, 대상 몬스터와 같은 레벨로 취급한다. ②: 엑시즈 소재인 이 카드가 엑시즈 몬스터의 효과를 발동하기 위해 제거되었을 경우에 발동할 수 있다. 상대 필드의 앞면 표시 몬스터 1장의 공격력을 0 으로 한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：对手从额外牌组将怪兽特殊召唤的情况下，以自己场上的1只表侧表示怪兽为对象可以发动。从手牌将此卡特殊召唤。然后，仅以此卡和对象怪兽作为素材进行超量召唤。在此之际，此卡的等级视为与对象怪兽的等级相同。②：作为超量素材的此卡为发动超量怪兽的效果被去除的情况下可以发动。将对手场上的1只表侧表示怪兽的攻击力改成0。
