text:
  en: |-
    If your opponent controls more monsters than you do: Activate 1 of these effects (but you can only use each effect of "Ultimate Sky" once per turn);
    ● Target face-up cards on the field up to the number of face-up monsters your opponent controls and pay 800 LP for each target; negate their effects until the end of this turn.
    ● When your opponent activates a monster effect in the hand or GY: Negate that effect.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：相手フィールドのモンスターの数が自分フィールドのモンスターより多い場合、以下の効果から１つを選択して発動できる（このカード名の以下の効果はそれぞれ１ターンに１度しか選択できない）。
    ●相手フィールドの表側表示モンスターの数まで、フィールドの表側表示カードを対象とし、対象とした数×８００ＬＰを払って発動できる。そのカードの効果をターン終了時まで無効にする。
    ●相手が手札・墓地のモンスターの効果を発動した時に発動できる。その効果を無効にする。
  ko: |-
    ①: 상대 필드의 몬스터의 수가 자신 필드의 몬스터보다 많을 경우, 이하의 효과에서 1개를 선택하고 발동할 수 있다(이 카드명의 이하의 효과는 각각 1턴에 1번밖에 선택할 수 없다).<br>●상대 필드의 앞면 표시 몬스터의 수까지, 필드의 앞면 표시 카드를 대상으로 하고, 대상으로 한 수 × 800 LP를 지불하여 발동할 수 있다. 그 카드의 효과를 턴 종료시까지 무효로 한다.<br>●상대가 패 / 묘지의 몬스터의 효과를 발동했을 때에 발동할 수 있다. 그 효과를 무효로 한다.
  zh-TW:
  zh-CN: |-
    ①：对手场上的怪兽的数量多于自己场上的怪兽的情况下，可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。
    ●以对手场上的表侧表示怪兽的数量为上限，以场上的表侧表示卡为对象，支付作为对象的数量×800的LP可以发动。将该卡的效果直至回合结束时为止无效。
    ●对手发动手牌・墓地的怪兽的效果时可以发动。将该效果无效。
