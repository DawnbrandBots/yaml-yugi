text:
  en: |-
    Special Summon 1 "Raise Moon" Xyz Monster from your Extra Deck, and if you do, attach this card to it, then you can shuffle all "Raise Moon" cards in your GY into the Deck. You can banish this card from your GY; draw 1 card. You can only use this effect of "The Glitter of Raise Moon" once per turn. You cannot add cards from the Deck to the hand during the Duel you activate either of this card's effects, except by drawing them.
