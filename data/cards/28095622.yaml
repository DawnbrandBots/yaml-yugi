  ja: |-
    レベル２「ゴーストリック」モンスター×２
    自分は「ゴーストリックの妖狐」を１ターンに１度しかＥＸデッキから特殊召喚できない。このカードは自分フィールドの裏側守備表示のレベルを持つ「ゴーストリック」モンスターの上に重ねてＸ召喚する事もできる。①：このカードはモンスターゾーンに存在する限り、相手の効果では破壊されない。②：１ターンに１度、このカードのＸ素材を１つ取り除いて発動できる。デッキから「ゴーストリック」モンスター１体を特殊召喚する。このターン、自分は闇属性モンスターしか特殊召喚できない。
