  ja: <ruby>天<rt>てん</rt></ruby><ruby>下<rt>か</rt></ruby><ruby>独<rt>どっ</rt></ruby><ruby>歩<rt>ぽ</rt></ruby>の<ruby>大<rt>だい</rt></ruby><ruby>義<rt>ぎ</rt></ruby><ruby>賊<rt>ぞく</rt></ruby>
