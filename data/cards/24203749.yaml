text:
  en: |-
    You can Tribute Summon this card face-up by Tributing monsters in your hand and/or your opponent's field, while you control no monsters. You can only use each of the following effects of "The Great Gallant Bandit" once per turn. When your opponent activates a card effect in the hand, GY, or banishment, and you control this Normal Summoned/Set card (Quick Effect): You can negate that effect, and if you do, destroy that card. During the Battle Phase (Quick Effect): You can reveal your entire hand; change all monsters your opponent controls to Defense Position.
  de: |-
    Du kannst diese Karte offen als Tributbeschwörung beschwören, indem du Monster von deiner Hand und/oder der Spielfeldseite deines Gegners als Tribut anbietest, solange du keine Monster kontrollierst. Du kannst jeden der folgenden Effekte von „Der große ritterliche Bandit“ nur einmal pro Spielzug verwenden. Wenn dein Gegner einen Karteneffekt in der Hand, im Friedhof oder von verbannten Karten aktiviert und du diese als Normalbeschwörung beschworene/gesetzte Karte kontrollierst (Schnelleffekt): Du kannst jenen Effekt annullieren und falls du dies tust, zerstöre jene Karte. Während der Battle Phase (Schnelleffekt): Du kannst deine gesamte Hand vorzeigen; ändere alle Monster, die dein Gegner kontrolliert, in die Verteidigungsposition.
  es: |-
    Puedes Invocar boca arriba por Sacrificio esta carta Sacrificando monstruos en tu mano y/o Campo de tu adversario, mientras no controles monstruos. Sólo puedes usar cada uno de los siguientes efectos de "El Gran Bandido Gallardo" una vez por turno. Cuando tu adversario activa un efecto de carta en la mano, Cementerio o destierro, y tú controlas esta carta Invocada de Modo Normal/Colocada (Efecto Rápido): puedes negar ese efecto y, si lo haces, destruye esa carta. Durante la Battle Phase (Efecto Rápido): puedes mostrar toda tu mano; cambia a Posición de Defensa todos los monstruos que controle tu adversario.
  fr: |-
    Vous pouvez Invoquer par Sacrifice face recto cette carte en Sacrifiant des monstres dans votre main et/ou Terrain de votre adversaire, tant que vous ne contrôlez aucun monstre. Vous ne pouvez utiliser chacun des effets suivants de "Le Grand Bandit Galant" qu'une fois par tour. Lorsque votre adversaire active un effet de carte dans la main, Cimetière ou bannissement, et que vous contrôlez cette carte Invoquée/Posée Normalement (Effet Rapide) : vous pouvez annuler l'effet, et si vous le faites, détruisez la carte. Durant la Battle Phase (Effet Rapide) : vous pouvez révéler toute votre main ; changez tous les monstres contrôlés par votre adversaire en Position de Défense.
  it: |-
    Puoi Evocare tramite Tributo questa carta scoperta offrendo come Tributo mostri nella tua mano e/o nel Terreno del tuo avversario, mentre non controlli nessun mostro. Puoi utilizzare ognuno dei seguenti effetti di "Il Bandito Grande Gentiluomo" una sola volta per turno. Quando il tuo avversario attiva l'effetto di una carta nella mano, Cimitero o carte bandite, e tu controlli questa carta Evocata Normalmente/Posizionata (Effetto Rapido): puoi annullare quell'effetto e, se lo fai, distruggi quella carta. Durante la Battle Phase (Effetto Rapido): puoi rivelare tutta la tua mano; metti in Posizione di Difesa tutti i mostri controllati dal tuo avversario.
  pt: |-
    Você pode Invocar este card por Invocação-Tributo com a face para cima ao oferecer como Tributo monstros na sua mão e/ou no campo do seu oponente, enquanto você não controlar nenhum monstro. Você só pode usar cada um dos seguintes efeitos de "O Grande Bandido Galante" uma vez por turno. Quando seu oponente ativar um efeito de card na mão, no Cemitério ou no banimento, e você controlar este card Invocado por Invocação-Normal/Baixado (Efeito Rápido): você pode negar esse efeito e, se isso acontecer, destrua esse card. Durante a Fase de Batalha (Efeito Rápido): você pode revelar toda a sua mão; coloque todos os monstros que seu oponente controla em Posição de Defesa.
  ja: |-
    自分フィールドにモンスターが存在しない場合、このカードは自分の手札及び相手フィールドの中からモンスターをリリースして、表側表示でＡ召喚できる。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが通常召喚されている場合、相手が手札・墓地・除外状態のカードの効果を発動した時に発動できる。その効果を無効にし破壊する。②：自分・相手のバトルフェイズに、手札を全て相手に見せて発動できる。相手フィールドのモンスターを全て守備表示にする。
  ko:
  zh-TW:
  zh-CN: |-
    自己场上不存在怪兽的情况下，此卡可通过从自己手牌及对手场上之中将怪兽解放来以表侧表示上级召唤。此卡名的①②效果1回合仅可各使用1次。①：此卡是被通常召唤的情况下，对手发动手牌・墓地・除外状态的卡的效果时可以发动。将该效果无效并破坏。②：在自己・对手的战斗阶段，向对手出示所有手牌可以发动。将对手场上的怪兽全部改成守备表示。
