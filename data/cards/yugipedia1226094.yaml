text:
  en: |-
    If "Sinful Spoils of Subversion - Snake-Eye" or "Snake-Eyes Poplar" is in either GY, you can Special Summon this card (from your hand). You can only Special Summon "Diabellstar, the Seeker of Sinful Spoils" once per turn this way. You can only use each of the following effects of "Diabellstar, the Seeker of Sinful Spoils" once per turn. You can banish 1 "Sinful Spoils of Doom - Rciela" from your GY; destroy all Spells/Traps your opponent controls. During your opponent's turn (Quick Effect): You can banish 1 "Sinful Spoils of Betrayal - Silvera" from your GY; destroy all monsters your opponent controls.
