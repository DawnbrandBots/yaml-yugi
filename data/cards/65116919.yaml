text:
  en: |-
    Cannot be Normal Summoned, unless you control a "Ghostrick" monster. When your opponent activates a monster effect on the field (Quick Effect): You can Special Summon this card from your hand in face-down Defense Position, and if you do, place 1 "Ghostrick" Field Spell or "Ghostrick" Continuous Trap from your hand or Deck face-up on your field, then if your opponent has 5 or more cards in their GY, you can Special Summon 1 monster from your hand in face-down Defense Position. Once per turn: You can change this card to face-down Defense Position.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分フィールドに「ゴーストリック」モンスターが存在する場合のみ、このカードは召喚できる。①：相手がフィールドのモンスターの効果を発動した時に発動できる。このカードを手札から裏側守備表示で特殊召喚し、手札・デッキから「ゴーストリック」フィールド魔法・永続罠カード１枚を自分フィールドに表側表示で置く。その後、相手の墓地のカードが５枚以上の場合、手札からモンスター１体を裏側守備表示で特殊召喚できる。②：自分メインフェイズに発動できる。このカードを裏側守備表示にする（１ターンに１度のみ）。
