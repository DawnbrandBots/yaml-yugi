name:
  en: Barian's Seal
  de: Barians Siegel
  es: Sello de Barian
  fr: Sceau de Barian
  it: Sigillo di Barian
  pt: Selo de Barian
  ja: バリアンズ・シール
  ja_romaji: Barianzu Shīru
  ko:
  ko_rr:
  zh-TW:
  zh-CN: 巴利安之印
text:
  en: |-
    When your opponent activates a Spell/Trap Card, or monster effect, while you control a "CXyz" monster, or a monster with "Number C101" through "Number C107" in its name: Negate that activation, then you can attach 1 monster from the field or either GY to 1 Xyz Monster you control. You can banish this card from your GY; Special Summon 2 "Umbral Horror" monsters from your GY. You can only use 1 "Barian's Seal" effect per turn, and only once that turn.
  de: |-
    Wenn dein Gegner eine Zauber-/Fallenkarte oder einen Monstereffekt aktiviert, solange du ein Monster mit „Nummer C101“ bis „Nummer C107“ in seinem Namen oder ein „CXyz“-Monster kontrollierst: Annulliere jene Aktivierung, dann kannst du 1 Monster vom Spielfeld oder einem beliebigen Friedhof an 1 Xyz-Monster anhängen, das du kontrollierst. Du kannst diese Karte von deinem Friedhof verbannen; beschwöre 2 „Schattenhorror“-Monster als Spezialbeschwörung von deinem Friedhof. Du kannst nur 1 Effekt von „Barians Siegel“ pro Spielzug verwenden und in jenem Spielzug nur einmal.
  es: |-
    Cuando tu adversario activa una Carta Mágica/de Trampa o un efecto de monstruo, mientras controles un monstruo "CXyz" o un monstruo cuyo nombre vaya de "Número C101" a "Número C107": niega esa activación, y después puedes acoplar a 1 Monstruo Xyz que controles 1 monstruo en el Campo o en cualquier Cementerio. Puedes desterrar esta carta en tu Cementerio; Invoca de Modo Especial 2 monstruos "Horror de las Sombras" desde tu Cementerio. Sólo puedes usar 1 efecto de "Sello de Barian" por turno, y sólo una vez ese turno.
  fr: |-
    Lorsque votre adversaire active une Carte Magie/Piège ou un effet de monstre, tant que vous contrôlez un monstre "CXyz", ou un monstre avec "Numéro C101" à "Numéro C107" dans son nom : annulez l'activation, puis vous pouvez attacher 1 monstre depuis le Terrain ou l'un des Cimetières à 1 Monstre Xyz que vous contrôlez. Vous pouvez bannir cette carte depuis votre Cimetière ; Invoquez Spécialement 2 monstres "Horreur de l'Ombre" depuis votre Cimetière. Vous ne pouvez utiliser qu'1 effet de "Sceau de Barian" par tour, et uniquement une fois le tour.
  it: |-
    Quando il tuo avversario attiva una Carta Magia/Trappola, o l'effetto di un mostro, mentre controlli un mostro "CXyz", o un mostro con "Numero C101" fino a "Numero C107" nel suo nome: annulla quell'attivazione, poi puoi attaccare 1 mostro dal Terreno o qualsiasi Cimitero a 1 Mostro Xyz che controlli. Puoi bandire questa carta dal tuo Cimitero; Evoca Specialmente 2 mostri "Orrore Umbral" dal tuo Cimitero. Puoi utilizzare solo 1 effetto di "Sigillo di Barian" per turno, e solo una volta in quel turno.
  pt: |-
    Quando seu oponente ativar um Card de Magia/Armadilha, ou efeito de monstro, enquanto você controlar um monstro "CXyz", ou um monstro com "Número C101" até "Número C107" em seu nome: negue a ativação e, depois, você pode associar 1 monstro no campo ou em qualquer Cemitério a 1 Monstro Xyz que você controla. Você pode banir este card do seu Cemitério; Invoque por Invocação-Especial 2 monstros "Terror Umbral" do seu Cemitério. Você só pode usar 1 efeito de "Selo de Barian" por turno e apenas uma vez por turno.
  ja: |-
    このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。①：「ＣＸ」モンスターまたは「ＣＮｏ．１０１」～「ＣＮｏ．１０７」のいずれかの「ＣＮｏ．」モンスターが自分フィールドに存在し、相手がモンスターの効果・魔法・罠カードを発動した時に発動できる。その発動を無効にする。その後、自分か相手のフィールド・墓地からモンスター１体を自分フィールドのＸモンスター１体のＸ素材にできる。②：墓地のこのカードを除外して発動できる。自分の墓地から「アンブラル」モンスター２体を特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合1次，仅可使用其中1个。①：自己场上存在“混沌超量”怪兽或“混沌编号101”～“混沌编号107”中的任一“混沌编号”怪兽，且对手发动怪兽的效果・魔法・陷阱卡时可以发动。将该发动无效。然后，可从自己或对手的、场上・墓地将1只怪兽作为自己场上的1只超量怪兽的超量素材。②：将墓地的此卡除外可以发动。从自己墓地将2只“黑影”怪兽特殊召唤。
