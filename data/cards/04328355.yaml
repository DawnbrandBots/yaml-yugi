text:
  en: |-
    You can send 1 Normal Monster with 2000 or less ATK from your Deck to the GY; Special Summon this card from your hand. If this card is Normal or Special Summoned: You can place 1 "Bunnillin" Continuous Spell/Trap from your Deck or GY face-up on your field. If your opponent Special Summons an Effect Monster(s), while this card is in the Monster Zone (except during the Damage Step): You can Tribute this card; Special Summon 1 Normal Monster from your GY. You can only use each effect of "Bunnillin: Mocha MOD" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：デッキから攻撃力２０００以下の通常モンスター１体を墓地へ送って発動できる。このカードを手札から特殊召喚する。②：このカードが召喚・特殊召喚した場合に発動できる。自分のデッキ・墓地から「バニリン」永続魔法・永続罠カード１枚を自分フィールドに表側表示で置く。③：このカードがモンスターゾーンに存在する状態で、相手が効果モンスターを特殊召喚した場合、このカードをリリースして発動できる。自分の墓地から通常モンスター１体を特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：从牌组将1只攻击力2000以下的通常怪兽送至墓地可以发动。从手牌将此卡特殊召唤。②：此卡召唤・特殊召唤的情况下可以发动。从自己牌组・墓地将1张“香兰兔”永续魔法・永续陷阱卡以表侧表示放在自己场上。③：此卡存在于怪兽区域的状态下，对手将效果怪兽特殊召唤的情况下，解放此卡可以发动。从自己墓地将1只通常怪兽特殊召唤。
