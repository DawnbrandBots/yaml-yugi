name:
  en: Underworld Circle
  de: Zirkel der Unterwelt
  es: Círculo del Inframundo
  fr: Le Cercle du Monde Souterrain
  it: Cerchio degli Inferi
  pt: Círculo do Submundo
  ja: <ruby>黄<rt>よ</rt></ruby><ruby>泉<rt>み</rt></ruby><ruby>天<rt>てん</rt></ruby><ruby>輪<rt>りん</rt></ruby>
