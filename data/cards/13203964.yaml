  fr: Dragon Hydrelecteur Parfaitron
  it: Perfectron Idradrive Drago
  pt: Hidradrive Dragão Perfectron
  ja: パーフェクトロン・ハイドライブ・ドラゴン
  ja_romaji: Pāfekutoron Haidoraibu Doragon
  ko: 퍼펙트론 하이드라이브 드래곤
  ko_rr:
  zh-TW:
  zh-CN: 完美智能・海德拉驱动龙
text:
  en: |-
    1+ Link Monsters
    While face-up on the field, this card is also LIGHT, WATER, FIRE, and WIND-Attribute, also it is unaffected by the activated effects of monsters with the same Attribute. If this card is Link Summoned, or at the end of the Damage Step if this card battled: Destroy as many monsters your opponent controls as possible, then inflict 300 damage to your opponent for each Link Monster in your GY. If this card with 1000 or more ATK would be destroyed by battle or card effect, you can change its ATK to be 1000 less than its current ATK instead.
  de: |-
    1+ Linkmonster
    Solange diese Karte offen auf dem Spielfeld liegt, hat sie zusätzlich die Eigenschaften LICHT, WASSER, FEUER und WIND, zusätzlich bleibt sie von aktivierten Effekten von Monstern mit derselben Eigenschaft unberührt. Falls diese Karte als Linkbeschwörung beschworen wird oder am Ende des Damage Steps, falls diese Karte gekämpft hat: Zerstöre so viele Monster, die dein Gegner kontrolliert, wie möglich, dann füge deinem Gegner für jedes Linkmonster in deinem Friedhof 300 Schaden zu. Falls diese Karte mit 1000 oder mehr ATK durch Kampf oder einen Karteneffekt zerstört würde, kannst du stattdessen ihre ATK zu 1000 weniger als seine derzeitigen ATK ändern.
  es: |-
    1+ Monstruos de Enlace
    Mientras esté boca arriba en el Campo, esta carta también tiene los Atributos de LUZ, AGUA, FUEGO y VIENTO, y además no es afectada por los efectos activados de monstruos con el mismo Atributo. Si esta carta es Invocada por Enlace, o al final del Damage Step si esta carta batalló: destruye tantos monstruos que controle tu adversario como sea posible, y después inflige 300 puntos de daño a tu adversario por cada Monstruo de Enlace en tu Cementerio. Si esta carta con 1000 ATK o más fuera a ser destruida en batalla o por el efecto de una carta, puedes cambiar su ATK para que sea 1000 menos que su ATK en este momento en su lugar.
  fr: |-
    1+ Monstre Lien
    Tant que cette carte est face recto sur le Terrain, elle est aussi LUMIÈRE, EAU, FEU et VENT, et aussi, elle n'est pas affectée par les effets activés des monstres du même Attribut. Si cette carte est Invoquée par Lien, ou à la fin de la Damage Step si cette carte a combattu : détruisez autant de monstres contrôlés par votre adversaire que possible, puis infligez 300 points de dommages à votre adversaire pour chaque Monstre Lien dans votre Cimetière. Si cette carte avec min. 1000 ATK va être détruite au combat ou par un effet de carte, vous pouvez changer son ATK pour qu'elle soit inférieure de 1000 à son ATK actuelle à la place.
  it: |-
    1+ Mostri Link
    Mentre è scoperta sul Terreno, questa carta ha anche Attributo LUCE, ACQUA, FUOCO e VENTO, inoltre essa è immune agli effetti attivati dei mostri con lo stesso Attributo. Se questa carta viene Evocata Link, o alla fine del Damage Step se questa carta ha combattuto: distruggi tanti mostri controllati dal tuo avversario quanti possibile, poi infliggi 300 danni al tuo avversario per ogni Mostro Link nel tuo Cimitero. Se questa carta con ATK 1000 o superiore sta per essere distrutta in battaglia o dall'effetto di una carta, puoi invece cambiare il suo ATK in modo che sia di 1000 inferiore al suo ATK attuale.
  pt: |-
    1+ Monstros Link
    Enquanto estiver com a face para cima no campo, este card também é dos Atributos LUZ, ÁGUA, FOGO e VENTO e, além disso, não é afetado pelos efeitos ativados de monstros com o mesmo Atributo. Se este card for Invocado por Invocação-Link, ou no final da Etapa de Dano se este card batalhou: destrua tantos monstros que seu oponente controla quanto possível e, depois, cause 300 de dano ao seu oponente para cada Monstro Link no seu Cemitério. Se este card com 1000 ou mais de ATK seria destruído em batalha ou por um efeito de card, em vez disso, você pode mudar seu ATK para 1000 a menos que seu ATK atual.
  ja: |-
    Ｌモンスター１体以上
    ①：このカードがＬ召喚した場合、またはこのカードが戦闘を行ったダメージステップ終了時に発動する。相手フィールドのモンスターを全て破壊する。その後、自分の墓地のＬモンスターの数×３００ダメージを相手に与える。②：このカードはモンスターゾーンに存在する限り、属性を「光」「水」「炎」「風」としても扱い、自身と同じ属性のモンスターが発動した効果を受けない。③：攻撃力１０００以上のこのカードが戦闘・効果で破壊される場合、代わりにこのカードの攻撃力を１０００下げた数値にできる。
  ko: |-
    링크 몬스터 1장 이상<br>①: 이 카드를 링크 소환했을 경우, 또는 이 카드가 전투를 실행한 데미지 스텝 종료시에 발동한다. 상대 필드의 몬스터를 전부 파괴한다. 그 후, 자신 묘지의 링크 몬스터의 수 × 300 데미지를 상대에게 준다. ②: 이 카드는 몬스터 존에 존재하는 한, 속성을 "빛" "물" "화염" "바람"으로도 취급하고, 자신과 같은 속성의 몬스터가 발동한 효과를 받지 않는다. ③: 공격력 1000 이상의 이 카드가 전투 / 효과로 파괴될 경우, 대신에 이 카드의 공격력을 1000 내린 수치로 할 수 있다.
  zh-TW:
  zh-CN: |-
    连接怪兽1只以上
    ①：此卡连接召唤的情况下，或此卡进行战斗的伤害步骤结束时发动。将对手场上的怪兽全部破坏。然后，给予对手相当于自己墓地的连接怪兽的数量×300的伤害。②：此卡只要存在于怪兽区域，属性也视为“光”、“水”、“炎”、“风”，不受与自身相同属性的怪兽发动的效果影响。③：攻击力1000以上的此卡将被战斗・效果破坏的情况下，作为代替可将此卡的攻击力改成下降了1000的数值。
