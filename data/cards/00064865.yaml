name:
  en: Cyberse Code Magician
  de: Cyberse-Kodier-Magier
  es: Hechicero Ciberso Codificador
  fr: Magicien Codeur Cyberse
  it: Mago Codificatore Cyberso
  pt: Feiticeiro do Código Ciberso
  ja: サイバース・コード・マジシャン
  ja_romaji: Saibāsu Kōdo Majishan
  ko: 사이버스 코드 매지션
  ko_rr:
  zh-TW:
  zh-CN: 电子界代码魔术师
text:
  en: |-
    You can Ritual Summon this card with "Cynet Ritual". If a Link Monster you control would be used as Link Material for a Cyberse monster, this card in your hand can also be used as material. If this card is sent from the hand or field to the GY: You can send 1 Cyberse monster from your Deck to the GY, or if this Ritual Summoned card was sent to the GY, you can Special Summon that monster instead, also in either case, you cannot Special Summon for the rest of this turn, except Cyberse monsters. You can only use each effect of "Cyberse Code Magician" once per turn.
  de: |-
    Du kannst diese Karte mit „Cynet-Ritual“ als Ritualbeschwörung beschwören. Falls ein Linkmonster, das du kontrollierst, als Linkmaterial für ein Cyberse-Monster verwendet würde, kann auch diese Karte in deiner Hand als Material verwendet werden. Falls diese Karte von der Hand oder dem Spielfeld auf den Friedhof gelegt wird: Du kannst 1 Cyberse-Monster von deinem Deck auf den Friedhof legen oder falls diese als Ritualbeschwörung beschworene Karte auf den Friedhof gelegt wurde, kannst du jenes Monster stattdessen als Spezialbeschwörung beschwören, zusätzlich kannst du in beiden Fällen für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von Cyberse-Monstern. Du kannst jeden Effekt von „Cyberse-Kodier-Magier“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes Invocar esta carta por Ritual con "Cinet-Ritual". Si un Monstruo de Enlace que controlas fuera a ser usado como Material de Enlace para un monstruo Ciberso, esta carta en tu mano también puede ser usada como material. Si esta carta es mandada de la mano o Campo al Cementerio: puedes mandar al Cementerio 1 monstruo Ciberso en tu Deck o, si esta carta Invocada por Ritual fue mandada al Cementerio, puedes Invocar ese monstruo de Modo Especial en su lugar, y además en cualquier caso no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos Ciberso. Sólo puedes usar cada efecto de "Hechicero Ciberso Codificador" una vez por turno.
  fr: |-
    Vous pouvez Invoquer Rituellement cette carte avec "Cynet Rituel". Si un Monstre Lien que vous contrôlez va être utilisé comme Matériel Lien pour un monstre Cyberse, cette carte dans votre main peut aussi être utilisée comme Matériel. Si cette carte est envoyée depuis la main ou Terrain au Cimetière : vous pouvez envoyer 1 monstre Cyberse depuis votre Deck au Cimetière, ou si cette carte Invoquée Rituellement a été envoyée au Cimetière, vous pouvez Invoquer Spécialement le monstre à la place, et aussi, dans n'importe quel cas, vous ne pouvez pas Invoquer Spécialement (monstres Cyberse exclus) le reste de ce tour. Vous ne pouvez utiliser chaque effet de "Magicien Codeur Cyberse" qu'une fois par tour.
  it: |-
    Puoi Evocare tramite Rituale questa carta con "Cynet Rituale". Se un Mostro Link che controlli sta per essere utilizzato come Materiale Link per un mostro Cyberso, anche questa carta nella tua mano può essere utilizzata come materiale. Se questa carta viene mandata dalla mano o Terreno al Cimitero: puoi mandare 1 mostro Cyberso dal tuo Deck al Cimitero o, se questa carta Evocata tramite Rituale è stata mandata al Cimitero, puoi invece Evocare Specialmente quel mostro, inoltre in ogni caso, non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri Cyberso. Puoi utilizzare ogni effetto di "Mago Codificatore Cyberso" una sola volta per turno.
  pt: |-
    Você pode Invocar este card por Invocação-Ritual com "Cinet Ritual". Se um Monstro Link que você controla seria usado como Matéria Link para um monstro Ciberso, este card na sua mão também pode ser usado como matéria. Se este card for enviado da mão ou do campo para o Cemitério: você pode enviar 1 monstro Ciberso do seu Deck para o Cemitério, ou se este card Invocado por Invocação-Ritual foi enviado para o Cemitério, em vez disso, você pode Invocar esse monstro por Invocação-Especial e, além disso, em qualquer caso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros Ciberso. Você só pode usar cada efeito de "Feiticeiro do Código Ciberso" uma vez por turno.
  ja: |-
    「サイバネット・リチューアル」により降臨
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのＬモンスターをサイバース族ＬモンスターのＬ素材とする場合、手札のこのカードもＬ素材にできる。②：このカードが手札・フィールドから墓地へ送られた場合に発動できる。デッキからサイバース族モンスター１体を墓地へ送る。儀式召喚したこのカードが墓地へ送られていた場合、デッキから墓地へ送らず特殊召喚する事もできる。このターン、自分はサイバース族モンスターしか特殊召喚できない。
  ko: |-
    "사이바넷 리츄얼"에 의해 의식 소환
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드의 링크 몬스터를 사이버스족 링크 몬스터의 링크 소재로 할 경우, 패의 이 카드도 링크 소재로 할 수 있다. ②: 이 카드가 패 / 필드에서 묘지로 보내졌을 경우에 발동할 수 있다. 덱에서 사이버스족 몬스터 1장을 묘지로 보낸다. 의식 소환한 이 카드가 묘지로 보내져 있었을 경우, 덱에서 묘지로 보내지 않고 특수 소환할 수도 있다. 이 턴에, 자신은 사이버스족 몬스터밖에 특수 소환할 수 없다.
  zh-TW:
  zh-CN: |-
    以“电脑网仪式”降临
    此卡名的①②效果1回合仅可各使用1次。①：在要将自己场上的连接怪兽作为电子界族连接怪兽的连接素材的情况下，手牌的此卡也可一起作为连接素材。②：此卡从手牌・场上被送至墓地的情况下可以发动。从牌组将1只电子界族怪兽送至墓地。被送至墓地的此卡原先是被仪式召唤的情况下，也可将从牌组送至墓地改成特殊召唤。此回合，自己仅可特殊召唤电子界族怪兽。
