name:
  en: Unchained Oni of Shara
  de: Losgekettete Oni von Shara
  es: Oni Desencadenada de Shara
  fr: Oni Désenchaînée de Shara
  it: Oni Svincolata della Shara
  pt: Oni Desacorrentada de Shara
  ja: <ruby>破<rt>は</rt></ruby><ruby>械<rt>かい</rt></ruby><ruby>式<rt>し</rt></ruby><ruby>鬼<rt>き</rt></ruby>シャラ
  ja_romaji: Hakaishiki Shara
  ko: 언체인드식귀 샤라
  ko_rr:
  zh-TW:
  zh-CN: 破械式鬼 奢罗
text:
  en: |-
    During the Main Phase (Quick Effect): You can discard this card; Special Summon 1 Fiend monster from your hand, then destroy 1 card you control. If a card(s) on the field is destroyed by card effect (except the effect of "Unchained Oni of Shara") or by battle, while this card is in your GY: You can add this card to your hand or Special Summon it, but place it on the bottom of the Deck when it leaves the field. You can only use each effect of "Unchained Oni of Shara" once per turn.
  de: |-
    Während der Main Phase (Schnelleffekt): Du kannst diese Karte abwerfen; beschwöre 1 Unterweltler-Monster als Spezialbeschwörung von deiner Hand, dann zerstöre 1 Karte, die du kontrollierst. Falls eine oder mehr Karten auf dem Spielfeld durch einen Karteneffekt (außer den Effekt von „Losgekettete Oni von Shara“) oder Kampf zerstört werden, solange sich diese Karte in deinem Friedhof befindet: Du kannst diese Karte deiner Hand hinzufügen oder sie als Spezialbeschwörung beschwören, aber lege sie unters Deck, wenn sie das Spielfeld verlässt. Du kannst jeden Effekt von „Losgekettete Oni von Shara“ nur einmal pro Spielzug verwenden.
  es: |-
    Durante la Main Phase (Efecto Rápido): puedes descartar esta carta; Invoca de Modo Especial 1 monstruo Demonio desde tu mano, y después destruye 1 carta que controles. Si una o más cartas en el Campo son destruidas por el efecto de una carta (excepto el efecto de "Oni Desencadenada de Shara") o en batalla, mientras esta carta está en tu Cementerio: puedes añadir esta carta a tu mano o Invocarla de Modo Especial, pero ponla en la parte inferior del Deck cuando deje el Campo. Sólo puedes usar cada efecto de "Oni Desencadenada de Shara" una vez por turno.
  fr: |-
    Durant la Main Phase (Effet Rapide) : vous pouvez défausser cette carte ; Invoquez Spécialement 1 monstre Démon depuis votre main, puis détruisez 1 carte que vous contrôlez. Si une ou plusieurs cartes sur le Terrain sont détruites par un effet de carte (sauf par l'effet de "Oni Désenchaînée de Shara") ou au combat, tant que cette carte est dans votre Cimetière : vous pouvez ajouter cette carte à votre main ou l'Invoquer Spécialement, mais placez-la au-dessous du Deck lorsqu'elle quitte le Terrain. Vous ne pouvez utiliser chaque effet de "Oni Désenchaînée de Shara" qu'une fois par tour.
  it: |-
    Durante la Main Phase (Effetto Rapido): puoi scartare questa carta; Evoca Specialmente 1 mostro Demone dalla tua mano, poi distruggi 1 carta che controlli. Se una o più carte sul Terreno vengono distrutte dall'effetto di una carta (eccetto l'effetto di "Oni Svincolata della Shara") o in battaglia, mentre questa carta è nel tuo Cimitero: puoi aggiungere questa carta alla tua mano o Evocarla Specialmente, ma mettila in fondo al Deck quando lascia il Terreno. Puoi utilizzare ogni effetto di "Oni Svincolata della Shara" una sola volta per turno.
  pt: |-
    Durante a Fase Principal (Efeito Rápido): você pode descartar este card; Invoque por Invocação-Especial 1 monstro Demônio da sua mão e, depois, destrua 1 card que você controla. Se um ou mais cards no campo forem destruídos por um efeito de card (exceto o efeito de "Oni Desacorrentada de Shara") ou em batalha, enquanto este card estiver no seu Cemitério: você pode adicionar este card à sua mão ou Invocá-lo por Invocação-Especial, mas coloque-o no fundo do Deck quando ele deixar o campo. Você só pode usar cada efeito de "Oni Desacorrentada de Shara" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分・相手のメインフェイズに、このカードを手札から捨てて発動できる。手札から悪魔族モンスター１体を特殊召喚する。その後、自分フィールドのカード１枚を破壊する。②：このカードが墓地に存在する状態で、フィールドのカードが戦闘または「破械式鬼シャラ」以外のカードの効果で破壊された場合に発動できる。このカードを手札に加えるか特殊召喚する。この効果で特殊召喚したこのカードは、フィールドから離れた場合にデッキの一番下に戻る。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 / 상대의 메인 페이즈에, 이 카드를 패에서 버리고 발동할 수 있다. 패에서 악마족 몬스터 1장을 특수 소환한다. 그 후, 자신 필드의 카드 1장을 파괴한다. ②: 이 카드가 묘지에 존재하는 상태에서, 필드의 카드가 전투 또는 "언체인드식귀 샤라" 이외의 카드의 효과로 파괴되었을 경우에 발동할 수 있다. 이 카드를 패에 넣거나 특수 소환한다. 이 효과로 특수 소환한 이 카드는, 필드에서 벗어났을 경우에 덱 맨 아래로 되돌아간다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：在自己・对手的主要阶段，从手牌将此卡舍弃可以发动。从手牌将1只恶魔族怪兽特殊召唤。然后，将自己场上的1张卡破坏。②：此卡存在于墓地的状态下，场上的卡因战斗或“破械式鬼 奢罗”以外的卡的效果被破坏的情况下可以发动。将此卡加入手牌或特殊召唤。以此效果特殊召唤的此卡从场上离开的情况下，放回牌组最下面。
