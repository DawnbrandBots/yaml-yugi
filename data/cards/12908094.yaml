name:
  en: Gagaga Magician - Gagaga Magic
  de: Gagaga-Magier - Gagaga-Magie
  es: Mago Gagaga - Magia Gagaga
  fr: Magicien Gagaga - Magie Gagaga
  it: Mago Gagaga - Magia Gagaga
  pt: Mago Gagaga - Magia Gagaga
  ja: ガガガマジシャン－ガガガマジック
  ja_romaji: Gagaga Majishan - Gagaga Majikku
  ko: 가가가 매지션－가가가 매직
  ko_rr:
  zh-TW:
  zh-CN: 我我我魔术师－我我我魔术
text:
  en: |-
    If this card is in your hand: You can Special Summon both this card and 1 "Zubaba", "Gagaga", "Gogogo", or "Dododo" monster from your hand or GY, except "Gagaga Magician - Gagaga Magic", then immediately after this effect resolves, Xyz Summon 1 "Zubaba", "Gagaga", "Gogogo", "Dododo", "Djinn", "Heroic Champion", "Number", "ZW -", or "ZS -" Xyz Monster using only those 2 monsters. When you do, treat the Level of 1 of the monsters the same as the other monster's. You can only use this effect of "Gagaga Magician - Gagaga Magic" once per turn.
  de: |-
    Falls sich diese Karte in deiner Hand befindet: Du kannst sowohl diese Karte als auch 1 „Zubaba“-, „Gagaga“-, „Gogogo“- oder „Dododo“-Monster als Spezialbeschwörung von deiner Hand oder deinem Friedhof beschwören, außer „Gagaga-Magier - Gagaga-Magie“, dann, sofort nachdem dieser Effekt aufgelöst wurde, beschwöre 1 „Zubaba“-, „Gagaga“-, „Gogogo“-, „Dododo“-, „Dschinn“-, „Heroischer Champion“-, „Nummer“-, „ZW -“- oder „ZS -“-Xyz-Monster als Xyz-Beschwörung, indem du nur jene 2 Monster verwendest. Wenn du dies tust, behandle die Stufe von 1 der Monster als dieselbe wie die des anderen Monsters. Du kannst diesen Effekt von „Gagaga-Magier - Gagaga-Magie“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta está en tu mano: puedes Invocar de Modo Especial, desde tu mano o Cementerio, esta carta y 1 monstruo "Zubaba", "Gagaga", "Gogogo", o "Dododo", excepto "Mago Gagaga - Magia Gagaga", e inmediatamente después de que se resuelva este efecto, Invoca Xyz 1 Monstruo Xyz "Zubaba", "Gagaga", "Gogogo", "Dododo", "Genio", "Campeón Heroico", "Número", "ZW -" o "ZS -" usando sólo esos 2 monstruos. Cuando lo haces, trata el Nivel de 1 de los monstruos como el mismo del otro monstruo. Sólo puedes usar este efecto de "Mago Gagaga - Magia Gagaga" una vez por turno.
  fr: |-
    Si cette carte est dans votre main : vous pouvez Invoquer Spécialement cette carte ainsi qu'1 monstre "Zubaba", "Gagaga", "Gogogo" ou "Dododo" ("Magicien Gagaga - Magie Gagaga" exclu) depuis votre main ou Cimetière, puis immédiatement après la résolution de cet effet, Invoquez par Xyz 1 Monstre Xyz "Zubaba", "Gagaga", "Gogogo", "Dododo", "Génie", "Champion Héroïque", "Numéro", "ZW -" ou "ZS -" en utilisant uniquement ces 2 monstres. Lorsque vous le faites, traitez le Niveau d'1 des monstres comme le même que celui de l'autre monstre. Vous ne pouvez utiliser cet effet de "Magicien Gagaga - Magie Gagaga" qu'une fois par tour.
  it: |-
    Se questa carta è nella tua mano: puoi Evocare Specialmente sia questa carta che 1 mostro "Zubaba", "Gagaga", "Gogogo" o "Dododo" dalla tua mano o Cimitero, eccetto "Mago Gagaga - Magia Gagaga", poi immediatamente dopo che questo effetto si è risolto, Evoca Xyz 1 Mostro Xyz "Zubaba", "Gagaga", "Gogogo", "Dododo", "Djinn", "Campione Eroico", "Numero", "ZW -" o "ZS -" utilizzando solo quei 2 mostri. Quando lo fai, considera il Livello di 1 dei mostri lo stesso dell'altro mostro. Puoi utilizzare questo effetto di "Mago Gagaga - Magia Gagaga" una sola volta per turno.
  pt: |-
    Se este card estiver na sua mão: você pode Invocar por Invocação-Especial tanto este card quanto 1 monstro "Zubaba", "Gagaga", "Gogogo" ou "Dododo" da sua mão ou do Cemitério, exceto "Mago Gagaga - Magia Gagaga" e, depois, imediatamente depois que este efeito resolver, Invoque por Invocação-Xyz 1 Monstro Xyz "Zubaba", "Gagaga", "Gogogo", "Dododo", "Djinn", "Campeão Heroico", "Número", "ZW -" ou "ZS -" usando apenas esses 2 monstros. Ao fazê-lo, considere o Nível de 1 desses monstros como o mesmo que o do outro monstro. Você só pode usar este efeito de "Mago Gagaga - Magia Gagaga" uma vez por turno.
  ja: |-
    このカード名の効果は１ターンに１度しか使用できない。①：このカードが手札に存在する場合に発動できる。「ガガガマジシャン－ガガガマジック」以外の自分の手札・墓地の「ズババ」、「ガガガ」、「ゴゴゴ」、「ドドド」モンスター１体と、このカードを特殊召喚し、その２体のみを素材として「ズババ」、「ガガガ」、「ゴゴゴ」、「ドドド」、「魔人」、「Ｈ－Ｃ」、「Ｎｏ．」、「ＺＷ」、「ＺＳ」Ｘモンスター１体のＸ召喚を行う。その際、Ｘ素材とするモンスター１体のレベルは、もう１体のモンスターと同じレベルとして扱う。
  ko: |-
    이 카드명의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드가 패에 존재할 경우에 발동할 수 있다. "가가가 매지션－가가가 매직" 이외의 자신의 패 / 묘지의 "주바바", "가가가", "고고고", "도도도" 몬스터 1장과, 이 카드를 특수 소환하고, 그 2장만을 소재로서 "주바바", "가가가", "고고고", "도도도", "마인(魔人)", "H－C(히로익 챔피언)", "No.", "ZW(제알 웨폰)", "ZS(제알 서버스)" 엑시즈 몬스터 1장의 엑시즈 소환을 실행한다. 그 시기에, 엑시즈 소재로 하는 몬스터 1장의 레벨은, 나머지 1장의 몬스터와 같은 레벨로 취급한다.
  zh-TW:
  zh-CN: |-
    此卡名的效果1回合仅可使用1次。①：此卡存在于手牌的情况下可以发动。将“我我我魔术师－我我我魔术”以外的、自己手牌・墓地的1只“刷拉拉”、“我我我”、“隆隆隆”、“怒怒怒”怪兽、与此卡特殊召唤，仅以该2只作为素材进行1只“刷拉拉”、“我我我”、“隆隆隆”、“怒怒怒”、“魔人”、“英豪胜利者”、“编号”、“ZEXAL兵器”、“ZEXAL从者”超量怪兽的超量召唤。在此之际，要作为超量素材的1只怪兽的等级可视为与另1只怪兽的等级相同。
