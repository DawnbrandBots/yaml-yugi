text:
  en: |-
    You can Ritual Summon this card with any "Zenet" card. This card equipped with an Equip Card is unaffected by your opponent's activated effects. You can only use each of the following effects of "Zenetnakht Sphinx" once per turn. You can discard this card; add 1 "Zenet" card from your Deck to your hand, except "Zenetnakht Sphinx". (Quick Effect): You can send 1 face-up Normal Monster Card you control to the GY; change as many monsters your opponent controls as possible to face-down Defense Position, then you can Special Summon 1 Normal Monster from your GY.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「セネト」カードにより降臨
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から捨てて発動できる。デッキから「セネトナクト・スフィンクス」以外の「セネト」カード１枚を手札に加える。②：装備カードを装備しているこのカードは相手が発動した効果を受けない。③：自分・相手ターンに、自分フィールドの表側表示の通常モンスターカード１枚を墓地へ送って発動できる。相手フィールドのモンスターを全て裏側守備表示にする。その後、自分の墓地から通常モンスター１体を特殊召喚できる。
  ko:
  zh-TW:
  zh-CN: |-
    以“塞尼特”卡降临
    此卡名的①③效果1回合仅可各使用1次。①：从手牌将此卡舍弃可以发动。从牌组将“塞尼特纳赫特・斯芬克斯”以外的1张“塞尼特”卡加入手牌。②：装备有装备卡的此卡不受对手发动的效果影响。③：在自己・对手回合中，将自己场上的1张表侧表示的通常怪兽卡送至墓地可以发动。将对手场上的怪兽全部改成里侧守备表示。然后，可从自己墓地将1只通常怪兽特殊召唤。
