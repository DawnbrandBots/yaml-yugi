name:
  en: Ashtra's Howl
  de: Ashtras Heulen
  es: Aullido de Ashtra
  fr: Hurlement d'Ashtra
  it: Ululato di Ashtra
  pt: Uivo de Ashtra
  ja: <ruby>依鬼<rt>アシュトラ</rt></ruby>の<ruby>呪<rt>じゅ</rt></ruby><ruby>咆<rt>ほう</rt></ruby>
  ja_romaji: Ashutora no Juhō
  ko:
  ko_rr:
