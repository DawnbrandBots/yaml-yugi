text:
  en: |-
    You can target up to 3 cards you control; destroy them, and if you do, Special Summon this card from your hand, then you can apply any of the following effects, in sequence, based on the original types of the destroyed cards.
    ● Monster: Draw 1 card.
    ● Spell: Change the battle position of 1 monster on the field.
    ● Trap: Destroy 1 other card on the field.
    If this card on the field is destroyed by card effect: You can destroy all monsters on the field. You can only use each effect of "Unchained Malevolent Magistrate Kamura" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのカードを３枚まで対象として発動できる。そのカードを破壊し、このカードを手札から特殊召喚する。その後、破壊したカードの元々の種類によって以下の効果をそれぞれ適用できる。●モンスター：自分は１枚ドローする。●魔法：フィールドのモンスター１体の表示形式を変更する。●罠：フィールドの他のカード１枚を破壊する。②：フィールドのこのカードが効果で破壊された場合に発動できる。フィールドのモンスターを全て破壊する。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드의 카드를 3장까지 대상으로 하고 발동할 수 있다. 그 카드를 파괴하고, 이 카드를 패에서 특수 소환한다. 그 후, 파괴한 카드의 원래의 종류에 따라 이하의 효과를 각각 적용할 수 있다. ●몬스터: 자신은 1장 드로우한다. ●마법: 필드의 몬스터 1장의 표시 형식을 변경한다. ●함정: 필드의 다른 카드 1장을 파괴한다. ②: 필드의 이 카드가 효과로 파괴되었을 경우에 발동할 수 있다. 필드의 몬스터를 전부 파괴한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：以自己场上的最多3张卡为对象可以发动。将该卡破坏，从手牌将此卡特殊召唤。然后，根据所破坏的卡的原本的种类，可分别适用以下效果。●怪兽：自己抽1张。●魔法：变更场上的1只怪兽的表示形式。●陷阱：将场上的1张其他卡破坏。②：场上的此卡因效果被破坏的情况下可以发动。将场上的怪兽全部破坏。
