  en: |-
    If this card is Normal or Special Summoned: You can Special Summon 1 WATER Cyberse monster with 1000 or less ATK from your Deck, also you cannot Special Summon for the rest of this turn, except WATER monsters. If you Link Summon a "Marincess" Link Monster(s), while this card is in your GY: You can banish this card; equip 1 "Marincess" monster from your GY to 1 of those Link Monsters as an Equip Spell that gives it 600 ATK. You can only use each effect of "Marincess Azuri" once per turn.
