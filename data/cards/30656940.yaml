    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合に発動できる。デッキから攻撃力１０００以下のサイバース族・水属性モンスター１体を特殊召喚する。このターン、自分は水属性モンスターしか特殊召喚できない。②：このカードが墓地に存在する状態で、自分が「マリンセス」ＬモンスターをＬ召喚した場合、このカードを除外して発動できる。そのＬモンスター１体に自分の墓地から「マリンセス」モンスター１体を攻撃力６００アップの装備魔法カード扱いで装備する。
