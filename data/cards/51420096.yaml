  zh-CN: 魔救奇石－提亚马特石
text:
  en: |-
    If this card is Special Summoned by the effect of an "Adamancipator" card: You can add 1 "Adamancipator" card from your Deck to your hand, except "Adamancipator Crystal - Tiamite", then you can Special Summon 1 Rock monster from your hand. If this card is in your GY: You can target 1 Rock Synchro Monster in your field or GY; return it to the Extra Deck, and if you do, place this card on top of the Deck. You can only use each effect of "Adamancipator Crystal - Tiamite" once per turn.
  de: |-
    Falls diese Karte durch den Effekt einer „Steinbefreier“-Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 „Steinbefreier“-Karte von deinem Deck hinzufügen, außer „Steinbefreier-Kristall - Tiamit“, dann kannst du 1 Fels-Monster als Spezialbeschwörung von deiner Hand beschwören. Falls sich diese Karte in deinem Friedhof befindet: Du kannst 1 Fels-Synchromonster auf deiner Spielfeldseite oder in deinem Friedhof wählen; lege es ins Extra Deck zurück und falls du dies tust, lege diese Karte aufs Deck. Du kannst jeden Effekt von „Steinbefreier-Kristall - Tiamit“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta es Invocada de Modo Especial por el efecto de una carta "Adamancipador": puedes añadir a tu mano 1 carta "Adamancipador" en tu Deck, excepto "Cristal Adamancipador - Tiamita", y después puedes Invocar de Modo Especial 1 monstruo Roca desde tu mano. Si esta carta está en tu Cementerio: puedes seleccionar 1 Monstruo de Sincronía Roca en tu Campo o Cementerio; devuélvelo al Deck Extra y, si lo haces, pon esta carta en la parte superior del Deck. Sólo puedes usar cada efecto de "Cristal Adamancipador - Tiamita" una vez por turno.
  fr: |-
    Si cette carte est Invoquée Spécialement par l'effet d'une carte "Inflexcipateur" : vous pouvez ajouter 1 carte "Inflexcipateur" ("Cristal Inflexcipateur - Tiamite" exclu) depuis votre Deck à votre main, puis vous pouvez Invoquer Spécialement 1 monstre Rocher depuis votre main. Si cette carte est dans votre Cimetière : vous pouvez cibler 1 Monstre Synchro Rocher dans votre Terrain ou Cimetière ; renvoyez-le à l'Extra Deck, et si vous le faites, placez cette carte au-dessus du Deck. Vous ne pouvez utiliser chaque effet de "Cristal Inflexcipateur - Tiamite" qu'une fois par tour.
  it: |-
    Se questa carta viene Evocata Specialmente dall'effetto di una carta "Irremovibilatore": puoi aggiungere 1 carta "Irremovibilatore" dal tuo Deck alla tua mano, eccetto "Irremovibilatore Cristallo - Tiamite", poi puoi Evocare Specialmente 1 mostro Roccia dalla tua mano. Se questa carta è nel tuo Cimitero: puoi scegliere come bersaglio 1 Mostro Synchro Roccia nel tuo Terreno o Cimitero; fallo ritornare nell'Extra Deck e, se lo fai, metti questa carta in cima al Deck. Puoi utilizzare ogni effetto di "Irremovibilatore Cristallo - Tiamite" una sola volta per turno.
  pt: |-
    Se este card for Invocado por Invocação-Especial pelo efeito de um card "Adamancipador": você pode adicionar 1 card "Adamancipador" do seu Deck à sua mão, exceto "Cristal Adamancipador - Tiamita" e, depois, você pode Invocar por Invocação-Especial 1 monstro Rocha da sua mão. Se este card estiver no seu Cemitério: você pode escolher 1 Monstro Sincro Rocha no seu campo ou Cemitério; devolva-o para o Deck Adicional e, se isso acontecer, coloque este card no topo do Deck. Você só pode usar cada efeito de "Cristal Adamancipador - Tiamita" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが「アダマシア」カードの効果で特殊召喚した場合に発動できる。デッキから「魔救の奇石－ティアマイト」以外の「アダマシア」カード１枚を手札に加える。その後、手札から岩石族モンスター１体を特殊召喚できる。②：このカードが墓地に存在する場合、自分のフィールド・墓地の岩石族Ｓモンスター１体を対象として発動できる。そのモンスターをＥＸデッキに戻し、このカードをデッキの一番上に戻す。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：此卡以“魔救”卡的效果特殊召唤的情况下可以发动。从牌组将“魔救奇石－提亚马特石”以外的1张“魔救”卡加入手牌。然后，可从手牌将1只岩石族怪兽特殊召唤。②：此卡存在于墓地的情况下，以自己场上・墓地的1只岩石族同步怪兽为对象可以发动。将该怪兽放回额外牌组，将此卡放回牌组最上面。
