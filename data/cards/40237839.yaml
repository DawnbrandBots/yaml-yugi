name:
  en: Winged Kuriboh Sabatiel LV10
  de: Geflügelter Kuriboh Sabatiel LV10
  es: Kuriboh Alado Sabatiel LV10
  fr: Kuriboh Ailé Sabatier LV10
  it: Kuriboh Alato Sabatiel LV10
  pt: Kuriboh Alado Sabatiel LV 10
  ja: ハネクリボー・サバティエル <ruby>ＬＶ<rt>レベル</rt></ruby>１０
  ja_romaji: Hane Kuribō Sabatieru Reberu Ten
  ko: 날개 크리보 사바티엘 LV10
  ko_rr:
  zh-TW: 羽翼庫里波・薩巴希爾 LV10
  zh-CN: 羽翼库里波・萨巴希尔 LV10
text:
  en: |-
    You can reveal this card in your hand and pay half your LP; add 1 "Polymerization" Spell or "Fusion" Spell from your Deck to your hand, and if you do, shuffle this card into the Deck, also for the rest of this turn, you cannot Special Summon from the Extra Deck, except "HERO" monsters. During your opponent's turn, if your LP are 1000 or less (Quick Effect): You can Special Summon this card from your hand, then you can inflict damage to your opponent equal to the highest ATK among the monsters they control. You can only use each effect of "Winged Kuriboh Sabatiel LV10" once per turn.
  de: |-
    Du kannst diese Karte in deiner Hand vorzeigen und die Hälfte deiner LP zahlen; füge deiner Hand 1 „Polymerisation“-Zauber oder „Fusion“-Zauber von deinem Deck hinzu und falls du dies tust, mische diese Karte ins Deck, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von „HELD“-Monstern. Während des Spielzugs deines Gegners, falls du 1000 oder weniger LP hast (Schnelleffekt): Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören, dann kannst du deinem Gegner Schaden in Höhe der höchsten ATK unter den Monstern zufügen, die er kontrolliert. Du kannst jeden Effekt von „Geflügelter Kuriboh Sabatiel LV10“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes mostrar esta carta en tu mano y pagar la mitad de tus LP; añade a tu mano 1 Mágica "Polimerización" o Mágica "Fusión" en tu Deck y, si lo haces, baraja esta carta al Deck, y además por el resto de este turno no puedes Invocar de Modo Especial desde el Deck Extra, excepto monstruos "HÉROE". Durante el turno de tu adversario, si tus LP son 1000 o menos (Efecto Rápido): puedes Invocar esta carta de Modo Especial desde tu mano, y después puedes infligir daño a tu adversario igual al mayor ATK de entre los monstruos que controle. Sólo puedes usar cada efecto de "Kuriboh Alado Sabatiel LV10" una vez por turno.
  fr: |-
    Vous pouvez révéler cette carte dans votre main, et payez la moitié de vos LP ; ajoutez 1 Magie "Polymérisation" ou Magie "Fusion" depuis votre Deck à votre main, et si vous le faites, mélangez cette carte dans le Deck, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres "HÉROS" exclus) depuis l'Extra Deck le reste de ce tour. Durant le tour de votre adversaire, si vos LP sont inférieurs ou égaux à 1000 (Effet Rapide) : vous pouvez Invoquer Spécialement cette carte depuis votre main, puis vous pouvez infliger des dommages à votre adversaire égaux à la plus haute ATK parmi les monstres qu'il contrôle. Vous ne pouvez utiliser chaque effet de "Kuriboh Ailé Sabatier LV10" qu'une fois par tour.
  it: |-
    Puoi rivelare questa carta nella tua mano e pagare la metà dei tuoi LP; aggiungi 1 Magia "Polimerizzazione" o Magia "Fusione" dal tuo Deck alla tua mano e, se lo fai, mischia questa carta nel Deck, inoltre per il resto di questo turno, non puoi Evocare Specialmente dall'Extra Deck, eccetto mostri "EROE". Durante il turno del tuo avversario, se i tuoi LP sono 1000 o inferiori (Effetto Rapido): puoi Evocare Specialmente questa carta dalla tua mano, poi puoi infliggere al tuo avversario danno pari all'ATK più alto tra i mostri che controlla. Puoi utilizzare ogni effetto di "Kuriboh Alato Sabatiel LV10" una sola volta per turno.
  pt: |-
    Você pode revelar este card na sua mão e pagar metade dos seus PV; adicione 1 Magia "Polimerização" ou Magia "Fusão" do seu Deck à sua mão e, se isso acontecer, embaralhe este card no Deck e, além disso, pelo resto deste turno, você não pode Invocar por Invocação-Especial do Deck Adicional, exceto monstros "HERÓI". Durante o turno do seu oponente, se seus PV forem 1000 ou menos (Efeito Rápido): você pode Invocar este card por Invocação-Especial da sua mão e, depois, você pode causar dano ao seu oponente igual ao maior ATK entre os monstros que ele controla. Você só pode usar cada efeito de "Kuriboh Alado Sabatiel LV 10" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：手札のこのカードを相手に見せ、ＬＰを半分払って発動できる。デッキから「融合」魔法カードか「フュージョン」魔法カード１枚を手札に加え、このカードをデッキに戻す。このターン、自分は「ＨＥＲＯ」モンスターしかＥＸデッキから特殊召喚できない。②：相手ターンに、自分のＬＰが１０００以下の場合に発動できる。このカードを手札から特殊召喚する。その後、相手フィールドのモンスターの一番高い攻撃力分のダメージを相手に与える事ができる。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 패의 이 카드를 상대에게 보여주고, LP를 절반 지불하여 발동할 수 있다. 덱에서 "융합" 마법 카드나 "퓨전" 마법 카드 1장을 패에 넣고, 이 카드를 덱으로 되돌린다. 이 턴에, 자신은 "히어로" 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. ②: 상대 턴에, 자신의 LP가 1000 이하일 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 그 후, 상대 필드의 몬스터의 가장 높은 공격력만큼의 데미지를 상대에게 줄 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：向对手出示手牌的此卡，支付一半LP可以发动。从牌组将1张“融合”魔法卡或“结合”魔法卡加入手牌，将此卡放回牌组。此回合，自己从额外牌组仅可特殊召唤“－英雄”怪兽。②：在对手回合中，自己的LP在1000以下的情况下可以发动。从手牌将此卡特殊召唤。然后，可给予对手相当于对手场上的怪兽中最高攻击力数值的伤害。
