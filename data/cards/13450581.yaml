text:
  en: |-
    Can make up to 2 attacks on monsters during each Battle Phase. You can only use each of the following effects of "Knight of Twin Swords" once per turn. If this card is in your hand and you control a card with an effect that requires a die roll: You can Special Summon this card. During your Main Phase: You can roll a six-sided die 3 times, and if you do, this card gains ATK equal to the total x 350 (until the end of this turn), then if 2 or more of the results were the same, you can Special Summon 1 monster from your hand.
