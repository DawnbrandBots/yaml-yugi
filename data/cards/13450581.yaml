    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在し、サイコロを振る効果を持つカードが自分フィールドに存在する場合に発動できる。このカードを特殊召喚する。②：自分メインフェイズに発動できる。サイコロを３回振る。このカードの攻撃力はターン終了時まで、出た目の合計×３５０アップする。同じ目が２つ以上出た場合、さらに手札からモンスター１体を特殊召喚できる。③：このカードは１度のバトルフェイズ中に２回までモンスターに攻撃できる。
