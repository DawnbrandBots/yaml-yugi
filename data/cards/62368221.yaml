name:
  en: Ars Magna the Corruption and the Purification
  de: Ars Magna des Verderbens und der Reinigung
  es: Ars Magna la Corrupción y la Purificación
  fr: Ars Magna la Corruption et la Purification
  it: Ars Magna la Corruzione e la Purificazione
  pt: Ars Magna, a Corrupção e a Purificação
  ja: <ruby>浄<rt>じょう</rt></ruby><ruby>化<rt>か</rt></ruby>と<ruby>腐<rt>ふ</rt></ruby><ruby>敗<rt>はい</rt></ruby>のアルス＝マグナ
  ja_romaji: Jōka to Fuhai no Arusu=Maguna
  ko:
  ko_rr:
  zh-TW:
  zh-CN: 净化与腐败之奥艺
text:
  en: |-
    You can banish this card from your hand; add 1 "Ars Magna" Spell/Trap from your Deck to your hand, also until the end of the next turn, the first three times each "Power Patron" Link Monster you control would be destroyed by battle, it is not destroyed. If an Xyz or Link Monster(s) is Special Summoned, while this card is banished (except during the Damage Step): You can Special Summon this card. You can target Spells/Traps on the field, up to the number of "Power Patron" Link Monsters you control; banish them. You can only use each effect of "Ars Magna the Corruption and the Purification" once per turn.
  de: |-
    Du kannst diese Karte von deiner Hand verbannen; füge deiner Hand 1 „Ars Magna“-Zauber/Falle von deinem Deck hinzu, zusätzlich wird bis zum Ende des nächsten Spielzugs jedes „Machtpatron“-Linkmonster, das du kontrollierst, die ersten drei Male, die es durch Kampf zerstört würde, nicht zerstört. Falls ein oder mehr Xyz- oder Linkmonster als Spezialbeschwörung beschworen werden, solange diese Karte verbannt ist (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung beschwören. Du kannst Zauber/Fallen auf dem Spielfeld bis zur Anzahl der „Machtpatron“-Linkmonster wählen, die du kontrollierst; verbanne sie. Du kannst jeden Effekt von „Ars Magna des Verderbens und der Reinigung“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes desterrar esta carta en tu mano; añade a tu mano 1 Mágica/Trampa "Ars Magna" en tu Deck y además, hasta el final del próximo turno, las primeras tres veces que cada Monstruo de Enlace "Modelo de Poder" que controlas fuera a ser destruido en batalla, no es destruido. Si uno o más Monstruos Xyz o de Enlace son Invocados de Modo Especial, mientras esta carta está desterrada (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial. Puedes seleccionar hasta tantas Mágicas/Trampas en el Campo como el número de Monstruos de Enlace "Modelo de Poder" que controlas; destiérralas. Sólo puedes usar cada efecto de "Ars Magna la Corrupción y la Purificación" una vez por turno.
  fr: |-
    Vous pouvez bannir cette carte depuis votre main ; ajoutez 1 Magie/Piège "Ars Magna" depuis votre Deck à votre main, et aussi, jusqu'à la fin du prochain tour, les trois premières fois que chaque Monstre Lien "Mécène du Pouvoir" que vous contrôlez va être détruit au combat, il n'est pas détruit. Si un ou plusieurs Monstres Xyz ou Lien sont Invoqués Spécialement, tant que cette carte est bannie (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte. Vous pouvez cibler un nombre de Magies/Pièges sur le Terrain, inférieur ou égal au nombre de Monstres Lien "Mécène du Pouvoir" que vous contrôlez ; bannissez-les. Vous ne pouvez utiliser chaque effet de "Ars Magna la Corruption et la Purification" qu'une fois par tour.
  it: |-
    Puoi bandire questa carta dalla tua mano; aggiungi 1 Magia/Trappola "Ars Magna" dal tuo Deck alla tua mano, inoltre fino alla fine del prossimo turno, le prime tre volte che ogni Mostro Link "Patrono Potente" che controlli sta per essere distrutto in battaglia, non viene distrutto. Se uno o più Mostri Xyz o Link vengono Evocati Specialmente, mentre questa carta è bandita (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta. Puoi scegliere come bersaglio Magie/Trappole sul Terreno, fino al numero di Mostri Link "Patrono Potente" che controlli; bandiscile. Puoi utilizzare ogni effetto di "Ars Magna la Corruzione e la Purificazione" una sola volta per turno.
  pt: |-
    Você pode banir este card da sua mão; adicione 1 Magia/Armadilha "Ars Magna" do seu Deck à sua mão e, além disso, até o final do próximo turno, nas primeiras três vezes que cada Monstro Link "Patrono(a) do Poder" que você controla seria destruído em batalha, ele não é destruído. Se um ou mais Monstros Xyz ou Link forem Invocados por Invocação-Especial, enquanto este card estiver banido (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial. Você pode escolher Magias/Armadilhas no campo, até o número de Monstros Link "Patrono(a) do Poder" que você controla; bana-os. Você só pode usar cada efeito de "Ars Magna, a Corrupção e a Purificação" uma vez por turno.
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から除外して発動できる。デッキから「アルス＝マグナ」魔法・罠カード１枚を手札に加える。次のターンの終了時まで、自分の「獄神」Ｌモンスターはそれぞれ１ターンに３度まで戦闘では破壊されない。②：このカードが除外状態で、Ｘ・Ｌモンスターが特殊召喚された場合に発動できる。このカードを特殊召喚する。③：自分フィールドの「獄神」Ｌモンスターの数まで、フィールドの魔法・罠カードを対象として発動できる。そのカードを除外する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：从手牌将此卡除外可以发动。从牌组将1张“奥艺”魔法・陷阱卡加入手牌。直至下个回合结束时为止，自己的“狱神”连接怪兽1回合各最多3次，不会因战斗被破坏。②：此卡为除外状态，且超量・连接怪兽被特殊召唤的情况下可以发动。将此卡特殊召唤。③：以自己场上的“狱神”连接怪兽的数量为上限，以场上的魔法・陷阱卡为对象可以发动。将该卡除外。
