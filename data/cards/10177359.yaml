text:
  en: |-
    While you control a "Reindsurm" monster whose original Level is 8 or higher or your opponent has a Dragon monster in their field or GY, the activated effects of your "Reindsurm" monsters cannot be negated. Once per turn: You can send 1 "Reindsurm" monster or Dragon monster from your hand or face-up field to the GY; add 1 Insect monster from your Deck to your hand with the same original Level, but a different original name.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：自分フィールドに元々のレベルが８以上の「リインゼルム」モンスターが存在する限り、または相手のフィールドか墓地にドラゴン族モンスターが存在する限り、自分が発動した「リインゼルム」モンスターの効果は無効化されない。②：１ターンに１度、自分の手札・フィールド（表側表示）から「リインゼルム」モンスターかドラゴン族モンスター１体を墓地へ送って発動できる。そのモンスターとは元々のカード名が異なり、元々のレベルが同じ昆虫族モンスター１体をデッキから手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    ①：只要自己场上存在原本等级为8以上的“轮回虫龙”怪兽，或只要对手场上或墓地存在龙族怪兽，自己发动的“轮回虫龙”怪兽的效果不会被无效化。②：1回合1次，从自己手牌・场上（表侧表示）将1只“轮回虫龙”怪兽或龙族怪兽送至墓地可以发动。从牌组将1只与该怪兽原本卡名不同，原本等级相同的昆虫族怪兽加入手牌。
