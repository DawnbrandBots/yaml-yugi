  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：墓地からモンスターを特殊召喚する効果を含む、カードの効果を相手が発動した時に発動できる。その効果を無効にし、相手の墓地からモンスター１体を相手フィールドに特殊召喚する。その後、相手フィールドの表側表示モンスターを任意の数だけ墓地へ送る（攻撃力の合計は６０００まで）。②：このカードが除外された場合に発動できる。このカードを手札に加える。その後、１体以上のリリースを必要とする手札のモンスター１体の召喚をリリースなしで行う事ができる。
