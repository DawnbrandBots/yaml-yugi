name:
  en: Cyber Dragon, the Luminous Mech Dragon
  de: Cyber Drache, der leuchtende Mech-Drache
  es: Ciber Dragón, el Dragón Mech Brillante
  fr: Cyber Dragon, le Dragon Méca Lumineux
  it: Cyber Drago, il Drago Mech Luminoso
  pt: Dragão Cibernético, o Dragão Mecha Brilhante
  ja: <ruby>機<rt>き</rt></ruby><ruby>光<rt>こう</rt></ruby><ruby>竜<rt>りゅう</rt></ruby>－サイバー・ドラゴン
  ja_romaji: Kikōryū - Saibā Doragon
  ko: 기광룡－사이버 드래곤
  ko_rr:
  zh-TW: 機光龍－電子龍
  zh-CN: 机光龙－电子龙
text:
  en: |-
    If you control no monsters, you can Special Summon this card (from your hand). You can only use each of the following effects of "Cyber Dragon, the Luminous Mech Dragon" once per turn. If this card is Special Summoned: You can target 1 face-up monster your opponent controls; negate its effects until the end of this turn. During your Main Phase: You can Fusion Summon 1 Machine Fusion Monster from your Extra Deck, using this card you control and monsters from your hand or field.
  de: |-
    Falls du keine Monster kontrollierst, kannst du diese Karte als Spezialbeschwörung (von deiner Hand) beschwören. Du kannst jeden der folgenden Effekte von „Cyber Drache, der leuchtende Mech-Drache“ nur einmal pro Spielzug verwenden. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 offenes Monster wählen, das dein Gegner kontrolliert; annulliere bis zum Ende dieses Spielzugs seine Effekte. Während deiner Main Phase: Du kannst 1 Maschine-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du diese Karte, die du kontrollierst, und Monster von deiner Hand oder Spielfeldseite verwendest.
  es: |-
    Si no controlas monstruos, puedes Invocar esta carta de Modo Especial (desde tu mano). Sólo puedes usar cada uno de los siguientes efectos de "Ciber Dragón, el Dragón Mech Brillante" una vez por turno. Si esta carta es Invocada de Modo Especial: puedes seleccionar 1 monstruo boca arriba que controle tu adversario; niega sus efectos hasta el final de este turno. Durante tu Main Phase: puedes Invocar por Fusión 1 Monstruo de Fusión Máquina desde tu Deck Extra, usando esta carta que controlas y monstruos en tu mano o Campo.
  fr: |-
    Si vous ne contrôlez aucun monstre, vous pouvez Invoquer Spécialement cette carte (depuis votre main). Vous ne pouvez utiliser chacun des effets suivants de "Cyber Dragon, le Dragon Méca Lumineux" qu'une fois par tour. Si cette carte est Invoquée Spécialement : vous pouvez cibler 1 monstre face recto contrôlé par votre adversaire ; jusqu'à la fin de ce tour, annulez ses effets. Durant votre Main Phase : vous pouvez Invoquer par Fusion 1 Monstre Fusion Machine depuis votre Extra Deck, en utilisant cette carte que vous contrôlez et des monstres depuis votre main ou Terrain.
  it: |-
    Se non controlli nessun mostro, puoi Evocare Specialmente questa carta (dalla tua mano). Puoi utilizzare ognuno dei seguenti effetti di "Cyber Drago, il Drago Mech Luminoso" una sola volta per turno. Se questa carta viene Evocata Specialmente: puoi scegliere come bersaglio 1 mostro scoperto controllato dal tuo avversario; annulla i suoi effetti fino alla fine di questo turno. Durante la tua Main Phase: puoi Evocare tramite Fusione 1 Mostro Fusione Macchina dal tuo Extra Deck, utilizzando questa carta che controlli e mostri dalla tua mano o Terreno.
  pt: |-
    Se você não controlar nenhum monstro, você pode Invocar este card por Invocação-Especial (da sua mão). Você só pode usar cada um dos seguintes efeitos de "Dragão Cibernético, o Dragão Mecha Brilhante" uma vez por turno. Se este card for Invocado por Invocação-Especial: você pode escolher 1 monstro com a face para cima que seu oponente controla; negue os efeitos dele até o final deste turno. Durante sua Fase Principal: você pode Invocar por Invocação-Fusão 1 Monstro de Fusão Máquina do seu Deck Adicional, usando este card que você controla e monstros da sua mão ou do campo.
  ja: |-
    このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドにモンスターが存在しない場合、このカードは手札から特殊召喚できる。②：このカードが特殊召喚した場合、相手フィールドの表側表示モンスター１体を対象として発動できる。そのモンスターの効果をターン終了時まで無効にする。③：自分メインフェイズに発動できる。フィールドのこのカードを含む自分の手札・フィールドのモンスターを融合素材とし、機械族の融合モンスター１体を融合召喚する。
  ko: |-
    이 카드명의 ②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드에 몬스터가 존재하지 않을 경우, 이 카드는 패에서 특수 소환할 수 있다. ②: 이 카드를 특수 소환했을 경우, 상대 필드의 앞면 표시 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터의 효과를 턴 종료시까지 무효로 한다. ③: 자신 메인 페이즈에 발동할 수 있다. 필드의 이 카드를 포함하는 자신의 패 / 필드의 몬스터를 융합 소재로 하고, 기계족인 융합 몬스터 1장을 융합 소환한다.
  zh-TW:
  zh-CN: |-
    此卡名的②③效果1回合仅可各使用1次。①：自己场上不存在怪兽的情况下，此卡可从手牌特殊召唤。②：此卡特殊召唤的情况下，以对手场上的1只表侧表示怪兽为对象可以发动。将该怪兽的效果直至回合结束时为止无效。③：在自己的主要阶段可以发动。将包含场上的此卡在内的、自己手牌・场上的怪兽作为融合素材，将1只机械族的融合怪兽融合召唤。
