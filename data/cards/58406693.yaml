  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の墓地・除外状態の「ラーの翼神竜」モンスター１体を召喚条件を無視して特殊召喚する。この効果で「ラーの翼神竜」を特殊召喚した場合、さらにそのモンスターを墓地へ送り、ＥＸデッキから「ラーの翼神竜」モンスター１体を特殊召喚できる。この効果で特殊召喚したモンスターはエンドフェイズに墓地へ送られる。②：自分メインフェイズにこのカードが墓地に存在する場合、手札から「太陽神」カード１枚を捨てて発動できる。このカードを手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：将自己墓地・除外状态的1只“拉之翼神龙”怪兽无视召唤条件特殊召唤。以此效果特殊召唤了“拉之翼神龙”的情况下，进而可将该怪兽送至墓地，从额外牌组将1只“拉之翼神龙”怪兽特殊召唤。以此效果特殊召唤的怪兽将在结束阶段被送至墓地。②：在自己的主要阶段，此卡存在于墓地的情况下，从手牌将1张“太阳神”卡舍弃可以发动。将此卡加入手牌。
