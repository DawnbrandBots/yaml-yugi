name:
  en: Coralianectes, the Luminous Cradle Dragon
  de: Coralianectes, der leuchtende Wiegendrache
  es: Coralianectes, el Dragón Original Brillante
  fr: Coralianectes, le Dragon du Berceau Lumineux
  it: Coralianectes, il Drago Culla Luminosa
  pt: Coralianectes, o Dragão do Berço Reluzente
  ja: <ruby>耀<rt>よう</rt></ruby><ruby>爛<rt>らん</rt></ruby><ruby>竜<rt>りゅう</rt></ruby>コラリアネクテス
