name:
  en: Verre, the Maid of Endymion
  de: Verre, die Maid von Endymion
  es: Verre, la Criada de Endimión
  fr: Verre, la Domestique d'Endymion
  it: Verre, la Domestica di Endymion
  pt: Verre, a Empregada de Endymion
  ja: エンディミオンの<ruby>侍<rt>じ</rt></ruby><ruby>女<rt>じょ</rt></ruby>ヴェール
  ja_romaji: Endimion no Jijo Vēru
  ko: 엔디미온의 시녀 베르
  ko_rr:
  zh-TW: 恩底彌翁的侍女 薇兒
  zh-CN: 恩底弥翁的侍女 薇儿
text:
  en: |-
    (This card is always treated as a "Witchcrafter" card.)
    Gains 2300 ATK while you have "Regulus, the Prince of Endymion" in your field or GY. You can only use each of the following effects of "Verre, the Maid of Endymion" once per turn. During your Main Phase, if a Spell Card or effect was activated this turn: You can Special Summon this card from your hand. If this card is Special Summoned: You can add 1 "Witchcrafter" Spell/Trap or 1 "Magical Dimension" from your Deck to your hand.
  de: |-
    (Diese Karte wird immer als „Hexwerker“-Karte behandelt.)
    Erhält 2300 ATK, solange du „Regulus, der Prinz von Endymion“ auf deiner Spielfeldseite oder in deinem Friedhof hast. Du kannst jeden der folgenden Effekte von „Verre, die Maid von Endymion“ nur einmal pro Spielzug verwenden. Während deiner Main Phase, falls in diesem Spielzug eine Zauberkarte oder ein Zaubereffekt aktiviert wurde: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 „Hexwerker“-Zauber/Falle oder 1 „Magieartige Dimension“ von deinem Deck hinzufügen.
  es: |-
    (Esta carta se trata siempre como una carta "Artibruja").
    Gana 2300 ATK mientras tengas "Regulus, el Príncipe de Endimión" en tu Campo o Cementerio. Sólo puedes usar cada uno de los siguientes efectos de "Verre, la Criada de Endimión" una vez por turno. Durante tu Main Phase, si una Carta Mágica o su efecto fue activado este turno: puedes Invocar esta carta de Modo Especial desde tu mano. Si esta carta es Invocada de Modo Especial: puedes añadir a tu mano 1 Mágica/Trampa "Artibruja" o 1 "Dimensión Mágica" en tu Deck.
  fr: |-
    (Cette carte est toujours traitée comme carte "Artisanesorcière".)
    Gagne 2300 ATK tant que vous avez "Regulus, le Prince d'Endymion" dans votre Terrain ou Cimetière. Vous ne pouvez utiliser chacun des effets suivants de "Verre, la Domestique d'Endymion" qu'une fois par tour. Durant votre Main Phase, si une Carte Magie ou effet de Magie a été activé ce tour : vous pouvez Invoquer Spécialement cette carte depuis votre main. Si cette carte est Invoquée Spécialement : vous pouvez ajouter 1 Magie/Piège "Artisanesorcière" ou 1 "Dimension Magique" depuis votre Deck à votre main.
  it: |-
    (Questa carta viene sempre considerata come una carta "Stregartigiana".)
    Guadagna 2300 ATK mentre hai "Regulus, il Principe di Endymion" nel tuo Terreno o Cimitero. Puoi utilizzare ognuno dei seguenti effetti di "Verre, la Domestica di Endymion" una sola volta per turno. Durante la tua Main Phase, se una Carta Magia o un suo effetto è stato attivato in questo turno: puoi Evocare Specialmente questa carta dalla tua mano. Se questa carta viene Evocata Specialmente: puoi aggiungere 1 Magia/Trappola "Stregartigiana" o 1 "Dimensione Magica" dal tuo Deck alla tua mano.
  pt: |-
    (Este card deve ser sempre considerado como um card "Fazticeira".)
    Ganha 2300 de ATK enquanto você tiver "Regulus, o Príncipe de Endymion" no seu campo ou Cemitério. Você só pode usar cada um dos seguintes efeitos de "Verre, a Empregada de Endymion" uma vez por turno. Durante sua Fase Principal, se um Card de Magia ou seus efeitos foram ativados neste turno: você pode Invocar este card por Invocação-Especial da sua mão. Se este card for Invocado por Invocação-Especial: você pode adicionar 1 Magia/Armadilha "Fazticeira" ou 1 "Dimensão Mágica" do seu Deck à sua mão.
  ja: |-
    このカード名はルール上「ウィッチクラフト」カードとしても扱う。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：魔法カードの効果が発動したターンの自分メインフェイズに発動できる。このカードを手札から特殊召喚する。②：このカードが特殊召喚した場合に発動できる。デッキから「ウィッチクラフト」魔法・罠カードか「ディメンション・マジック」１枚を手札に加える。③：自分のフィールドか墓地に「聖月の皇太子レグルス」が存在する限り、このカードの攻撃力は２３００アップする。
  ko: |-
    이 카드명은 룰상 "위치크래프트" 카드로도 취급한다. 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 마법 카드의 효과가 발동한 턴의 자신 메인 페이즈에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. ②: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 덱에서 "위치크래프트" 마법 / 함정 카드나 "디멘션 매직" 1장을 패에 넣는다. ③: 자신의 필드나 묘지에 "프린스 오브 엔디미온 레굴루스"가 존재하는 한, 이 카드의 공격력은 2300 올린다.
  zh-TW:
  zh-CN: |-
    此卡名在规则上也视为“魔女工艺”卡。此卡名的①②效果1回合仅可各使用1次。①：在发动过魔法卡效果的回合的、自己的主要阶段可以发动。从手牌将此卡特殊召唤。②：此卡特殊召唤的情况下可以发动。从牌组将1张“魔女工艺”魔法・陷阱卡或“次元魔法”加入手牌。③：只要自己场上或墓地存在“恩底弥翁之圣月皇太子 雷格鲁斯”，此卡的攻击力上升2300。
