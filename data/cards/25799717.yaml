  ja: |-
    このカードは通常召喚できない。このカードを含む手札の光属性モンスター３体を相手に見せた場合に特殊召喚できる。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：手札のこのカードを相手に見せて発動できる。デッキから「龍札」カード１枚を手札に加える。その後、自分の手札を１枚選んで捨てる。②：自分・相手のメインフェイズに発動できる。相手フィールドのモンスター１体を破壊し、このカードを墓地へ送る。その後、フィールドに地属性モンスターが存在する場合、自分は１枚ドローできる。
