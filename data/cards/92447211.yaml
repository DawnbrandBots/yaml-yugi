text:
  en: |-
    If this card is Normal or Special Summoned: You can reveal 1 Zombie monster in your hand and send 1 EARTH Zombie monster from your Deck to the GY; send the revealed monster to the GY, and if you do, this card gains 500 ATK until the end of this turn. You can only use this effect of "Long-Tailed Black Horse" once per turn.
  de: |-
    Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Zombie-Monster in deiner Hand vorzeigen und 1 ERDE Zombie-Monster von deinem Deck auf den Friedhof legen; lege das vorgezeigte Monster auf den Friedhof und falls du dies tust, erhält diese Karte bis zum Ende dieses Spielzugs 500 ATK. Du kannst diesen Effekt von „Langschwänziges schwarzes Pferd“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta es Invocada de Modo Normal o Especial: puedes mostrar 1 monstruo Zombi en tu mano y mandar al Cementerio 1 monstruo Zombi de TIERRA en tu Deck; manda al Cementerio el monstruo mostrado y, si lo haces, esta carta gana 500 ATK hasta el final de este turno. Sólo puedes usar este efecto de "Caballo Negro Colilargo" una vez por turno.
  fr: |-
    Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez révéler 1 monstre Zombie dans votre main, et envoyez 1 monstre Zombie TERRE depuis votre Deck au Cimetière ; envoyez le monstre révélé au Cimetière, et si vous le faites, cette carte gagne 500 ATK jusqu'à la fin de ce tour. Vous ne pouvez utiliser cet effet de "Cheval Noir à Longue Queue" qu'une fois par tour.
  it: |-
    Se questa carta viene Evocata Normalmente o Specialmente: puoi rivelare 1 mostro Zombie nella tua mano e mandare 1 mostro TERRA Zombie dal tuo Deck al Cimitero; manda il mostro rivelato al Cimitero e, se lo fai, questa carta guadagna 500 ATK fino alla fine di questo turno. Puoi utilizzare questo effetto di "Cavallo Nero Coda Lunga" una sola volta per turno.
  pt: |-
    Se este card for Invocado por Invocação-Normal ou Especial: você pode revelar 1 monstro Zumbi na sua mão e enviar 1 monstro Zumbi de TERRA do seu Deck para o Cemitério; envie o monstro revelado para o Cemitério e, se isso acontecer, este card ganha 500 de ATK até o final deste turno. Você só pode usar este efeito de "Cavalo Negro de Cauda Longa" uma vez por turno.
  ja: |-
    このカード名の効果は１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合、手札のアンデット族モンスター１体を相手に見せ、デッキからアンデット族・地属性モンスター１体を墓地へ送って発動できる。見せたモンスターを墓地へ送り、このカードの攻撃力はターン終了時まで５００アップする。
