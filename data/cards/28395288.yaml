  ja: |-
    「方界」モンスター×３
    このカード名の②の効果は１ターンに１度しか使用できず、この効果を発動するターン、自分は融合モンスターしかＥＸデッキから特殊召喚できない。①：このカードは、攻撃力が自分の墓地の「方界胤ヴィジャム」の数×１０００アップし、このカードより攻撃力が低いモンスターの発動した効果を受けない。②：自分・相手ターンに発動できる。このカードをＥＸデッキに戻し、自分の墓地から「方界」モンスター３体を特殊召喚し、デッキから「方界」カード１枚を手札に加える。
