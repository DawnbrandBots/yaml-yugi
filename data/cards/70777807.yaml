text:
  en: |-
    When this card is activated: Special Summon 1 DARK Zombie monster from your Deck or GY. When that monster leaves the field, destroy this card. That monster is unaffected by the activated effects of other non-DARK monsters. If this face-up card leaves the field: Destroy as many cards you control as possible, and if you do, take 400 damage for each card destroyed. You can only activate 1 "Castle of Vampire" per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、自分のデッキ・墓地からアンデット族・闇属性モンスター１体を特殊召喚する。そのモンスターがフィールドから離れる時にこのカードは破壊される。②：このカードの①の効果で特殊召喚したモンスターは、闇属性以外の他のモンスターが発動した効果を受けない。③：表側表示のこのカードがフィールドから離れた場合に発動する。自分フィールドのカードを全て破壊し、自分は破壊した数×４００ダメージを受ける。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：作为此卡发动时的效果处理，从自己牌组・墓地将1只不死族・暗属性怪兽特殊召唤。该怪兽从场上离开时此卡将被破坏。②：以此卡的①效果特殊召唤的怪兽不受暗属性以外的其他怪兽发动的效果影响。③：表侧表示的此卡从场上离开的情况下发动。将自己场上的卡全部破坏，自己受到所破坏的数量×400的伤害。
