text:
  en: |-
    Special Summon 1 Normal Monster from your hand, Deck, or GY in Defense Position (if you Special Summon from the Deck, it must be Level 4 or lower), or if you control a Normal Monster Card, you can apply 1 of these effects instead.
    ● Destroy all monsters your opponent controls.
    ● Destroy all Spells/Traps your opponent controls.
    ● Draw 2 cards.
    ● Special Summon 1 monster from either GY to your field.
    You can only activate 1 "Ancient Secrets" per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：自分の手札・デッキ・墓地から通常モンスター１体を守備表示で特殊召喚する（デッキから特殊召喚する場合はレベル４以下でなければならない）。自分フィールドに通常モンスターカードが存在する場合、代わりに以下の効果から１つを選んで適用できる。●相手フィールドのモンスターを全て破壊する。●相手フィールドの魔法・罠カードを全て破壊する。●自分は２枚ドローする。●自分か相手の墓地からモンスター１体を自分フィールドに特殊召喚する。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 자신의 패 / 덱 / 묘지에서 일반 몬스터 1장을 수비 표시로 특수 소환한다(덱에서 특수 소환할 경우에는 레벨 4 이하이어야 한다). 자신 필드에 일반 몬스터 카드가 존재할 경우, 대신에 이하의 효과에서 1개를 고르고 적용할 수 있다. ●상대 필드의 몬스터를 전부 파괴한다. ●상대 필드의 마법 / 함정 카드를 전부 파괴한다. ●자신은 2장 드로우한다. ●자신이나 상대 묘지에서 몬스터 1장을 자신 필드에 특수 소환한다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：从自己手牌・牌组・墓地将1只通常怪兽以守备表示特殊召唤（从牌组特殊召唤的情况下必须是等级4以下）。自己场上存在通常怪兽卡的情况下，作为代替可从以下效果中挑选1个适用。
    ●将对手场上的怪兽全部破坏。
    ●将对手场上的魔法・陷阱卡全部破坏。
    ●自己抽2张。
    ●从自己或对手墓地将1只怪兽特殊召唤至自己场上。
