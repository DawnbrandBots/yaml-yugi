    此卡名的①②③效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下可以发动。从牌组将1只等级3以外的“亚马逊”怪兽加入手牌。②：在自己的主要阶段可以发动。将自己手牌・场上的怪兽作为融合素材，将1只地・风属性融合怪兽融合召唤。③：自己的“亚马逊”怪兽与对手怪兽进行战斗的伤害计算时，将墓地的此卡除外可以发动。该2只的攻击力直至回合结束时为止交换。
