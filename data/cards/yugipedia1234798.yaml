  en: |-
    If this card is Normal or Special Summoned: You can add 1 "Amazoness" monster from your Deck to your hand, except a Level 3 monster. During your Main Phase: You can Fusion Summon 1 EARTH or WIND Fusion Monster from your Extra Deck, using monsters from your hand or field. During damage calculation, if your "Amazoness" monster battles an opponent's monster: You can banish this card from your GY; switch the battling monsters' ATK until the end of this turn. You can only use each effect of "Amazoness Spellcaster - Forbidden Spell Dance" once per turn.
