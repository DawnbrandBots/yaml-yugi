  en: |-
    Activate this card by sending 1 "The Winged Dragon of Ra" monster from your hand, Deck, or face-up field to the GY. During your Main Phase, if this card was activated this turn: You can add 1 "Sun God" monster from your Deck to your hand. If a monster(s) is destroyed by battle: Its controller takes damage equal to its original ATK, then if you have "The Winged Dragon of Ra" in your GY, you gain 1000 LP. You can only use each effect of "The Sun God Leading Down into Darkness" once per turn.
