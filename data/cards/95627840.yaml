text:
  en: |-
    2 WATER monsters
    You can only Special Summon "Codaedalus(s)" once per turn. This card's name becomes "Umi" while on the field. If this card is Link Summoned: You can activate this effect; during the End Phase of this turn, add 1 card from your GY to your hand that mentions "Atlantis, City of the Sea Dragon", except "Codaedalus". Once per turn: You can send 1 face-up "Umi" you control to the GY; send up to 2 Spells/Traps on the field to the GY.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    水属性モンスター２体
    自分は「コダイダロス」を１ターンに１度しか特殊召喚できない。①：このカードがＬ召喚した場合に発動できる。このターンのエンドフェイズに、「コダイダロス」を除く、「竜都アトランティス」のカード名が記されたカード１枚を自分の墓地から手札に加える。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：１ターンに１度、自分フィールドの表側表示の「海」１枚を墓地へ送って発動できる。フィールドの魔法・罠カードを２枚まで墓地へ送る。
  ko:
  zh-TW:
  zh-CN: |-
    水属性怪兽2只
    自己1回合仅可特殊召唤1次“小代达罗斯”。①：此卡连接召唤的情况下可以发动。在此回合的结束阶段，从自己墓地将除“小代达罗斯”以外的、1张记载有“龙都 亚特兰蒂斯”卡名的卡加入手牌。②：此卡只要存在于怪兽区域，卡名视为“海”。③：1回合1次，将自己场上的1张表侧表示的“海”送至墓地可以发动。将场上的最多2张魔法・陷阱卡送至墓地。
