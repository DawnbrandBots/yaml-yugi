  ja: |-
    幻想魔族チューナー＋チューナー以外のモンスター１体以上
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが特殊召喚した場合、フィールドの魔法・罠カードを２枚まで対象として発動できる。そのカードを手札に戻す。②：このカードが墓地へ送られた場合、どこから墓地へ送られたかによって以下の効果を発動できる。●フィールド：デッキから「白鴉」罠カード１枚を自分フィールドにセットする。●ＥＸデッキ：自分の墓地から「白鴉」カード１枚を手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    幻想魔族协调＋协调以外的怪兽1只以上
    此卡名的①②效果1回合仅可各使用1次。①：此卡特殊召唤的情况下，以场上的最多2张魔法・陷阱卡为对象可以发动。将该卡放回手牌。②：此卡被送至墓地的情况下，根据从何处被送至墓地，可以发动以下效果。
    ●场上：从牌组将1张“白鸦”陷阱卡放置在自己场上。
    ●额外牌组：从自己墓地将1张“白鸦”卡加入手牌。
