text:
  en: |-
    Send 2 monsters from your Deck to the GY, including an Insect monster, also you cannot Special Summon until the end of the next turn after this card resolves, except Insect monsters. If you Ritual Summon an Insect monster(s) while this card is in your GY: You can banish this card; all "Reindsurm" monsters you currently control gain 800 ATK/DEF. You can only use 1 "Reindsurm Butterfly" effect per turn, and only once that turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。①：デッキから昆虫族モンスターを含むモンスター２体を墓地へ送る。このカードの発動後、次のターンの終了時まで、自分は昆虫族モンスターしか特殊召喚できない。②：このカードが墓地に存在する状態で、自分が昆虫族モンスターを儀式召喚した場合、このカードを除外して発動できる。自分フィールドの全ての「リインゼルム」モンスターの攻撃力・守備力は８００アップする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合1次，仅可使用其中1个。①：从牌组将包含昆虫族怪兽在内的2只怪兽送至墓地。此卡发动后，直至下个回合结束时为止自己仅可特殊召唤昆虫族怪兽。②：此卡存在于墓地的状态下，自己将昆虫族怪兽仪式召唤的情况下，将此卡除外可以发动。自己场上的所有“轮回虫龙”怪兽的攻击力・守备力上升800。
