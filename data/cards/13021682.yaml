name:
  en: Starjunk Synchron
  de: Stern-Gerümpelsynchronisierer
  es: Sincronizador de Estrellabasura
  fr: Robot d'Étoile Synchronique
  it: Stellarottame Synchron
  pt: Sucata Sincron Estelar
  ja: スタージャンク・シンクロン
  ja_romaji: Sutājanku Shinkuron
  ko: 스타정크 싱크론
  ko_rr:
  zh-TW:
  zh-CN: 星废品同步士
text:
  en: |-
    For a Synchro Summon, you can substitute this card for any 1 "Synchron" Tuner. You can only use each of the following effects of "Starjunk Synchron" once per turn. If this card is in your hand: You can target 1 Level 2 or lower monster in your GY; Special Summon this card, and if you do, Special Summon that monster but negate its effects, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Synchro Monsters. You can banish this card from your GY; this turn, no "Junk Warrior" you control can be destroyed by your opponent's card effects.
  de: |-
    Du kannst diese Karte anstelle von 1 beliebigen „Synchron“-Empfänger für eine Synchrobeschwörung verwenden. Du kannst jeden der folgenden Effekte von „Stern-Gerümpelsynchronisierer“ nur einmal pro Spielzug verwenden. Falls sich diese Karte in deiner Hand befindet: Du kannst 1 Monster der Stufe 2 oder niedriger in deinem Friedhof wählen; beschwöre diese Karte als Spezialbeschwörung und falls du dies tust, beschwöre jenes Monster als Spezialbeschwörung, aber annulliere seine Effekte, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Synchromonstern. Du kannst diese Karte von deinem Friedhof verbannen; in diesem Spielzug können „Gerümpelkrieger“, die du kontrollierst, nicht durch Karteneffekte deines Gegners zerstört werden.
  es: |-
    Para una Invocación por Sincronía, puedes sustituir esta carta por 1 Cantante "Sincrón" (o "Sincronizador") cualquiera. Sólo puedes usar cada uno de los siguientes efectos de "Sincronizador de Estrellabasura" una vez por turno. Si esta carta está en tu mano: puedes seleccionar 1 monstruo de Nivel 2 o menor en tu Cementerio; Invoca esta carta de Modo Especial y, si lo haces, Invoca ese monstruo de Modo Especial pero niega sus efectos, y además no puedes Invocar de Modo Especial desde el Deck Extra por el resto de este turno, excepto Monstruos de Sincronía. Puedes desterrar esta carta en tu Cementerio; este turno, ningún "Guerrero de Basura" que controles puede ser destruido por efectos de cartas de tu adversario.
  fr: |-
    Pour une Invocation Synchro, vous pouvez substituer cette carte à 1 Syntoniseur "Synchronique". Vous ne pouvez utiliser chacun des effets suivants de "Robot d'Étoile Synchronique" qu'une fois par tour. Si cette carte est dans votre main : vous pouvez cibler 1 monstre de max. Niveau 2 dans votre Cimetière ; Invoquez Spécialement cette carte, et si vous le faites, Invoquez Spécialement le monstre mais annulez ses effets, et aussi, vous ne pouvez pas Invoquer Spécialement (Monstres Synchro exclus) depuis l'Extra Deck le reste de ce tour. Vous pouvez bannir cette carte depuis votre Cimetière ; ce tour, "Robot Guerrier" que vous contrôlez ne peut pas être détruit par des effets de carte de votre adversaire.
  it: |-
    Per una Synchro Evocazione, puoi sostituire con questa carta 1 qualsiasi Tuner "Synchron". Puoi utilizzare ognuno dei seguenti effetti di "Stellarottame Synchron" una sola volta per turno. Se questa carta è nella tua mano: puoi scegliere come bersaglio 1 mostro di Livello 2 o inferiore nel tuo Cimitero; Evoca Specialmente questa carta e, se lo fai, Evoca Specialmente quel mostro, ma annulla i suoi effetti, inoltre non puoi Evocare Specialmente dall'Extra Deck per il resto di questo turno, eccetto Mostri Synchro. Puoi bandire questa carta dal tuo Cimitero; in questo turno, nessun "Guerriero Rottame" che controlli può essere distrutto dagli effetti delle carte del tuo avversario.
  pt: |-
    Para uma Invocação-Sincro, você pode substituir este card por qualquer 1 Regulador "Sincron". Você só pode usar cada um dos seguintes efeitos de "Sucata Sincron Estelar" uma vez por turno. Se este card estiver na sua mão: você pode escolher 1 monstro de Nível 2 ou menos no seu Cemitério; Invoque este card por Invocação-Especial e, se isso acontecer, Invoque esse monstro por Invocação-Especial, mas negue seus efeitos e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional pelo resto deste turno, exceto Monstros Sincro. Você pode banir este card do seu Cemitério; neste turno, nenhum "Guerreiro Sucata" que você controla pode ser destruído pelos efeitos de card do seu oponente.
  ja: |-
    このカードは「シンクロン」チューナーの代わりとしてＳ素材にできる。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在する場合、自分の墓地のレベル２以下のモンスター１体を対象として発動できる。このカードを特殊召喚し、対象のモンスターを効果を無効にして特殊召喚する。このターン、自分はＳモンスターしかＥＸデッキから特殊召喚できない。②：墓地のこのカードを除外して発動できる。このターン中、自分フィールドの「ジャンク・ウォリアー」は相手の効果では破壊されない。
  ko: |-
    이 카드는 "싱크론" 튜너 대신 싱크로 소재로 할 수 있다. 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드가 패에 존재할 경우, 자신 묘지의 레벨 2 이하의 몬스터 1장을 대상으로 하고 발동할 수 있다. 이 카드를 특수 소환하고, 대상 몬스터를 효과를 무효로 하여 특수 소환한다. 이 턴에, 자신은 싱크로 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. ②: 묘지의 이 카드를 제외하고 발동할 수 있다. 이 턴 중에, 자신 필드의 "정크 워리어"는 상대 효과로는 파괴되지 않는다.
  zh-TW:
  zh-CN: |-
    此卡可代替“同步士”协调作为同步素材。此卡名的①②效果1回合仅可各使用1次。①：此卡存在于手牌的情况下，以自己墓地的1只等级2以下的怪兽为对象可以发动。将此卡特殊召唤，将对象怪兽的效果无效并特殊召唤。此回合，自己从额外牌组仅可特殊召唤同步怪兽。②：将墓地的此卡除外可以发动。此回合中，自己场上的“废品战士”不会因对手的效果而被破坏。
