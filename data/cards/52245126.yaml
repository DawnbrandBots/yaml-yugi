text:
  en: |-
    If 4 or more cards are on the field: You can Special Summon this card from your hand. You can send up to 2 Spells/Traps you control to the GY; draw that many cards, then you can Special Summon 1 WATER monster from your hand. When your opponent activates a card or effect (Quick Effect): You can change this card to face-down Defense Position, also for the rest of this turn, all face-down cards you control cannot be destroyed by your opponent's card effects, and your opponent cannot target them with card effects. You can only use each effect of "Audhumla, Progenitor of the Frozen Expanse" once per turn.
  de: |-
    Falls 4 oder mehr Karten auf dem Spielfeld liegen: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören. Du kannst bis zu 2 Zauber/Fallen, die du kontrollierst, auf den Friedhof legen; ziehe ebenso viele Karten, dann kannst du 1 WASSER Monster als Spezialbeschwörung von deiner Hand beschwören. Wenn dein Gegner eine Karte oder einen Effekt aktiviert (Schnelleffekt): Du kannst diese Karte in die verdeckte Verteidigungsposition ändern, zusätzlich, für den Rest dieses Spielzugs, können alle verdeckten Karten, die du kontrollierst, nicht durch Karteneffekte deines Gegners zerstört werden und dein Gegner kann sie nicht als Ziel für Karteneffekte wählen. Du kannst jeden Effekt von „Audhumla, Urahnin der gefrorenen Weite“ nur einmal pro Spielzug verwenden.
  es: |-
    Si 4 o más cartas están en el Campo: puedes Invocar esta carta de Modo Especial desde tu mano. Puedes mandar al Cementerio hasta 2 Mágicas/Trampas que controles; roba ese mismo número de cartas, y después puedes Invocar de Modo Especial 1 monstruo de AGUA desde tu mano. Cuando tu adversario activa una carta o efecto (Efecto Rápido): puedes cambiar esta carta a Posición de Defensa boca abajo y además, por el resto de este turno, todas las cartas boca abajo que controlas no pueden ser destruidas por efectos de cartas de tu adversario, y tu adversario no puede seleccionarlas con efectos de cartas. Sólo puedes usar cada efecto de "Audhumla, Progenitora de la Extensión Helada" una vez por turno.
  fr: |-
    Si min. 4 cartes sont sur le Terrain : vous pouvez Invoquer Spécialement cette carte depuis votre main. Vous pouvez envoyer max. 2 Magies/Pièges que vous contrôlez au Cimetière ; piochez autant de cartes, puis vous pouvez Invoquer Spécialement 1 monstre EAU depuis votre main. Lorsque votre adversaire active une carte ou un effet (Effet Rapide) : vous pouvez changer cette carte en Position de Défense face verso, et aussi, le reste de ce tour, toutes les cartes face verso que vous contrôlez ne peuvent pas être détruites par des effets de carte de votre adversaire, et votre adversaire ne peut pas les cibler avec des effets de carte. Vous ne pouvez utiliser chaque effet de "Audhumla, Progéniteur de l'Étendue Glacée" qu'une fois par tour.
  it: |-
    Se 4 o più carte sono sul Terreno: puoi Evocare Specialmente questa carta dalla tua mano. Puoi mandare fino a 2 Magie/Trappole che controlli al Cimitero; pesca quel numero di carte, poi puoi Evocare Specialmente 1 mostro ACQUA dalla tua mano. Quando il tuo avversario attiva una carta o un effetto (Effetto Rapido): puoi mettere questa carta coperta in Posizione di Difesa, inoltre per il resto di questo turno, tutte le carte coperte che controlli non possono essere distrutte dagli effetti delle carte del tuo avversario, e il tuo avversario non può sceglierle come bersaglio con gli effetti delle carte. Puoi utilizzare ogni effetto di "Audhumla, Progenitrice del Firmamento Congelato" una sola volta per turno.
  pt: |-
    Se 4 ou mais cards estiverem no campo: você pode Invocar este card por Invocação-Especial da sua mão. Você pode enviar até 2 Magia/Armadilha que você controla para o Cemitério; compre esse número de cards e, depois, você pode Invocar por Invocação-Especial 1 monstro de ÁGUA da sua mão. Quando seu oponente ativar um card ou efeito (Efeito Rápido): você pode colocar este card com a face para baixo em Posição de Defesa e, além disso, pelo resto deste turno, nenhum dos cards com a face para baixo que você controla podem ser destruídos pelos efeitos de card do seu oponente e seu oponente não pode escolhê-los como alvo de efeitos de card. Você só pode usar cada efeito de "Audhumla, Progenitora da Expansão Congelado" uma vez por turno.
