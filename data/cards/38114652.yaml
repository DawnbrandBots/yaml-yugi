name:
  en: Mikumari the Banisher Ashtra
  de: Mikumari die Verbanner-Ashtra
  es: Mikumari la Ashtra Desvanecedora
  fr: Mikumari la Bannisseuse Ashtra
  it: Mikumari l'Ashtra Banditrice
  pt: Mikumari, a Ashtra Banidora
  ja: <ruby>封<rt>ふう</rt></ruby><ruby>神<rt>じん</rt></ruby>の<ruby>剣鬼<rt>アシュトラ</rt></ruby> ミクマリ
