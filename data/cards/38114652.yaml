  zh-CN: 封神之剑艮鬼 水子守
text:
  en: |-
    You can Special Summon this card (from your hand) by revealing 1 face-down card you control and returning it to the hand or Extra Deck. You can only Special Summon "Mikumari the Banisher Ashtra" once per turn this way. You can only use each of the following effects of "Mikumari the Banisher Ashtra" once per turn. During your Main Phase: You can add 1 non-Wyrm "Ashtra" monster from your Deck to your hand. If this card is sent to the GY as Synchro Material for an "Ashtra" Synchro Monster: You can target 1 Normal Trap in your GY; Set it.
  de: |-
    Du kannst diese Karte als Spezialbeschwörung (von deiner Hand) beschwören, indem du 1 verdeckte Karte vorzeigst, die du kontrollierst, und sie auf die Hand oder ins Extra Deck zurückgibst. Du kannst „Mikumari die Verbanner-Ashtra“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Du kannst jeden der folgenden Effekte von „Mikumari die Verbanner-Ashtra“ nur einmal pro Spielzug verwenden. Während deiner Main Phase: Du kannst deiner Hand 1 „Ashtra“-Nichtwyrm-Monster von deinem Deck hinzufügen. Falls diese Karte als Synchromaterial für ein „Ashtra“-Synchromonster auf den Friedhof gelegt wird: Du kannst 1 Normale Falle in deinem Friedhof wählen; setze sie.
  es: |-
    Puedes Invocar esta carta de Modo Especial (desde tu mano) mostrando 1 carta boca abajo que controles y devolviéndola a la mano o Deck Extra. Sólo puedes Invocar de Modo Especial "Mikumari la Ashtra Desvanecedora" una vez por turno de esta forma. Sólo puedes usar cada uno de los siguientes efectos de "Mikumari la Ashtra Desvanecedora" una vez por turno. Durante tu Main Phase: puedes añadir a tu mano 1 monstruo "Ashtra" que no sea Wyrm en tu Deck. Si esta carta es mandada al Cementerio como Material de Sincronía para un Monstruo de Sincronía "Ashtra": puedes seleccionar 1 Trampa Normal en tu Cementerio; Colócala.
  fr: |-
    Vous pouvez Invoquer Spécialement cette carte (depuis votre main) en révélant 1 carte face verso que vous contrôlez et en la renvoyant à la main ou Extra Deck. Vous ne pouvez Invoquer Spécialement "Mikumari la Bannisseuse Ashtra" qu'une fois par tour de cette façon. Vous ne pouvez utiliser chacun des effets suivants de "Mikumari la Bannisseuse Ashtra" qu'une fois par tour. Durant votre Main Phase : vous pouvez ajouter 1 monstre "Ashtra" non-Wyrm depuis votre Deck à votre main. Si cette carte est envoyée au Cimetière comme Matériel Synchro pour un Monstre Synchro "Ashtra" : vous pouvez cibler 1 Piège Normal dans votre Cimetière ; Posez-le.
  it: |-
    Puoi Evocare Specialmente questa carta (dalla tua mano) rivelando 1 carta coperta che controlli e facendola ritornare nella mano o Extra Deck. Puoi Evocare Specialmente "Mikumari l'Ashtra Banditrice" una sola volta per turno in questo modo. Puoi utilizzare ognuno dei seguenti effetti di "Mikumari l'Ashtra Banditrice" una sola volta per turno. Durante la tua Main Phase: puoi aggiungere 1 mostro non-Wyrm "Ashtra" dal tuo Deck alla tua mano. Se questa carta viene mandata al Cimitero come Materiale Synchro per un Mostro Synchro "Ashtra": puoi scegliere come bersaglio 1 Trappola Normale nel tuo Cimitero; Posizionala.
  pt: |-
    Você pode Invocar este card por Invocação-Especial (da sua mão) ao revelar 1 card com a face para baixo que você controla e devolvê-lo para a mão ou para o Deck Adicional. Você só pode Invocar "Mikumari, a Ashtra Banidora" por Invocação-Especial uma vez por turno desta forma. Você só pode usar cada um dos seguintes efeitos de "Mikumari, a Ashtra Banidora" uma vez por turno. Durante sua Fase Principal: você pode adicionar 1 monstro "Ashtra" não-Wyrm do seu Deck à sua mão. Se este card for enviado para o Cemitério como Matéria Sincro para um Monstro Sincro "Ashtra": você pode escolher 1 Armadilha Normal no seu Cemitério; Baixe-a.
  ja: |-
    このカード名の、①の方法による特殊召喚は１ターンに１度しかできず、②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードは自分フィールドの裏側表示カード１枚を相手に見せて手札・ＥＸデッキに戻し、手札から特殊召喚できる。②：自分メインフェイズに発動できる。デッキから幻竜族以外の「アシュトラ」モンスター１体を手札に加える。③：このカードが「アシュトラ」ＳモンスターのＳ素材として墓地へ送られた場合、自分の墓地の通常罠カード１枚を対象として発動できる。そのカードを自分フィールドにセットする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名以①方法的特殊召唤1回合仅可进行1次，且②③效果1回合仅可各使用1次。①：此卡可通过将自己场上的1张里侧表示卡出示给对手并放回手牌・额外牌组，来从手牌特殊召唤。②：在自己的主要阶段可以发动。从牌组将1只幻龙族以外的“艮鬼”怪兽加入手牌。③：此卡作为“艮鬼”同步怪兽的同步素材被送至墓地的情况下，以自己墓地的1张通常陷阱卡为对象可以发动。将该卡放置在自己场上。
