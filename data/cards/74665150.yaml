  ko_rr:
  zh-TW:
  zh-CN: 解码语者・整合
text:
  en: |-
    2+ Effect Monsters
    While this card is in the Extra Monster Zone, it gains 500 ATK for every other Link Monster in the field and the GYs, also your opponent cannot target it with card effects. (Quick Effect): You can Tribute 1 monster this card points to; send 1 Cyberse monster from your Extra Deck to the GY, also this card can make up to 2 attacks on monsters during each Battle Phase this turn. You can only use this effect of "Decode Talker Integration" once per turn.
  de: |-
    2+ Effektmonster
    Solange diese Karte in der Extra-Monsterzone liegt, erhält sie für jedes andere Linkmonster auf dem Spielfeld und in den Friedhöfen 500 ATK, zusätzlich kann dein Gegner sie nicht als Ziel für Karteneffekte wählen. (Schnelleffekt): Du kannst 1 Monster, auf das diese Karte zeigt, als Tribut anbieten; lege 1 Cyberse-Monster von deinem Extra Deck auf den Friedhof, zusätzlich kann diese Karte in diesem Spielzug während jeder Battle Phase bis zu 2 Angriffe auf Monster durchführen. Du kannst diesen Effekt von „Dekodier-Sprecher Integration“ nur einmal pro Spielzug verwenden.
  es: |-
    2+ Monstruos de Efecto
    Mientras esta carta esté en la Zona de Monstruos Extra, gana 500 ATK por cada otro Monstruo de Enlace en el Campo y Cementerios, y además tu adversario no puede seleccionarla con efectos de cartas. (Efecto Rápido): puedes Sacrificar 1 monstruo al que apunte esta carta; manda al Cementerio 1 monstruo Ciberso en tu Deck Extra, y además esta carta puede hacer hasta 2 ataques a monstruos durante cada Battle Phase este turno. Sólo puedes usar este efecto de "Decodificador Hablador de Integración" una vez por turno.
  fr: |-
    2+ Monstres à Effet
    Tant que cette carte est dans la Zone Monstre Extra, elle gagne 500 ATK pour chaque autre Monstre Lien dans le Terrain et les Cimetières, et aussi votre adversaire ne peut pas la cibler avec des effets de carte. (Effet Rapide) : vous pouvez Sacrifier 1 monstre pointé par cette carte ; envoyez 1 monstre Cyberse depuis votre Extra Deck au Cimetière, et aussi, cette carte peut faire max. 2 attaques sur des monstres durant chaque Battle Phase ce tour. Vous ne pouvez utiliser cet effet de "Décodeur Bavard Intégré" qu'une fois par tour.
  it: |-
    2+ Mostri con Effetto
    Mentre questa carta è nella Zona Mostri Extra, essa guadagna 500 ATK per ogni altro Mostro Link nel Terreno e nei Cimiteri, inoltre il tuo avversario non può sceglierla come bersaglio con gli effetti delle carte. (Effetto Rapido): puoi offrire come Tributo 1 mostro puntato da questa carta; manda 1 mostro Cyberso dal tuo Extra Deck al Cimitero, inoltre questa carta può effettuare fino a 2 attacchi su mostri durante ogni Battle Phase in questo turno. Puoi utilizzare questo effetto di "Decodificatore Trasmittente Integrazione" una sola volta per turno.
  pt: |-
    2+ Monstros de Efeito
    Enquanto este card estiver na Zona de Monstros Adicional, ele ganha 500 de ATK para cada outro Monstro Link no campo e nos Cemitérios e, além disso, seu oponente não pode escolhê-lo como alvo de efeitos de card. (Efeito Rápido): você pode oferecer como Tributo 1 monstro para o qual este card apontar; envie 1 monstro Ciberso do seu Deck Adicional para o Cemitério e, além disso, este card pode realizar até 2 ataques contra monstros durante cada Fase de Batalha neste turno. Você só pode usar este efeito de "Decodificar Transmissor Integrado" uma vez por turno.
  ja: |-
    効果モンスター２体以上
    このカード名の②の効果は１ターンに１度しか使用できない。①：このカードがＥＸモンスターゾーンに存在する限り、このカードの攻撃力はこのカード以外のお互いのフィールド・墓地のＬモンスターの数×５００アップし、相手はこのカードを効果の対象にできない。②：自分・相手ターンに、このカードのリンク先の自分のモンスター１体をリリースして発動できる。ＥＸデッキからサイバース族モンスター１体を墓地へ送る。このターン、このカードは１度のバトルフェイズ中に２回までモンスターに攻撃できる。
  ko: |-
    효과 몬스터 2장 이상
    이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드가 엑스트라 몬스터 존에 존재하는 한, 이 카드의 공격력은 이 카드 이외의 서로의 필드 / 묘지의 링크 몬스터의 수 × 500 올리고, 상대는 이 카드를 효과의 대상으로 할 수 없다. ②: 자신 / 상대 턴에, 이 카드의 링크 앞의 자신 몬스터 1장을 릴리스하고 발동할 수 있다. 엑스트라 덱에서 사이버스족 몬스터 1장을 묘지로 보낸다. 이 턴에, 이 카드는 1번의 배틀 페이즈 중에 2회까지 몬스터에 공격할 수 있다.
  zh-TW:
  zh-CN: |-
    效果怪兽2只以上
    此卡名的②效果1回合仅可使用1次。①：只要此卡存在于额外怪兽区域，此卡的攻击力上升相当于此卡以外的、双方场上・墓地的连接怪兽的数量×500的数值，对手不可将此卡作为效果的对象。②：在自己・对手回合中，解放此卡连接端的1只自己的怪兽可以发动。从额外牌组将1只电子界族怪兽送至墓地。此回合，此卡在1次战斗阶段中最多可攻击怪兽2次。
