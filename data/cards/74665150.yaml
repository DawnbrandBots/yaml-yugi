name:
  en: Decode Talker Integration
  de: Dekodier-Sprecher Integration
  es: Decodificador Hablador de Integración
  fr: Décodeur Bavard Intégré
  it: Decodificatore Trasmittente Integrazione
  pt: Decodificar Transmissor Integrado
  ja: デコード・トーカー・インテグレーション
  ja_romaji: Dekōdo Tōkā Integurēshon
