text:
  en: |-
    If your opponent Normal or Special Summons a monster(s) (except during the Damage Step): You can target 1 of them; choose 1 of your face-down banished "Xenovader△" monsters with the same Attribute, and either add it to your hand or Special Summon it, also for the rest of this turn, you cannot choose the same Attribute again with this effect of "Xenovader△ Judgment", and you cannot activate cards or effects, except "Xenovader△" cards or effects. Once per battle, during damage calculation, if your "Xenovader△" monster battles an opponent's monster and you have no cards in your Deck: You can make that opponent's monster's ATK become 0.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：相手がモンスターを召喚・特殊召喚した場合、その内の１体を対象として発動できる。そのモンスターと同じ属性を持つ自分の除外状態（裏側）の「異解△」モンスター１体を選び、手札に加えるか特殊召喚する（このターン、このカード名のこの効果で同じ属性のモンスターを選べない）。このターン、自分は「異解△」カード以外のカードの効果を発動できない。②：自分のデッキの枚数が０枚の場合、自分の「異解△」モンスターが相手モンスターと戦闘を行うダメージ計算時に１度、発動できる。その相手モンスターの攻撃力を０にする。
  ko:
  zh-TW:
  zh-CN: |-
    ①：对手将怪兽召唤・特殊召唤的情况下，以其中1只为对象可以发动。挑选自己除外状态（里侧）的、与该怪兽相同属性的1只“异解△”怪兽，加入手牌或特殊召唤（此回合，不可以此卡名的此效果挑选相同属性的怪兽）。此回合，自己不可发动“异解△”卡以外的卡的效果。②：自己牌组的张数为0张的情况下，每次自己的“异解△”怪兽与对手怪兽进行战斗的伤害计算时可以发动1次。将该对手怪兽的攻击力改成0。
