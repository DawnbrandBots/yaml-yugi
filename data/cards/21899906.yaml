text:
  en: |-
    Add 1 "Harpie" monster from your Deck to your hand, then if only your opponent controls a monster, you can Special Summon 1 "Harpie Lady", or 1 monster that mentions it, from your hand or GY. You can banish this card from your GY; Fusion Summon 1 EARTH or WIND Fusion Monster from your Extra Deck, using monsters from your hand or field. You can only use each effect of "Elegant Tri-Mirror" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：デッキから「ハーピィ」モンスター１体を手札に加える。相手フィールドにのみモンスターが存在する場合、さらに「ハーピィ・レディ」またはそのカード名が記されたモンスター１体を自分の手札・墓地から特殊召喚できる。②：墓地のこのカードを除外して発動できる。自分の手札・フィールドのモンスターを融合素材とし、風・地属性の融合モンスター１体を融合召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将1只“神鹰”怪兽加入手牌。仅有对手场上才存在怪兽的情况下，进而可从自己手牌・墓地将1只“神鹰女郎”或记载有该卡名的怪兽特殊召唤。②：将墓地的此卡除外可以发动。将自己手牌・场上的怪兽作为融合素材，将1只风・地属性融合怪兽融合召唤。
