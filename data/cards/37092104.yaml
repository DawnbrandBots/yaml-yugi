text:
  en: |-
    This card's name becomes "Umi" while on the field. You can only use each of the following effects of "Monster Arms of Atlantis" once per turn. If this card is Normal or Special Summoned: You can target 1 monster that mentions "Atlantis, City of the Sea Dragon" in your GY; Special Summon it in Defense Position. When your opponent activates a monster effect (Quick Effect): You can banish this card from your field or GY, and send 1 face-up "Umi" you control to the GY; negate that activated effect.
  de: |-
    Der Name dieser Karte wird zu „Umi“, solange sie auf dem Spielfeld liegt. Du kannst jeden der folgenden Effekte von „Monsterarme von Atlantis“ nur einmal pro Spielzug verwenden. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Monster, das „Atlantis, Stadt des Seedrachen“ erwähnt, in deinem Friedhof wählen; beschwöre es als Spezialbeschwörung in die Verteidigungsposition. Wenn dein Gegner einen Monstereffekt aktiviert (Schnelleffekt): Du kannst diese Karte von deiner Spielfeldseite oder deinem Friedhof verbannen und 1 offenes „Umi“, das du kontrollierst, auf den Friedhof legen; annulliere jenen aktivierten Effekt.
  es: |-
    El nombre de esta carta se convierte en "Umi" mientras esté en el Campo. Sólo puedes usar cada uno de los siguientes efectos de "Monstruo Brazos de Atlántida" una vez por turno. Si esta carta es Invocada de Modo Normal o Especial: puedes seleccionar 1 monstruo en tu Cementerio que mencione "Atlántida, Ciudad del Dragón Marino"; Invócalo de Modo Especial en Posición de Defensa. Cuando tu adversario activa un efecto de monstruo (Efecto Rápido): puedes desterrar esta carta en tu Campo o Cementerio, y manda al Cementerio 1 "Umi" boca arriba que controles; niega ese efecto activado.
  fr: |-
    Le nom de cette carte devient "Umi" tant qu'elle est sur le Terrain. Vous ne pouvez utiliser chacun des effets suivants de "Bras de Monstre d'Atlantis" qu'une fois par tour. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez cibler 1 monstre qui mentionne "Atlantis, Cité du Dragon des Mers" dans votre Cimetière ; Invoquez-le Spécialement en Position de Défense. Lorsque votre adversaire active un effet de monstre (Effet Rapide) : vous pouvez bannir cette carte depuis votre Terrain ou Cimetière, et envoyez 1 "Umi" face recto que vous contrôlez au Cimetière ; annulez l'effet activé.
  it: |-
    Il nome di questa carta diventa "Umi" mentre è sul Terreno. Puoi utilizzare ognuno dei seguenti effetti di "Braccia Mostro di Atlantide" una sola volta per turno. Se questa carta viene Evocata Normalmente o Specialmente: puoi scegliere come bersaglio 1 mostro che menziona "Atlantide, Città del Drago del Mare" nel tuo Cimitero; Evocalo Specialmente in Posizione di Difesa. Quando il tuo avversario attiva l'effetto di un mostro (Effetto Rapido): puoi bandire questa carta dal tuo Terreno o Cimitero e mandare 1 "Umi" scoperto che controlli al Cimitero; annulla quell'effetto attivato.
  pt: |-
    O nome deste card se torna "Umi" enquanto estiver no campo. Você só pode usar cada um dos seguintes efeitos de "Braços Monstruosos da Atlântida" uma vez por turno. Se este card for Invocado por Invocação-Normal ou Especial: você pode escolher 1 monstro que mencione "Atlântida, a Cidade do Dragão Marinho" no seu Cemitério; Invoque-o por Invocação-Especial em Posição de Defesa. Quando seu oponente ativar um efeito de monstro (Efeito Rápido): você pode banir este card do seu campo ou Cemitério, e enviar 1 "Umi" com a face para cima que você controla para o Cemitério; negue esse efeito ativado.
  ja: |-
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合、「竜都アトランティス」のカード名が記された自分の墓地のモンスター１体を対象として発動できる。そのモンスターを守備表示で特殊召喚する。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：相手がモンスターの効果を発動した時、フィールド・墓地のこのカードを除外し、自分フィールドの表側表示の「海」１枚を墓地へ送って発動できる。その発動した効果を無効にする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①③效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下，以自己墓地的1只记载有“龙都 亚特兰蒂斯”卡名的怪兽为对象可以发动。将该怪兽以守备表示特殊召唤。②：此卡只要存在于怪兽区域，卡名视为“海”。③：对手发动怪兽的效果时，将场上・墓地的此卡除外，并将自己场上的1张表侧表示的“海”送至墓地可以发动。将该发动的效果无效。
