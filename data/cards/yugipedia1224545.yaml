    此卡名的①②效果1回合仅可各使用1次。①：将场上的此卡以外的、自己手牌・场上的1张卡送至墓地可以发动。将此卡视为永续魔法卡以表侧表示放在原本持有者的魔法与陷阱区域，从牌组将“白鸦骑士 马尔特”以外的最多2只“白鸦”怪兽特殊召唤（同名卡最多1张）。②：此卡视为永续魔法卡的情况下，怪兽的攻击宣言时，以自己的魔法与陷阱区域的1张“白鸦”怪兽卡为对象可以发动。将该卡特殊召唤。
