name:
  en: Daedalus Maelstrom
  de: Daedalus-Mahlstrom
  es: Vorágine Dédalo
  fr: Malstrom Dédale
  it: Maelstrom Dedalo
  pt: Turbilhão de Daedalus
  ja: <ruby>海竜神の大渦<rt>ダイダロス・メイルストローム</rt></ruby>
  ja_romaji: Daidarosu Meirusutorōmu
  ko: 다이달로스 메일스트롬
  ko_rr:
  zh-TW:
  zh-CN: 代达罗斯的大涡
text:
  en: |-
    When your opponent would Normal or Special Summon a monster(s), while you control "Atlantis, City of the Sea Dragon": Negate the Summon, and if you do, destroy that monster(s), then if you control a WATER Link Monster, you can destroy all monsters on the field, except WATER monsters. You can banish this card from your GY and send 1 face-up "Umi" you control to the GY, then target 1 monster your opponent controls; send it to the GY. You can only use 1 "Daedalus Maelstrom" effect per turn, and only once that turn.
  de: |-
    Wenn dein Gegner ein oder mehr Monster als Normal- oder Spezialbeschwörung beschwören würde, solange du „Atlantis, Stadt des Seedrachen“ kontrollierst: Annulliere die Beschwörung und falls du dies tust, zerstöre jene Monster, dann, falls du ein WASSER Linkmonster kontrollierst, kannst du alle Monster auf dem Spielfeld zerstören, außer WASSER Monstern. Du kannst diese Karte von deinem Friedhof verbannen und 1 offenes „Umi“, das du kontrollierst, auf den Friedhof legen und dann 1 Monster wählen, das dein Gegner kontrolliert; lege es auf den Friedhof. Du kannst nur 1 Effekt von „Daedalus-Mahlstrom“ pro Spielzug verwenden und in jenem Spielzug nur einmal.
  es: |-
    Cuando tu adversario fuera a Invocar uno o más monstruos de Modo Normal o Especial, mientras controlas "Atlántida, Ciudad del Dragón Marino": niega la Invocación y, si lo haces, destruye ese o esos monstruos y después, si controlas un Monstruo de Enlace de AGUA, puedes destruir todos los monstruos en el Campo, excepto monstruos de AGUA. Puedes desterrar esta carta en tu Cementerio y mandar 1 "Umi" boca arriba que controles al Cementerio, y después selecciona 1 monstruo que controle tu adversario; mándalo al Cementerio. Sólo puedes usar 1 efecto de "Vorágine Dédalo" por turno, y sólo una vez ese turno.
  fr: |-
    Lorsque votre adversaire va Invoquer Normalement ou Spécialement un ou plusieurs monstres, tant que vous contrôlez "Atlantis, Cité du Dragon des Mers" : annulez l'Invocation, et si vous le faites, détruisez ces monstres, puis si vous contrôlez un Monstre Lien EAU, vous pouvez détruire tous les monstres (monstres EAU exclus) sur le Terrain. Vous pouvez bannir cette carte depuis votre Cimetière, et envoyez 1 "Umi" face recto que vous contrôlez au Cimetière, puis ciblez 1 monstre contrôlé par votre adversaire ; envoyez-le au Cimetière. Vous ne pouvez utiliser qu'1 effet de "Malstrom Dédale" par tour, et uniquement une fois le tour.
  it: |-
    Quando il tuo avversario sta per Evocare Normalmente o Specialmente uno o più mostri, mentre controlli "Atlantide, Città del Drago del Mare": annulla l'Evocazione e, se lo fai, distruggi quei mostri, poi se controlli un Mostro Link ACQUA, puoi distruggere tutti i mostri sul Terreno, eccetto i mostri ACQUA. Puoi bandire questa carta dal tuo Cimitero e mandare 1 "Umi" scoperto che controlli al Cimitero, poi scegliere come bersaglio 1 mostro controllato dal tuo avversario; mandalo al Cimitero. Puoi utilizzare solo 1 effetto di "Maelstrom Dedalo" per turno, e solo una volta in quel turno.
  pt: |-
    Quando seu oponente Invocaria um ou mais monstros por Invocação-Normal ou Especial, enquanto você controlar "Atlântida, a Cidade do Dragão Marinho": negue a Invocação e, se isso acontecer, destrua esse(s) monstro(s) e, depois, se você controlar um Monstro Link de ÁGUA, você pode destruir todos os monstros no campo, exceto monstros de ÁGUA. Você pode banir este card do seu Cemitério e enviar 1 "Umi" com a face para cima que você controla para o Cemitério e, depois, escolha 1 monstro que seu oponente controla; envie-o para o Cemitério. Você só pode usar 1 efeito de "Turbilhão de Daedalus" por turno e apenas uma vez por turno.
  ja: |-
    このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。①：自分フィールドに「竜都アトランティス」が存在し、相手がモンスターを召喚・特殊召喚する際に発動できる。それを無効にし、そのモンスターを破壊する。その後、自分フィールドに水属性Ｌモンスターが存在する場合、水属性モンスターを除く、フィールドのモンスターを全て破壊できる。②：墓地のこのカードを除外し、自分フィールドの表側表示の「海」１枚を墓地へ送り、相手フィールドのモンスター１体を対象として発動できる。そのモンスターを墓地へ送る。
  ko: |-
    이 카드명의 ①②의 효과는 1턴에 1번, 어느 쪽이든 1개밖에 사용할 수 없다. ①: 자신 필드에 "용도 아틀란티스"가 존재하고, 상대가 몬스터를 일반 소환 / 특수 소환할 시기에 발동할 수 있다. 그것을 무효로 하고, 그 몬스터를 파괴한다. 그 후, 자신 필드에 물 속성 링크 몬스터가 존재할 경우, 물 속성 몬스터가 아닌, 필드의 몬스터를 전부 파괴할 수 있다. ②: 묘지의 이 카드를 제외하고, 자신 필드의 앞면 표시의 "바다" 1장을 묘지로 보내고, 상대 필드의 몬스터 1장을 대상으로 하여 발동할 수 있다. 그 몬스터를 묘지로 보낸다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合1次，仅可使用其中1个。①：自己场上存在“龙都 亚特兰蒂斯”，且对手召唤・特殊召唤怪兽之际可以发动。将其无效，将该怪兽破坏。然后，自己场上存在水属性连接怪兽的情况下，可将除水属性怪兽以外的、场上的怪兽全部破坏。②：将墓地的此卡除外，将自己场上的1张表侧表示的“海”送至墓地，以对手场上的1只怪兽为对象可以发动。将该怪兽送至墓地。
