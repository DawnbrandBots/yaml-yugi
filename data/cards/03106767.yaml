text:
  en: |-
    During your opponent's End Phase: You can place this card from your GY on top of the Deck. During the Main Phase (Quick Effect): You can return this card from the field to the hand, and if you do, each player draws 1 card, then your opponent can draw 1 card, and if they do, you must keep your hand revealed during this Main Phase. (Quick Effect): You can banish this revealed card from your hand; destroy all face-up cards your opponent controls. You can only use each effect of "The Secret Crane Princess Who Returns A Favor" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：相手エンドフェイズに発動できる。墓地のこのカードをデッキの一番上に戻す。②：自分・相手のメインフェイズに発動できる。フィールドのこのカードを手札に戻し、お互いはそれぞれ１枚ドローする。その後、相手は以下の効果を適用できる。●自分は１枚ドローし、このメインフェイズ中、相手は手札を全て公開し続ける。③：自分・相手ターンに、手札で公開されているこのカードを除外して発動できる。相手フィールドの表側表示カードを全て破壊する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：在对手的结束阶段可以发动。将墓地的此卡放回牌组最上面。②：在自己・对手的主要阶段可以发动。将场上的此卡放回手牌，双方各抽1张。然后，对手可适用以下效果。
    ●自己抽1张，此主要阶段中，对手持续公开所有手牌。
    ③：在自己・对手回合中，将手牌中被公开的此卡除外可以发动。将对手场上的表侧表示卡全部破坏。
