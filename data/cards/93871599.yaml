name:
  en: The Guiding Flute of Summoning Dragons
  de: Leitende Drachenrufflöte
  es: La Flauta Guía de Convoca-Dragones
  fr: La Flûte Directrice d'Invocation des Dragons
  it: Flauto Guida Evoca-Draghi
  pt: A Flauta Guia para Invocação de Dragões
  ja: ドラゴン・<ruby>導<rt>みちび</rt></ruby>きの<ruby>呼<rt>よび</rt></ruby><ruby>笛<rt>ぶえ</rt></ruby>
  ja_romaji: Doragon Michibiki no Yobibue
  ko: 드래곤 인도의 호적
  ko_rr:
  zh-TW:
  zh-CN: 龙之引导唤笛
text:
  en: |-
    If a Spellcaster monster is on the field: Special Summon 1 Level 5 or higher Dragon monster from your Deck, then if your opponent controls 2 or more monsters, you can Special Summon 1 monster from your Deck with the same name as the first Summoned monster, also you cannot Special Summon for the rest of this turn, except Dragon or Spellcaster monsters. During your Main Phase 2, if this card is in your GY because it was sent there this turn: You can banish it; draw 1 card. You can only use each effect of "The Guiding Flute of Summoning Dragons" once per turn.
  de: |-
    Falls sich ein Hexer-Monster auf dem Spielfeld befindet: Beschwöre 1 Drache-Monster der Stufe 5 oder höher als Spezialbeschwörung von deinem Deck, dann, falls dein Gegner 2 oder mehr Monster kontrolliert, kannst du 1 Monster mit demselben Namen wie das erste beschworene Monster als Spezialbeschwörung von deinem Deck beschwören, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von Drache- und Hexer-Monstern. Während deiner Main Phase 2, falls sich diese Karte in deinem Friedhof befindet, weil sie in diesem Spielzug dorthin gelegt wurde: Du kannst sie verbannen; ziehe 1 Karte. Du kannst jeden Effekt von „Leitende Drachenrufflöte“ nur einmal pro Spielzug verwenden.
  es: |-
    Si un monstruo Lanzador de Conjuros está en el Campo: Invoca de Modo Especial 1 monstruo Dragón de Nivel 5 o mayor desde tu Deck y después, si tu adversario controla 2 o más monstruos, puedes Invocar de Modo Especial 1 monstruo desde tu Deck con el mismo nombre que el primer monstruo Invocado, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos Dragón o Lanzador de Conjuros. Durante tu Main Phase 2, si esta carta está en tu Cementerio porque fue mandada allí este turno: puedes desterrarla; roba 1 carta. Sólo puedes usar cada efecto de "La Flauta Guía de Convoca-Dragones" una vez por turno.
  fr: |-
    Si un monstre Magicien est sur le Terrain : Invoquez Spécialement 1 monstre Dragon de min. Niveau 5 depuis votre Deck, puis si votre adversaire contrôle min. 2 monstres, vous pouvez Invoquer Spécialement 1 monstre depuis votre Deck du même nom que le premier monstre Invoqué, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Dragon ou Magicien exclus) le reste de ce tour. Durant votre Main Phase 2, si cette carte est dans votre Cimetière parce qu'elle y a été envoyée ce tour : vous pouvez la bannir ; piochez 1 carte. Vous ne pouvez utiliser chaque effet de "La Flûte Directrice d'Invocation des Dragons" qu'une fois par tour.
  it: |-
    Se un mostro Incantatore è sul Terreno: Evoca Specialmente 1 mostro Drago di Livello 5 o superiore dal tuo Deck, poi se il tuo avversario controlla 2 o più mostri, puoi Evocare Specialmente dal tuo Deck 1 mostro con lo stesso nome del primo mostro Evocato, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri Drago o Incantatore. Durante la tua Main Phase 2, se questa carta è nel tuo Cimitero perché è stata mandata lì in questo turno: puoi bandirla; pesca 1 carta. Puoi utilizzare ogni effetto di "Flauto Guida Evoca-Draghi" una sola volta per turno.
  pt: |-
    Se um monstro Mago estiver no campo: Invoque por Invocação-Especial 1 monstro Dragão de Nível 5 ou mais do seu Deck e, depois, se seu oponente controlar 2 ou mais monstros, você pode Invocar por Invocação-Especial 1 monstro do seu Deck com o mesmo nome que o do primeiro monstro Invocado e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros Dragão ou Mago. Durante sua Fase Principal 2, se este card estiver no seu Cemitério porque foi enviado para lá neste turno: você pode bani-lo; compre 1 card. Você só pode usar cada efeito de "A Flauta Guia para Invocação de Dragões" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：フィールドに魔法使い族モンスターが存在する場合に発動できる。デッキからレベル５以上のドラゴン族モンスター１体を特殊召喚する。相手フィールドにモンスターが２体以上存在する場合、さらに特殊召喚したモンスターの同名モンスター１体をデッキから特殊召喚できる。このターン、自分はドラゴン族・魔法使い族モンスターしか特殊召喚できない。②：自分メインフェイズ２に、このターンに墓地へ送られたこのカードを除外して発動できる。自分は１枚ドローする。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 필드에 마법사족 몬스터가 존재할 경우에 발동할 수 있다. 덱에서 레벨 5 이상의 드래곤족 몬스터 1장을 특수 소환한다. 상대 필드에 몬스터가 2장 이상 존재할 경우, 추가로 특수 소환한 몬스터와 같은 이름의 몬스터 1장을 덱에서 특수 소환할 수 있다. 이 턴에, 자신은 드래곤족 / 마법사족 몬스터밖에 특수 소환할 수 없다. ②: 자신 메인 페이즈 2 에, 이 턴에 묘지로 보내진 이 카드를 제외하고 발동할 수 있다. 자신은 1장 드로우한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：场上存在魔法师族怪兽的情况下可以发动。从牌组将1只等级5以上的龙族怪兽特殊召唤。对手场上存在2只以上怪兽的情况下，进而可再从牌组将1只特殊召唤的怪兽的同名怪兽特殊召唤。此回合，自己仅可特殊召唤龙族・魔法师族怪兽。②：在自己的主要阶段2，将在此回合被送至墓地的此卡除外可以发动。自己抽1张。
