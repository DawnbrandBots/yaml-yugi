text:
  en: |-
    Target up to 3 "Ars Magna" monsters in your field or GY; banish them, then until the end of this turn, you can negate the effects of up to that many other face-up cards on the field. You can banish this card from your GY; return 1 "Power Patron" Link Monster from your GY to the Extra Deck, then you can Special Summon it. You can only use 1 "Ars Magna "Philosophorum"" effect per turn, and only once that turn.
  de: |-
    Wähle bis zu 3 „Ars Magna“-Monster auf deiner Spielfeldseite oder in deinem Friedhof; verbanne sie, dann kannst du bis zum Ende dieses Spielzugs die Effekte von bis zu ebenso vielen anderen offenen Karten auf dem Spielfeld annullieren. Du kannst diese Karte von deinem Friedhof verbannen; lege 1 „Machtpatron“-Linkmonster von deinem Friedhof ins Extra Deck zurück, dann kannst du es als Spezialbeschwörung beschwören. Du kannst nur 1 Effekt von „Ars Magna „Philosophorum““ pro Spielzug verwenden und in jenem Spielzug nur einmal.
  es: |-
    Selecciona hasta 3 monstruos "Ars Magna" en tu Campo o Cementerio; destiérralos y después, hasta el final de este turno, puedes negar los efectos de hasta ese número de otras cartas boca arriba en el Campo. Puedes desterrar esta carta en tu Cementerio; devuelve al Deck Extra 1 Monstruo de Enlace "Modelo de Poder" en tu Cementerio, y después puedes Invocarlo de Modo Especial. Sólo puedes usar 1 efecto de "Ars Magna "Philosophorum"" por turno, y sólo una vez ese turno.
  fr: |-
    Ciblez max. 3 monstres "Ars Magna" dans votre Terrain ou Cimetière ; bannissez-les, puis jusqu'à la fin de ce tour, vous pouvez annuler les effets de max. autant d'autres cartes face recto sur le Terrain. Vous pouvez bannir cette carte depuis votre Cimetière ; renvoyez 1 Monstre Lien "Mécène du Pouvoir" depuis votre Cimetière à l'Extra Deck, puis vous pouvez l'Invoquer Spécialement. Vous ne pouvez utiliser qu'1 effet de "Ars Magna "Philosophorum"" par tour, et uniquement une fois le tour.
  it: |-
    Scegli come bersaglio fino a 3 mostri "Ars Magna" nel tuo Terreno o Cimitero; bandiscili, poi fino alla fine di questo turno, puoi annullare gli effetti di fino a quel numero di altre carte scoperte sul Terreno. Puoi bandire questa carta dal tuo Cimitero; fai ritornare 1 Mostro Link "Patrono Potente" dal tuo Cimitero nell'Extra Deck, poi puoi Evocarlo Specialmente. Puoi utilizzare solo 1 effetto di "Ars Magna "Philosophorum"" per turno, e solo una volta in quel turno.
  pt: |-
    Escolha até 3 monstros "Ars Magna" no seu campo ou Cemitério; bana-os e, depois, até o final deste turno, você pode negar os efeitos de até esse número de outros cards com a face para cima no campo. Você pode banir este card do seu Cemitério; devolva 1 Monstro Link "Patrono(a) do Poder" do seu Cemitério para o Deck Adicional e, depois, você pode Invocá-lo por Invocação-Especial. Você só pode usar 1 efeito de "Ars Magna "Philosophorum"" por turno e apenas uma vez por turno.
  ja: |-
    このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。①：自分のフィールド・墓地の「アルス＝マグナ」モンスターを３体まで対象として発動できる。そのモンスターを除外する。その後、その数までフィールドの他の表側表示カードの効果をターン終了時まで無効にできる。②：墓地のこのカードを除外して発動できる。自分の墓地から「獄神」Ｌモンスター１体をＥＸデッキに戻す。その後、そのモンスターを特殊召喚できる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合1次，仅可使用其中1个。①：以自己场上・墓地的最多3只“奥艺”怪兽为对象可以发动。将该怪兽除外。然后，以其数量为上限，可将场上的其他表侧表示卡的效果直至回合结束时为止无效。②：将墓地的此卡除外可以发动。从自己墓地将1只“狱神”连接怪兽放回额外牌组。然后，可将该怪兽特殊召唤。
