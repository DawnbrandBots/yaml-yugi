name:
  en: Synchro Emergency
  de: Synchro-Notfall
  es: Emergencia Sincro
  fr: Urgence Synchro
  it: Emergenza Synchro
  pt: Emergência Sincro
  ja: シンクロ・エマージェンシー
  ja_romaji: Shinkuro Emājenshī
  ko: 싱크로 이멀전시
  ko_rr:
  zh-TW:
  zh-CN: 同步紧急
text:
  en: |-
    If only your opponent controls a monster, you can activate this card from your hand. Special Summon 1 monster from your hand (but negate its effects), then if your opponent controls a monster Special Summoned from the Extra Deck, you can Special Summon 1 "Synchron" monster from your Deck. Until the end of the next turn after this card resolves, you cannot Special Summon from the Extra Deck, except Synchro Monsters. You can banish this card from your GY; immediately after this effect resolves, Synchro Summon 1 Synchro Monster. You can only activate 1 "Synchro Emergency" per turn.
  de: |-
    Falls nur dein Gegner ein Monster kontrolliert, kannst du diese Karte von deiner Hand aktivieren. Beschwöre 1 Monster als Spezialbeschwörung von deiner Hand (aber annulliere seine Effekte), dann, falls dein Gegner ein Monster kontrolliert, das als Spezialbeschwörung vom Extra Deck beschworen wurde, kannst du 1 „Synchron“-Monster als Spezialbeschwörung von deinem Deck beschwören. Du kannst bis zum Ende des nächsten Spielzugs, nachdem diese Karte aufgelöst wurde, keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Synchromonstern. Du kannst diese Karte von deinem Friedhof verbannen; sofort nachdem dieser Effekt aufgelöst wurde, beschwöre 1 Synchromonster als Synchrobeschwörung. Du kannst nur 1 „Synchro-Notfall“ pro Spielzug aktivieren.
  es: |-
    Si sólo tu adversario controla un monstruo, puedes activar esta carta desde tu mano. Invoca 1 monstruo de Modo Especial desde tu mano (pero niega sus efectos) y después, si tu adversario controla un monstruo Invocado de Modo Especial desde el Deck Extra, puedes Invocar de Modo Especial, desde tu Deck, 1 monstruo "Sincrón" (o "Sincronizador"). Hasta el final del próximo turno después de que esta carta se resuelva, no puedes Invocar de Modo Especial desde el Deck Extra, excepto Monstruos de Sincronía. Puedes desterrar esta carta en tu Cementerio; inmediatamente después de que se resuelva este efecto, Invoca por Sincronía 1 Monstruo de Sincronía. Sólo puedes activar 1 "Emergencia Sincro" por turno.
  fr: |-
    Si uniquement votre adversaire contrôle un monstre, vous pouvez activer cette carte depuis votre main. Invoquez Spécialement 1 monstre depuis votre main (mais annulez ses effets), puis si votre adversaire contrôle un monstre Invoqué Spécialement depuis l'Extra Deck, vous pouvez Invoquer Spécialement 1 monstre "Synchronique" depuis votre Deck. Jusqu'à la fin du prochain tour après la résolution de cette carte, vous ne pouvez pas Invoquer Spécialement (Monstres Synchro exclus) depuis l'Extra Deck. Vous pouvez bannir cette carte depuis votre Cimetière ; immédiatement après la résolution de cet effet, Invoquez par Synchronisation 1 Monstre Synchro. Vous ne pouvez activer qu'1 "Urgence Synchro" par tour.
  it: |-
    Se solo il tuo avversario controlla un mostro, puoi attivare questa carta dalla tua mano. Evoca Specialmente 1 mostro dalla tua mano (ma annulla i suoi effetti), poi se il tuo avversario controlla un mostro Evocato Specialmente dall'Extra Deck, puoi Evocare Specialmente 1 mostro "Synchron" dal tuo Deck. Fino alla fine del prossimo turno dopo che questa carta si è risolta, non puoi Evocare Specialmente dall'Extra Deck, eccetto Mostri Synchro. Puoi bandire questa carta dal tuo Cimitero; immediatamente dopo che questo effetto si è risolto, Synchro Evoca 1 Mostro Synchro. Puoi attivare solo 1 "Emergenza Synchro" per turno.
  pt: |-
    Se somente seu oponente controlar um monstro, você pode ativar este card da sua mão. Invoque por Invocação-Especial 1 monstro da sua mão (mas negue seus efeitos) e, depois, se seu oponente controlar um monstro Invocado por Invocação-Especial do Deck Adicional, você pode Invocar por Invocação-Especial 1 monstro "Sincron" do seu Deck. Até o final do próximo turno depois que este card resolver, você não pode Invocar por Invocação-Especial do Deck Adicional, exceto Monstros Sincro. Você pode banir este card do seu Cemitério; imediatamente depois que este efeito resolver, Invoque 1 Monstro Sincro por Invocação-Sincro. Você só pode ativar 1 "Emergência Sincro" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。相手フィールドにのみモンスターが存在する場合、このカードの発動は手札からもできる。①：手札からモンスター１体を効果を無効にして特殊召喚する。ＥＸデッキから特殊召喚されたモンスターが相手フィールドに存在する場合、さらにデッキから「シンクロン」モンスター１体を特殊召喚できる。このカードの発動後、次のターンの終了時まで自分はＳモンスターしかＥＸデッキから特殊召喚できない。②：墓地のこのカードを除外して発動できる。Ｓモンスター１体のＳ召喚を行う。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. 상대 필드에만 몬스터가 존재할 경우, 이 카드의 발동은 패에서도 할 수 있다. ①: 패에서 몬스터 1장을 효과를 무효로 하고 특수 소환한다. 엑스트라 덱에서 특수 소환된 몬스터가 상대 필드에 존재할 경우, 추가로 덱에서 "싱크론" 몬스터 1장을 특수 소환할 수 있다. 이 카드의 발동 후, 다음 턴의 종료시까지 자신은 싱크로 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. ②: 묘지의 이 카드를 제외하고 발동할 수 있다. 싱크로 몬스터 1장의 싱크로 소환을 실행한다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。仅有对手场上才存在怪兽的情况下，此卡也可从手牌发动。①：从手牌将1只怪兽的效果无效并特殊召唤。对手场上存在被从额外牌组特殊召唤的怪兽的情况下，进而可从牌组特殊召唤1只“同步士”怪兽。此卡发动后，直至下个回合结束时为止，自己从额外牌组仅可特殊召唤同步怪兽。②：将墓地的此卡除外可以发动。进行1只同步怪兽的同步召唤。
