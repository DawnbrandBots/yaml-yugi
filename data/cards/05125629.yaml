name:
  en: Malefic Paradigm Shift
  de: Niederträchtige Musterverschiebung
  es: Cambio de Paradigma Malicioso
  fr: Modification de Paradigme Corrompu
  it: Cambiamento Paradigma Maligno
  pt: Mudança Perniciosa de Paradigma
  ja: <ruby>Ｓｉｎ<rt>シン</rt></ruby> <ruby>Ｐａｒａｄｉｇｍ<rt>パラダイム</rt></ruby> <ruby>Ｓｈｉｆｔ<rt>シフト</rt></ruby>
  ja_romaji: Shin Paradaimu Shifuto
  ko: Sin 패러다임 시프트
  ko_rr:
  zh-TW:
  zh-CN: Sin 范式转变
text:
  en: |-
    Add to your hand, or place face-up in your Field Zone, 1 "Malefic World" from your Deck or GY, then Special Summon 1 "Malefic" monster from your Deck or Extra Deck in Defense Position, ignoring its Summoning conditions, then if your opponent controls a monster with 2500 or more ATK, all face-up monsters they currently control lose 2500 ATK until the end of this turn. You can activate this card from your hand by paying half your LP. You can only activate 1 "Malefic Paradigm Shift" per turn.
  de: |-
    Füge deiner Hand 1 „Niederträchtige Welt“ von deinem Deck oder Friedhof hinzu oder lege sie offen in deine Spielfeldzone, dann beschwöre 1 „Niederträchtig“-Monster als Spezialbeschwörung von deinem Deck oder Extra Deck in die Verteidigungsposition, ungeachtet seiner Beschwörungsbedingungen, dann, falls dein Gegner ein Monster mit 2500 oder mehr ATK kontrolliert, verlieren alle offenen Monster, die er derzeit kontrolliert, bis zum Ende dieses Spielzugs 2500 ATK. Du kannst diese Karte von deiner Hand aktivieren, indem du die Hälfte deiner LP zahlst. Du kannst nur 1 „Niederträchtige Musterverschiebung“ pro Spielzug aktivieren.
  es: |-
    Añade a tu mano, o pon boca arriba en tu Zona del Campo, 1 "Mundo Malicioso" en tu Deck o Cementerio, y después Invoca de Modo Especial, desde tu Deck o Deck Extra, 1 monstruo "Malicioso/a" en Posición de Defensa, ignorando sus condiciones de Invocación y después, si tu adversario controla un monstruo con 2500 ATK o más, todos los monstruos boca arriba que controle en este momento pierden 2500 ATK hasta el final de este turno. Puedes activar esta carta desde tu mano pagando la mitad de tus LP. Sólo puedes activar 1 "Cambio de Paradigma Malicioso" por turno.
  fr: |-
    Ajoutez à votre main ou placez face recto dans votre Zone Terrain, 1 "Monde Corrompu" depuis votre Deck ou Cimetière, puis Invoquez Spécialement 1 monstre "Corrompu" depuis votre Deck ou Extra Deck en Position de Défense, en ignorant ses conditions d'Invocation, puis si votre adversaire contrôle un monstre avec min. 2500 ATK, tous les monstres face recto qu'il contrôle actuellement perdent 2500 ATK jusqu'à la fin de ce tour. Vous pouvez activer cette carte depuis votre main en payant la moitié de vos LP. Vous ne pouvez activer qu'1 "Modification de Paradigme Corrompu" par tour.
  it: |-
    Aggiungi alla tua mano, o metti scoperto nella tua Zona Terreno, 1 "Mondo Maligno" dal tuo Deck o Cimitero, poi Evoca Specialmente 1 mostro "Maligno" dal tuo Deck o Extra Deck in Posizione di Difesa, ignorando le sue condizioni di Evocazione, poi se il tuo avversario controlla un mostro con ATK 2500 o superiore, tutti i mostri scoperti che controlla attualmente perdono 2500 ATK fino alla fine di questo turno. Puoi attivare questa carta dalla tua mano pagando la metà dei tuoi LP. Puoi attivare solo 1 "Cambiamento Paradigma Maligno" per turno.
  pt: |-
    Adicione à sua mão, ou coloque com a face para cima na sua Zona do Campo, 1 "Mundo Pernicioso" do seu Deck ou Cemitério e, depois, Invoque por Invocação-Especial 1 monstro "Pernicioso(a)" do seu Deck ou Deck Adicional em Posição de Defesa, ignorando suas condições de Invocação e, depois, se seu oponente controlar um monstro com 2500 ou mais de ATK, todos os monstros com a face para cima que ele controla atualmente perdem 2500 de ATK até o final deste turno. Você pode ativar este card da sua mão ao pagar metade dos seus PV. Você só pode ativar 1 "Mudança Perniciosa de Paradigma" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。このカードはＬＰを半分払って手札から発動する事もできる。①：自分のデッキ・墓地から「Ｓｉｎ Ｗｏｒｌｄ」１枚を選び、手札に加えるか自分のフィールドゾーンに表側表示で置く。その後、デッキ・ＥＸデッキから「Ｓｉｎ」モンスター１体を召喚条件を無視して守備表示で特殊召喚する。その後、相手フィールドに攻撃力２５００以上のモンスターが存在する場合、相手フィールドの全てのモンスターの攻撃力はターン終了時まで２５００ダウンする。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. 이 카드는 LP를 절반 지불하고 패에서 발동할 수도 있다. ①: 자신의 덱 / 묘지에서 "Sin(신) 월드" 1장을 고르고, 패에 넣거나 자신의 필드 존에 앞면 표시로 놓는다. 그 후, 덱 / 엑스트라 덱에서 "Sin(신)" 몬스터 1장을 소환 조건을 무시하고 수비 표시로 특수 소환한다. 그 후, 상대 필드에 공격력 2500 이상의 몬스터가 존재할 경우, 상대 필드의 모든 몬스터의 공격력은 턴 종료시까지 2500 내린다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。此卡也可通过支付一半LP来从手牌发动。①：从自己牌组・墓地挑选1张“Sin 世界”，加入手牌或以表侧表示放在自己的场地区域。然后，从牌组・额外牌组将1只“Sin”怪兽无视召唤条件以守备表示特殊召唤。然后，对手场上存在攻击力2500以上的怪兽的情况下，对手场上的所有怪兽的攻击力直至回合结束时为止下降2500。
