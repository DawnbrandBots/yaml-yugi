  en: |-
    If you control no monsters, you can Normal Summon this card without Tributing. You can only use each of the following effects of "Barrel Dragon the Machine Dragon" once per turn. During your Main Phase: You can add 1 DARK Machine monster from your Deck to your hand, except "Barrel Dragon the Machine Dragon". During the Battle Phase, if this card is in your GY because it was sent there from the field this turn (Quick Effect): You can Special Summon it, and if you do, toss a coin 3 times, then you can destroy monsters on the field up to the number of heads.
