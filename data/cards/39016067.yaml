text:
  en: |-
    While this Pendulum Summoned card is in your Monster Zone, your opponent cannot target it with card effects, also it cannot be destroyed by your opponent's card effects. (Quick Effect): You can target 1 Pendulum Monster Card you control and 1 card your opponent controls; return them to the hand. You can only use this effect of "Wind Unicorn Parallel, the Dracoslayer" once per turn.
  de: |-
    Solange diese als Pendelbeschwörung beschworene Karte in deiner Monsterzone liegt, kann dein Gegner sie nicht als Ziel für Karteneffekte wählen, zusätzlich kann sie nicht durch Karteneffekte deines Gegners zerstört werden. (Schnelleffekt): Du kannst 1 Pendelmonsterkarte, die du kontrollierst, und 1 Karte, die dein Gegner kontrolliert, wählen; gib sie auf die Hand zurück. Du kannst diesen Effekt von „Wind-Einhorn Parallel, der Drachobezwinger“ nur einmal pro Spielzug verwenden.
  es: |-
    Mientras esta carta Invocada por Péndulo esté en tu Zona de Monstruos, tu adversario no puede seleccionarla con efectos de cartas, y además no puede ser destruida por efectos de cartas de tu adversario. (Efecto Rápido): puedes seleccionar 1 Carta de Monstruo de Péndulo que controles y 1 carta que controle tu adversario; devuélvelas a la mano. Sólo puedes usar este efecto de "Unicornio de Viento Paralelo, el Dracoasesino" una vez por turno.
  fr: |-
    Tant que cette carte Invoquée par Pendulation est dans votre Zone Monstre, votre adversaire ne peut pas la cibler avec des effets de carte, et aussi, elle ne peut pas être détruite par des effets de carte de votre adversaire. (Effet Rapide) : vous pouvez cibler 1 Carte Monstre Pendule que vous contrôlez et 1 carte contrôlée par votre adversaire ; renvoyez-les à la main. Vous ne pouvez utiliser cet effet de "Licorne du Vent Parallèle, le Dracossassin" qu'une fois par tour.
  it: |-
    Mentre questa carta Evocata Pendulum è nella tua Zona Mostri, il tuo avversario non può sceglierla come bersaglio con gli effetti delle carte, inoltre essa non può essere distrutta dagli effetti delle carte del tuo avversario. (Effetto Rapido): puoi scegliere come bersaglio 1 Carta Mostro Pendulum che controlli e 1 carta controllata dal tuo avversario; falle ritornare nella mano. Puoi utilizzare questo effetto di "Parallelo Unicorno del Vento, il Dracoassassino" una sola volta per turno.
  pt: |-
    Enquanto este card Invocado por Invocação-Pêndulo estiver na sua Zona de Monstros, seu oponente não pode escolhê-lo como alvo de efeitos de card e, além disso, ele não pode ser destruído pelos efeitos de card do seu oponente. (Efeito Rápido): você pode escolher 1 Card de Monstro Pêndulo que você controla e 1 card que seu oponente controla; devolva-os para a mão. Você só pode usar este efeito de "Unicórnio do Vento Paralelo, o Dracossassino" uma vez por turno.
  ja: |-
    このカード名の②のモンスター効果は１ターンに１度しか使用できない。①：Ｐ召喚したこのカードがモンスターゾーンに存在する限り、このカードは相手の効果では破壊されず、相手はこのカードを効果の対象にできない。②：自分・相手ターンに、自分フィールドのＰモンスターカード１枚と相手フィールドのカード１枚を対象として発動できる。そのカードを手札に戻す。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的②怪兽效果1回合仅可使用1次。①：只要灵摆召唤的此卡存在于怪兽区域，此卡不会因对手的效果被破坏，对手不可将此卡作为效果的对象。②：在自己・对手回合中，以自己场上的1张灵摆怪兽卡和对手场上的1张卡为对象可以发动。将该卡放回手牌。
