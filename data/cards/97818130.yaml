name:
  en: Black Skull Dragon, the Archfiend of Unity
  de: Schw. Totenkopfdrache, der Erzunterweltler der Einheit
  es: Dragón de Cráneo Negro, el Archidemonio de la Unidad
  fr: Dragon Crâne Noir, l'Archdémon de l'Unité
  it: Drago Teschio Nero, l'Arcidemone dell'Unità
  pt: Dragão Caveira Negro, o Arquidemônio da Unidade
  ja: <ruby>結<rt>けっ</rt></ruby><ruby>束<rt>そく</rt></ruby>の<ruby>悪<rt>あく</rt></ruby><ruby>魔<rt>ま</rt></ruby><ruby>竜<rt>りゅう</rt></ruby>ブラック・デーモンズ・ドラゴン
  ja_romaji: Kessoku no Akumaryū - Burakku Dēmonzu Doragon
  ko: 결속의 악마룡 블랙 데몬즈 드래곤
  ko_rr:
  zh-TW:
  zh-CN: 团结之凶魔龙 黑恶魔龙
text:
  en: |-
    Cannot be Normal Summoned/Set. Must be Special Summoned by its own effect. If this card is in your hand (Quick Effect): You can discard 1 Quick-Play or Ritual Spell; Special Summon this card in Defense Position. You can only use this effect of "Black Skull Dragon, the Archfiend of Unity" once per turn. If this card is Special Summoned: You can Set 1 Spell/Trap that mentions "Light and Darkness Ritual" from your Deck or GY. At the start of the Battle Phase: You can make your opponent lose 800 LP, and if you do, this card gains 800 ATK.
  de: |-
    Kann nicht als Normalbeschwörung beschworen/gesetzt werden. Diese Karte muss durch ihren eigenen Effekt als Spezialbeschwörung beschworen werden. Falls sich diese Karte in deiner Hand befindet (Schnelleffekt): Du kannst 1 Schnell- oder Ritualzauber abwerfen; beschwöre diese Karte als Spezialbeschwörung in die Verteidigungsposition. Du kannst diesen Effekt von „Schw. Totenkopfdrache, der Erzunterweltler der Einheit“ nur einmal pro Spielzug verwenden. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 Zauber/Falle, der oder die „Ritual von Licht und Finsternis“ erwähnt, von deinem Deck oder Friedhof setzen. Am Beginn der Battle Phase: Du kannst deinen Gegner 800 LP verlieren lassen und falls du dies tust, erhält diese Karte 800 ATK.
  es: |-
    No puede ser Invocado de Modo Normal/Colocado. Debe ser Invocado de Modo Especial por su propio efecto. Si esta carta está en tu mano (Efecto Rápido): puedes descartar 1 Mágica de Juego Rápido o Mágica de Ritual; Invoca esta carta de Modo Especial en Posición de Defensa. Sólo puedes usar este efecto de "Dragón de Cráneo Negro, el Archidemonio de la Unidad" una vez por turno. Si esta carta es Invocada de Modo Especial: puedes Colocar 1 Mágica/Trampa que mencione "Ritual de la Luz y la Oscuridad" desde tu Deck o Cementerio. Al comienzo de la Battle Phase: puedes hacer que tu adversario pierda 800 LP y, si lo haces, esta carta gana 800 ATK.
  fr: |-
    Ni Invocable Normalement ni Posable Normalement. Uniquement Invocable Spécialement par son propre effet. Si cette carte est dans votre main (Effet Rapide) : vous pouvez défausser 1 Magie Jeu-Rapide ou Rituelle ; Invoquez Spécialement cette carte en Position de Défense. Vous ne pouvez utiliser cet effet de "Dragon Crâne Noir, l'Archdémon de l'Unité" qu'une fois par tour. Si cette carte est Invoquée Spécialement : vous pouvez Poser 1 Magie/Piège qui mentionne "Rituel de la Lumière et des Ténèbres" depuis votre Deck ou Cimetière. Au début de la Battle Phase : vous pouvez faire perdre 800 LP à votre adversaire, et si vous le faites, cette carte gagne 800 ATK.
  it: |-
    Non può essere Evocato Normalmente/Posizionato. Deve essere Evocato Specialmente dal suo stesso effetto. Se questa carta è nella tua mano (Effetto Rapido): puoi scartare 1 Magia Rapida o Rituale; Evoca Specialmente questa carta in Posizione di Difesa. Puoi utilizzare questo effetto di "Drago Teschio Nero, l'Arcidemone dell'Unità" una sola volta per turno. Se questa carta viene Evocata Specialmente: puoi Posizionare 1 Magia/Trappola che menziona "Rituale di Luce e Oscurità" dal tuo Deck o Cimitero. All'inizio della Battle Phase: puoi far perdere al tuo avversario 800 LP e, se lo fai, questa carta guadagna 800 ATK.
  pt: |-
    Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial por seu próprio efeito. Se este card estiver na sua mão (Efeito Rápido): você pode descartar 1 Magia Rápida ou de Ritual; Invoque este card por Invocação-Especial em Posição de Defesa. Você só pode usar este efeito de "Dragão Caveira Negro, o Arquidemônio da Unidade" uma vez por turno. Se este card for Invocado por Invocação-Especial: você pode Baixar 1 Magia/Armadilha que mencione "Ritual da Luz e das Trevas" do seu Deck ou Cemitério. No começo da Fase de Batalha: você pode fazer com que seu oponente perca 800 PV e, se isso acontecer, este card ganha 800 de ATK.
  ja: |-
    このカードは通常召喚できず、このカードの効果でのみ特殊召喚できる。このカード名の①の効果は１ターンに１度しか使用できない。①：自分・相手ターンに、手札から速攻・儀式魔法カード１枚を捨てて発動できる。このカードを手札から守備表示で特殊召喚する。②：このカードが特殊召喚した場合に発動できる。自分のデッキ・墓地から「光と闇の儀式」のカード名が記された魔法・罠カード１枚を自分フィールドにセットする。③：お互いのバトルフェイズ開始時に発動できる。相手は８００ＬＰを失い、このカードの攻撃力は８００アップする。
  ko: |-
    이 카드는 통상 소환할 수 없으며, 이 카드의 효과로만 특수 소환할 수 있다. 이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 / 상대 턴에, 패에서 속공 / 의식 마법 카드 1장을 버리고 발동할 수 있다. 이 카드를 패에서 수비 표시로 특수 소환한다. ②: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 자신의 덱 / 묘지에서 "빛과 어둠의 의식"의 카드명이 쓰여진 마법 / 함정 카드 1장을 자신 필드에 세트한다. ③: 서로의 배틀 페이즈 개시시에 발동할 수 있다. 상대는 800 LP를 상실하고, 이 카드의 공격력은 800 올린다.
  zh-TW:
  zh-CN: |-
    此卡不可通常召唤，仅可通过此卡的效果特殊召唤。此卡名的①效果1回合仅可使用1次。①：在自己・对手回合中，从手牌将1张速攻・仪式魔法卡舍弃可以发动。从手牌将此卡以守备表示特殊召唤。②：此卡特殊召唤的情况下可以发动。从自己牌组・墓地将1张记载有“光与暗的仪式”卡名的魔法・陷阱卡放置在自己场上。③：在双方的战斗阶段开始时可以发动。对手失去800LP，此卡的攻击力上升800。
