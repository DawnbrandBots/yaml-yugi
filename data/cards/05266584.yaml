text:
  en: |-
    If you control no monsters, or all monsters you control are "Salamangreat" monsters: You can Special Summon this card from your hand, then you can increase or decrease the Level of 1 monster on the field by 1. If you Link Summon a Link-3 or higher FIRE Link Monster while this card is in your GY: You can banish this card; Set 1 "Salamangreat" Trap from your Deck. You can only use each effect of "Salamangreat Bastella" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのモンスターが、存在しない場合または「サラマングレイト」モンスターのみの場合に発動できる。このカードを手札から特殊召喚する。その後、フィールドのモンスター１体のレベルを１つ上げるか下げる事ができる。②：このカードが墓地に存在する状態で、自分がリンク３以上の炎属性ＬモンスターをＬ召喚した場合、このカードを除外して発動できる。デッキから「サラマングレイト」罠カード１枚を自分フィールドにセットする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：自己场上的怪兽，不存在的情况下或均为“转生炎兽”怪兽的情况下可以发动。从手牌将此卡特殊召唤。然后，可令场上的1只怪兽的等级上升或下降1。②：此卡存在于墓地的状态下，自己将连接3以上的炎属性连接怪兽连接召唤的情况下，将此卡除外可以发动。从牌组将1张“转生炎兽”陷阱卡放置在自己场上。
