  ja: |-
    ①：このカードの発動時の効果処理として、お互いはそれぞれ自身の手札からモンスター１体を攻撃表示で特殊召喚できる。その後、この効果で特殊召喚したモンスター以外の表側表示モンスターがフィールドに存在する場合、それらを全て裏側守備表示にする。このカードの発動後、ターン終了時まで自分はモンスターを召喚・特殊召喚できない。②：１ターンに１度、自分のモンスターの攻撃宣言時に発動できる。その攻撃を無効にし、相手フィールドの裏側表示カード１枚を破壊する。③：相手エンドフェイズに発動する。このカードを手札に戻す。
