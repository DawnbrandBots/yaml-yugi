text:
  en: |-
    Cannot be destroyed by card effects. You can only use each of the following effects of "Invincible Rocket Warrior" once per turn. You can send 1 Spell/Trap that mentions "Dark Time Wizard" from your Deck to the GY; Special Summon this card from your hand, then you can make 1 monster your opponent controls lose 1500 ATK, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Fusion Monsters. When this card declares an attack: You can add 1 Level 4 Warrior monster from your Deck to your hand.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：デッキから「時の黒魔術師」のカード名が記された魔法・罠カード１枚を墓地へ送って発動できる。このカードを手札から特殊召喚する。その後、相手フィールドのモンスター１体の攻撃力を１５００ダウンできる。この効果の発動後、ターン終了時まで自分は融合モンスターしかＥＸデッキから特殊召喚できない。②：フィールドのこのカードは効果では破壊されない。③：このカードの攻撃宣言時に発動できる。デッキから戦士族・レベル４モンスター１体を手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①③效果1回合仅可各使用1次。①：从牌组将1张记载有“时间黑魔术师”卡名的魔法・陷阱卡送至墓地可以发动。从手牌将此卡特殊召唤。然后，可令对手场上的1只怪兽的攻击力下降1500。此效果发动后，直至回合结束时为止，自己从额外牌组仅可特殊召唤融合怪兽。②：场上的此卡不会因效果被破坏。③：此卡的攻击宣言时可以发动。从牌组将1只战士族・等级4怪兽加入手牌。
