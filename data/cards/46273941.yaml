text:
  en: |-
    Once per turn: You can Ritual Summon 1 "Zenet" Ritual Monster from your hand or GY, by sending Normal Monster Cards with different names from each other from your hand, Deck, and/or face-up field to the GY whose total Levels equal or exceed its Level, then you can equip 1 Normal Monster from your GY to it as an Equip Spell. If you Special Summon a non-Token Normal Monster(s) (except during the Damage Step): You can draw 1 card. You can only use this effect of "Pere-Zenet Em Heru" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の②の効果は１ターンに１度しか使用できない。①：１ターンに１度、発動できる。レベルの合計が儀式召喚するモンスターのレベル以上になるように、自分の手札・デッキ・フィールド（表側表示）の通常モンスターカードを墓地へ送り（同名カードは１枚まで）、自分の手札・墓地から「セネト」儀式モンスター１体を儀式召喚する。その後、そのモンスターに自分の墓地から通常モンスター１体を装備魔法カード扱いで装備できる。②：自分がトークン以外の通常モンスターを特殊召喚した場合に発動できる。自分は１枚ドローする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的②效果1回合仅可使用1次。①：1回合1次，可以发动。为使合计等级达到仪式召唤的怪兽的等级以上，将自己手牌・牌组・场上（表侧表示）的通常怪兽卡送至墓地（同名卡最多1张），从自己手牌・墓地将1只“塞尼特”仪式怪兽仪式召唤。然后，可从自己墓地将1只通常怪兽视为装备魔法卡装备于该怪兽。②：自己将衍生物以外的通常怪兽特殊召唤的情况下可以发动。自己抽1张。
