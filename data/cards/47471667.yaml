  en: |-
    Target 1 face-up Spell you control; destroy it, and if you do, draw 1 card, then if you control a "Destiny HERO" monster, you can Special Summon 1 "Destiny HERO" monster from your hand, GY, or banishment. At the end of the Damage Step, if a monster equipped with an Equip Card, or "Destiny HERO - Dogma", attacked: You can banish this card from your GY; that monster can make a second attack in a row. You can only activate 1 "D - Burst" per turn.
