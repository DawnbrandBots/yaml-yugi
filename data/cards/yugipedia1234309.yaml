  en: |-
    If this card is added from the Deck to your hand, except by drawing it: You can Special Summon it. If this card is Special Summoned: You can pay half your LP; destroy as many other monsters on the field as possible, and if you do, inflict damage to your opponent equal to the highest ATK on the field among the destroyed face-up monsters they own, and if you do that, this card gains that much ATK. If this card is destroyed: You can add 1 "Final Geas" from your Deck to your hand. You can only use each effect of "Gandora-X the Blackmetal Rampaging Dragon" once per turn.
