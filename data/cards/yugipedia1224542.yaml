text:
  en: |-
    If you control a "Winter Raven" card, you can Special Summon this card (from your hand). You can only Special Summon "Purifire of the Winter Raven's Forest" once per turn this way. You can only use each of the following effects of "Purifire of the Winter Raven's Forest" once per turn. If this card is Normal or Special Summoned: You can add 1 "Winter Raven" Spell/Trap or 1 "Sinful Spoils" card from your Deck to your hand. You can target 1 "Winter Raven" Monster Card or 1 Level 7 or 8 Monster Card in the Spell & Trap Zone; Special Summon it to your field.
