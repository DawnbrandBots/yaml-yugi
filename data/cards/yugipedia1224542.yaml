text:
  en: |-
    If you control a "White Crow" card, you can Special Summon this card (from your hand). You can only Special Summon "Fire Fiend of the White Crow Forest" once per turn this way. You can only use each of the following effects of "Fire Fiend of the White Crow Forest" once per turn. If this card is Normal or Special Summoned: You can add 1 "White Crow" Spell/Trap or 1 "Sinful Spoils" card from your Deck to your hand. You can target 1 "White Crow" Monster Card or 1 Level 7 or 8 Monster Card in the Spell & Trap Zone; Special Summon it to your field.
