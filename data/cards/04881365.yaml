name:
  en: Alligator's Dragon Knight
  de: Alligatordrachen-Ritter
  es: Dragón del Aligátor Caballero
  fr: Chevalier Dragon de l'Alligator
  it: Cavaliere Drago dell'Alligatore
  pt: Cavaleiro Dragão do Jacaré
  ja: ワイバーンの<ruby>竜<rt>りゅう</rt></ruby><ruby>騎<rt>き</rt></ruby><ruby>士<rt>し</rt></ruby>
  ja_romaji: Waibān no Ryūkishi
  ko:
  ko_rr:
  zh-TW:
  zh-CN: 飞龙的龙骑士
text:
  en: |-
    Can attack directly. You can only use each of the following effects of "Alligator's Dragon Knight" once per turn. If this card is in your hand: You can reveal 1 other card that mentions "Dark Time Wizard" in your hand; Special Summon this card. If this card is Normal or Special Summoned: You can add up to 2 Spells/Traps with different names that mention "Dark Time Wizard", from your Deck to your hand, then discard 1 card.
  de: |-
    Kann direkt angreifen. Du kannst jeden der folgenden Effekte von „Alligatordrachen-Ritter“ nur einmal pro Spielzug verwenden. Falls sich diese Karte in deiner Hand befindet: Du kannst 1 andere Karte, die „Dunkler Zeitzauberer“ erwähnt, in deiner Hand vorzeigen; beschwöre diese Karte als Spezialbeschwörung. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst deiner Hand bis zu 2 Zauber/Fallen mit unterschiedlichen Namen, die „Dunkler Zeitzauberer“ erwähnen, von deinem Deck hinzufügen, dann wirf 1 Karte ab.
  es: |-
    Puede atacar directamente. Sólo puedes usar cada uno de los siguientes efectos de "Dragón del Aligátor Caballero" una vez por turno. Si esta carta está en tu mano: puedes mostrar otra carta en tu mano que mencione "Mago del Tiempo Oscuro"; Invoca esta carta de Modo Especial. Si esta carta es Invocada de Modo Normal o Especial: puedes añadir a tu mano hasta 2 Mágicas/Trampas con nombres diferentes en tu Deck que mencionen "Mago del Tiempo Oscuro", y después descarta 1 carta.
  fr: |-
    Peut attaquer directement. Vous ne pouvez utiliser chacun des effets suivants de "Chevalier Dragon de l'Alligator" qu'une fois par tour. Si cette carte est dans votre main : vous pouvez révéler 1 autre carte qui mentionne "Magicien du Temps des Ténèbres" dans votre main ; Invoquez Spécialement cette carte. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez ajouter max. 2 Magies/Pièges de noms différents qui mentionnent "Magicien du Temps des Ténèbres", depuis votre Deck à votre main, puis défaussez 1 carte.
  it: |-
    Può attaccare direttamente. Puoi utilizzare ognuno dei seguenti effetti di "Cavaliere Drago dell'Alligatore" una sola volta per turno. Se questa carta è nella tua mano: puoi rivelare 1 altra carta che menziona "Stregone del Tempo Oscuro" nella tua mano; Evoca Specialmente questa carta. Se questa carta viene Evocata Normalmente o Specialmente: puoi aggiungere fino a 2 Magie/Trappole con nomi diversi che menzionano "Stregone del Tempo Oscuro", dal tuo Deck alla tua mano, poi scartare 1 carta.
  pt: |-
    Pode atacar diretamente. Você só pode usar cada um dos seguintes efeitos de "Cavaleiro Dragão do Jacaré" uma vez por turno. Se este card estiver na sua mão: você pode revelar 1 outro card que mencione "Mago do Tempo Negro" na sua mão; Invoque este card por Invocação-Especial. Se este card for Invocado por Invocação-Normal ou Especial: você pode adicionar até 2 Magias/Armadilhas com nomes diferentes que mencionem "Mago do Tempo Negro", do seu Deck à sua mão e, depois, descarte 1 card.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在する場合、このカード以外の「時の黒魔術師」のカード名が記された手札のカード１枚を相手に見せて発動できる。このカードを特殊召喚する。②：このカードが召喚・特殊召喚した場合に発動できる。デッキから「時の黒魔術師」のカード名が記された魔法・罠カードを２枚まで手札に加える（同名カードは１枚まで）。その後、自分の手札を１枚選んで捨てる。③：このカードは直接攻撃できる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：此卡存在于手牌的情况下，向对手出示此卡以外的、手牌的1张记载有“时间黑魔术师”卡名的卡可以发动。将此卡特殊召唤。②：此卡召唤・特殊召唤的情况下可以发动。从牌组将最多2张记载有“时间黑魔术师”卡名的魔法・陷阱卡加入手牌（同名卡最多1张）。然后，挑选自己的1张手牌舍弃。③：此卡可直接攻击。
