text:
  en: |-
    After a Spell/Trap(s) becomes Set on your opponent's field while you do not control any face-up cards other than "Ghostrick" cards, it cannot be activated until the end of the next turn. Once per turn: You can shuffle up to 5 "Ghostrick" cards from your GY and/or banishment into the Deck. If this card in your possession is sent to your GY by an opponent's card: You can change all monsters your opponent controls to face-down Defense Position. The monsters that were, cannot change their battle positions.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：自分フィールドに「ゴーストリック」カード以外の表側表示カードが存在しない状態で、相手フィールドに魔法・罠カードがセットされた時に適用する。そのカードは次のターンの終了時まで発動できない。②：自分・相手ターンに１度、発動できる。自分の墓地・除外状態の「ゴーストリック」カードを５枚までデッキに戻す。③：このカードが相手によって墓地へ送られた場合に発動できる。相手フィールドのモンスターを全て裏側守備表示にする。この効果で裏側守備表示になったモンスターは表示形式を変更できない。
