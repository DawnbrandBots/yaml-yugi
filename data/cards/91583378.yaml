    ①：自分ターンにこのカードをドローした時、このカードを相手に見せて発動できる。このカードを特殊召喚する。②：このカードが自分ターンに特殊召喚した場合に発動できる。このターン、お互いに「業火の魔神エクゾディア」以外のカードの効果を発動できず、自分はモンスターを召喚・特殊召喚できない。③：このカードが戦闘を行うダメージステップ開始時に発動できる。相手フィールドのモンスターを全て破壊し、その元々の攻撃力の合計分のダメージを相手に与える。
