    ①：此卡只要存在于场地区域，卡名视为“夏”。②：1回合1次，可以发动。依对手手牌的数量在此卡上放四季计数物。③：在自己・对手的战斗阶段开始时可以发动。从自己手牌・牌组・墓地将“秋”以外的、1张可放四季计数物的场地魔法卡以表侧表示放在自己场上（此卡的四季计数物移至该卡）。④：场地区域的卡将被效果破坏的情况下，作为代替可将墓地的此卡除外。
