name:
  en: Reincarnation of the Unchained
  de: Reinkarnation der Losgeketteten
  es: Reencarnación del Desencadenado
  fr: Réincarnation des Désenchaînés
  it: Reincarnazione dello Svincolato
  pt: Reencarnação do Desacorrentado
  ja: <ruby>破<rt>は</rt></ruby><ruby>械<rt>かい</rt></ruby><ruby>転<rt>てん</rt></ruby><ruby>生<rt>しょう</rt></ruby>
  ja_romaji: Hakaitenshō
  ko: 언체인드 전생
  ko_rr:
  zh-TW:
  zh-CN: 破械转生
text:
  en: |-
    When this card is activated: You can add 1 "Abomination's Prison", or 1 "Unchained" Spell, except "Reincarnation of the Unchained", from your Deck to your hand. Once per turn: You can target up to 3 "Unchained" cards in your GY, except "Reincarnation of the Unchained"; shuffle them into the Deck, then you can destroy other cards you control up to the number shuffled. You can only activate 1 "Reincarnation of the Unchained" per turn.
  de: |-
    Wenn diese Karte aktiviert wird: Du kannst deiner Hand 1 „Gefängnis der Scheußlichkeit“ oder 1 „Losgekettet“-Zauber, außer „Reinkarnation der Losgeketteten“, von deinem Deck hinzufügen. Einmal pro Spielzug: Du kannst bis zu 3 „Losgekettet“-Karten in deinem Friedhof wählen, außer „Reinkarnation der Losgeketteten“; mische sie ins Deck, dann kannst du andere Karten, die du kontrollierst, bis zur Anzahl der gemischten Karten zerstören. Du kannst nur 1 „Reinkarnation der Losgeketteten“ pro Spielzug aktivieren.
  es: |-
    Cuando esta carta es activada: puedes añadir a tu mano 1 "Prisión de la Abominación" o 1 Mágica "Desencadenado/a" en tu Deck, excepto "Reencarnación del Desencadenado". Una vez por turno: puedes seleccionar hasta 3 cartas "Desencadenado/a" en tu Cementerio, excepto "Reencarnación del Desencadenado"; barájalas al Deck, y después puedes destruir otras cartas que controles hasta el número de barajadas. Sólo puedes activar 1 "Reencarnación del Desencadenado" por turno.
  fr: |-
    Lorsque cette carte est activée : vous pouvez ajouter 1 "Prison de l'Abomination" ou 1 Magie "Désenchaîné" ("Réincarnation des Désenchaînés" exclu) depuis votre Deck à votre main. Une fois par tour : vous pouvez cibler max. 3 cartes "Désenchaîné" ("Réincarnation des Désenchaînés" exclu) dans votre Cimetière ; mélangez-les dans le Deck, puis vous pouvez détruire un nombre d'autres cartes que vous contrôlez, inférieur ou égal au nombre mélangé. Vous ne pouvez activer qu'1 "Réincarnation des Désenchaînés" par tour.
  it: |-
    Quando questa carta viene attivata: puoi aggiungere 1 "Prigione dell'Abominio", o 1 Magia "Svincolato", eccetto "Reincarnazione dello Svincolato", dal tuo Deck alla tua mano. Una volta per turno: puoi scegliere come bersaglio fino a 3 carte "Svincolato" nel tuo Cimitero, eccetto "Reincarnazione dello Svincolato"; mischiale nel Deck, poi puoi distruggere altre carte che controlli fino al numero di carte mischiate. Puoi attivare solo 1 "Reincarnazione dello Svincolato" per turno.
  pt: |-
    Quando este card for ativado: você pode adicionar 1 "Prisão da Abominação", ou 1 Magia "Desacorrentado(a)", exceto "Reencarnação do Desacorrentado", do seu Deck à sua mão. Uma vez por turno: você pode escolher até 3 cards "Desacorrentado(a)" no seu Cemitério, exceto "Reencarnação do Desacorrentado"; embaralhe-os no Deck e, depois, você pode destruir outros cards que você controla até o número embaralhado. Você só pode ativar 1 "Reencarnação do Desacorrentado" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、デッキから「破械転生」以外の「破械」魔法カードか「雙王の械」１枚を手札に加える事ができる。②：１ターンに１度、「破械転生」以外の自分の墓地の「破械」カードを３枚まで対象として発動できる。そのカードをデッキに戻す。その後、戻した数まで自分フィールドの他のカードを破壊できる。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 이 카드의 발동시의 효과 처리로서, 덱에서 "언체인드 전생" 이외의 "언체인드" 마법 카드나 "쌍왕의 계" 1장을 패에 넣을 수 있다. ②: 1턴에 1번, "언체인드 전생" 이외의 자신 묘지의 "언체인드" 카드를 3장까지 대상으로 하고 발동할 수 있다. 그 카드를 덱으로 되돌린다. 그 후, 되돌린 수까지 자신 필드의 다른 카드를 파괴할 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：作为此卡发动时的效果处理，可从牌组将“破械转生”以外的、1张“破械”魔法卡或“双王之械”加入手牌。②：1回合1次，以“破械转生”以外的、自己墓地的最多3张“破械”卡为对象可以发动。将该卡放回牌组。然后，依所放回的数量为上限，可将自己场上的其他卡破坏。
