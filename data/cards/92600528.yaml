text:
  en: |-
    Cannot be Normal Summoned, unless you control a "Ghostrick" monster. If this card is Normal Summoned or flipped face-up: Set 1 "Ghostrick" Quick-Play Spell or "Ghostrick" Normal Trap from your Deck (it can be activated this turn), also you cannot Special Summon for the rest of this turn, except DARK monsters. You can only use this effect of "Ghostrick Lich" once per turn. Once per turn: You can change this card to face-down Defense Position.
  de:
