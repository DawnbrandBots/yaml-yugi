  ja: |-
    自分フィールドに「ゴーストリック」モンスターが存在する場合のみ、このカードは召喚できる。このカード名の①の効果は１ターンに１度しか使用できない。①：このカードが召喚・リバースした場合に発動する。デッキから「ゴーストリック」速攻魔法・通常罠カード１枚を自分フィールドにセットする。この効果でセットしたカードはセットしたターンでも発動できる。このターン、自分は闇属性モンスターしか特殊召喚できない。②：自分メインフェイズに発動できる。このカードを裏側守備表示にする（１ターンに１度のみ）。
