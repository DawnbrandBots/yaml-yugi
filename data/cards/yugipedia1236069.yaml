  en: |-
    If this card is Normal or Special Summoned: You can Special Summon 1 "Ashtra" non-Tuner from your Deck in Defense Position, then you can change 1 face-up monster you control to face-down Defense Position, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Synchro Summon using a Level 1 Tuner. If an "Ashtra" and/or face-down card(s) you control would be destroyed by card effect, you can banish this card from your GY instead. You can only use each effect of "Ashtrata Tamayori" once per turn.
