name:
  en: Crow, the Carrion Cutpurse
  de: Crow, der Leichen-Beutelschneider
  es: Cuervo, el Ladrón de Carroña
  fr: Crow, le Voleur Charognard
  it: Crow, il Tagliaborse Carcassa
  pt: Corvo, o Ladrão de Carcaças
  ja: <ruby>躯<rt>むくろ</rt></ruby><ruby>売<rt>う</rt></ruby>りのカラス
  ja_romaji: Mukuro Uri no Karasu
  ko: 사체 파는 까마귀
  ko_rr:
  zh-TW:
  zh-CN: 贩卖亡骸的乌鸦
text:
  en: |-
    Send the top cards of your Deck to the GY, up to the number of Traps with different names from each other in the GYs +1 (max. 4), then you can apply 1 of these effects.
    ● Special Summon 1 monster from among those cards.
    ● Set 1 Spell/Trap from among those cards, except "Crow, the Carrion Cutpurse". If you Set a Trap or Quick-Play Spell, it can be activated this turn.
  de: |-
    Lege die obersten Karten deines Decks bis zur Anzahl der Fallen mit unterschiedlichen Namen voneinander in den Friedhöfen +1 (max. 4) auf den Friedhof, dann kannst du 1 dieser Effekte ausführen.
    ● Beschwöre 1 Monster von jenen Karten als Spezialbeschwörung.
    ● Setze 1 Zauber/Falle von jenen Karten, außer „Crow, der Leichen-Beutelschneider“. Falls du eine Falle oder einen Schnellzauber setzt, kann sie oder er in diesem Spielzug aktiviert werden.
  es: |-
    Manda al Cementerio las cartas de la parte superior de tu Deck, hasta el número de Trampas con nombres diferentes entre sí que haya en los Cementerios +1 (máx. 4), y después puedes aplicar 1 de estos efectos.
    ● Invoca de Modo Especial 1 monstruo de entre esas cartas.
    ● Coloca 1 Mágica/Trampa de entre esas cartas, excepto "Cuervo, el Ladrón de Carroña". Si Colocas una Trampa o una Mágica de Juego Rápido, puede ser activada este turno.
  fr: |-
    Envoyez un nombre de cartes du dessus de votre Deck au Cimetière, inférieur ou égal au nombre de Pièges de noms différents les uns des autres dans les Cimetières +1 (max. 4), puis vous pouvez appliquer 1 de ces effets.
    ● Invoquez Spécialement 1 monstre parmi ces cartes.
    ● Posez 1 Magie/Piège parmi ces cartes ("Crow, le Voleur Charognard" exclu). Si vous avez Posé un Piège ou une Magie Jeu-Rapide, il peut être activé ce tour.
  it: |-
    Manda carte dalla cima del tuo Deck al Cimitero, fino al numero di Trappole con nomi diversi l'una dall'altra nei Cimiteri +1 (massimo 4), poi puoi applicare 1 di questi effetti.
    ● Evoca Specialmente 1 mostro tra quelle carte.
    ● Posiziona 1 Magia/Trappola tra quelle carte, eccetto "Crow, il Tagliaborse Carcassa". Se Posizioni una Trappola o Magia Rapida, essa può essere attivata in questo turno.
  pt: |-
    Envie cards do topo do seu Deck para o Cemitério, até o número de Armadilhas com nomes diferentes umas das outras nos Cemitérios +1 (máx. 4) e, depois, você pode aplicar 1 desses efeitos.
    ● Invoque por Invocação-Especial 1 monstro dentre esses cards.
    ● Baixe 1 Magia/Armadilha dentre esses cards, exceto "Corvo, o Ladrão de Carcaças". Se você Baixar uma Armadilha ou Magia Rápida, ela pode ser ativada neste turno.
  ja: |-
    ①：お互いの墓地の罠カードの種類の数＋１枚まで自分のデッキの上からカードを墓地へ送る（最大４枚まで）。その後、以下の効果から１つを選んで適用できる。
    ●墓地へ送ったカードの中からモンスター１体を特殊召喚する。
    ●墓地へ送ったカードの中から「躯売りのカラス」以外の魔法・罠カード１枚を自分フィールドにセットする。速攻魔法・罠カードをセットした場合、そのカードはセットしたターンでも発動できる。
  ko: |-
    ①: 서로의 묘지의 함정 카드 종류의 수 ＋ 1장까지 자신의 덱 위에서 카드를 묘지로 보낸다(최대 4장까지). 그 후, 이하의 효과에서 1개를 고르고 적용할 수 있다.
    ●묘지로 보낸 카드 중에서 몬스터 1장을 특수 소환한다.
    ●묘지로 보낸 카드 중에서 "사체 파는 까마귀" 이외의 마법 / 함정 카드 1장을 자신 필드에 세트한다. 속공 마법 / 함정 카드를 세트했을 경우, 그 카드는 세트한 턴에도 발동할 수 있다.
  zh-TW:
  zh-CN: |-
    ①：以双方墓地的陷阱卡的种类的数量＋1张为上限，从自己牌组上面将卡送至墓地（最多4张）。然后，可从以下效果中挑选1个适用。
    ●从送至了墓地的卡中将1只怪兽特殊召唤。
    ●从送至了墓地的卡中将“贩卖亡骸的乌鸦”以外的1张魔法・陷阱卡放置在自己场上。放置了速攻魔法・陷阱卡的情况下，该卡在放置的回合也可以发动。
