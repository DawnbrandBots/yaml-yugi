  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できず、この効果を発動するターン、自分は融合モンスターしかＥＸデッキから特殊召喚できない。①：自分メインフェイズに発動できる。このカードを手札から特殊召喚する。②：このカードが召喚・特殊召喚した場合、手札を１枚捨てて発動できる。デッキから「方界」魔法・罠カードを２枚まで手札に加える。③：１ターンに１度、自分・相手のバトルフェイズに発動できる。自分の手札・フィールドのモンスターを融合素材とし、「方界」融合モンスター１体を融合召喚する。
