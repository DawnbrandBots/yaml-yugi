  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、デッキから「方界」カード１枚を墓地へ送る事ができる。②：１ターンに１度、手札を１枚捨てて発動できる。相手フィールドの表側表示モンスター１体に方界カウンターを１つ置く。方界カウンターが置かれているモンスターは攻撃できず、効果は無効化される。③：自分フィールドに「方界」モンスターが特殊召喚された場合に発動できる。自分の手札・フィールドのモンスターを融合素材とし、「方界」融合モンスター１体を融合召喚する。
