text:
  en: |-
    When this card is activated: You can send 1 "Cubic" card from your Deck to the GY. Once per turn: You can discard 1 card; place 1 Cubic Counter on 1 face-up monster your opponent controls (monsters with a Cubic Counter cannot attack, also negate their effects). If a "Cubic" monster(s) is Special Summoned to your field (except during the Damage Step): You can Fusion Summon 1 "Cubic" Fusion Monster from your Extra Deck, using monsters from your hand or field. You can only activate 1 "Cubic Bodhi" per turn.
