text:
  en: |-
    Activate this card by banishing (face-down) 5 cards from your GY and/or the top of your Deck. During your Main Phase: You can add 1 of your face-down banished "Xenovader△" cards to your hand, except "Xenovader△ Territory - Valvols". You can only use this effect of "Xenovader△ Territory - Valvols" once per turn. While you control a Level 5 or higher "Xenovader△" monster and you have no cards in your Deck, your opponent cannot activate cards or effects during your turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    自分のデッキの上・墓地から合計５枚のカードを裏側で除外してこのカードを発動できる。このカード名の①の効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。「異解△領域－ヴァルヴォルス」以外の自分の除外状態（裏側）の「異解△」カード１枚を手札に加える。②：自分フィールドにレベル５以上の「異解△」モンスターが存在し、自分のデッキの枚数が０枚である限り、自分ターンの間、相手はカードの効果を発動できない。
  ko:
  zh-TW:
  zh-CN: |-
    从自己牌组上面・墓地将合计5张卡以里侧除外可以发动此卡。此卡名的①效果1回合仅可使用1次。①：在自己的主要阶段可以发动。将“异解△领域－瓦尔涡罗斯”以外的、自己除外状态（里侧）的1张“异解△”卡加入手牌。②：只要自己场上存在等级5以上的“异解△”怪兽，且自己牌组的张数为0张，在自己回合期间，对手不可发动卡的效果。
