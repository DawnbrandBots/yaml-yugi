name:
  en: Spell Shattering Sword
  de: Zauberbrechendes Schwert
  es: Espada Rompedora de Hechizos
  fr: Épée Brise-Sort
  it: Spada Spezza-Magia
  pt: Espada Destruidora de Magia
  ja: <ruby>魔<rt>ま</rt></ruby><ruby>法<rt>ほう</rt></ruby><ruby>効<rt>こう</rt></ruby><ruby>果<rt>か</rt></ruby>の<ruby>剣<rt>つるぎ</rt></ruby>
