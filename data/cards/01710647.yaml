name:
  en: Yoa the Plague Ashtra
  de: Yoa der Seuchen-Ashtra
  es: Yoa el Ashtra Plaga
  fr: Yoa le Fléau Ashtra
  it: Yoa l'Ashtra Piaga
  pt: Yoa, o Ashtra da Peste
  ja: <ruby>疫<rt>えき</rt></ruby><ruby>神<rt>じん</rt></ruby>の<ruby>依鬼<rt>アシュトラ</rt></ruby> ヨア
  ja_romaji: Ekijin no Ashutora Yoa
  ko:
