  zh-TW:
  zh-CN: 疫神之依艮鬼 夜亚
text:
  en: |-
    You can Special Summon this card (from your hand) by revealing 1 face-down card you control and returning it to the hand or Extra Deck. You can only Special Summon "Yoa the Plague Ashtra" once per turn this way. You can only use each of the following effects of "Yoa the Plague Ashtra" once per turn. During your Main Phase: You can Set 1 "Ashtra" Spell/Trap from your Deck. During your opponent's turn (Quick Effect): You can target 1 face-up monster on the field; increase or decrease its Level by 1.
  de: |-
    Du kannst diese Karte als Spezialbeschwörung (von deiner Hand) beschwören, indem du 1 verdeckte Karte vorzeigst, die du kontrollierst, und sie auf die Hand oder ins Extra Deck zurückgibst. Du kannst „Yoa der Seuchen-Ashtra“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Du kannst jeden der folgenden Effekte von „Yoa der Seuchen-Ashtra“ nur einmal pro Spielzug verwenden. Während deiner Main Phase: Du kannst 1 „Ashtra“-Zauber/Falle von deinem Deck setzen. Während des Spielzugs deines Gegners (Schnelleffekt): Du kannst 1 offenes Monster auf dem Spielfeld wählen; erhöhe oder verringere seine Stufe um 1.
  es: |-
    Puedes Invocar esta carta de Modo Especial (desde tu mano) mostrando 1 carta boca abajo que controles y devolviéndola a la mano o Deck Extra. Sólo puedes Invocar de Modo Especial "Yoa el Ashtra Plaga" una vez por turno de esta forma. Sólo puedes usar cada uno de los siguientes efectos de "Yoa el Ashtra Plaga" una vez por turno. Durante tu Main Phase: puedes Colocar 1 Mágica/Trampa "Ashtra" desde tu Deck. Durante el turno de tu adversario (Efecto Rápido): puedes seleccionar 1 monstruo boca arriba en el Campo; aumenta o reduce su Nivel en 1.
  fr: |-
    Vous pouvez Invoquer Spécialement cette carte (depuis votre main) en révélant 1 carte face verso que vous contrôlez et en la renvoyant à la main ou Extra Deck. Vous ne pouvez Invoquer Spécialement "Yoa le Fléau Ashtra" qu'une fois par tour de cette façon. Vous ne pouvez utiliser chacun des effets suivants de "Yoa le Fléau Ashtra" qu'une fois par tour. Durant votre Main Phase : vous pouvez Poser 1 Magie/Piège "Ashtra" depuis votre Deck. Durant le tour de votre adversaire (Effet Rapide) : vous pouvez cibler 1 monstre face recto sur le Terrain ; augmentez ou réduisez son Niveau de 1.
  it: |-
    Puoi Evocare Specialmente questa carta (dalla tua mano) rivelando 1 carta coperta che controlli e facendola ritornare nella mano o Extra Deck. Puoi Evocare Specialmente "Yoa l'Ashtra Piaga" una sola volta per turno in questo modo. Puoi utilizzare ognuno dei seguenti effetti di "Yoa l'Ashtra Piaga" una sola volta per turno. Durante la tua Main Phase: puoi Posizionare 1 Magia/Trappola "Ashtra" dal tuo Deck. Durante il turno del tuo avversario (Effetto Rapido): puoi scegliere come bersaglio 1 mostro scoperto sul Terreno; aumenta o diminuisci il suo Livello di 1.
  pt: |-
    Você pode Invocar este card por Invocação-Especial (da sua mão) ao revelar 1 card com a face para baixo que você controla e devolvê-lo para a mão ou para o Deck Adicional. Você só pode Invocar "Yoa, o Ashtra da Peste" por Invocação-Especial uma vez por turno desta forma. Você só pode usar cada um dos seguintes efeitos de "Yoa, o Ashtra da Peste" uma vez por turno. Durante sua Fase Principal: você pode Baixar 1 Magia/Armadilha "Ashtra" do seu Deck. Durante o turno do seu oponente (Efeito Rápido): você pode escolher 1 monstro com a face para cima no campo; aumente ou diminua o Nível dele em 1.
  ja: |-
    このカード名の、①の方法による特殊召喚は１ターンに１度しかできず、②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードは自分フィールドの裏側表示カード１枚を相手に見せて手札・ＥＸデッキに戻し、手札から特殊召喚できる。②：自分メインフェイズに発動できる。デッキから「アシュトラ」魔法・罠カード１枚を自分フィールドにセットする。③：相手ターンに、フィールドの表側表示モンスター１体を対象として発動できる。そのモンスターのレベルを１つ上げるか下げる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名以①方法的特殊召唤1回合仅可进行1次，且②③效果1回合仅可各使用1次。①：此卡可通过将自己场上的1张里侧表示卡出示给对手并放回手牌・额外牌组，来从手牌特殊召唤。②：在自己的主要阶段可以发动。从牌组将1张“艮鬼”魔法・陷阱卡放置在自己场上。③：在对手回合中，以场上的1只表侧表示怪兽为对象可以发动。该怪兽的等级上升或下降1。
