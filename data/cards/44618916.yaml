text:
  en: |-
    If this card is added to your hand, except by drawing it: You can Special Summon it. If this card is Normal or Special Summoned: You can Set 1 Spell/Trap from your Deck that mentions "Harpie Lady". During damage calculation, if your "Amazoness" monster battles an opponent's monster: You can activate this effect; for that battle, neither monster can be destroyed by battle, also you take no battle damage. You can only use each effect of "Amazoness Fighter - Instant Kill Dance" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがドロー以外の方法で手札に加わった場合に発動できる。このカードを特殊召喚する。②：このカードが召喚・特殊召喚した場合に発動できる。デッキから「ハーピィ・レディ」のカード名が記された魔法・罠カード１枚を自分フィールドにセットする。③：自分の「アマゾネス」モンスターが相手モンスターと戦闘を行うダメージ計算時に発動できる。その２体はその戦闘では破壊されず、その戦闘で発生する自分への戦闘ダメージは０になる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：此卡以抽牌以外的方法加入手牌的情况下可以发动。将此卡特殊召唤。②：此卡召唤・特殊召唤的情况下可以发动。从牌组将1张记载有“神鹰女郎”卡名的魔法・陷阱卡放置在自己场上。③：自己的“亚马逊”怪兽与对手怪兽进行战斗的伤害计算时可以发动。该2只不会因该战斗被破坏，因该战斗对自己造成的战斗伤害变为0。
