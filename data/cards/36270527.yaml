name:
  en: Ars Magna the Finite and the Infinite
  de: Ars Magna des Endlichen und des Unendlichen
  es: Ars Magna la Finita y la Infinita
  fr: Ars Magna le Fini et l'Infini
  it: Ars Magna il Finito e l'Infinito
  pt: Ars Magna, o Finito e o Infinito
  ja: <ruby>無<rt>む</rt></ruby><ruby>限<rt>げん</rt></ruby>と<ruby>有<rt>ゆう</rt></ruby><ruby>限<rt>げん</rt></ruby>のアルス＝マグナ
  ja_romaji: Mugen to Yūgen no Arusu=Maguna
  ko: 무한과 유한의 아르스＝마그나
  ko_rr:
  zh-TW:
  zh-CN: 无限与有限之奥艺
text:
  en: |-
    You can banish this card from your hand; add 1 non-Warrior "Ars Magna" monster from your Deck to your hand, also for the rest of this turn, the original ATK of all "Power Patron" Link Monsters you control become tripled. If a Fusion or Link Monster(s) is Special Summoned, while this card is banished (except during the Damage Step): You can Special Summon this card. If you control a "Power Patron" Link Monster: You can target 1 monster on the field; banish it. You can only use each effect of "Ars Magna the Finite and the Infinite" once per turn.
  de: |-
    Du kannst diese Karte von deiner Hand verbannen; füge deiner Hand 1 „Ars Magna“-Nichtkrieger-Monster von deinem Deck hinzu, zusätzlich werden für den Rest dieses Spielzugs die Grund-ATK aller „Machtpatron“-Linkmonster verdreifacht, die du kontrollierst. Falls ein oder mehr Fusions- oder Linkmonster als Spezialbeschwörung beschworen werden, solange diese Karte verbannt ist (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung beschwören. Falls du ein „Machtpatron“-Linkmonster kontrollierst: Du kannst 1 Monster auf dem Spielfeld wählen; verbanne es. Du kannst jeden Effekt von „Ars Magna des Endlichen und des Unendlichen“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes desterrar esta carta en tu mano; añade a tu mano 1 monstruo "Ars Magna" que no sea Guerrero en tu Deck y además, por el resto de este turno, el ATK original de todos los Monstruos de Enlace "Modelo de Poder" que controles se triplica. Si uno o más Monstruos de Fusión o Enlace son Invocados de Modo Especial, mientras esta carta está desterrada (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial. Si controlas un Monstruo de Enlace "Modelo de Poder": puedes seleccionar 1 monstruo en el Campo; destiérralo. Sólo puedes usar cada efecto de "Ars Magna la Finita y la Infinita" una vez por turno.
  fr: |-
    Vous pouvez bannir cette carte depuis votre main ; ajoutez 1 monstre "Ars Magna" non-Guerrier depuis votre Deck à votre main, et aussi, l'ATK d'origine de tous les Monstres Lien "Mécène du Pouvoir" que vous contrôlez sera triplée le reste de ce tour. Si un ou plusieurs Monstres Fusion ou Lien sont Invoqués Spécialement, tant que cette carte est bannie (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte. Si vous contrôlez un Monstre Lien "Mécène du Pouvoir" : vous pouvez cibler 1 monstre sur le Terrain ; bannissez-le. Vous ne pouvez utiliser chaque effet de "Ars Magna le Fini et l'Infini" qu'une fois par tour.
  it: |-
    Puoi bandire questa carta dalla tua mano; aggiungi 1 mostro "Ars Magna" non-Guerriero dal tuo Deck alla tua mano, inoltre per il resto di questo turno, l'ATK originale di tutti i Mostri Link "Patrono Potente" che controlli viene triplicato. Se uno o più Mostri Fusione o Link vengono Evocati Specialmente, mentre questa carta è bandita (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta. Se controlli un Mostro Link "Patrono Potente": puoi scegliere come bersaglio 1 mostro sul Terreno; bandiscilo. Puoi utilizzare ogni effetto di "Ars Magna il Finito e l'Infinito" una sola volta per turno.
  pt: |-
    Você pode banir este card da sua mão; adicione 1 monstro "Ars Magna" não-Guerreiro do seu Deck à sua mão e, além disso, pelo resto deste turno, o ATK original de todos os Monstros Link "Patrono(a) do Poder" que você controla se torna o triplo. Se um ou mais Monstros de Fusão ou Link forem Invocados por Invocação-Especial, enquanto este card estiver banido (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial. Se você controlar um Monstro Link "Patrono(a) do Poder": você pode escolher 1 monstro no campo; bana-o. Você só pode usar cada efeito de "Ars Magna, o Finito e o Infinito" uma vez por turno.
  ja: |-
    このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から除外して発動できる。デッキから戦士族以外の「アルス＝マグナ」モンスター１体を手札に加える。このターン中、自分フィールドの「獄神」Ｌモンスターの元々の攻撃力は３倍になる。②：このカードが除外状態で、融合・Ｌモンスターが特殊召喚された場合に発動できる。このカードを特殊召喚する。③：自分フィールドに「獄神」Ｌモンスターが存在する場合、フィールドのモンスター１体を対象として発動できる。そのモンスターを除外する。
  ko: |-
    이 카드명의 ①②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 패에서 제외하고 발동할 수 있다. 덱에서 전사족 이외의 "아르스＝마그나" 몬스터 1장을 패에 넣는다. 이 턴 중에, 자신 필드의 "감옥신" 링크 몬스터의 원래 공격력은 3배가 된다. ②: 이 카드가 제외 상태이고, 융합 / 링크 몬스터가 특수 소환되었을 경우에 발동할 수 있다. 이 카드를 특수 소환한다. ③: 자신 필드에 "감옥신" 링크 몬스터가 존재할 경우, 필드의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 제외한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：从手牌将此卡除外可以发动。从牌组将1只战士族以外的“奥艺”怪兽加入手牌。此回合中，自己场上的“狱神”连接怪兽的原本的攻击力变为3倍。②：此卡为除外状态，且融合・连接怪兽被特殊召唤的情况下可以发动。将此卡特殊召唤。③：自己场上存在“狱神”连接怪兽的情况下，以场上的1只怪兽为对象可以发动。将该怪兽除外。
