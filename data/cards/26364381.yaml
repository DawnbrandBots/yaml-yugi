  zh-CN: 巨匠造物主 EMA
text:
  en: |-
    If this card is in your hand: You can send 4 monsters with 2400 or more ATK and 1000 DEF from your hand, Deck, and/or face-up field to the GY; Special Summon this card. You can target 1 Spell/Trap on each field; destroy them, then Special Summon 1 "Homunculus Token" (Fairy/LIGHT/Level 2/ATK 800/DEF 800) to both players' fields in Defense Position, and if you do, this card gains 1600 ATK. You can only use each effect of "Demiurge Ema" once per turn.
  de: |-
    Falls sich diese Karte in deiner Hand befindet: Du kannst 4 Monster mit 2400 oder mehr ATK und 1000 DEF von deiner Hand, deinem Deck und/oder offen von deiner Spielfeldseite auf den Friedhof legen; beschwöre diese Karte als Spezialbeschwörung. Du kannst 1 Zauber/Falle auf jeder Spielfeldseite wählen; zerstöre sie, dann beschwöre 1 „Homunkulus-Spielmarke“ (Fee/LICHT/Stufe 2/ATK 800/DEF 800) als Spezialbeschwörung auf die Spielfeldseiten beider Spieler in die Verteidigungsposition und falls du dies tust, erhält diese Karte 1600 ATK. Du kannst jeden Effekt von „Demiurg Ema“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta está en tu mano: puedes mandar al Cementerio 4 monstruos con 2400 ATK o más y 1000 DEF en tu mano, Deck y/o Campo boca arriba; Invoca esta carta de Modo Especial. Puedes seleccionar 1 Mágica/Trampa en cada Campo; destrúyelas, y después Invoca de Modo Especial 1 "Ficha Homúnculo" (Hada/LUZ/Nivel 2/ATK 800/DEF 800) a los Campos de ambos jugadores en Posición de Defensa y, si lo haces, esta carta gana 1600 ATK. Sólo puedes usar cada efecto de "Demiurgo Ema" una vez por turno.
  fr: |-
    Si cette carte est dans votre main : vous pouvez envoyer 4 monstres avec min. 2400 ATK et 1000 DEF depuis votre main, Deck et/ou Terrain face recto au Cimetière ; Invoquez Spécialement cette carte. Vous pouvez cibler 1 Magie/Piège sur chaque Terrain ; détruisez-les, puis Invoquez Spécialement 1 "Jeton Homuncule" (Elfe/LUMIÈRE/Niveau 2/ATK 800/DEF 800) sur chaque Terrain en Position de Défense, et si vous le faites, cette carte gagne 1600 ATK. Vous ne pouvez utiliser chaque effet de "Démiurge Ema" qu'une fois par tour.
  it: |-
    Se questa carta è nella tua mano: puoi mandare 4 mostri con ATK 2400 o superiore e DEF 1000 dalla tua mano, Deck e/o Terreno scoperto al Cimitero; Evoca Specialmente questa carta. Puoi scegliere come bersaglio 1 Magia/Trappola su ogni Terreno; distruggile, poi Evoca Specialmente 1 "Segna-Homunculus" (Fata/LUCE/Livello 2/ATK 800/DEF 800) sul Terreno di entrambi i giocatori in Posizione di Difesa e, se lo fai, questa carta guadagna 1600 ATK. Puoi utilizzare ogni effetto di "Demiurgo Ema" una sola volta per turno.
  pt: |-
    Se este card estiver na sua mão: você pode enviar 4 monstros com 2400 ou mais de ATK e 1000 de DEF da sua mão, do Deck e/ou do campo com a face para cima para o Cemitério; Invoque este card por Invocação-Especial. Você pode escolher 1 Magia/Armadilha em cada campo; destrua-as e, depois, Invoque por Invocação-Especial 1 "Ficha de Homúnculo" (Fada/LUZ/Nível 2/ATK 800/DEF 800) no campo dos dois duelistas em Posição de Defesa e, se isso acontecer, este card ganha 1600 de ATK. Você só pode usar cada efeito de "Demiurgo Ema" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の手札・デッキ・フィールド（表側表示）から攻撃力２４００以上で守備力１０００のモンスター４体を墓地へ送って発動できる。このカードを手札から特殊召喚する。②：自分及び相手フィールドの魔法・罠カードを１枚ずつ対象として発動できる。そのカードを破壊する。その後、お互いのフィールドに「ホムンクルストークン」（天使族・光・星２・攻／守８００）を１体ずつ守備表示で特殊召喚し、このカードの攻撃力は１６００アップする。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신의 패 / 덱 / 필드(앞면 표시)에서 공격력 2400 이상이고 수비력 1000 인 몬스터 4장을 묘지로 보내고 발동할 수 있다. 이 카드를 패에서 특수 소환한다. ②: 자신 및 상대 필드의 마법 / 함정 카드를 1장씩 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다. 그 후, 서로의 필드에 "호문쿨루스 토큰"(천사족 / 빛 / 레벨 2 / 공 800 / 수 800)을 1장씩 수비 표시로 특수 소환하고, 이 카드의 공격력은 1600 올린다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从自己手牌・牌组・场上（表侧表示）将4只攻击力2400以上且守备力1000的怪兽送至墓地可以发动。从手牌将此卡特殊召唤。②：以自己及对手场上的各1张魔法・陷阱卡为对象可以发动。将该卡破坏。然后，各将1只“人工生命体衍生物”（天使族・光・星2・攻/守800）以守备表示特殊召唤至双方场上，此卡的攻击力上升1600。
