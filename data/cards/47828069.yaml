text:
  en: |-
    When you draw this card: You can reveal it; Special Summon it. If this card is Normal or Special Summoned from the hand: You can draw 1 card, also you cannot Special Summon from the Extra Deck for the rest of this turn, except LIGHT Xyz Monsters. You cannot add cards from the Deck to the hand the turn you activate this effect, except by drawing them. Once per opponent's turn, you can (Quick Effect): Immediately after this effect resolves, Xyz Summon 1 Rank 7 LIGHT monster.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：このカードをドローした時、このカードを相手に見せて発動できる。このカードを特殊召喚する。②：このカードが手札から召喚・特殊召喚した場合に発動できる（この効果を発動するターン、自分はドロー以外の方法でデッキからカードを手札に加える事ができない）。自分は１枚ドローする。この効果の発動後、ターン終了時まで自分は光属性ＸモンスターしかＥＸデッキから特殊召喚できない。③：相手ターンに１度、発動できる。光属性・ランク７のＸモンスター１体のＸ召喚を行う。
  ko:
  zh-TW:
  zh-CN: |-
    ①：抽到此卡时，将此卡出示给对手可以发动。将此卡特殊召唤。②：此卡从手牌召唤・特殊召唤的情况下可以发动（发动此效果的回合中，自己不可用抽牌以外的方法从牌组将卡加入手牌）。自己抽1张。此效果发动后，直至回合结束时为止自己从额外牌组仅可特殊召唤光属性超量怪兽。③：在每个对手回合中1次，可以发动。进行1只光属性・阶级7的超量怪兽的超量召唤。
