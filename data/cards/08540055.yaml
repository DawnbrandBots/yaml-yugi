text:
  en: |-
    If this card is Normal or Special Summoned: Banish (face-down) the top 3 cards of your Deck. You can only use each of the following effects of "Xenovader△ of Blue Tuonela" once per turn. If this card is in your hand and your opponent controls more monsters than you do: You can Special Summon this card. During your Main Phase: You can Special Summon 1 of your face-down banished Level 5 or higher "Xenovader△" monsters, also you cannot activate cards or effects for the rest of this turn, except "Xenovader△" cards or effects.
