  ja: |-
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在し、相手フィールドのモンスターの数が自分フィールドのモンスターより多い場合に発動できる。このカードを特殊召喚する。②：このカードが召喚・特殊召喚した場合に発動する。自分のデッキの上からカード３枚を裏側で除外する。③：自分メインフェイズに発動できる。自分の除外状態（裏側）のレベル５以上の「異解△」モンスター１体を特殊召喚する。このターン、自分は「異解△」カード以外のカードの効果を発動できない。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①③效果1回合仅可各使用1次。①：此卡存在于手牌，且对手场上的怪兽数量多于自己场上的怪兽的情况下可以发动。将此卡特殊召唤。②：此卡召唤・特殊召唤的情况下发动。从自己牌组上面将3张卡以里侧除外。③：在自己的主要阶段可以发动。将自己除外状态（里侧）的1只等级5以上的“异解△”怪兽特殊召唤。此回合，自己不可发动“异解△”卡以外的卡的效果。
