text:
  en: |-
    Add 1 "Zenet" monster from your Deck to your hand. If you discard a "Zenet" Ritual Monster(s) while this card is in your GY (except during the Damage Step): You can banish this card; Special Summon 1 non-Effect Fusion Monster from your Extra Deck with ATK less than or equal to any of the discarded monsters' as a Normal Monster Card, but for the rest of this turn, it cannot attack directly, also you cannot activate non-Zombie monster effects. You can only use each effect of "Zenet Per Akh" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：デッキから「セネト」モンスター１体を手札に加える。②：このカードが墓地に存在する状態で、自分が「セネト」儀式モンスターを手札から捨てた場合、このカードを除外して発動できる。捨てたモンスターの攻撃力以下の攻撃力を持つ、効果モンスター以外の融合モンスター１体をＥＸデッキから通常モンスターカード扱いで特殊召喚する。このターン、この効果で特殊召喚したモンスターは直接攻撃できず、自分はアンデット族以外のモンスターの効果を発動できない。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从牌组将1只“塞尼特”怪兽加入手牌。②：此卡存在于墓地的状态下，自己从手牌将“塞尼特”仪式怪兽舍弃的情况下，将此卡除外可以发动。从额外牌组将1只攻击力在所舍弃的怪兽的攻击力以下的、效果怪兽以外的融合怪兽视为通常怪兽卡特殊召唤。此回合，以此效果特殊召唤的怪兽不可直接攻击，自己不可发动不死族以外的怪兽的效果。
