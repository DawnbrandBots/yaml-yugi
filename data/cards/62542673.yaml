  it: Sovrano del Fato - EROE del Destino
  pt: HERÓI do Destino - Suserano da Condenação
  ja: <ruby>Ｄ－ＨＥＲＯ<rt>デステニーヒーロー</rt></ruby> デビルロードガイ
