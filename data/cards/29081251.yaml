name:
  en: Hubrow, Founder of the Ominous Observers
  de: Hubrow, Gründer der unheilvollen Beobachter
  es: Hubrow, Fundador de los Observadores Ominosos
  fr: Hubrow, Fondateur des Observateurs Menaçants
  it: Hubrow, Fondatore degli Osservatori Minacciosi
  pt: Hubrow, o Fundador dos Observadores Sinistros
  ja: <ruby>死<rt>し</rt></ruby><ruby>相<rt>そう</rt></ruby>の<ruby>冥<rt>みょう</rt></ruby><ruby>鑑<rt>かん</rt></ruby>ヒュブロ
