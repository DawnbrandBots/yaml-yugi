  ko:
  ko_rr:
  zh-TW:
  zh-CN: 死相之冥鉴 修布罗
text:
  en: |-
    You can Normal Summon this card without Tributing. You can only use each of the following effects of "Hubrow, Founder of the Ominous Observers" once per turn. If this card is Normal or Special Summoned: You can send 1 Level 6 or higher Zombie monster from your Deck to the GY, except "Hubrow, Founder of the Ominous Observers", then you can add 1 Level 6 or higher Zombie monster from your GY to your hand. If a monster(s) is Special Summoned from the GY, while this card is in the Monster Zone, you can (except during the Damage Step): Immediately after this effect resolves, Xyz Summon 1 Zombie Xyz Monster.
  de: |-
    Du kannst diese Karte als Normalbeschwörung beschwören, ohne Tribut anzubieten. Du kannst jeden der folgenden Effekte von „Hubrow, Gründer der unheilvollen Beobachter“ nur einmal pro Spielzug verwenden. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Zombie-Monster der Stufe 6 oder höher von deinem Deck auf den Friedhof legen, außer „Hubrow, Gründer der unheilvollen Beobachter“, dann kannst du deiner Hand 1 Zombie-Monster der Stufe 6 oder höher von deinem Friedhof hinzufügen. Falls ein oder mehr Monster als Spezialbeschwörung vom Friedhof beschworen werden, solange sich diese Karte in der Monsterzone befindet, kannst du (außer während des Damage Steps): Sofort nachdem dieser Effekt aufgelöst wurde, beschwöre 1 Zombie-Xyz-Monster als Xyz-Beschwörung.
  es: |-
    Puedes Invocar esta carta de Modo Normal sin Sacrificar. Sólo puedes usar cada uno de los siguientes efectos de "Hubrow, Fundador de los Observadores Ominosos" una vez por turno. Si esta carta es Invocada de Modo Normal o Especial: puedes mandar al Cementerio 1 monstruo Zombi de Nivel 6 o mayor en tu Deck, excepto "Hubrow, Fundador de los Observadores Ominosos", y después puedes añadir a tu mano 1 monstruo Zombi de Nivel 6 o mayor en tu Cementerio. Si uno o más monstruos son Invocados de Modo Especial desde el Cementerio, mientras esta carta está en la Zona de Monstruos, puedes (excepto durante el Damage Step): inmediatamente después de que se resuelva este efecto, Invocar Xyz 1 Monstruo Xyz Zombi.
  fr: |-
    Vous pouvez Invoquer Normalement cette carte sans Sacrifice. Vous ne pouvez utiliser chacun des effets suivants de "Hubrow, Fondateur des Observateurs Menaçants" qu'une fois par tour. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez envoyer 1 monstre Zombie de min. Niveau 6 ("Hubrow, Fondateur des Observateurs Menaçants" exclu) depuis votre Deck au Cimetière, puis vous pouvez ajouter 1 monstre Zombie de min. Niveau 6 depuis votre Cimetière à votre main. Si un ou plusieurs monstres sont Invoqués Spécialement depuis le Cimetière, tant que cette carte est dans la Zone Monstre, vous pouvez (sauf durant la Damage Step) : immédiatement après la résolution de cet effet, Invoquez par Xyz 1 Monstre Xyz Zombie.
  it: |-
    Puoi Evocare Normalmente questa carta senza offrire Tributi. Puoi utilizzare ognuno dei seguenti effetti di "Hubrow, Fondatore degli Osservatori Minacciosi" una sola volta per turno. Se questa carta viene Evocata Normalmente o Specialmente: puoi mandare 1 mostro Zombie di Livello 6 o superiore dal tuo Deck al Cimitero, eccetto "Hubrow, Fondatore degli Osservatori Minacciosi", poi puoi aggiungere 1 mostro Zombie di Livello 6 o superiore dal tuo Cimitero alla tua mano. Se uno o più mostri vengono Evocati Specialmente dal Cimitero, mentre questa carta è nella Zona Mostri, puoi (eccetto durante il Damage Step): immediatamente dopo che questo effetto si è risolto, Evoca Xyz 1 Mostro Xyz Zombie.
  pt: |-
    Você pode Invocar este card por Invocação-Normal sem oferecer Tributo. Você só pode usar cada um dos seguintes efeitos de "Hubrow, o Fundador dos Observadores Sinistros" uma vez por turno. Se este card for Invocado por Invocação-Normal ou Especial: você pode enviar 1 monstro Zumbi de Nível 6 ou mais do seu Deck para o Cemitério, exceto "Hubrow, o Fundador dos Observadores Sinistros" e, depois, você pode adicionar 1 monstro Zumbi de Nível 6 ou mais do seu Cemitério à sua mão. Se um ou mais monstros forem Invocados por Invocação-Especial do Cemitério, enquanto este card estiver na Zona de Monstros, você pode (exceto durante a Etapa de Dano): imediatamente depois que este efeito resolver, Invocar por Invocação-Xyz 1 Monstro Xyz Zumbi.
  ja: |-
    このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードはリリースなしで召喚できる。②：このカードが召喚・特殊召喚した場合に発動できる。「死相の冥鑑ヒュブロ」を除く、レベル６以上のアンデット族モンスター１体をデッキから墓地へ送る。その後、自分の墓地からレベル６以上のアンデット族モンスター１体を手札に加える事ができる。③：このカードがモンスターゾーンに存在する状態で、墓地からモンスターが特殊召喚された場合に発動できる。アンデット族Ｘモンスター１体のＸ召喚を行う。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的②③效果1回合仅可各使用1次。①：此卡无需解放即可召唤。②：此卡召唤・特殊召唤的情况下可以发动。从牌组将除“死相之冥鉴 修布罗”以外的、1只等级6以上的不死族怪兽送至墓地。然后，可从自己墓地将1只等级6以上的不死族怪兽加入手牌。③：此卡存在于怪兽区域的状态下，有怪兽从墓地被特殊召唤的情况下可以发动。进行1只不死族超量怪兽的超量召唤。
