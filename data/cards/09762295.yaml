  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：自分の手札・デッキ・フィールド（表側表示）・墓地の通常モンスターカードを以下の数だけ選び、お互いに確認する。その後、その数によって以下の効果を適用する。この効果で手札のカードを確認した場合、さらに自分は１枚ドローできる。
    ●２枚：効果モンスターを除く、レベル８以下の融合モンスター１体をＥＸデッキから通常モンスターカード扱いで特殊召喚する。
    ●３枚：デッキの「セネト」モンスター１体または自分の墓地の通常モンスター１体を特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：依以下的数量，挑选自己手牌・牌组・场上（表侧表示）・墓地的通常怪兽卡，给双方确认。然后，依其数量适用以下效果。以此效果确认了手牌的卡的情况下，自己可进而抽1张。
    ●2张：从额外牌组将除效果怪兽以外的、1只等级8以下的融合怪兽视为通常怪兽卡特殊召唤。
    ●3张：将牌组的1只“塞尼特”怪兽或自己墓地的1只通常怪兽特殊召唤。
