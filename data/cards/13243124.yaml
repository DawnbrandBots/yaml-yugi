name:
  en: Favorite HERO Flame Wingman
  de: Lieblings-HELD Flammenflügelmann
  es: HÉROE Favorito de la Llama Wingman
  fr: Homme-Oiseau de Feu, HÉROS Favori
  it: Uomo Alato della Fiamma EROE Preferito
  pt: Homem-Alado das Chamas, o HERÓI Favorito
  ja: <ruby>Ｆ・ＨＥＲＯ<rt>フェイバリットヒーロー</rt></ruby> フレイム・ウィングマン
  ja_romaji: Feibaritto Hīrō Fureimu Winguman
  ko: 페이버릿 히어로 프레임 윙맨
  ko_rr:
  zh-TW: 至愛－英雄 火焰翼人
  zh-CN: 至爱－英雄 火焰翼人
text:
  en: |-
    2 monsters with the same Type but different Attributes
    (This card is always treated as an "Elemental HERO" card.)
    When an attack is declared involving this card and a monster with 2200 or more ATK: You can make this card gain 1000 ATK, then you can Special Summon 1 Level 4 or lower monster from your hand in Defense Position. If a monster(s) was destroyed by battle this turn (Quick Effect): You can Fusion Summon 1 Fusion Monster from your Extra Deck, using monsters from your hand or field. You can only use each effect of "Favorite HERO Flame Wingman" once per turn.
  de: |-
    2 Monster mit demselben Typ, aber unterschiedlichen Eigenschaften
    (Diese Karte wird immer als „Elementar-HELD“-Karte behandelt.)
    Wenn ein Angriff deklariert wird, an dem diese Karte und ein Monster mit 2200 oder mehr ATK beteiligt sind: Du kannst diese Karte 1000 ATK erhalten lassen, dann kannst du 1 Monster der Stufe 4 oder niedriger als Spezialbeschwörung von deiner Hand in die Verteidigungsposition beschwören. Falls ein oder mehr Monster in diesem Spielzug durch Kampf zerstört wurden (Schnelleffekt): Du kannst 1 Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du Monster von deiner Hand oder Spielfeldseite verwendest. Du kannst jeden Effekt von „Lieblings-HELD Flammenflügelmann“ nur einmal pro Spielzug verwenden.
  es: |-
    2 monstruos con el mismo Tipo pero con Atributos diferentes
    (Esta carta se trata siempre como una carta "HÉROE Elemental").
    Cuando es declarado un ataque que involucre esta carta y un monstruo con 2200 ATK o más: puedes hacer que esta carta gane 1000 ATK, y después puedes Invocar de Modo Especial, desde tu mano, 1 monstruo de Nivel 4 o menor en Posición de Defensa. Si uno o más monstruos fueron destruidos en batalla este turno (Efecto Rápido): puedes Invocar por Fusión 1 Monstruo de Fusión desde tu Deck Extra, usando monstruos en tu mano o Campo. Sólo puedes usar cada efecto de "HÉROE Favorito de la Llama Wingman" una vez por turno.
  fr: |-
    2 monstres du même Type mais d'Attributs différents
    (Cette carte est toujours traitée comme carte "HÉROS Élémentaire".)
    Lorsqu'une attaque impliquant cette carte et un monstre avec min. 2200 ATK est déclarée : vous pouvez faire gagner 1000 ATK à cette carte, puis vous pouvez Invoquer Spécialement 1 monstre de max. Niveau 4 depuis votre main en Position de Défense. Ce tour, si un ou plusieurs monstres ont été détruits au combat (Effet Rapide) : vous pouvez Invoquer par Fusion 1 Monstre Fusion depuis votre Extra Deck, en utilisant des monstres depuis votre main ou Terrain. Vous ne pouvez utiliser chaque effet de "Homme-Oiseau de Feu, HÉROS Favori" qu'une fois par tour.
  it: |-
    2 mostri con lo stesso Tipo ma Attributi diversi
    (Questa carta viene sempre considerata come una carta "EROE Elementale".)
    Quando viene dichiarato un attacco che coinvolge questa carta e un mostro con ATK 2200 o superiore: puoi far guadagnare a questa carta 1000 ATK, poi puoi Evocare Specialmente 1 mostro di Livello 4 o inferiore dalla tua mano in Posizione di Difesa. Se uno o più mostri sono stati distrutti in battaglia in questo turno (Effetto Rapido): puoi Evocare tramite Fusione 1 Mostro Fusione dal tuo Extra Deck, utilizzando mostri dalla tua mano o Terreno. Puoi utilizzare ogni effetto di "Uomo Alato della Fiamma EROE Preferito" una sola volta per turno.
  pt: |-
    2 monstros com o mesmo Tipo, mas Atributos diferentes
    (Este card deve ser sempre considerado como um card "HERÓI do Elemento".)
    Quando um ataque for declarado envolvendo este card e um monstro com 2200 ou mais de ATK: você pode fazer com que este card ganhe 1000 de ATK e, depois, você pode Invocar por Invocação-Especial 1 monstro de Nível 4 ou menos da sua mão em Posição de Defesa. Se um ou mais monstros foram destruídos em batalha neste turno (Efeito Rápido): você pode Invocar por Invocação-Fusão 1 Monstro de Fusão do seu Deck Adicional, usando monstros da sua mão ou do campo. Você só pode usar cada efeito de "Homem-Alado das Chamas, o HERÓI Favorito" uma vez por turno.
  ja: |-
    同じ種族で属性が異なるモンスター×２
    このカード名はルール上「Ｅ・ＨＥＲＯ」カードとしても扱う。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが攻撃力２２００以上のモンスターと戦闘を行う攻撃宣言時に発動できる。このカードの攻撃力は１０００アップする。その後、手札からレベル４以下のモンスター１体を守備表示で特殊召喚できる。②：モンスターが戦闘で破壊された自分・相手ターンに発動できる。自分の手札・フィールドのモンスターを融合素材とし、融合モンスター１体を融合召喚する。
  ko: |-
    같은 종족으로 속성이 다른 몬스터 × 2
    이 카드명은 룰상 "엘리멘틀 히어로" 카드로도 취급한다. 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드가 공격력 2200 이상의 몬스터와 전투를 실행하는 공격 선언시에 발동할 수 있다. 이 카드의 공격력은 1000 올린다. 그 후, 패에서 레벨 4 이하의 몬스터 1장을 수비 표시로 특수 소환할 수 있다. ②: 몬스터가 전투로 파괴된 자신 / 상대 턴에 발동할 수 있다. 자신의 패 / 필드의 몬스터를 융합 소재로 하고, 융합 몬스터 1장을 융합 소환한다.
  zh-TW:
  zh-CN: |-
    种族相同而属性不同的怪兽×2
    此卡名在规则上也视为“元素－英雄”卡。此卡名的①②效果1回合仅可各使用1次。①：此卡与攻击力2200以上的怪兽进行战斗的攻击宣言时可以发动。此卡的攻击力上升1000。然后，可从手牌将1只等级4以下的怪兽以守备表示特殊召唤。②：有怪兽因战斗被破坏的自己・对手回合可以发动。将自己手牌・场上的怪兽作为融合素材，将1只融合怪兽融合召唤。
