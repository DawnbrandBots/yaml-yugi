text:
  en: |-
    Tribute up to 2 "Ghostrick" monsters from your hand and/or field, and if you do, Special Summon that many "Ghostrick" monsters from your Deck with different names from each other, each in face-up or face-down Defense Position, also you cannot Special Summon for the rest of this turn, except DARK monsters. During your Main Phase: You can banish this card from your GY; change 1 face-down Defense Position "Ghostrick" monster you control to face-up Defense Position. You can only use each effect of "Ghostrick Art" once per turn.
  de:
