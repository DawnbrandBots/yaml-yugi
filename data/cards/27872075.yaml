  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の手札・フィールドの「ゴーストリック」モンスターを２体までリリースし、その数だけデッキから「ゴーストリック」モンスターをそれぞれ表側守備表示か裏側守備表示で特殊召喚する（同名カードは１枚まで）。このカードの発動後、ターン終了時まで自分は闇属性モンスターしか特殊召喚できない。②：自分メインフェイズに墓地のこのカードを除外して発動できる。自分フィールドの裏側守備表示の「ゴーストリック」モンスター１体を表側守備表示にする。
