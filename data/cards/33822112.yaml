text:
  en: |-
    If this card is Normal or Special Summoned: Banish (face-down) 7 cards from the top of your Deck. (Quick Effect): You can reveal this card and 1 "Trirealm Rift" card in your hand; banish both those cards (face-down), and if you do, draw 2 cards. You can only use this effect of "Trirealm Rift Savage Storms" once per turn. Once per turn (Quick Effect): You can shuffle 1 of your face-down banished "Trirealm Rift" monsters into the Deck, then you can shuffle 1 monster your opponent controls with the same Attribute as that monster into the Deck.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①の効果は１ターンに１度しか使用できない。①：自分・相手ターンに、手札のこのカードと手札の「異解△」カード１枚を相手に見せて発動できる。その２枚を裏側で除外し、自分は２枚ドローする。②：このカードが召喚・特殊召喚した場合に発動する。自分のデッキの上からカード７枚を裏側で除外する。③：自分・相手ターンに１度、発動できる。自分の除外状態（裏側）の「異解△」モンスター１体をデッキに戻す。その後、そのモンスターと属性が同じ相手フィールドのモンスター１体をデッキに戻す事ができる。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①效果1回合仅可使用1次。①：在自己・对手回合中，向对手出示手牌的此卡和手牌的1张“异解△”卡可以发动。将该2张以里侧除外，自己抽2张。②：此卡召唤・特殊召唤的情况下发动。从自己牌组上面将7张卡以里侧除外。③：在每个自己・对手回合中1次，可以发动。将自己除外状态（里侧）的1只“异解△”怪兽放回牌组。然后，可将与该怪兽属性相同的对手场上的1只怪兽放回牌组。
