name:
  en: Shining Umbral Horror
  de: Glänzender Schattenhorror
  es: Horror de las Sombras Brillante
  fr: Horreur de l'Ombre Brillante
  it: Orrore Umbral Brillante
  pt: Terror Umbral Brilhante
  ja: シャイニング・アンブラル
  ja_romaji: Shainingu Anburaru
  ko: 샤이닝 엄브럴
  ko_rr:
  zh-TW:
  zh-CN: 闪光・黑影
text:
  en: |-
    If you Normal or Special Summon an "Umbral Horror" monster(s) or a "Masquerade" Xyz Monster(s) (except during the Damage Step): You can Special Summon this card from your hand, and if you do, draw 1 card, then you can Special Summon it if it is an "Umbral Horror" monster. Can be treated as 2 materials for the Xyz Summon of a "Number" Xyz Monster that requires 3 or more materials. You can only use each effect of "Shining Umbral Horror" once per turn.
  de: |-
    Falls du ein oder mehr „Schattenhorror“-Monster oder ein oder mehr „Maskerade“-Xyz-Monster als Normal- oder Spezialbeschwörung beschwörst (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören und falls du dies tust, ziehe 1 Karte, dann kannst du sie als Spezialbeschwörung beschwören, falls es ein „Schattenhorror“-Monster ist. Kann als 2 Material für die Xyz-Beschwörung eines „Nummer“-Xyz-Monsters verwendet werden, das 3 oder mehr Material erfordert. Du kannst jeden Effekt von „Glänzender Schattenhorror“ nur einmal pro Spielzug verwenden.
  es: |-
    Si Invocas de Modo Normal o Especial uno o más monstruos "Horror de las Sombras" o uno o más Monstruos Xyz "Mascarada" (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial desde tu mano y, si lo haces, roba 1 carta, y después puedes Invocarla de Modo Especial si es un monstruo "Horror de las Sombras". Puede ser tratado como 2 materiales para la Invocación Xyz de un Monstruo Xyz "Número" que requiera 3 o más materiales. Sólo puedes usar cada efecto de "Horror de las Sombras Brillante" una vez por turno.
  fr: |-
    Si vous Invoquez Normalement ou Spécialement un ou plusieurs monstres "Horreur de l'Ombre", ou un ou plusieurs Monstres Xyz "Mascarade" (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte depuis votre main, et si vous le faites, piochez 1 carte, puis vous pouvez l'Invoquer Spécialement si c'est un monstre "Horreur de l'Ombre". Peut être traitée comme 2 Matériels pour l'Invocation Xyz d'un Monstre Xyz "Numéro" qui nécessite min. 3 Matériels. Vous ne pouvez utiliser chaque effet de "Horreur de l'Ombre Brillante" qu'une fois par tour.
  it: |-
    Se Evochi Normalmente o Specialmente uno o più mostri "Orrore Umbral" o uno o più Mostri Xyz "Masquerade" (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta dalla tua mano e, se lo fai, pesca 1 carta, poi puoi Evocarla Specialmente se è un mostro "Orrore Umbral". Può essere considerato come 2 materiali per l'Evocazione Xyz di un Mostro Xyz "Numero" che richiede 3 o più materiali. Puoi utilizzare ogni effetto di "Orrore Umbral Brillante" una sola volta per turno.
  pt: |-
    Se você Invocar por Invocação-Normal ou Especial um ou mais monstros "Terror Umbral" ou um ou mais Monstros Xyz "Mascarado(a)" (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial da sua mão e, se isso acontecer, compre 1 card e, depois, você pode Invocá-lo por Invocação-Especial se for um monstro "Terror Umbral". Pode ser considerado como 2 matérias para a Invocação-Xyz de um Monstro Xyz "Número" que requer 3 ou mais matérias. Você só pode usar cada efeito de "Terror Umbral Brilhante" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分が「アンブラル」モンスターか「仮面魔踏士」Ｘモンスターを召喚・特殊召喚した場合に発動できる。このカードを手札から特殊召喚し、自分は１枚ドローする。そのドローしたカードが「アンブラル」モンスターだった場合、さらにそのモンスターを特殊召喚できる。②：モンスター３体以上を素材とする「Ｎｏ．」ＸモンスターをＸ召喚する場合、このカードは２体分のＸ素材にできる。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신이 "엄브럴" 몬스터나 "마스커레이드" 엑시즈 몬스터를 일반 소환 / 특수 소환했을 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환하고, 자신은 1장 드로우한다. 그 드로우한 카드가 "엄브럴" 몬스터였을 경우, 추가로 그 몬스터를 특수 소환할 수 있다. ②: 몬스터 3장 이상을 소재로 하는 "No." 엑시즈 몬스터를 엑시즈 소환할 경우, 이 카드는 2장만큼의 엑시즈 소재로 할 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：自己将“黑影”怪兽或“假面魔蹈士”超量怪兽召唤・特殊召唤的情况下可以发动。从手牌将此卡特殊召唤，自己抽1张。该抽到的卡是“黑影”怪兽的情况下，进而可将该怪兽特殊召唤。②：要超量召唤需以3只以上怪兽作为素材的“编号”超量怪兽的情况下，此卡可作为2只的超量素材。
