  en: |-
    Choose opponent's Main Monster Zones equal to the number of Normal Monsters and "Sennet" Ritual Monsters you control; negate the first monster effect activated in each of those zones that resolves this turn. If the total ATK of all Normal Monster Cards you control is more than 3000: You can banish this card from your GY, then target 1 monster your opponent controls; send it to the GY. You can only use each effect of "Sennet Cataract" once per turn.
