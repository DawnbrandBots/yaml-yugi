name:
  en: Ashtrashen - Gate to the Worlds Beyond
  de: Ashtrashen - Tor zum Jenseits
  es: Ashtrashen - Puerta a los Mundos Más Allá
  fr: Ashtrashen - Portail des Mondes de l'Au-Delà
  it: Ashtrashen - Portale verso i Mondi Oltre
  pt: Ashtrashen - Portal para os Mundos Além
  ja: <ruby>艮神鬼門<rt>アシュトラーシェン</rt></ruby> <ruby>三<rt>さん</rt></ruby><ruby>千<rt>ぜん</rt></ruby><ruby>世<rt>せ</rt></ruby><ruby>界<rt>かい</rt></ruby>
  ja_romaji: Ashutorāshen Sanzensekai
  ko: 아슈트라셴 삼천세계
  ko_rr:
  zh-TW:
  zh-CN: 艮鬼神门 三千世界
text:
  en: |-
    You can target any number of face-down cards you control; add "Ashtra" cards from your Deck to your hand, except Field Spells, each with a different name, equal to the number of those face-down cards, then send those face-down cards to the GY. If you control an "Ashtra" monster and a face-down card, and either player Sets a card: You can target 1 card on the field; return it to the hand. You can only use each effect of "Ashtrashen - Gate to the Worlds Beyond" once per turn.
  de: |-
    Du kannst eine beliebige Anzahl verdeckter Karten wählen, die du kontrollierst; füge deiner Hand „Ashtra“-Karten mit unterschiedlichen Namen, außer Spielfeldzaubern, in Höhe der Anzahl jener verdeckten Karten von deinem Deck hinzu, dann lege jene verdeckten Karten auf den Friedhof. Falls du ein „Ashtra“-Monster und eine verdeckte Karte kontrollierst und ein beliebiger Spieler eine Karte setzt: Du kannst 1 Karte auf dem Spielfeld wählen; gib sie auf die Hand zurück. Du kannst jeden Effekt von „Ashtrashen - Tor zum Jenseits“ nur einmal pro Spielzug verwenden.
  es: |-
    Puedes seleccionar cualquier número de cartas boca abajo que controles; añade a tu mano cartas "Ashtra" en tu Deck, excepto Mágicas de Campo, cada una con un nombre diferente, iguales al número de esas cartas boca abajo, y después manda al Cementerio esas cartas boca abajo. Si controlas un monstruo "Ashtra" y una carta boca abajo, y cualquier jugador Coloca una carta: puedes seleccionar 1 carta en el Campo; devuélvela a la mano. Sólo puedes usar cada efecto de "Ashtrashen - Puerta a los Mundos Más Allá" una vez por turno.
  fr: |-
    Vous pouvez cibler un nombre de votre choix de cartes face verso que vous contrôlez ; ajoutez un nombre de cartes "Ashtra" (Magies de Terrain exclues) depuis votre Deck à votre main, chacune de nom différent, égal au nombre de ces cartes face verso, puis envoyez ces cartes face verso au Cimetière. Si vous contrôlez un monstre "Ashtra" et une carte face verso, et que l'un des joueurs Pose une carte : vous pouvez cibler 1 carte sur le Terrain ; renvoyez-la à la main. Vous ne pouvez utiliser chaque effet de "Ashtrashen - Portail des Mondes de l'Au-Delà" qu'une fois par tour.
  it: |-
    Puoi scegliere come bersaglio un qualsiasi numero di carte coperte che controlli; aggiungi carte "Ashtra" dal tuo Deck alla tua mano, eccetto Magie Terreno, ognuna con un nome diverso, pari al numero di quelle carte coperte, poi manda quelle carte coperte al Cimitero. Se controlli un mostro "Ashtra" e una carta coperta, e qualsiasi giocatore Posiziona una carta: puoi scegliere come bersaglio 1 carta sul Terreno; falla ritornare nella mano. Puoi utilizzare ogni effetto di "Ashtrashen - Portale verso i Mondi Oltre" una sola volta per turno.
  pt: |-
    Você pode escolher qualquer número de cards com a face para baixo que você controla; adicione cards "Ashtra" do seu Deck à sua mão, exceto Magias de Campo, cada um com um nome diferente, igual ao número desses cards com a face para baixo e, depois, envie aqueles cards com a face para baixo para o Cemitério. Se você controlar um monstro "Ashtra" e um card com a face para baixo e qualquer duelista Baixar um card: você pode escolher 1 card no campo; devolva-o para a mão. Você só pode usar cada efeito de "Ashtrashen - Portal para os Mundos Além" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドの裏側表示カードを任意の数だけ対象として発動できる。その裏側表示カードの数だけ、デッキからフィールド魔法カード以外の「アシュトラ」カードを手札に加える（同名カードは１枚まで）。その後、対象の裏側表示カードを墓地へ送る。②：自分フィールドに「アシュトラ」モンスター及び裏側表示カードが存在する状態で、フィールドにカードがセットされた場合、フィールドのカード１枚を対象として発動できる。そのカードを手札に戻す。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드의 뒷면 표시 카드를 임의의 수만큼 대상으로 하고 발동할 수 있다. 그 뒷면 표시 카드의 수만큼, 덱에서 필드 마법 카드 이외의 "아슈트라" 카드를 패에 넣는다(같은 이름의 카드는 1장까지). 그 후, 대상의 뒷면 표시 카드를 묘지로 보낸다. ②: 자신 필드에 "아슈트라" 몬스터 및 뒷면 표시 카드가 존재하는 상태에서, 필드에 카드가 세트되었을 경우, 필드의 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 패로 되돌린다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：以自己场上任意数量的里侧表示卡为对象可以发动。依该里侧表示卡的数量，从牌组将场地魔法卡以外的“艮鬼”卡加入手牌（同名卡最多1张）。然后，将对象的里侧表示卡送至墓地。②：自己场上存在“艮鬼”怪兽及里侧表示卡的状态下，有卡被放置到场上的情况下，以场上的1张卡为对象可以发动。将该卡放回手牌。
