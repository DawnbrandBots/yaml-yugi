text:
  en: |-
    If you activate a "Lunalight" monster's effect (except during the Damage Step): You can Special Summon this card from your hand, then if you activated this effect during the turn your opponent activated a card or effect, you can add 1 "Polymerization" from your Deck or GY to your hand. If this card is sent to the GY by card effect: You can Special Summon 1 "Lunalight" monster from your face-up Extra Deck or GY, except a Level 5 monster, but it cannot activate its effects. You can only use each effect of "Lunalight Scarlet Tiger" once per turn.
  de: |-
    Falls du einen Effekt eines „Lunalicht“-Monsters aktivierst (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören, dann, falls du diesen Effekt während des Spielzugs aktiviert hast, in dem dein Gegner eine Karte oder einen Effekt aktiviert hat, kannst du deiner Hand 1 „Polymerisation“ von deinem Deck oder Friedhof hinzufügen. Falls diese Karte durch einen Karteneffekt auf den Friedhof gelegt wird: Du kannst 1 „Lunalicht“-Monster als Spezialbeschwörung offen von deinem Extra Deck oder von deinem Friedhof beschwören, außer einem Monster der Stufe 5, aber seine Effekte können nicht aktiviert werden. Du kannst jeden Effekt von „Lunalicht Scharlach-Tiger“ nur einmal pro Spielzug verwenden.
  es: |-
    Si activas el efecto de un monstruo "Lunaluz" (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial desde tu mano, y después si activaste este efecto durante el turno en el que tu adversario activó una carta o efecto, puedes añadir a tu mano 1 "Polimerización" en tu Deck o Cementerio. Si esta carta es mandada al Cementerio por el efecto de una carta: puedes Invocar de Modo Especial 1 monstruo "Lunaluz", desde tu Deck Extra boca arriba o Cementerio, excepto un monstruo de Nivel 5, pero no puede activar sus efectos. Sólo puedes usar cada efecto de "Tigresa Escarlata de la Lunaluz" una vez por turno.
  fr: |-
    Si vous activez un effet de monstre "Clair de Lune" (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte depuis votre main, puis si vous avez activé cet effet durant le tour où votre adversaire a activé une carte ou un effet, vous pouvez ajouter 1 "Polymérisation" depuis votre Deck ou Cimetière à votre main. Si cette carte est envoyée au Cimetière par un effet de carte : vous pouvez Invoquer Spécialement 1 monstre "Clair de Lune" (monstres de Niveau 5 exclus) depuis votre Extra Deck face recto ou Cimetière, mais il ne peut pas activer ses effets. Vous ne pouvez utiliser chaque effet de "Tigre Écarlate de Clair de Lune" qu'une fois par tour.
  it: |-
    Se attivi l'effetto di un mostro "Lucelunare" (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta dalla tua mano, poi se hai attivato questo effetto durante un turno in cui il tuo avversario ha attivato una carta o un effetto, puoi aggiungere 1 "Polimerizzazione" dal tuo Deck o Cimitero alla tua mano. Se questa carta viene mandata al Cimitero dall'effetto di una carta: puoi Evocare Specialmente 1 mostro "Lucelunare" dal tuo Extra Deck scoperto o Cimitero, eccetto un mostro di Livello 5, ma esso non può attivare i suoi effetti. Puoi utilizzare ogni effetto di "Tigre Scarlatta della Lucelunare" una sola volta per turno.
  pt: |-
    Se você ativar um efeito de monstro "Luzlunar" (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial da sua mão e, depois, se você ativou este efeito durante o turno em que seu oponente ativou um card ou efeito, você pode adicionar 1 "Polimerização" do seu Deck ou Cemitério à sua mão. Se este card for enviado para o Cemitério por um efeito de card: você pode Invocar por Invocação-Especial 1 monstro "Luzlunar" do seu Deck Adicional com a face para cima ou Cemitério, exceto um monstro de Nível 5, mas ele não pode ativar seus efeitos. Você só pode usar cada efeito de "Tigresa Escarlate Luzlunar" uma vez por turno.
