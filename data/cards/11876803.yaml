name:
  en: Lunalight Scarlet Tiger
  de: Lunalicht Scharlach-Tiger
  es: Tigresa Escarlata de la Lunaluz
  fr: Tigre Écarlate de Clair de Lune
  it: Tigre Scarlatta della Lucelunare
  pt: Tigresa Escarlate Luzlunar
