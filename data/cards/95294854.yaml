  ja: |-
    幻想魔族チューナー＋チューナー以外のモンスター１体以上
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが特殊召喚した場合、自分及び相手フィールドのカードを１枚ずつ対象として発動できる。そのカードを手札に戻す。②：このカードが墓地へ送られた場合、どこから墓地へ送られたかによって以下の効果を発動できる。●フィールド：フィールドのカード１枚を対象として発動できる。そのカードをデッキに戻す。●ＥＸデッキ：自分の墓地から「白鴉」モンスター１体を特殊召喚する。
  ko:
