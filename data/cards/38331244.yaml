name:
  en: Akasuna the Battle Ashtra
  de: Akasuna der Kampf-Ashtra
  es: Akasuna el Ashtra de Batalla
  fr: Akasuna le Combattant Ashtra
  it: Akasuna l'Ashtra Battaglia
  pt: Akasuna, o Ashtra de Batalha
  ja: <ruby>金<rt>こん</rt></ruby><ruby>神<rt>じん</rt></ruby>の<ruby>戦鬼<rt>アシュトラ</rt></ruby> アカスナ
  ja_romaji: Konjin no Ashutora Akasuna
  ko: 금신의 아슈트라 아카스나
  ko_rr:
  zh-TW:
  zh-CN: 金神之战艮鬼 赤沙
text:
  en: |-
    You can Special Summon this card (from your hand) by revealing 1 face-down card you control and returning it to the hand or Extra Deck. You can only Special Summon "Akasuna the Battle Ashtra" once per turn this way. You can only use each of the following effects of "Akasuna the Battle Ashtra" once per turn. During the Main Phase (Quick Effect): You can send 1 Trap from your hand or face-down field to the GY; change all face-up monsters your opponent controls to face-down Defense Position. During your End Phase: You can Set 1 "Ashtra" Trap from your Deck.
  de: |-
    Du kannst diese Karte als Spezialbeschwörung (von deiner Hand) beschwören, indem du 1 verdeckte Karte vorzeigst, die du kontrollierst, und sie auf die Hand oder ins Extra Deck zurückgibst. Du kannst „Akasuna der Kampf-Ashtra“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Du kannst jeden der folgenden Effekte von „Akasuna der Kampf-Ashtra“ nur einmal pro Spielzug verwenden. Während der Main Phase (Schnelleffekt): Du kannst 1 Falle von deiner Hand oder verdeckt von deiner Spielfeldseite auf den Friedhof legen; ändere alle offenen Monster, die dein Gegner kontrolliert, in die verdeckte Verteidigungsposition. Während deiner End Phase: Du kannst 1 „Ashtra“-Falle von deinem Deck setzen.
  es: |-
    Puedes Invocar esta carta de Modo Especial (desde tu mano) mostrando 1 carta boca abajo que controles y devolviéndola a la mano o Deck Extra. Sólo puedes Invocar de Modo Especial "Akasuna el Ashtra de Batalla" una vez por turno de esta forma. Sólo puedes usar cada uno de los siguientes efectos de "Akasuna el Ashtra de Batalla" una vez por turno. Durante la Main Phase (Efecto Rápido): puedes mandar al Cementerio 1 Trampa en tu mano o Campo boca abajo; cambia todos los monstruos boca arriba que controla tu adversario a Posición de Defensa boca abajo. Durante tu End Phase: puedes Colocar 1 Trampa "Ashtra" desde tu Deck.
  fr: |-
    Vous pouvez Invoquer Spécialement cette carte (depuis votre main) en révélant 1 carte face verso que vous contrôlez et en la renvoyant à la main ou Extra Deck. Vous ne pouvez Invoquer Spécialement "Akasuna le Combattant Ashtra" qu'une fois par tour de cette façon. Vous ne pouvez utiliser chacun des effets suivants de "Akasuna le Combattant Ashtra" qu'une fois par tour. Durant la Main Phase (Effet Rapide) : vous pouvez envoyer 1 Piège depuis votre main ou Terrain face verso au Cimetière ; changez tous les monstres face recto contrôlés par votre adversaire en Position de Défense face verso. Durant votre End Phase : vous pouvez Poser 1 Piège "Ashtra" depuis votre Deck.
  it: |-
    Puoi Evocare Specialmente questa carta (dalla tua mano) rivelando 1 carta coperta che controlli e facendola ritornare nella mano o Extra Deck. Puoi Evocare Specialmente "Akasuna l'Ashtra Battaglia" una sola volta per turno in questo modo. Puoi utilizzare ognuno dei seguenti effetti di "Akasuna l'Ashtra Battaglia" una sola volta per turno. Durante la Main Phase (Effetto Rapido): puoi mandare 1 Trappola dalla tua mano o Terreno coperto al Cimitero; metti coperti in Posizione di Difesa tutti i mostri scoperti controllati dal tuo avversario. Durante la tua End Phase: puoi Posizionare 1 Trappola "Ashtra" dal tuo Deck.
  pt: |-
    Você pode Invocar este card por Invocação-Especial (da sua mão) ao revelar 1 card com a face para baixo que você controla e devolvê-lo para a mão ou para o Deck Adicional. Você só pode Invocar "Akasuna, o Ashtra de Batalha" por Invocação-Especial uma vez por turno desta forma. Você só pode usar cada um dos seguintes efeitos de "Akasuna, o Ashtra de Batalha" uma vez por turno. Durante a Fase Principal (Efeito Rápido): você pode enviar 1 Armadilha da sua mão ou do campo com a face para baixo para o Cemitério; coloque todos os monstros com a face para cima que seu oponente controla com a face para baixo em Posição de Defesa. Durante sua Fase Final: você pode Baixar 1 Armadilha "Ashtra" do seu Deck.
  ja: |-
    このカード名の、①の方法による特殊召喚は１ターンに１度しかできず、②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードは自分フィールドの裏側表示カード１枚を相手に見せて手札・ＥＸデッキに戻し、手札から特殊召喚できる。②：自分・相手のメインフェイズに、自分の手札・フィールド（裏側表示）から罠カード１枚を墓地へ送って発動できる。相手フィールドの表側表示モンスターを全て裏側守備表示にする。③：自分エンドフェイズに発動できる。デッキから「アシュトラ」罠カード１枚を自分フィールドにセットする。
  ko: |-
    이 카드명의, ①의 방법에 의한 특수 소환은 1턴에 1번밖에 할 수 없으며, ②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드는 자신 필드의 뒷면 표시 카드 1장을 상대에게 보여주고 패 / 엑스트라 덱으로 되돌리고, 패에서 특수 소환할 수 있다. ②: 자신 / 상대의 메인 페이즈에, 자신의 패 / 필드(뒷면 표시)에서 함정 카드 1장을 묘지로 보내고 발동할 수 있다. 상대 필드의 앞면 표시 몬스터를 전부 뒷면 수비 표시로 한다. ③: 자신 엔드 페이즈에 발동할 수 있다. 덱에서 "아슈트라" 함정 카드 1장을 자신 필드에 세트한다.
  zh-TW:
  zh-CN: |-
    此卡名以①方法的特殊召唤1回合仅可进行1次，且②③效果1回合仅可各使用1次。①：此卡可通过将自己场上的1张里侧表示卡出示给对手并放回手牌・额外牌组，来从手牌特殊召唤。②：在自己・对手的主要阶段，从自己手牌・场上（里侧表示）将1张陷阱卡送至墓地可以发动。将对手场上的表侧表示怪兽全部改成里侧守备表示。③：在自己的结束阶段可以发动。从牌组将1张“艮鬼”陷阱卡放置在自己场上。
