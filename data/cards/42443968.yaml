text:
  en: |-
    Gains these effects while you control an "Amazoness" monster or "Harpie Lady".
    ● Face-up monsters your opponent controls are changed to Attack Position and must attack if able.
    ● Once per battle, when an opponent's monster declares an attack: You can halve its ATK.
    Once per turn, during the Standby Phase: You can Set 1 Spell/Trap from your GY or banishment that mentions "Harpie Lady", except "Eyelluring Mirror Wall".
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    ①：自分フィールドに「ハーピィ・レディ」か「アマゾネス」モンスターが存在する限り、このカードは以下の効果を得る。●相手フィールドの表側表示モンスターは攻撃表示になり、攻撃可能な相手モンスターは攻撃しなければならない。●相手モンスターの攻撃宣言時に１度、発動できる。そのモンスターの攻撃力を半分にする。②：自分・相手のスタンバイフェイズに１度、発動できる。「誘惑の鏡壁」を除く、「ハーピィ・レディ」のカード名が記された魔法・罠カード１枚を自分の墓地・除外状態から自分フィールドにセットする。
  ko:
  zh-TW:
  zh-CN: |-
    ①：只要自己场上存在“神鹰女郎”或“亚马逊”怪兽，此卡获得以下效果。
    ●对手场上的表侧表示怪兽变为攻击表示，可攻击的对手怪兽必须攻击。
    ●每当对手怪兽攻击宣言时，可以发动1次。将该怪兽的攻击力改成一半。
    ②：在每个自己・对手的准备阶段可以发动1次。从自己墓地・除外状态将除“诱惑的镜壁”以外的、1张记载有“神鹰女郎”卡名的魔法・陷阱卡放置在自己场上。
