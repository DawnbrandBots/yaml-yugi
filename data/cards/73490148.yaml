text:
  en: |-
    You can Ritual Summon this card with a "Zenet" card. Cannot be destroyed by card effects, while equipped with an Equip Card. You can only use each of the following effects of "Tau-Zenet Adjat" once per turn. You can discard this card; send 1 "Zenet" card from your Deck to the GY, except "Tau-Zenet Adjat". (Quick Effect): You can send up to 3 face-up Normal Monster Cards you control to the GY, then target that many cards your opponent controls; return them to the hand, then you can Special Summon 1 Normal Monster from your GY.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「セネト」カードにより降臨
    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から捨てて発動できる。デッキから「タウセネト・アジャト」以外の「セネト」カード１枚を墓地へ送る。②：装備カードを装備しているこのカードは効果では破壊されない。③：自分・相手ターンに、自分フィールドの表側表示の通常モンスターカードを３枚まで墓地へ送り、その数だけ相手フィールドのカードを対象として発動できる。そのカードを手札に戻す。その後、自分の墓地から通常モンスター１体を特殊召喚できる。
  ko:
  zh-TW:
  zh-CN: |-
    以“塞尼特”卡降临
    此卡名的①③效果1回合仅可各使用1次。①：从手牌将此卡舍弃可以发动。从牌组将“塔乌塞尼特・阿贾特”以外的1张“塞尼特”卡送至墓地。②：装备有装备卡的此卡不会因效果被破坏。③：在自己・对手回合中，将自己场上最多3张表侧表示的通常怪兽卡送至墓地，依其数量以对手场上的卡为对象可以发动。将该卡放回手牌。然后，可从自己墓地将1只通常怪兽特殊召唤。
