text:
  en: |-
    If this card is in your hand and you control a "Sun God" card: You can Special Summon this card. You can Tribute this card, then target 1 other card in either GY; send 1 "Sun God" card from your Deck to the GY, and if you do, place the targeted card on the bottom of the Deck. During the End Phase, if "The Immortal Sun God" was sent to your GY this turn: You can add this card from your GY to your hand. You can only use each effect of "The Sun God's Terror Machine - Gil Garth" once per turn.
