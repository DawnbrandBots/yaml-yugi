text:
  en: |-
    Once per turn, during the Battle Phase (Quick Effect): You can Fusion Summon 1 "Cubic" Fusion Monster from your Extra Deck, using monsters from your hand or field. You can only use each of the following effects of "Pritima the Infinity Cubic Vessel" once per turn, also you cannot Special Summon from the Extra Deck the turn you activate either effect, except Fusion Monsters. During your Main Phase: You can Special Summon this card from your hand. If this card is Normal or Special Summoned: You can discard 1 card; add up to 2 "Cubic" Spells/Traps from your Deck to your hand.
