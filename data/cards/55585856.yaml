  de: Frl. Mystick
  es: Sra. Llamada Tic
  fr: Miss Tic-Tac
  it: Miss Tick Richiamo
  pt: Srta. Mhisti K.
  ja: ミズティックコール
  ja_romaji: Mizutikku Kōru
  ko:
  ko_rr:
  zh-TW:
  zh-CN: 秘召刻漏淑女
text:
  en: |-
    If this card is in your hand or GY: You can discard 1 other Spellcaster monster or 1 Spell/Trap; Special Summon this card, but banish it when it leaves the field. If this card is Normal or Special Summoned: You can banish 1 Level 4 Spellcaster monster from your Deck, and if you do, during the End Phase of this turn, add to your hand or Special Summon that banished monster. You can only use each effect of "Ms. Tick Call" once per turn.
  de: |-
    Falls sich diese Karte in deiner Hand oder deinem Friedhof befindet: Du kannst 1 anderes Hexer-Monster oder 1 Zauber/Falle abwerfen; beschwöre diese Karte als Spezialbeschwörung, aber verbanne sie, wenn sie das Spielfeld verlässt. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Hexer-Monster der Stufe 4 von deinem Deck verbannen und falls du dies tust, während der End Phase dieses Spielzugs, füge jenes verbannte Monster deiner Hand hinzu oder beschwöre es als Spezialbeschwörung. Du kannst jeden Effekt von „Frl. Mystick“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta está en tu mano o Cementerio: puedes descartar otro monstruo Lanzador de Conjuros o 1 Mágica/Trampa; Invoca esta carta de Modo Especial, pero destiérrala cuando deje el Campo. Si esta carta es Invocada de Modo Normal o Especial: puedes desterrar 1 monstruo Lanzador de Conjuros de Nivel 4 en tu Deck y, si lo haces, durante la End Phase de este turno, añade a tu mano o Invoca de Modo Especial ese monstruo desterrado. Sólo puedes usar cada efecto de "Sra. Llamada Tic" una vez por turno.
  fr: |-
    Si cette carte est dans votre main ou Cimetière : vous pouvez défausser 1 autre monstre Magicien ou 1 Magie/Piège ; Invoquez Spécialement cette carte, mais bannissez-la lorsqu'elle quitte le Terrain. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez bannir 1 monstre Magicien de Niveau 4 depuis votre Deck, et si vous le faites, durant la End Phase de ce tour, ajoutez à votre main ou Invoquez Spécialement le monstre banni. Vous ne pouvez utiliser chaque effet de "Miss Tic-Tac" qu'une fois par tour.
  it: |-
    Se questa carta è nella tua mano o Cimitero: puoi scartare 1 altro mostro Incantatore o 1 Magia/Trappola; Evoca Specialmente questa carta, ma bandiscila quando lascia il Terreno. Se questa carta viene Evocata Normalmente o Specialmente: puoi bandire 1 mostro Incantatore di Livello 4 dal tuo Deck e, se lo fai, durante la End Phase di questo turno, aggiungi alla tua mano o Evoca Specialmente quel mostro bandito. Puoi utilizzare ogni effetto di "Miss Tick Richiamo" una sola volta per turno.
  pt: |-
    Se este card estiver na sua mão ou no Cemitério: você pode descartar 1 outro monstro Mago ou 1 Magia/Armadilha; Invoque este card por Invocação-Especial, mas bana-o quando ele deixar o campo. Se este card for Invocado por Invocação-Normal ou Especial: você pode banir 1 monstro Mago de Nível 4 do seu Deck e, se isso acontecer, durante a Fase Final deste turno, adicione à sua mão ou Invoque por Invocação-Especial esse monstro banido. Você só pode usar cada efeito de "Srta. Mhisti K." uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札・墓地に存在する場合、手札から他の魔法使い族モンスター１体か魔法・罠カード１枚を捨てて発動できる。このカードを特殊召喚する。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。②：このカードが召喚・特殊召喚した場合に発動できる。デッキから魔法使い族・レベル４モンスター１体を除外する。このターンのエンドフェイズに、除外したそのモンスターを手札に加えるか特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：此卡存在于手牌・墓地的情况下，从手牌将1只其他的魔法师族怪兽或1张魔法・陷阱卡舍弃可以发动。将此卡特殊召唤。以此效果特殊召唤的此卡从场上离开的情况下将被除外。②：此卡召唤・特殊召唤的情况下可以发动。从牌组将1只魔法师族・等级4怪兽除外。在此回合的结束阶段，将所除外的该怪兽加入手牌或特殊召唤。
