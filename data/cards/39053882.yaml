text:
  en: |-
    If this card is Normal or Special Summoned: You can add 1 "Umbral Horror" monster from your Deck to your hand, except "V Umbral Horror". You can banish this card from your GY, then target 1 "Masquerade" Xyz Monster you control; Special Summon from your Extra Deck, 1 "Number" monster that is 1 Rank higher than that monster you control, by using it as material (this is treated as an Xyz Summon, transfer its materials). You can only use each effect of "V Umbral Horror" once per turn.
