text:
  en: |-
    If this card is Normal or Special Summoned: You can add 1 "Umbral Horror" monster from your Deck to your hand, except "V Umbral Horror". You can banish this card from your GY, then target 1 "Masquerade" Xyz Monster you control; Special Summon from your Extra Deck, 1 "Number" monster that is 1 Rank higher than that monster you control, by using it as material (this is treated as an Xyz Summon, transfer its materials). You can only use each effect of "V Umbral Horror" once per turn.
  de: |-
    Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 „Schattenhorror“-Monster von deinem Deck hinzufügen, außer „V-Schattenhorror“. Du kannst diese Karte von deinem Friedhof verbannen und dann 1 „Maskerade“-Xyz-Monster wählen, das du kontrollierst; beschwöre 1 „Nummer“-Monster, dessen Rang 1 höher als der jenes Monsters ist, das du kontrollierst, als Spezialbeschwörung von deinem Extra Deck, indem du es als Material verwendest (dies wird als Xyz-Beschwörung behandelt, transferiere sein Material). Du kannst jeden Effekt von „V-Schattenhorror“ nur einmal pro Spielzug verwenden.
  es: |-
    Si esta carta es Invocada de Modo Normal o Especial: puedes añadir a tu mano 1 monstruo "Horror de las Sombras" en tu Deck, excepto "Horror de las Sombras V". Puedes desterrar esta carta en tu Cementerio, y después selecciona 1 Monstruo Xyz "Mascarada" que controles; Invoca de Modo Especial, desde tu Deck Extra, 1 monstruo "Número" que sea 1 Rango mayor que ese monstruo que controlas, usándolo como material (esto se trata como una Invocación Xyz, transfiere sus materiales). Sólo puedes usar cada efecto de "Horror de las Sombras V" una vez por turno.
  fr: |-
    Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez ajouter 1 monstre "Horreur de l'Ombre" ("Horreur de l'Ombre V" exclu) depuis votre Deck à votre main. Vous pouvez bannir cette carte depuis votre Cimetière, puis ciblez 1 Monstre Xyz "Mascarade" que vous contrôlez ; Invoquez Spécialement depuis votre Extra Deck 1 monstre "Numéro" qui a 1 Rang de plus que le monstre que vous contrôlez, en l'utilisant comme Matériel (ceci est traité comme Invocation Xyz, transférez ses Matériels). Vous ne pouvez utiliser chaque effet de "Horreur de l'Ombre V" qu'une fois par tour.
  it: |-
    Se questa carta viene Evocata Normalmente o Specialmente: puoi aggiungere 1 mostro "Orrore Umbral" dal tuo Deck alla tua mano, eccetto "Orrore Umbral V". Puoi bandire questa carta dal tuo Cimitero, poi scegliere come bersaglio 1 Mostro Xyz "Masquerade" che controlli; Evoca Specialmente dal tuo Extra Deck 1 mostro "Numero" che è di 1 Rango superiore a quel mostro che controlli, utilizzandolo come materiale (questa viene considerata come un'Evocazione Xyz, trasferisci i suoi materiali). Puoi utilizzare ogni effetto di "Orrore Umbral V" una sola volta per turno.
  pt: |-
    Se este card for Invocado por Invocação-Normal ou Especial: você pode adicionar 1 monstro "Terror Umbral" do seu Deck à sua mão, exceto "Terror Umbral V". Você pode banir este card do seu Cemitério e, depois, escolha 1 Monstro Xyz "Mascarado(a)" que você controla; Invoque por Invocação-Especial do seu Deck Adicional, 1 monstro "Número" que seja 1 Classe maior que a desse monstro que você controla, usando-o como matéria (isso é considerado uma Invocação-Xyz, transfira as matérias dele). Você só pode usar cada efeito de "Terror Umbral V" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合に発動できる。デッキから「Ｖアンブラル」以外の「アンブラル」モンスター１体を手札に加える。②：墓地のこのカードを除外し、自分フィールドの「仮面魔踏士」Ｘモンスター１体を対象として発動できる。その自分のモンスターよりランクが１つ高い「Ｎｏ．」モンスター１体を、対象のモンスターの上に重ねてＸ召喚扱いでＥＸデッキから特殊召喚する。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 일반 소환 / 특수 소환했을 경우에 발동할 수 있다. 덱에서 "V(브이)엄브럴" 이외의 "엄브럴" 몬스터 1장을 패에 넣는다. ②: 묘지의 이 카드를 제외하고, 자신 필드의 "마스커레이드" 엑시즈 몬스터 1장을 대상으로 하여 발동할 수 있다. 그 자신의 몬스터보다 랭크가 1개 높은 "No." 몬스터 1장을, 대상 몬스터 위에 겹쳐 엑시즈 소환으로 취급하고 엑스트라 덱에서 특수 소환한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下可以发动。从牌组将“V黑影”以外的1只“黑影”怪兽加入手牌。②：将墓地的此卡除外，以自己场上的1只“假面魔蹈士”超量怪兽为对象可以发动。从额外牌组将1只阶级比该自己的怪兽高1的“编号”怪兽重叠在对象怪兽上面，视为超量召唤特殊召唤。
