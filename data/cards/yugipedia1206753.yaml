  zh-CN: |-
    以“塞尼特”卡降临
    此卡名的①③效果1回合仅可各使用1次。①：从手牌将此卡舍弃可以发动。从牌组将“塔乌塞尼特・阿贾特”以外的1张“塞尼特”卡送至墓地。②：装备有装备卡的此卡不会因效果被破坏。③：在自己・对手回合中，将自己场上最多3张表侧表示的通常怪兽卡送至墓地，依其数量以对手场上的卡为对象可以发动。将该卡放回手牌。然后，可从自己墓地将1只通常怪兽特殊召唤。
