name:
  en: Hey, Space Trunade!
  de: He, Weltraum-Trunade!
  es: ¡Hola, Tornado Espacial!
  fr: Hé, Espace Trunade !
  it: Ehi, Ritorno Spaziale!
  pt: Ei, Trunade Espacial!
  ja: <ruby>宇<rt>う</rt></ruby><ruby>宙<rt>ちゅう</rt></ruby><ruby>的<rt>てき</rt></ruby>ハリケーン
  ja_romaji: Uchūteki Harikēn
  ko: 우주적 허리케인
  ko_rr:
  zh-TW:
  zh-CN: 宇宙性飓风
text:
  en: |-
    Return up to 2 cards from the field to the hand, then each player places cards from their hand on the bottom of their Deck, in any order, equal to the number returned to their hand. You can only activate 1 "Hey, Space Trunade!" per turn.
  de: |-
    Gib bis zu 2 Karten vom Spielfeld auf die Hand zurück, dann legt jeder Spieler Karten in Höhe der auf seine Hand zurückgegebenen Anzahl von seiner Hand in beliebiger Reihenfolge unter sein Deck. Du kannst nur 1 „He, Weltraum-Trunade!“ pro Spielzug aktivieren.
  es: |-
    Devuelve a la mano hasta 2 cartas en el Campo, y después cada jugador pone cartas de su mano en la parte inferior de su Deck, en cualquier orden, iguales al número de devueltas a su mano. Sólo puedes activar 1 "¡Hola, Tornado Espacial!" por turno.
  fr: |-
    Renvoyez max. 2 cartes depuis le Terrain à la main, puis chaque joueur place un nombre de cartes depuis sa main au-dessous de son Deck dans l'ordre de son choix, égal au nombre renvoyé à sa main. Vous ne pouvez activer qu'1 "Hé, Espace Trunade !" par tour.
  it: |-
    Fai ritornare fino a 2 carte dal Terreno nella mano, poi ogni giocatore mette carte dalla sua mano in fondo al suo Deck, in qualsiasi ordine, pari al numero di carte fatte ritornare nella sua mano. Puoi attivare solo 1 "Ehi, Ritorno Spaziale!" per turno.
  pt: |-
    Devolva até 2 cards do campo para a mão e, depois, cada duelista coloca cards da sua mão no fundo do Deck dele, em qualquer ordem, igual ao número devolvido para a mão dele. Você só pode ativar 1 "Ei, Trunade Espacial!" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：フィールドのカードを２枚まで手札に戻す。その後、お互いはそれぞれ、自身の手札に戻った数だけ自身の手札を選び、好きな順番でデッキの下に戻す。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 필드의 카드를 2장까지 패로 되돌린다. 그 후, 양쪽 플레이어는 각각, 자신의 패로 되돌아간 수만큼 자신의 패를 고르고, 좋아하는 순서대로 덱 아래로 되돌린다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：将场上的最多2张卡放回手牌。然后，双方各自依回到了自身手牌的数量，挑选自身手牌以喜欢的顺序放回牌组下面。
