  ja: |-
    このカード名はルール上「獄神」カードとしても扱う。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の手札・フィールド（表側表示）から「メディウス」モンスター１体を除外して発動できる。ＥＸデッキから特殊召喚されたフィールドのモンスターを全て除外する。その後、自分の墓地から「アルトメギア」モンスター１体を特殊召喚できる。②：自分フィールドのモンスターの種族が３種類以上の場合、墓地のこのカードを除外して発動できる。自分の除外状態の「メディウス」モンスター１体を特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名在规则上也视为“狱神”卡。此卡名的①②效果1回合仅可各使用1次。①：从自己手牌・场上（表侧表示）将1只“墨迪乌斯”怪兽除外可以发动。将被从额外牌组特殊召唤的场上的怪兽全部除外。然后，可从自己墓地将1只“神艺”怪兽特殊召唤。②：自己场上怪兽的种族为3种以上的情况下，将墓地的此卡除外可以发动。将自己除外状态的1只“墨迪乌斯”怪兽特殊召唤。
