    You can send 1 Normal Monster with 2000 or less ATK from your Deck to the GY; Special Summon this card from your hand. If this card is Normal or Special Summoned: You can place 1 "Bunnillin" Continuous Spell/Trap from your Deck or GY face-up on your field. If your oppoennt Special Summons an Effect Monster(s), while this card is in the Monster Zone: You can Tribute this card; Special Summon 1 Normal Monster from your GY. You can only use each effect of "Bunnillin: Mocha MOD" once per turn.
