name:
  en: Barian's Hope
  de: Barians Hoffnung
  es: Esperanza de Barian
  fr: Espoir de Barian
  it: Speranza di Barian
  pt: Esperança de Barian
  ja: バリアンズ・ホープ
  ja_romaji: Barianzu Hōpu
  ko: 바리언즈 호프
  ko_rr:
  zh-TW:
  zh-CN: 巴利安之希望
text:
  en: |-
    Special Summon 1 "Umbral Horror" monster or 1 "Masquerade" Xyz Monster from your hand or GY, then you can make the Levels of all "Umbral Horror" monsters you control the same as 1 "Umbral Horror" monster in your field or GY. You can banish this card from your GY, then target 1 Xyz Monster you control; attach 1 "Number" Xyz Monster from your Extra Deck or GY to it. You can only use each effect of "Barian's Hope" once per turn.
  de: |-
    Beschwöre 1 „Schattenhorror“-Monster oder 1 „Maskerade“-Xyz-Monster als Spezialbeschwörung von deiner Hand oder deinem Friedhof, dann kannst du die Stufen aller „Schattenhorror“-Monster, die du kontrollierst, dieselbe wie die von 1 „Schattenhorror“-Monster auf deiner Spielfeldseite oder in deinem Friedhof werden lassen. Du kannst diese Karte von deinem Friedhof verbannen und dann 1 Xyz-Monster wählen, das du kontrollierst; hänge 1 „Nummer“-Xyz-Monster von deinem Extra Deck oder Friedhof daran an. Du kannst jeden Effekt von „Barians Hoffnung“ nur einmal pro Spielzug verwenden.
  es: |-
    Invoca de Modo Especial 1 monstruo "Horror de las Sombras" o 1 Monstruo Xyz "Mascarada" desde tu mano o Cementerio, y después puedes hacer que los Niveles de todos los monstruos "Horror de las Sombras" que controlas sean el mismo que el de 1 monstruo "Horror de las Sombras" en tu Campo o Cementerio. Puedes desterrar esta carta en tu Cementerio, y después selecciona 1 Monstruo Xyz que controles; acóplale 1 Monstruo Xyz "Número" en tu Deck Extra o Cementerio. Sólo puedes usar cada efecto de "Esperanza de Barian" una vez por turno.
  fr: |-
    Invoquez Spécialement 1 monstre "Horreur de l'Ombre" ou 1 Monstre Xyz "Mascarade" depuis votre main ou Cimetière, puis vous pouvez faire devenir le Niveau de tous les monstres "Horreur de l'Ombre" que vous contrôlez le même qu'1 monstre "Horreur de l'Ombre" dans votre Terrain ou Cimetière. Vous pouvez bannir cette carte depuis votre Cimetière, puis ciblez 1 Monstre Xyz que vous contrôlez ; attachez-lui 1 Monstre Xyz "Numéro" depuis votre Extra Deck ou Cimetière. Vous ne pouvez utiliser chaque effet de "Espoir de Barian" qu'une fois par tour.
  it: |-
    Evoca Specialmente 1 mostro "Orrore Umbral" o 1 Mostro Xyz "Masquerade" dalla tua mano o Cimitero, poi puoi far diventare i Livelli di tutti i mostri "Orrore Umbral" che controlli lo stesso di 1 mostro "Orrore Umbral" nel tuo Terreno o Cimitero. Puoi bandire questa carta dal tuo Cimitero, poi scegliere come bersaglio 1 Mostro Xyz che controlli; attacca 1 Mostro Xyz "Numero" dal tuo Extra Deck o Cimitero a esso. Puoi utilizzare ogni effetto di "Speranza di Barian" una sola volta per turno.
  pt: |-
    Invoque por Invocação-Especial 1 monstro "Terror Umbral" ou 1 Monstro Xyz "Mascarado(a)" da sua mão ou do Cemitério e, depois, você pode tornar os Níveis de todos os monstros "Terror Umbral" que você controla o mesmo que o de 1 monstro "Terror Umbral" no seu campo ou Cemitério. Você pode banir este card do seu Cemitério e, depois, escolha 1 Monstro Xyz que você controla; associe 1 Monstro Xyz "Número" do seu Deck Adicional ou Cemitério a ele. Você só pode usar cada efeito de "Esperança de Barian" uma vez por turno.
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の手札・墓地から「アンブラル」モンスターか「仮面魔踏士」Ｘモンスター１体を特殊召喚する。その後、自分フィールドの全ての「アンブラル」モンスターのレベルを、自分のフィールド・墓地の「アンブラル」モンスター１体のレベルと同じにできる。②：墓地のこのカードを除外し、自分フィールドのＸモンスター１体を対象として発動できる。自分のＥＸデッキ・墓地から「Ｎｏ．」Ｘモンスター１体を対象のモンスターのＸ素材にする。
  ko: |-
    이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신의 패 / 묘지에서 "엄브럴" 몬스터나 "마스커레이드" 엑시즈 몬스터 1장을 특수 소환한다. 그 후, 자신 필드의 모든 "엄브럴" 몬스터의 레벨을, 자신의 필드 / 묘지의 "엄브럴" 몬스터 1장의 레벨과 같게 할 수 있다. ②: 묘지의 이 카드를 제외하고, 자신 필드의 엑시즈 몬스터 1장을 대상으로 하여 발동할 수 있다. 자신의 엑스트라 덱 / 묘지에서 "No." 엑시즈 몬스터 1장을 대상 몬스터의 엑시즈 소재로 한다.
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从自己手牌・墓地将1只“黑影”怪兽或“假面魔蹈士”超量怪兽特殊召唤。然后，可将自己场上的所有“黑影”怪兽的等级改成与自己场上・墓地的1只“黑影”怪兽相同的等级。②：将墓地的此卡除外，以自己场上的1只超量怪兽为对象可以发动。从自己额外牌组・墓地将1只“编号”超量怪兽作为对象怪兽的超量素材。
