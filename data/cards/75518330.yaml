text:
  en: |-
    Special Summon 1 "Umbral Horror" monster or "Masquerade" Xyz Monster from your hand or GY, then you can make the Levels of all "Umbral Horror" monsters you control become the Level of 1 "Umbral Horror" monster in your field or GY. You can banish this card from your GY, then target 1 Xyz Monster you control; attach 1 "Number" Xyz Monster from your Extra Deck or GY to it. You can only use each effect of "Barian's Hope" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の手札・墓地から「アンブラル」モンスターか「仮面魔踏士」Ｘモンスター１体を特殊召喚する。その後、自分フィールドの全ての「アンブラル」モンスターのレベルを、自分のフィールド・墓地の「アンブラル」モンスター１体のレベルと同じにできる。②：墓地のこのカードを除外し、自分フィールドのＸモンスター１体を対象として発動できる。自分のＥＸデッキ・墓地から「Ｎｏ．」Ｘモンスター１体を対象のモンスターのＸ素材にする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：从自己手牌・墓地将1只“黑影”怪兽或“假面魔蹈士”超量怪兽特殊召唤。然后，可将自己场上的所有“黑影”怪兽的等级改成与自己场上・墓地的1只“黑影”怪兽相同的等级。②：将墓地的此卡除外，以自己场上的1只超量怪兽为对象可以发动。从自己额外牌组・墓地将1只“编号”超量怪兽作为对象怪兽的超量素材。
