text:
  en: |-
    Activate this card by banishing (face-down) 5 cards from your GY and/or the top of your Deck. During your Main Phase, you can Normal Summon 1 "Trirealm Rift" monster, in addition to your Normal Summon/Set (you can only gain this effect once per turn). During your Main Phase: You can banish (face-down) 1 "Trirealm Rift" monster you control whose original Level is 4 or lower, and if you do, Special Summon 1 of your face-down banished Level 5 or higher "Trirealm Rift" monsters. You can only use this effect of "Trirealm Rift Gospel" once per turn.
