text:
  en: |-
    (This card is always treated as a "Magna Warrior" card.)
    Cannot be Normal Summoned/Set. Must be Special Summoned (from your hand or GY) by Tributing 1 Level 7 or higher monster. You can only Special Summon "Plasma Warrior Eitom" once per turn this way. Once per turn: You can send 1 "Magnet Warrior" or "Magna Warrior" monster from your Deck to the GY, except "Plasma Warrior Eitom"; for the rest of this turn, this card's original ATK becomes 1500, also it can attack directly.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名はルール上「磁石の戦士」カードとしても扱う。このカードは通常召喚できない。「プラズマ戦士エイトム」は１ターンに１度、自分フィールドのレベル７以上のモンスター１体をリリースした場合のみ手札・墓地から特殊召喚できる。①：１ターンに１度、「プラズマ戦士エイトム」を除く、「マグネット・ウォリアー」モンスターか「磁石の戦士」モンスター１体をデッキから墓地へ送って発動できる。このターン、このカードの元々の攻撃力は１５００になり、直接攻撃できる。
  ko: |-
    이 카드명은 룰상 "자석의 전사" 카드로도 취급한다. 이 카드는 통상 소환할 수 없다. "플라즈마 전사 에이톰"은 1턴에 1번, 자신 필드의 레벨 7 이상의 몬스터 1장을 릴리스했을 경우에만 패 / 묘지에서 특수 소환할 수 있다. ①: 1턴에 1번, "플라즈마 전사 에이톰"이 아닌, "마그넷 워리어" 몬스터나 "자석의 전사" 몬스터 1장을 덱에서 묘지로 보내고 발동할 수 있다. 이 턴에, 이 카드의 원래 공격력은 1500 이 되고, 직접 공격할 수 있다.
  zh-TW:
  zh-CN: |-
    此卡名在规则上也视为“磁石之战士”卡。此卡不可通常召唤。“等离子战士 原能”1回合1次，仅可在解放自己场上1只等级7以上的怪兽的情况下，从手牌・墓地特殊召唤。①：1回合1次，从牌组将除“等离子战士 原能”以外的、1只“磁石战士”怪兽或“磁石之战士”怪兽送至墓地可以发动。此回合，此卡的原本攻击力变为1500，且可直接攻击。
