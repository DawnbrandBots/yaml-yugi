text:
  en: |-
    You can Ritual Summon this card with "Reindsurm Conquest". When your opponent activates a monster effect in the field or GY and you control this Ritual Summoned card (Quick Effect): You can negate the activation, then you can shuffle 1 monster each from both your opponent's field and GY into the Deck, also if either of them was a Dragon monster, double this card's ATK. If this card and a LIGHT "Reindsurm" monster are in your GY: You can add this card to your hand. You can only use each effect of "Reindsurm Giriakarma" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    「竜の骸歌」により降臨
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが儀式召喚されている場合、相手がフィールド・墓地のモンスターの効果を発動した時に発動できる。その発動を無効にする。その後、相手のフィールド及び墓地のモンスターを１体ずつデッキに戻す事ができる。この効果でドラゴン族モンスターを選んだ場合、このカードの攻撃力は倍になる。②：自分の墓地にこのカードと光属性の「リインゼルム」モンスターが存在する場合に発動できる。このカードを手札に加える。
  ko:
  zh-TW:
  zh-CN: |-
    以“轮回虫龙之骸歌”降临
    此卡名的①②效果1回合仅可各使用1次。①：此卡是被仪式召唤的情况下，对手发动场上・墓地的怪兽的效果时可以发动。将该发动无效。然后，可将对手场上及墓地的各1只怪兽放回牌组。以此效果挑选龙族怪兽的情况下，此卡的攻击力变为两倍。②：自己墓地存在此卡和光属性的“轮回虫龙”怪兽的情况下可以发动。将此卡加入手牌。
