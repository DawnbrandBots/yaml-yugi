text:
  en: |-
    When you draw this card: You can reveal it; Special Summon it. If Summoned this way: You can target 1 monster your opponent controls; place it on the bottom of the Deck. You can discard this card; draw 1 card. You cannot add cards from the Deck to the hand the turn you activate this effect, except by drawing them. You can only use this effect of "Raise Moon Blade Shayna" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の③の効果は１ターンに１度しか使用できない。①：このカードをドローした時、このカードを相手に見せて発動できる。このカードを特殊召喚する。②：このカードの①の効果で特殊召喚した場合、相手フィールドのモンスター１体を対象として発動できる。そのモンスターをデッキの一番下に戻す。③：このカードを手札から捨てて発動できる（この効果を発動するターン、自分はドロー以外の方法でデッキからカードを手札に加える事ができない）。自分は１枚ドローする。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的③效果1回合仅可使用1次。①：抽到此卡时，将此卡出示给对手可以发动。将此卡特殊召唤。②：以此卡的①效果特殊召唤的情况下，以对手场上的1只怪兽为对象可以发动。将该怪兽放回牌组最下面。③：从手牌将此卡舍弃可以发动（发动此效果的回合中，自己不可用抽牌以外的方法从牌组将卡加入手牌）。自己抽1张。
