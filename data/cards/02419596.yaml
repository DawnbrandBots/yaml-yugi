  ja: |-
    レベル４モンスター×２
    このカード名の①の効果は１ターンに１度しか使用できない。①：このカードのＸ素材を１つ取り除き、以下から１つを選択して発動できる。●取り除いたＸ素材を除く自分の墓地のレベル４モンスター１体を選び、そのモンスターとはカード名が異なり、種族・属性が同じレベル４モンスター１体をデッキから手札に加える。●相手フィールドのモンスター１体を対象として発動できる。そのモンスターをこのカードのＸ素材にする。②：このカードが破壊される場合、代わりにこのカードのＸ素材を１つ取り除く事ができる。
  ko:
  zh-TW:
  zh-CN: |-
    等级4怪兽×2
    此卡名的①效果1回合仅可使用1次。①：去除此卡的1个超量素材，可从以下效果中选择1个发动。●挑选所去除的超量素材以外的、自己墓地的1只等级4怪兽，从牌组将与该怪兽卡名不同，种族・属性相同的1只等级4怪兽加入手牌。●以对手场上的1只怪兽为对象可以发动。将该怪兽作为此卡的超量素材。②：此卡将被破坏的情况下，作为代替可去除此卡的1个超量素材。
