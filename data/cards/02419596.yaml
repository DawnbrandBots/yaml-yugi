text:
  en: |-
    2 Level 4 monsters
    You can detach 1 material from this card, then activate 1 of these effects;
    ● Choose 1 Level 4 monster in your GY, except the detached material, and add 1 Level 4 monster with the same Type and Attribute, but a different name, from your Deck to your hand.
    ● Target 1 monster your opponent controls; attach it to this card.
    You can only use this effect of "Number 101: Silent Honor ARK - Soul Asylum" once per turn. If this card would be destroyed, you can detach 1 material from this card instead.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    レベル４モンスター×２
    このカード名の①の効果は１ターンに１度しか使用できない。①：このカードのＸ素材を１つ取り除き、以下から１つを選択して発動できる。●取り除いたＸ素材を除く自分の墓地のレベル４モンスター１体を選び、そのモンスターとはカード名が異なり、種族・属性が同じレベル４モンスター１体をデッキから手札に加える。●相手フィールドのモンスター１体を対象として発動できる。そのモンスターをこのカードのＸ素材にする。②：このカードが破壊される場合、代わりにこのカードのＸ素材を１つ取り除く事ができる。
  ko: |-
    레벨 4 몬스터 × 2<br>이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드의 엑시즈 소재를 1개 제거하고, 이하에서 1개를 선택하여 발동할 수 있다. ●제거한 엑시즈 소재가 아닌 자신 묘지의 레벨 4 몬스터 1장을 골라, 그 몬스터와는 카드명이 다르고, 종족 / 속성이 같은 레벨 4 몬스터 1장을 덱에서 패에 넣는다. ●상대 필드의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 이 카드의 엑시즈 소재로 한다. ②: 이 카드가 파괴될 경우, 대신에 이 카드의 엑시즈 소재를 1개 제거할 수 있다.
  zh-TW:
  zh-CN: |-
    等级4怪兽×2
    此卡名的①效果1回合仅可使用1次。①：去除此卡的1个超量素材，可从以下效果中选择1个发动。●挑选所去除的超量素材以外的、自己墓地的1只等级4怪兽，从牌组将与该怪兽卡名不同，种族・属性相同的1只等级4怪兽加入手牌。●以对手场上的1只怪兽为对象可以发动。将该怪兽作为此卡的超量素材。②：此卡将被破坏的情况下，作为代替可去除此卡的1个超量素材。
