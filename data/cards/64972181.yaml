  en: |-
    This card's name becomes "Harpie Lady" while on the field or in the GY. You can only use each of the following effects of "Harpie Lady - Elegant Egotist" once per turn. If this card is in your hand and you control a WIND or EARTH monster: You can Special Summon this card. If this card is Special Summoned: You can Special Summon up to 2 Level 5 "Harpie" monsters from your hand, Deck, and/or GY, also you cannot Special Summon for the rest of this turn, except WIND or EARTH monsters.
