  ja: |-
    このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードのカード名は、フィールド・墓地に存在する限り「ハーピィ・レディ」として扱う。②：このカードが手札に存在し、自分フィールドに風・地属性モンスターのいずれかが存在する場合に発動できる。このカードを特殊召喚する。③：このカードが特殊召喚した場合に発動できる。自分の手札・デッキ・墓地からレベル５の「ハーピィ」モンスターを２体まで特殊召喚する。この効果の発動後、ターン終了時まで自分は風・地属性モンスターしか特殊召喚できない。
