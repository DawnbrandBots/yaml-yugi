text:
  en: |-
    Cannot be Normal Summoned/Set. Must be Special Summoned (from your hand) while the total ATK of your banished monsters is 4000 or higher, or while you have 5 or more face-down banished cards. You can only Special Summon "White-Horned Buster Dragon" once per turn this way. When your opponent activates a monster effect, or Spell Card or effect, on the field (Quick Effect): You can banish 1 card of the same type (Monster or Spell) from your GY; negate the activation, then this card gains 600 ATK. You can only use this effect of "White-Horned Buster Dragon" once per turn.
