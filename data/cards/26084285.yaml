name:
  en: Gravekeeper's Watcher
  de: Grabwächters Beobachter
  es: Vigilante del Cuidador de Tumbas
  fr: Sentinelle des Protecteurs du Tombeau
  it: Sorvegliante - Custode di Tombe
  pt: Vigia do Coveiro
  ja: <ruby>墓<rt>はか</rt></ruby><ruby>守<rt>もり</rt></ruby>の<ruby>監<rt>かん</rt></ruby><ruby>視<rt>し</rt></ruby><ruby>者<rt>しゃ</rt></ruby>
  ja_romaji: Hakamori no Kanshisha
  ko: 묘지기의 감시자
  ko_rr:
  zh-TW: 守墓的監視者
  zh-CN: 守墓的监视者
text:
  en: |-
    When your opponent activates a Spell/Trap Card or monster effect that includes an effect that makes them discard a card(s) (Quick Effect): You can send this card from your hand to the GY; negate the activation, and if you do, destroy it.
  de: |-
    Wenn dein Gegner eine Zauber-/Fallenkarte oder einen Monstereffekt aktiviert, die oder der einen Effekt enthält, der ihn eine oder mehr Karten abwerfen lässt (Schnelleffekt): Du kannst diese Karte von deiner Hand auf den Friedhof legen; annulliere die Aktivierung und falls du dies tust, zerstöre sie oder es.
  es: |-
    Cuando tu adversario activa una Carta Mágica/de Trampa o efecto de monstruo que incluya un efecto que le haría descartar una o más cartas (Efecto Rápido): puedes mandar al Cementerio esta carta en tu mano; niega la activación y, si lo haces, destrúyela.
  fr: |-
    Lorsque votre adversaire active une Carte Magie/Piège ou un effet de monstre qui inclut un effet qui lui fait défausser une ou plusieurs cartes (Effet Rapide) : vous pouvez envoyer cette carte depuis votre main au Cimetière ; annulez l'activation, et si vous le faites, détruisez-la.
  it: |-
    Quando il tuo avversario attiva una Carta Magia/Trappola o l'effetto di un mostro che include un effetto che gli fa scartare una o più carte (Effetto Rapido): puoi mandare questa carta dalla tua mano al Cimitero; annulla l'attivazione e, se lo fai, distruggila.
  pt: |-
    Quando seu oponente ativar um Card de Magia/Armadilha ou efeito de monstro que inclua um efeito que faça com que ele descarte um ou mais cards (Efeito Rápido): você pode enviar este card da sua mão para o Cemitério; negue a ativação e, se isso acontecer, destrua-o.
  ja: |-
    相手プレイヤーが自らの手札を捨てる効果を含むカードを発動した時、このカードを手札から墓地に送る事で、その発動と効果を無効にしてそのカードを破壊する。
  ko: |-
    상대 플레이어가 스스로 패를 버리는 효과를 포함하는 카드를 발동했을 때, 이 카드를 패에서 묘지로 보내는 것으로, 그 발동과 효과를 무효로 하고 그 카드를 파괴한다.
  zh-TW:
  zh-CN: |-
    ①：对手发动包含将自身手牌舍弃的效果在内的、怪兽的效果・魔法・陷阱卡时，从手牌将此卡送至墓地可以发动。将该发动无效并破坏。
