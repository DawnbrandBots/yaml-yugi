text:
  en: |-
    Special Summon 1 "Salamangreat" monster from your hand or GY, and if you do, equip this card to it. You can send 1 "Salamangreat" monster from your Deck to the GY; the equipped monster gains ATK equal to the sent monster's Level x 300. If this card is in your GY: You can shuffle 3 "Salamangreat" cards from your GY into the Deck, except Equip Spells, and if you do, add this card to your hand. You can only use each effect of "Salamangreat Gearblade" once per turn.
