  zh-CN: |-
    此卡名的①②③效果1回合仅可各使用1次。①：从自己的手牌・墓地将1只“转生炎兽”怪兽特殊召唤，并装备此卡。②：从牌组将1只“转生炎兽”怪兽送至墓地可以发动。装备怪兽的攻击力上升送至墓地的怪兽等级×300的数值。③：此卡存在于墓地的情况下可以发动。从自己墓地将装备魔法卡以外的3张“转生炎兽”卡放回牌组，将此卡加入手牌。
