    このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在し、裏側表示カード２枚以上か「闇」がフィールドに存在する場合に発動できる。このカードを特殊召喚する。②：自分フィールドに裏側表示カードが存在する限り、このカードは相手の効果では破壊されず、相手はこのカードを効果の対象にできない。③：このカードより低い攻撃力を持つフィールドのモンスターが、効果を発動した時または攻撃宣言した時に発動できる。そのモンスターを破壊する。
