text:
  en: |-
    While you control a face-down card, this card cannot be destroyed by your opponent's card effects, also your opponent cannot target it with card effects. You can only use each of the following effects of "King of Yamimado" once per turn. If this card is in your hand, and "Yami" and/or 2 or more face-down cards are on the field: You can Special Summon this card. When a monster on the field with less ATK than this card activates its effect or declares an attack (Quick Effect): You can destroy that monster.
