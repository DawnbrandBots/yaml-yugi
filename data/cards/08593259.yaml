  ja: |-
    「Ｅ・ＨＥＲＯ」モンスター＋戦士族モンスター
    このカード名の①の効果は１ターンに１度しか使用できない。①：このカードが特殊召喚した場合に発動できる。デッキから「Ｅ・ＨＥＲＯ」モンスター１体を特殊召喚する。相手フィールドにカードが存在する場合、さらにその数×４００ダメージを相手に与える事ができる。このターン、自分は「ＨＥＲＯ」モンスターしかＥＸデッキから特殊召喚できない。②：このカードがモンスターゾーンに存在する限り、自分フィールドの他の「Ｅ・ＨＥＲＯ」モンスターは戦闘・効果では破壊されない。
  ko: |-
    "엘리멘틀 히어로" 몬스터 ＋ 전사족 몬스터<br>이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 덱에서 "엘리멘틀 히어로" 몬스터 1장을 특수 소환한다. 상대 필드에 카드가 존재할 경우, 추가로 그 수 × 400 데미지를 상대에게 줄 수 있다. 이 턴에, 자신은 "히어로" 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. ②: 이 카드가 몬스터 존에 존재하는 한, 자신 필드의 다른 "엘리멘틀 히어로" 몬스터는 전투 / 효과로는 파괴되지 않는다.
