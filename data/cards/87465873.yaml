  ja: |-
    このカード名のカードは１ターンに１枚しか発動できず、チェーン３以降に発動した場合、このカードの発動に対して相手は効果を発動できない。①：ＥＸデッキから特殊召喚された相手フィールドの表側表示モンスター１体を対象として発動できる。自分の手札・デッキ・フィールド（表側表示）からアンデット族か闇属性のモンスター１体を墓地へ送り、その元々の攻撃力分だけ対象のモンスターの攻撃力をダウンする。対象のモンスターが光属性の場合、さらにその効果は無効化される。
