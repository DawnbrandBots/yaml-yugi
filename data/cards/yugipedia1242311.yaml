text:
  en: |-
    Your WATER monsters with 3000 or more ATK can make up to 2 attacks on monsters during each Battle Phase. You can only use each of the following effects of "White Nightmare" once per turn. You can send any number of WATER monsters from your hand to the GY; WATER monsters you control gain 500 ATK for each monster sent to the GY this way for the rest of this turn. If this card is sent to the GY: You can Special Summon 1 WATER monster from your GY in Defense Position, and if you do, it is treated as a Tuner.
