text:
  en: |-
    Add 1 Thunder monster from your Deck to your hand, but you cannot Normal Summon/Set monsters with that name until the end of the next turn after this card resolves. You can only activate 1 "Lightning Crash" per turn.
  de: |-
    Füge deiner Hand 1 Donner-Monster von deinem Deck hinzu, aber du kannst bis zum Ende des nächsten Spielzugs, nachdem diese Karte aufgelöst wurde, Monster mit jenem Namen nicht als Normalbeschwörung beschwören/setzen. Du kannst nur 1 „Blitzcrash“ pro Spielzug aktivieren.
  es: |-
    Añade a tu mano 1 monstruo Trueno en tu Deck, pero no puedes Invocar de Modo Normal/Colocar monstruos con ese nombre hasta el final del próximo turno después de que esta carta se resuelva. Sólo puedes activar 1 "Choque de Relámpagos" por turno.
  fr: |-
    Ajoutez 1 monstre Tonnerre depuis votre Deck à votre main, mais vous ne pouvez pas Invoquer/Poser Normalement de monstres de ce nom jusqu'à la fin du prochain tour après la résolution de cette carte. Vous ne pouvez activer qu'1 "Choc Lumineux" par tour.
  it: |-
    Aggiungi 1 mostro Tuono dal tuo Deck alla tua mano, ma non puoi Evocare Normalmente/Posizionare mostri con quel nome fino alla fine del prossimo turno dopo che questa carta si è risolta. Puoi attivare solo 1 "Schianto Fulmine" per turno.
  pt: |-
    Adicione 1 monstro Trovão do seu Deck à sua mão, mas você não pode Invocar por Invocação-Normal/Baixar monstros com esse nome até o final do próximo turno depois que este card resolver. Você só pode ativar 1 "Choque de Relâmpago" por turno.
  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：デッキから雷族モンスター１体を手札に加える。このカードの発動後、次のターンの終了時まで、自分はこの効果で手札に加えたモンスター及びその同名モンスターを通常召喚できない。
  ko: |-
    이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 덱에서 번개족 몬스터 1장을 패에 넣는다. 이 카드의 발동 후, 다음 턴의 종료시까지, 자신은 이 효과로 패에 넣은 몬스터 및 그와 같은 이름의 몬스터를 통상 소환할 수 없다.
  zh-TW:
  zh-CN: |-
    此卡名的卡1回合仅可发动1张。①：从牌组将1只雷族怪兽加入手牌。此卡发动后，直至下个回合结束时为止，自己不可通常召唤以此效果加入手牌的怪兽及其同名怪兽。
