text:
  en: |-
    If you control no monsters, or all monsters you control are Plant monsters: You can Special Summon this card from your hand or GY, but banish it when it leaves the field, also you cannot Special Summon for the rest of this turn, except Plant monsters. You can Tribute 1 Plant monster from your hand or field; Special Summon 1 "Rikka" monster from your Deck, except "Rikka Black Princess". You can only use each effect of "Rikka Black Princess" once per turn.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのモンスターが、存在しない場合または植物族モンスターのみの場合に発動できる。このカードを手札・墓地から特殊召喚する。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。この効果の発動後、ターン終了時まで自分は植物族モンスターしか特殊召喚できない。②：自分の手札・フィールドの植物族モンスター１体をリリースして発動できる。デッキから「六花のくろひめ」以外の「六花」モンスター１体を特殊召喚する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：自己场上的怪兽，不存在的情况下或均为植物族怪兽的情况下可以发动。从手牌・墓地将此卡特殊召唤。以此效果特殊召唤的此卡从场上离开的情况下将被除外。此效果发动后，直至回合结束时为止自己仅可特殊召唤植物族怪兽。②：解放自己手牌・场上的1只植物族怪兽可以发动。从牌组将“六花的黑姬”以外的1只“六花”怪兽特殊召唤。
