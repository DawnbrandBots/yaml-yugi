  en: |-
    Face-down cards in your Spell & Trap Zone cannot be destroyed by card effects. You can only use each of the following effects of "Dominusteer Rosepamela" once per turn. During your opponent's turn (Quick Effect): You can reveal this card in your hand; add 1 "Dominus Purge" card from your Deck to your hand, then discard 1 card. If this card is Normal or Special Summoned: You can Set 1 "Dominators" or "Dominus Purge" Trap from your Deck or GY. It can be activated this turn.
