  en: |-
    3 FIRE Effect Monsters
    (This card is always treated as "Salamangreat Heatleo".)
    Face-up monsters on the field become FIRE. During the Main Phase, if this card was Link Summoned using "Salamangreat Heatleo" (Quick Effect): You can target 1 card your opponent controls; shuffle it into the Deck, then you can make the ATK of 1 FIRE monster your opponent controls become the ATK of 1 monster in your GY. You can only use this effect of "The King of Beasts that Rises from the Valley of Flames" once per turn.
