  zh-CN: |-
    此卡名的①②效果1回合仅可各使用1次。①：自己场上存在“轮回虫龙”怪兽，且怪兽的效果・魔法・陷阱卡发动时可以发动。将该发动无效。然后，可适用以下效果。
    ●从自己牌组・墓地将1只“轮回虫龙”怪兽加入手牌，将自己场上的1只昆虫族怪兽送至墓地。
    ②：自己场上的“轮回虫龙”怪兽将被战斗・效果破坏的情况下，作为代替可将墓地的此卡放回牌组最下面。
