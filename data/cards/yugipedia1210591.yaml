    等级7怪兽×2只以上
    此卡名的②效果1回合仅可使用1次。①：对手怪兽不可将其他怪兽选择为攻击对象。②：此卡超量召唤的情况下，或有怪兽被从手牌特殊召唤的情况下，去除此卡的任意数量的超量素材可以发动。依其数量将对手场上的卡以喜欢的顺序放回牌组下面。③：每当对手的卡因对手用抽牌以外的方法从牌组离开则可以发动。将对手牌组最上面的卡作为此卡的超量素材。
