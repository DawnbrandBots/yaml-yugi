  ja: |-
    このカード名のカードは１ターンに１枚しか発動できない。①：相手の手札をランダムに１枚選び、次のターンのスタンバイフェイズまで表側で除外する。セットされていたこのカードを発動し、その効果でモンスターを除外した場合、さらにそのレベルによって以下の効果を適用できる。
    ●レベル４以下：相手はその同名モンスターを自身の手札・デッキ・墓地から全て除外する。
    ●レベル５以上：自分は種族・属性・レベルの内１つ以上がそのモンスターと同じ、レベル５以上のモンスター１体をデッキから手札に加える。
