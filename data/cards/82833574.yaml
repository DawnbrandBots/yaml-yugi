  ja: |-
    このカード名はルール上「アルトメギア」カードとしても扱う。①：自分が発動した「メディウス」モンスターの効果は無効化されない。②：自分の墓地に「獄神」モンスターが存在する場合、自分の墓地から融合・Ｓ・Ｘモンスター１体を除外し、「アルス＝マグナ」Ｌモンスターのカード名を１つ宣言して発動できる（このターン、このカード名のこの効果を発動するために同じカード名を宣言できない）。宣言したモンスター１体をＥＸデッキから特殊召喚する。この効果で特殊召喚したモンスターはＬ素材にできない。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名在规则上也视为“神艺”卡。①：自己发动的“墨迪乌斯”怪兽的效果不会被无效化。②：自己墓地存在“狱神”怪兽的情况下，从自己墓地将1只融合・同步・超量怪兽除外，宣言1个“奥艺”连接怪兽的卡名可以发动（此回合，不可为发动此卡名的此效果而宣言相同卡名）。从额外牌组将1只所宣言的怪兽特殊召唤。以此效果特殊召唤的怪兽不可作为连接素材。
