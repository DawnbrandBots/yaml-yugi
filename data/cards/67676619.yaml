  ja: |-
    このカードは獣戦士族モンスター１体をリリースして表側表示でＡ召喚できる。このカード名の②の効果は１ターンに１度しか使用できない。①：このカードがモンスターとの戦闘で相手に与える戦闘ダメージは倍になる。②：このカードが墓地に存在する状態で、自分フィールドに獣戦士族モンスターが召喚・特殊召喚された場合に発動できる。このカードを手札に加える。その後、このカードのＡ召喚を表側表示で行う事ができる。この効果でＡ召喚したこのカードは、攻撃力が５００アップし、フィールドから離れた場合に除外される。
