text:
  en: |-
    While you control 2 or more non-Token Normal Monsters, draw 2 cards instead of 1 for your normal draw during your Draw Phase. You can only use each of the following effects of "Bunnillin Extract" once per turn. If a card(s) is sent from your opponent's Deck to the GY (except during the Damage Step): You can Special Summon 1 Normal Monster from your hand or Deck. If a Level 5 or higher Normal Monster(s) with 2000 or less original ATK/DEF is Special Summoned (except during the Damage Step) or declares an attack: You can target 1 card your opponent controls; destroy it.
  de:
  es:
  fr:
  it:
  pt:
  ja: |-
    このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドにトークン以外の通常モンスターが２体以上存在する限り、自分ドローフェイズの通常のドローは２枚になる。②：相手のデッキからカードが墓地へ送られた場合に発動できる。手札・デッキから通常モンスター１体を特殊召喚する。③：レベル５以上で元々の攻撃力と元々の守備力が２０００以下の通常モンスターが、特殊召喚された場合または攻撃宣言した時、相手フィールドのカード１枚を対象として発動できる。そのカードを破壊する。
  ko:
  zh-TW:
  zh-CN: |-
    此卡名的②③效果1回合仅可各使用1次。①：只要自己场上存在2只以上衍生物以外的通常怪兽，自己抽牌阶段的通常抽牌变为2张。②：有卡被从对手牌组送至墓地的情况下可以发动。从手牌・牌组将1只通常怪兽特殊召唤。③：等级5以上且原本攻击力与原本守备力在2000以下的通常怪兽、被特殊召唤的情况下或攻击宣言时，以对手场上的1张卡为对象可以发动。将该卡破坏。
