name:
  en: Just Flip a Coin
  de: Wirf einfach eine Münze
  es: Sólo Lanza una Moneda
  fr: Pile ou Face ?
  it: Semplicemente Lancia una Moneta
  pt: Apenas Lance uma Moeda
  ja:
  ja_romaji:
  ko:
  ko_rr:
  zh-TW:
